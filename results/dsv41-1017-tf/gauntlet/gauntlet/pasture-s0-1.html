<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasture</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8ecae6;}
  svg#scene{display:block;width:100vw;height:100vh;}
  .drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;}
  @keyframes drift{from{transform:translateX(-420px);}to{transform:translateX(2020px);}}
  .hop{animation-name:hop;animation-duration:.9s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
  @keyframes hop{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc5ec"/>
      <stop offset="55%" stop-color="#b9e3f7"/>
      <stop offset="100%" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec94f"/>
      <stop offset="100%" stop-color="#3d8a26"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#fff9c6" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fff3a0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff3a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1600" height="585" fill="url(#skyGrad)"/>

  <!-- SUN + HALO + RAYS -->
  <g>
    <circle cx="1320" cy="170" r="132" fill="url(#sunGlow)"/>
    <circle cx="1320" cy="170" r="62" fill="#ffd93b"/>
    <g stroke="#ffd93b" stroke-width="8" stroke-linecap="round">
      <line x1="1398" y1="170" x2="1425" y2="170"/>
      <line x1="1375.2" y1="225.2" x2="1394.2" y2="244.2"/>
      <line x1="1320" y1="248" x2="1320" y2="275"/>
      <line x1="1264.8" y1="225.2" x2="1245.8" y2="244.2"/>

      <line x1="1264.8" y1="114.8" x2="1245.8" y2="95.8"/>
      <line x1="1320" y1="92" x2="1320" y2="65"/>
      <line x1="1375.2" y1="114.8" x2="1394.2" y2="95.8"/>
    </g>
  </g>

  <!-- CLOUDS -->
  <g class="drift" style="animation-duration:64s;animation-delay:-8s">

      <ellipse cx="-42" cy="0" rx="38" ry="26" fill="#ffffff" opacity="0.95"/>

  </g>
  <g class="drift" style="animation-duration:82s;animation-delay:-35s">

      <ellipse cx="0" cy="-120" rx="96" ry="48" fill="#fdf7ee"/>

      <ellipse cx="18" cy="-104" rx="26" ry="16" fill="#2e2e2e"/>
      <ellipse cx="52" cy="-140" rx="18" ry="13" fill="#2e2e2e"/>

      <ellipse cx="-2" cy="-62" rx="4" ry="6" fill="#e58ba1"/>

      <ellipse cx="100" cy="-150" rx="10" ry="7" fill="#e8d5c2"/>
      <ellipse cx="130" cy="-152" rx="10" ry="7" fill="#e8d5c2"/>
      <ellipse cx="146" cy="-106" rx="18" ry="14" fill="#f6aec0"/>
      <circle cx="108" cy="-130" r="4.5" fill="#1f1f1f"/>
      <circle cx="134" cy="-132" r="4.5" fill="#1f1f1f"/>
    </g>
  </g>

  <!-- SHEEP -->
  <g transform="translate(640,800)">
    <g class="hop" style="animation-delay:-0.28s">
      <rect x="-42" y="-54" width="10" height="54" rx="4" fill="#3a3a3a"/>

      <g transform="scale(0.85)">
        <path d="M-58,-78 q-18,-4 -14,-20 q4,-14 16,-10" fill="none" stroke="#e08598" stroke-width="6" stroke-linecap="round"/>

        <circle cx="66" cy="-86" r="4" fill="#2a2a2a"/>

    </g>
  </g>

    <g class="hop" style="animation-delay:-0.7s">
      <g transform="scale(0.85)">
        <path d="M-80,-150 Q-108,-128 -102,-76" fill="none" stroke="#4a2a12" stroke-width="10" stroke-linecap="round"/>
