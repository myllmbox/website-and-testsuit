svg{display:block;width:100vw;height:100vh}
.cloud{animation:drift 50s linear infinite}
.cloudA{animation-duration:52s;animation-delay:-12s}
.cloudB{animation-duration:66s;animation-delay:-32s}
.cloudC{animation-duration:42s;animation-delay:-27s}

.bounce{animation:bounce .9s ease-in-out infinite}
.bcow{animation-duration:.94s;animation-delay:-.18s}
.bsheep{animation-duration:.84s;animation-delay:-.47s}
.bpig{animation-duration:.76s;animation-delay:-.29s}
.bhorse{animation-duration:1s;animation-delay:-.63s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.shadow{fill:#163f0c;opacity:.22}
.trunk{fill:#8a5a2b;stroke:#5d3a1a;stroke-width:2}
.canopy{fill:#4e9d3c;stroke:#2f6b25;stroke-width:2}
.leg{stroke-width:2}
.horizon{stroke:#2d6b18;stroke-width:2}
</style>
