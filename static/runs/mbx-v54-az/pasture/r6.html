    cloudsG=document.getElementById('cloudsG'),
    birdsG=document.getElementById('birdsG'),
    hills=document.getElementById('hills'),
    grassRect=document.getElementById('grassRect'),
    haze=document.getElementById('hazeBand'),
    bushesG=document.getElementById('bushesG'),
    treesG=document.getElementById('treesG'),
    decoBack=document.getElementById('decoBack'),
    decoFront=document.getElementById('decoFront'),
    treeArt=document.getElementById('treeArt'),
    bushArt=document.getElementById('bushArt');

/* ---------- SUN: disc + halo + 12 rotating rays ---------- */
var sunRoot=el('g',{},sunG);
var halo=el('circle',{r:150,fill:'url(#glow)'},sunRoot);
el('animate',{} ,halo); /* placeholder replaced below */
var haloAnim=document.createElementNS(NS,'animate');
haloAnim.setAttribute('attributeName','r');
haloAnim.setAttribute('values','138;158;138');
haloAnim.setAttribute('dur','7s');
haloAnim.setAttribute('repeatCount','indefinite');
halo.appendChild(haloAnim);
el('circle',{r:76,fill:'#fff6bd',opacity:'.5'},sunRoot);
var rays=el('g',{fill:'#ffe473',opacity:'.92'},sunRoot);
for(var i=0;i<12;i++){
  el('path',{d:'M -7.5 -70 L 7.5 -70 L 0 -122 Z',transform:'rotate('+(i*30)+')'},rays);
}
el('animateTransform',{attributeName:'transform',attributeType:'XML',type:'rotate',
  from:'0 0 0',to:'360 0 0',dur:'95s',repeatCount:'indefinite'},rays);
el('circle',{r:56,fill:'url(#sunDisc)'},sunRoot);
el('circle',{cx:-14,cy:-18,r:20,fill:'#fffdf0',opacity:'.55'},sunRoot);

/* ---------- CLOUDS (each = many overlapping ellipses) ---------- */
var puff=[[0,0,36,27],[-30,9,27,20],[30,8,25,19],[-7,-15,29,23],[47,-1,20,16],[-50,2,19,15],[12,-6,24,18]];
var cloudDefs=[
  {fy:.15,s:1.15,v:12},
  {fy:.30,s:.86,v:17},
  {fy:.46,s:.66,v:9},
  {fy:.21,s:.98,v:14}
];
var clouds=[];
cloudDefs.forEach(function(c){
  var g=el('g',{},cloudsG);
  puff.forEach(function(p,idx){
    el('ellipse',{cx:p[0],cy:p[1],rx:p[2],ry:p[3],
      fill:(idx>3?'#f2f9ff':'#ffffff'),
      stroke:(idx>3?'none':'#e6f2fa'),
      'stroke-width':(idx>3?0:1)},g);
  });
  el('ellipse',{cx:-6,cy:14,rx:40,ry:11,fill:'#dcebff',opacity:'.55'},g);
  clouds.push({g:g,def:c,x:0,y:0,s:c.s,m:0});
});

/* ---------- BIRDS ---------- */
var birds=[];
for(var b=0;b<3;b++){
  var bg=el('g',{},birdsG);
  var bp=el('path',{fill:'none',stroke:'#3f5560','stroke-width':2.4,'stroke-linecap':'round'},bg);
  birds.push({g:bg,p:bp,x:0,y:0,ph:b*1.9,v:26+b*4,off:b*30});
}

/* ---------- GRASS TUFTS + FLOWERS ---------- */
function makeTuft(){
  var g=el('g',{},null);
  el('path',{d:'M0 0 q -1 -6 -4 -9',fill:'none',stroke:'C1','stroke-width':1.7,'stroke-linecap':'round'},g);
  el('path',{d:'M0 0 q 0.6 -8 1 -13',fill:'none',stroke:'C2','stroke-width':1.7,'stroke-linecap':'round'},g);
  el('path',{d:'M0 0 q 3 -6 6 -8',fill:'none',stroke:'C1','stroke-width':1.7,'stroke-linecap':'round'},g);
  return g;
}
var deco=[];
var rnd=mul(20240617);
function addDeco(parent,count,fn){
  for(var i=0;i<count;i++){
    var item={nx:rnd(),ny:.66+rnd()*.33,s:1,parent:parent};
    item.g=fn(item);
    deco.push(item);
  }
}
addDeco(decoBack,110,function(){return makeTuft();});
addDeco(decoFront,16,function(){return makeTuft();});
var petals=[];
function makeFlower(item){
  var g=el('g',{fill:'none'},null);
  var col=['#ffffff','#ffe9f1','#fff8d0'][Math.floor(rnd()*3)];
  for(var k=0;k<5;k++){
    var a=k/5*6.283;
    el('circle',{cx:(Math.cos(a)*3.6).toFixed(2),cy:(Math.sin(a)*3.6).toFixed(2),r:2.6,fill:col},g);
  }
  el('circle',{cx:0,cy:0,r:2,fill:'#ffcf33'},g);
  el('path',{d:'M0 3 q 1 6 0 10',stroke:'#3d8b2c','stroke-width':1.4,fill:'none'},g);
  return g;
}
addDeco(decoBack,18,makeFlower);

/* ---------- BUSHES ---------- */
var bushList=[];
var rndb=mul(777);
for(var i2=0;i2<10;i2++){
  var node=bushArt.cloneNode(true);
  node.removeAttribute('id');
  bushesG.appendChild(node);
  bushList.push({g:node,fx:rndb(),fy:.01+rndb()*.05,s:.5+rndb()*.8});
}

/* ---------- TREES ---------- */
var treeDefs=[];
function pushTrees(list){list.forEach(function(t,i){
  var node=treeArt.cloneNode(true);
  node.removeAttribute('id');
  treesG.appendChild(node);
  var sway=node.querySelector('.sway');
  var at=sway.querySelector('animateTransform');
  if(at){at.setAttribute('dur',(5.4+i*1.43).toFixed(2)+'s');at.setAttribute('begin',(-0.9-i*0.7).toFixed(2)+'s');}
  treeDefs.push({g:node,fx:t.fx,fy:t.fy,s:t.s});
});}
var layoutWide={
  W:1600,
  animals:[
    {id:'pig',fx:.16,fy:774,s:.82},
    {id:'sheep',fx:.355,fy:740,s:.88},
    {id:'cow',fx:.565,fy:780,s:.98},
    {id:'horse',fx:.79,fy:822,s:1}
  ],
  trees:[
    {fx:.06,fy:706,s:1.55},{fx:.945,fy:720,s:1.7},
    {fx:.245,fy:638,s:.62},{fx:.665,fy:632,s:.58},{fx:.44,fy:618,s:.46}
  ],
  sunFx:.80
};
var layoutNarrow={
  W:700,
  animals:[
    {id:'sheep',fx:.28,fy:690,s:.72},
    {id:'cow',fx:.74,fy:684,s:.74},
    {id:'pig',fx:.22,fy:816,s:.8},
    {id:'horse',fx:.70,fy:824,s:.8}
  ],
  trees:[
    {fx:.08,fy:678,s:1.1},{fx:.92,fy:692,s:1.18},{fx:.5,fy:616,s:.36}
  ],
  sunFx:.74
};
pushTrees(layoutWide.trees);

/* ---------- LAYOUT ---------- */
function layout(){
  var vw=window.innerWidth||1600, vh=window.innerHeight||900;
  var W=clamp(Math.round(900*vw/vh),620,2600);
  svg.setAttribute('viewBox','0 0 '+W+' 900');
  document.getElementById('skyRect').setAttribute('width',W);
  document.getElementById('grassRect').setAttribute('width',W);
  var first=grassRect.nextElementSibling;
  if(first){first.setAttribute('width',W);}
  hills.setAttribute('transform','scale('+(W/1600).toFixed(4)+' 1)');

  var cfg=(W>=1180)?layoutWide:layoutNarrow;

  sunRoot.setAttribute('transform','translate('+(W*cfg.sunFx).toFixed(0)+' 152)');

  /* clouds: distribute + set drift bounds */
  clouds.forEach(function(c,i){
    var span=W+220*c.s;
    if(!c.init){c.x=-120+span*((i+0.5)/clouds.length);c.init=true;}
    c.y=HOR*c.def.fy;
    c.m=120*c.s;
    c.g.setAttribute('transform','translate('+c.x.toFixed(1)+' '+c.y.toFixed(1)+') scale('+c.s+')');
  });

  /* birds */
  birds.forEach(function(bi,i){
    if(!bi.init){bi.x=W*(0.15+0.2*i);bi.y=140+46*i;bi.init=true;}
    bi.baseY=bi.y;
  });

  /* trees */
  cfg.trees.forEach(function(t,i){
    treeDefs[i].g.setAttribute('transform','translate('+(W*t.fx).toFixed(0)+' '+t.fy+') scale('+t.s+')');
    treeDefs[i].g.style.display=(treeDefs[i].fy||true)?'':'none';
  });
  for(var i=treeDefs.length;i-->cfg.trees.length;){treeDefs[i].g.style.display='none';}

  /* animals */
  cfg.animals.forEach(function(a){
    var g=document.getElementById(a.id);
    if(g)g.setAttribute('transform','translate('+(W*a.fx).toFixed(0)+' '+a.fy+') scale('+a.s+')');
  });

  /* bushes along the horizon */
  bushList.forEach(function(b){
    b.g.setAttribute('transform','translate('+(W*b.fx).toFixed(0)+' '+(HOR+8*b.s)+') scale('+b.s+')');
  });

  /* grass deco: depth-scaled */
  deco.forEach(function(d){
    var depth=(d.ny-0.65)/0.34;
    var sc=(d.parent===decoFront?1.5:1)*(0.5+0.95*clamp(depth,0,1));
    var col1=depth<.4?'#9ed673':'#3f8b2b';
    var col2=depth<.4?'#8ccc63':'#327a24';
    var kids=d.g.children;
    for(var k=0;k<kids.length;k++){
      var s=kids[k].getAttribute('stroke');
      if(s==='C1'||s==='C2'){kids[k].setAttribute('stroke',s==='C1'?col1:col2);}
    }
    d.g.setAttribute('transform','translate('+(W*d.nx).toFixed(1)+' '+(d.ny*BOT).toFixed(1)+') scale('+sc.toFixed(2)+')');
  });

  /* soft atmospheric band just under the horizon */
  while(haze.firstChild)haze.removeChild(haze.firstChild);
  el('rect',{x:0,y:HOR,width:W,height:52,fill:'url(#hazeG)'},haze);
}

/* ---------- ANIMATION LOOP (clouds + birds) ---------- */
var last=performance.now();
function tick(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var W=parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
  clouds.forEach(function(c){
    c.x+=c.def.v*dt;
    if(c.x>W+c.m){c.x=-c.m;}
    if(c.x<-c.m){c.x=W+c.m;}
    c.g.setAttribute('transform','translate('+c.x.toFixed(1)+' '+c.y.toFixed(1)+') scale('+c.s+')');
  });
  birds.forEach(function(bi){
    bi.x+=bi.v*dt;
    if(bi.x>W+120){bi.x=-120;}
    bi.ph+=dt*5.2;
    var h=2+5*(1+Math.sin(bi.ph))/2;
    bi.y=bi.baseY+Math.sin(bi.ph*.35)*7;
    bi.p.setAttribute('d','M -13 0 Q '+(-6.5)+' '+(-h)+' 0 1 Q 6.5 '+(-h)+' 13 0');
    bi.g.setAttribute('transform','translate('+(bi.x+bi.off).toFixed(1)+' '+bi.y.toFixed(1)+')');
  });
  requestAnimationFrame(tick);
}

layout();
requestAnimationFrame(tick);
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
