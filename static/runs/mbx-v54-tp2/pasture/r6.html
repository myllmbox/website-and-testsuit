<title>Pasture No. 4 - The Bouncing Four</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0e2a17}
#scene{display:block;width:100vw;height:100vh;
 --sky1:#74c1ea;--sky2:#b6e2f6;--sky3:#e9f9f3;--g1:#96cf6e;--g2:#49944e;--g3:#296834;--sun1:#fff8ab;--sun2:#ffd23f}
#scene.dusk{--sky1:#ed9a60;--sky2:#f8cfa8;--sky3:#ffe8d6;--g1:#8fae5c;--g2:#437a45;--g3:#28542e;--sun1:#fff1b8;--sun2:#ffa63a}
stop{transition:stop-color 1.3s ease}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.df{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
#dusk{opacity:0;transition:opacity 1.3s ease;pointer-events:none}
.dusk #dusk{opacity:.24}
@keyframes drift{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes hop{0%{transform:translateY(0)}13%{transform:translateY(-20px)}42%{transform:translateY(0)}54%{transform:translateY(-6px)}66%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes hopBig{0%{transform:translateY(0)}24%{transform:translateY(-48px)}56%{transform:translateY(0)}72%{transform:translateY(-14px)}88%{transform:translateY(0)}100%{transform:translateY(0)}}
.hop{animation-name:hop;animation-duration:.8s;animation-timing-function:cubic-bezier(.42,.05,.58,.95);animation-iteration-count:infinite}
.cheer .hop{animation-name:hopBig;animation-duration:.56s;animation-delay:0s!important}
@keyframes fly{from{transform:translateX(-230px)}to{transform:translateX(var(--fx))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}50%{transform:translate(var(--mx),var(--my))}100%{transform:translate(calc(var(--mx)*2),0);opacity:0}}
.fly{animation-name:fly;animation-timing-function:linear;animation-iteration-count:infinite}
.bob{animation-name:bob;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.mote{animation-name:mote;animation-timing-function:linear;animation-iteration-count:infinite}
.animal{cursor:pointer}
.animal:hover,.animal.spot{filter:drop-shadow(0 9px 14px rgba(9,44,18,.4)) saturate(1.07)}
.hit{fill:none;pointer-events:all}
.ring,.plate{opacity:0;transition:opacity .28s ease}
.animal:hover .plate,.animal.spot .plate,.animal:hover .ring,.animal.spot .ring{opacity:1}
.paused *{animation-play-state:paused!important}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5;
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.plaque{position:absolute;left:26px;top:22px;pointer-events:auto;background:#10301c;color:#f0f7e4;
 padding:14px 22px 17px;border-left:5px solid #f0b537;box-shadow:0 16px 36px rgba(8,34,16,.34);
 border-radius:2px 2px 18px 2px;transition:transform .35s ease,box-shadow .35s ease}
.plaque:hover{transform:translateY(-3px);box-shadow:0 22px 44px rgba(8,34,16,.4)}
.kick{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:#9dc08c;font-weight:700}
.plaque h1{margin:4px 0 7px;font-size:40px;line-height:.88;font-weight:600;letter-spacing:-.6px}
.plaque h1 em{font-style:italic;color:#f2c25a}
.plaque p{margin:0;font-size:12px;line-height:1.55;color:#c3d8b6;max-width:30ch}
.legend{position:absolute;left:26px;bottom:24px;display:flex;gap:8px;flex-wrap:wrap;max-width:62vw;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 15px 9px 11px;border-radius:999px;
 background:rgba(255,253,245,.94);border:1px solid #c8dcb4;color:#1b3720;font-size:10.5px;letter-spacing:.2em;
 text-transform:uppercase;font-weight:800;cursor:pointer;transition:transform .22s,background .22s,color .22s,box-shadow .22s}
.chip i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chip:hover,.chip.on{transform:translateY(-4px);background:#10301c;color:#f6f2df;border-color:#10301c;box-shadow:0 9px 20px rgba(8,34,16,.32)}
.tools{position:absolute;right:24px;top:22px;display:flex;gap:8px;pointer-events:auto}
.btn{padding:10px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.62);background:rgba(255,253,245,.93);
 color:#1b3720;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
 transition:transform .2s,background .2s,color .2s,border-color .2s}
.btn:hover{transform:translateY(-3px)}
.btn.on{background:#f0b537;border-color:#f0b537;color:#2a2109}
.hint{position:absolute;right:26px;bottom:26px;font-size:11px;font-style:italic;color:rgba(13,44,23,.78);
 background:rgba(244,250,235,.72);padding:6px 13px;border-radius:999px}
@media (max-width:680px){.plaque{left:12px;top:12px;padding:10px 14px 12px}.plaque h1{font-size:26px}

 .tools{right:10px;top:10px}.btn{padding:8px 11px;font-size:9px}.hint{display:none}}
</style>

<ellipse class="ring" cx="96" cy="-4" rx="112" ry="21" fill="none" stroke="#fff3b0" stroke-width="3.5" stroke-dasharray="14 11">
<animateTransform attributeName="transform" type="rotate" from="0 96 -4" to="360 96 -4" dur="16s" repeatCount="indefinite"/></ellipse>
<g class="plate"><rect x="30" y="-304" width="140" height="32" rx="6" fill="#10301c" opacity=".94"/><path d="M88-272h20l-10 11z" fill="#10301c" opacity=".94"/>
<text class="df" x="100" y="-280" text-anchor="middle" font-size="19" letter-spacing="3" fill="#f6f0dc">HORSE</text></g>
<rect class="hit" x="-14" y="-316" width="252" height="322"/>
</g>

</g>

<rect id="vigR" x="0" y="0" width="1600" height="900" fill="url(#vig)" pointer-events="none"/>
<rect id="dusk" x="0" y="0" width="1600" height="900" fill="url(#warmG)" style="mix-blend-mode:multiply" pointer-events="none"/>
</svg>

<div class="hud">
<div class="plaque">
<div class="kick">Field recording No. 4</div>
<h1>Morning <em>on the</em> Clover</h1>
<p>Four animals, four legs apiece, one long bounce. Hover or tap to greet a neighbour.</p>
</div>
<div class="legend">
<button class="chip" data-t="cow"><i style="background:#f6f0e2"></i>Cow</button>
<button class="chip" data-t="sheep"><i style="background:#fbf8ef"></i>Sheep</button>
<button class="chip" data-t="pig"><i style="background:#f4a4b9"></i>Pig</button>
<button class="chip" data-t="horse"><i style="background:#8f5f39"></i>Horse</button>
</div>
<div class="tools">
<button class="btn" id="duskB">Golden hour</button>
<button class="btn" id="pauseB">Pause</button>
</div>
<div class="hint">hover a beast / tap to make it leap</div>
</div>

<script>
(function(){
var NS='http://www.w3.org/2000/svg',S=document.getElementById('scene'),VH=900,HZ=585,W=1600,
A=[{id:'cow',fx:.145,fy:.80,k:1.10},{id:'sheep',fx:.385,fy:.93,k:1.02},{id:'pig',fx:.605,fy:.85,k:1.14},{id:'horse',fx:.845,fy:.74,k:1.06}],
TR=[{fx:.075,fy:.20,k:1.0},{fx:.925,fy:.36,k:1.15},{fx:.43,fy:.07,k:.5},{fx:.20,fy:.11,k:.36},{fx:.685,fy:.14,k:.44},{fx:.78,fy:.05,k:.3}],
CLD=[{fx:.28,y:92,k:1,d:118,dl:-24},{fx:.55,y:162,k:.72,d:152,dl:-96},{fx:.80,y:62,k:1.12,d:92,dl:-52},{fx:.13,y:224,k:.6,d:132,dl:-70},{fx:.65,y:300,k:.85,d:104,dl:-12},{fx:.95,y:250,k:.5,d:140,dl:-122}],
BRD=[{y:150,d:52,dl:-10,s:.9},{y:198,d:64,dl:-34,s:.72},{y:232,d:44,dl:-19,s:.6}],
FLO=[],MOT=[];
function n(t,a,h){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(h!=null)e.innerHTML=h;return e}
function r(){return Math.random()}
function g(i){return document.getElementById(i)}

/* sun rays: 12 triangles */
(function(){var s='';for(var i=0;i<12;i++){s+='<polygon points="0,-134 -8,-101 8,-101" transform="rotate('+(i*30)+')"/>';}g('rays').innerHTML=s;})();

/* clouds: each is 5 overlapping ellipses + a soft underside */
var cg=g('clouds');
CLD.forEach(function(c){var o=n('g',{'class':'cloud'}),i=n('g',{});
i.innerHTML='<g fill="#fdfeff"><ellipse cx="0" cy="0" rx="44" ry="26"/><ellipse cx="42" cy="-16" rx="34" ry="27"/><ellipse cx="76" cy="2" rx="30" ry="20"/><ellipse cx="-36" cy="10" rx="28" ry="18"/><ellipse cx="22" cy="14" rx="48" ry="19"/></g><ellipse cx="22" cy="25" rx="62" ry="11" fill="#cfe3ec" opacity=".42"/>';
o.appendChild(i);cg.appendChild(o);c.el=i;c.dr=o;o.style.animationDuration=c.d+'s';o.style.animationDelay=c.dl+'s';});

/* birds: two arcs each */
var bg=g('birds');
BRD.forEach(function(b){var f=n('g',{'class':'fly'}),o=n('g',{'class':'bob'}),i=n('g',{});
i.setAttribute('transform','translate(0,'+b.y+') scale('+b.s+')');
i.innerHTML='<g stroke="#3d5566" stroke-width="2.8" fill="none" stroke-linecap="round"><path d="M-11 0q6-8 11 0"/><path d="M1 0q6-8 11 0"/></g>';
o.appendChild(i);f.appendChild(o);bg.appendChild(f);b.el=f;b.bob=o;
o.style.animationDuration=(2.2+b.d/22)+'s';});

/* trees: brown trunk + cluster of canopy circles, gentle sway about the trunk top */
function tree(){return '<rect x="-9" y="-142" width="18" height="144" rx="6" fill="#7c5030"/>'+
'<path d="M-9-42q-9 6-17 22M9-48q10 6 16 20" stroke="#67412a" stroke-width="5" fill="none" stroke-linecap="round"/>'+
'<ellipse cx="0" cy="-126" rx="42" ry="25" fill="#2f6d3a"/>'+
'<g><animateTransform attributeName="transform" type="rotate" values="-1.3 0 -114;1.3 0 -114;-1.3 0 -114" dur="'+(6+r()*3).toFixed(1)+'s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"/>'+
'<circle cx="0" cy="-168" r="38" fill="#3f8247"/><circle cx="-31" cy="-148" r="29" fill="#4a9350"/><circle cx="31" cy="-152" r="27" fill="#357a41"/>'+
'<circle cx="-9" cy="-192" r="27" fill="#58a45a"/><circle cx="20" cy="-184" r="23" fill="#4c9852"/><circle cx="4" cy="-150" r="30" fill="#43894b"/>'+
'<circle cx="-14" cy="-174" r="12" fill="#72be69" opacity=".6"/></g>';}
var tg=g('trees');
TR.forEach(function(t){var o=n('g',{});o.innerHTML=tree();tg.appendChild(o);o._t=t;});

/* grass tufts + flowers, each swaying from its own root */
function sw(){return '<animateTransform attributeName="transform" type="rotate" values="-3 0 0;3.5 0 0;-3 0 0" dur="'+(3.2+r()*2.8).toFixed(2)+'s" begin="-'+(r()*3).toFixed(2)+'s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"/>';}
var cols=['#fdfdf6','#ffd9e6','#ffe9a8','#f4c8ea','#ffffff'],fg=g('flora');
for(var i=0;i<52;i++){var o=n('g',{'class':'fl'}),fl={fx:r(),fy:r()*.98,s:.55+r()*.6};
if(i%3===0){var c=cols[(r()*cols.length)|0];
o.innerHTML='<g><path d="M0 0q-2-9 0-16" stroke="#245f2c" stroke-width="2.4" fill="none"/>'+
'<g transform="translate(0,-18)"><g fill="'+c+'"><circle cx="0" cy="-6" r="4"/><circle cx="6" cy="-2" r="4"/><circle cx="3" cy="5" r="4"/><circle cx="-3" cy="5" r="4"/><circle cx="-6" cy="-2" r="4"/></g><circle r="3" fill="#ffd54a"/></g>'+sw()+'</g>';
}else{
o.innerHTML='<g><path d="M0 0q-1-11-6-16M0 0q2-12 7-15M0 0q0-8 3-10" stroke="#1f5c2b" stroke-width="2.8" fill="none" stroke-linecap="round" opacity=".6"/>'+sw()+'</g>';}
fg.appendChild(o);o._f=fl;}

/* pollen motes */
var mg=g('animals'),pg=document.createElementNS(NS,'g');S.insertBefore(pg,mg);
for(var j=0;j<14;j++){var m=n('circle',{'class':'mote',r:(1.6+r()*2.4).toFixed(1),fill:j%3?'#fffbe0':'#eaf7c8',opacity:".8"});
m.style.animationDuration=(13+r()*11).toFixed(1)+'s';m.style.animationDelay=(-r()*16).toFixed(1)+'s';
m.style.setProperty('--mx',(30+r()*90).toFixed(0)+'px');m.style.setProperty('--my',(-30-r()*70).toFixed(0)+'px');
pg.appendChild(m);MOT.push({el:m,fx:r(),fy:.42+r()*.52});}

function layout(){
W=Math.max(200,Math.min(3200,VH*(window.innerWidth/window.innerHeight||1.78)));
S.setAttribute('viewBox','0 0 '+W+' '+VH);
var s0=Math.max(.3,Math.min(1.15,W/1600));
A.forEach(function(o){var e=g(o.id);e.setAttribute('transform','translate('+(W*o.fx).toFixed(1)+','+(HZ+(VH-HZ)*o.fy).toFixed(1)+') scale('+(o.k*s0).toFixed(3)+')');});
TR.forEach(function(t,i){var e=tg.children[i];e.setAttribute('transform','translate('+(W*t.fx).toFixed(1)+','+(HZ+(VH-HZ)*t.fy).toFixed(1)+') scale('+(t.k*s0).toFixed(3)+')');});
for(var i=0;i<fg.children.length;i++){var f=fg.children[i]._f;fg.children[i].setAttribute('transform','translate('+(W*f.fx).toFixed(1)+','+(HZ+(VH-HZ)*f.fy).toFixed(1)+') scale('+(f.s*s0).toFixed(3)+')');}
CLD.forEach(function(c){c.el.setAttribute('transform','translate('+(W*c.fx).toFixed(1)+','+c.y+') scale('+c.k+')');
c.dr.style.setProperty('--x0',(-(W/2+340))+'px');c.dr.style.setProperty('--x1',(W/2+340)+'px');});
BRD.forEach(function(b){b.el.style.setProperty('--fx',(W+230)+'px');b.el.style.animationDuration=b.d+'s';b.el.style.animationDelay=b.dl+'s';
b.bob.setAttribute('transform','translate('+(W*b.d/b.d).toFixed(0)+',0)');});
MOT.forEach(function(m){m.el.setAttribute('cx',(W*m.fx).toFixed(1));m.el.setAttribute('cy',(VH*m.fy).toFixed(1));});
g('sun').setAttribute('transform','translate('+(W*.85).toFixed(1)+',146)');
g('vigR').setAttribute('width',W);g('dusk').setAttribute('width',W);
g('bladeR').setAttribute('width',W);g('pathE').setAttribute('cx',W/2);g('pathE').setAttribute('rx',(W*.62).toFixed(0));
var hf=document.getElementById('hillsFar'),hn=document.getElementById('hillsNear');
hf.setAttribute('transform','scale('+(W/1600)+' 1)');hn.setAttribute('transform','scale('+(W/1600)+' 1)');
}
layout();window.addEventListener('resize',layout,false);

/* interactions */
function pick(id){return g(id)}
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
var t=c.getAttribute('data-t'),a=pick(t);
c.addEventListener('mouseenter',function(){a.classList.add('spot');c.classList.add('on')});
c.addEventListener('mouseleave',function(){a.classList.remove('spot');c.classList.remove('on')});
c.addEventListener('focus',function(){a.classList.add('spot')});
c.addEventListener('blur',function(){a.classList.remove('spot')});
c.addEventListener('click',function(){a.classList.remove('cheer');void a.offsetWidth;a.classList.add('cheer');
setTimeout(function(){a.classList.remove('cheer')},1250)});});
Array.prototype.forEach.call(document.querySelectorAll('.animal'),function(a){
function leap(){a.classList.remove('cheer');void a.offsetWidth;a.classList.add('cheer');setTimeout(function(){a.classList.remove('cheer')},1250)}
a.addEventListener('click',leap);
a.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();leap();}});});
var pb=document.getElementById('pauseB');
pb.addEventListener('click',function(){var p=S.classList.toggle('paused');pb.classList.toggle('on',p);pb.textContent=p?'Resume':'Pause';});
var db=document.getElementById('duskB');
db.addEventListener('click',function(){var d=S.classList.toggle('dusk');db.classList.toggle('on',d);});
})();
</script>
</body>
</html>
