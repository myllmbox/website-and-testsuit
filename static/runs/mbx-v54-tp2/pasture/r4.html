<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadowbrook Pasture · Grazing Grounds No. 4</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#4fabe0 0 65%,#79c358 65% 100%);
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#0f2a1c}
#stage{display:block;width:100vw;height:100vh}
.scrim{position:fixed;inset:0;z-index:3;pointer-events:none;
 background:linear-gradient(157deg,rgba(255,253,242,.92),rgba(255,253,242,.42) 24%,rgba(255,253,242,0) 46%)}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
 background:radial-gradient(128% 96% at 50% 36%,rgba(0,0,0,0) 54%,rgba(12,44,25,.24) 100%)}
.plaque{position:fixed;z-index:6;left:clamp(14px,3vw,42px);top:clamp(12px,3vh,34px);max-width:min(30em,66vw)}
.eyebrow{display:inline-flex;gap:.6em;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.26em;
 text-transform:uppercase;color:#0b6b3c;background:#fffdf2;border:1px solid rgba(11,70,40,.22);padding:5px 11px;
 border-radius:999px;box-shadow:0 2px 0 rgba(11,70,40,.12)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#e2543a;animation:beacon 2.4s ease-out infinite}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(226,84,58,.6)}70%,100%{box-shadow:0 0 0 9px rgba(226,84,58,0)}}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
 font-weight:700;font-size:clamp(32px,6.4vw,70px);line-height:.9;letter-spacing:-.022em;margin:.28em 0 .16em;
 color:#0c2b1a;text-shadow:0 2px 0 rgba(255,255,255,.6)}
h1 em{font-style:italic;color:#c14b2c}
.lede{margin:0;font-size:clamp(11.5px,1.25vw,14.5px);line-height:1.5;color:#17402a;max-width:33ch;opacity:.92}
.lede b{font-weight:750}
.lede span{white-space:nowrap}
.dock{position:fixed;z-index:6;left:clamp(14px,3vw,42px);bottom:clamp(14px,3vh,32px);display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:11.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#0d3b25;
 background:rgba(255,253,242,.93);border:1.5px solid rgba(13,59,37,.28);padding:9px 15px;border-radius:999px;cursor:pointer;
 box-shadow:0 2px 0 rgba(13,59,37,.14);transition:transform .2s cubic-bezier(.2,.8,.25,1),background .2s,color .2s,box-shadow .2s,border-color .2s}
.chip:hover{transform:translateY(-3px);box-shadow:0 6px 0 -1px rgba(13,59,37,.24);border-color:#0d3b25}
.chip:active{transform:translateY(0)}
.chip[aria-pressed="true"]{background:#12492f;color:#f4ffe6;border-color:#12492f}
.chip:focus-visible{outline:3px solid #c14b2c;outline-offset:2px}
.roll{position:fixed;z-index:6;right:clamp(14px,3vw,42px);bottom:clamp(14px,3vh,32px);display:flex;flex-direction:column;gap:5px;align-items:stretch}
.roll .hd{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#0b4b2c;text-align:right;opacity:.75}
.herd{display:flex;align-items:center;gap:9px;font:inherit;text-align:left;cursor:pointer;
 background:rgba(255,253,242,.9);border:1px solid rgba(13,59,37,.18);border-radius:12px;padding:6px 11px;
 transition:transform .2s cubic-bezier(.2,.8,.25,1),box-shadow .2s,background .2s}
.herd:hover{transform:translateX(-6px);box-shadow:-4px 4px 0 rgba(13,59,37,.16);background:#fffdf2}
.herd .dot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.herd .nm{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-size:15px;font-weight:600;color:#123a26;line-height:1.1}
.herd .sp{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#3f6b52;font-weight:800}
@media (max-width:680px){.roll{display:none}.lede{display:none}}
/* scene motion */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.2s ease-in-out infinite}
.sway.b{animation-duration:6.7s;animation-delay:-1.9s}
.sway.c{animation-duration:4.3s;animation-delay:-3.2s}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.6deg)}}
.treeway{transform-box:fill-box;transform-origin:50% 100%;animation:lean 7.4s ease-in-out infinite}
.treeway.b{animation-duration:8.8s;animation-delay:-2.4s}
.treeway.c{animation-duration:6.3s;animation-delay:-4.1s}
@keyframes lean{0%,100%{transform:rotate(-.85deg)}50%{transform:rotate(.95deg)}}
#rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 150s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.08);opacity:1}}
.calm .sway,.calm .treeway{animation-play-state:paused}
.animal{cursor:pointer;transition:filter .25s ease}
.animal.lit{filter:drop-shadow(0 0 7px rgba(255,238,158,.95)) drop-shadow(0 9px 11px rgba(10,50,25,.22))}
.ring{opacity:0;transition:opacity .3s;transform-box:fill-box;transform-origin:50% 50%}
.animal.lit .ring{opacity:1;animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.14);opacity:.28}}
.tag{opacity:0;transition:opacity .28s ease;pointer-events:none}
.tag.on,#tagLayer.all .tag{opacity:1}
.tag .box,.tag .pt{fill:#fffdf2;stroke:#12492f;stroke-width:2}
.tag .nm{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-size:26px;font-weight:700;fill:#123a26}
.tag .sp{font-size:13px;letter-spacing:.18em;font-weight:800;fill:#0b6b3c;text-transform:uppercase}
.spark{fill:#fff3a8;stroke:#e8b93a;stroke-width:1.4;transform-box:fill-box;transform-origin:50% 50%;animation:spark .95s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){#rays,.halo,.sway,.treeway,.eyebrow i{animation:none}}
</style>
</head>

<div class="scrim"></div>
<div class="vignette"></div>

<header class="plaque">
 <span class="eyebrow"><i></i>Pasture no. 4 · live grazing feed</span>
 <h1>Meadow<br><em>brook</em></h1>
 <p class="lede"><b>Four species, one clover field.</b> Hooves never leave the grass — they just
  keep hopping. Hover a beast or a name to single it out; click for a little spark of applause.</p>
</header>

<div class="dock">
 <button class="chip" id="bNames" aria-pressed="false">Names</button>
 <button class="chip" id="bBreeze" aria-pressed="true">Breeze</button>
 <button class="chip" id="bStill" aria-pressed="false">Hold still</button>
</div>

<div class="roll" id="roll"><span class="hd">The herd · 4 head</span></div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var stage=document.getElementById("stage");
var tagLayer=document.getElementById("tagLayer");
var H=900,W=1600,paused=false,sunX=1340;

function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
var seed=20240611;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}

/* sun rays: 12 triangles */
var rays=document.getElementById("rays");
for(var i=0;i<12;i++){
 el("path",{d:"M-6,-64 L6,-64 L0,-102 Z",fill:"#ffe27a",opacity:(i%2?0.5:0.85),
  transform:"rotate("+(i*30)+")"},rays);
}

/* drifting birds */
var birdLayer=document.getElementById("birdLayer"),birds=[];
for(var b=0;b<3;b++){
 var bg=el("g",{},birdLayer);
 var pth=el("path",{d:"M-11,0 q6,-8 11,0 q5,-8 11,0",fill:"none",stroke:"#31596f","stroke-width":3,
  "stroke-linecap":"round",opacity:0.75},bg);
 el("animate",{attributeName:"d",dur:(0.5+rnd()*0.35).toFixed(2)+"s",repeatCount:"indefinite",
  begin:"-"+(rnd()).toFixed(2)+"s",
  values:"M-11,0 q6,-8 11,0 q5,-8 11,0;M-11,-6 q6,8 11,0 q5,8 11,0;M-11,0 q6,-8 11,0 q5,-8 11,0"},pth);
 birds.push({g:bg,x:rnd()*1600,y:130+b*52+rnd()*30,s:0.75+rnd()*0.45,v:24+rnd()*20,ph:rnd()*6});
}

/* clouds */
var clouds=[].map.call(document.querySelectorAll(".cloud"),function(g){
 return {g:g,y:+g.getAttribute("data-y"),s:+g.getAttribute("data-s"),v:+g.getAttribute("data-v"),x:rnd()*1600,ph:rnd()*6};
});

/* grass tufts + daisies */
function scatter(parent,n,gyMin,gyMax,sMin,sMax,flowerEvery){
 var out=[];
 for(var i=0;i<n;i++){
  var outer=el("g",{},parent);
  var sway=el("g",{"class":"sway "+(i%3===0?"":(i%3===1?"b":"c"))},outer);
  var isF=(flowerEvery>0 && i%flowerEvery===0);
  var u=el("use",{href:isF?"#flower":"#tuft"},sway);
  if(isF)u.style.color=["#ffffff","#ffd3e0","#fff4c9","#f6d9ff"][i%4];
  out.push({g:outer,fx:rnd(),gy:gyMin+rnd()*(gyMax-gyMin),s:sMin+rnd()*(sMax-sMin)});
 }
 return out;
}
var midGrass=scatter(document.getElementById("midGrass"),16,600,688,0.42,0.66,0);
var fgGrass=scatter(document.getElementById("fgGrass"),30,700,884,0.7,1.5,4);

/* animals */
var A=[].map.call(document.querySelectorAll(".animal"),function(g){
 var bb=g.querySelector(".parts").getBBox();
 var sh=g.querySelector(".shadow"),ring=g.querySelector(".ring");
 sh.setAttribute("rx",(bb.width*0.44).toFixed(1));
 if(ring)ring.setAttribute("rx",(bb.width*0.52).toFixed(1));
 var a={g:g,bb:bb,fx:+g.getAttribute("data-fx"),gy:+g.getAttribute("data-gy"),s:+g.getAttribute("data-s"),
  name:g.getAttribute("data-name"),sp:g.getAttribute("data-sp"),color:g.getAttribute("data-color")};
 /* name tag */
 var t=el("g",{"class":"tag"},tagLayer);
 el("path",{"class":"pt",d:"M22,56 h18 l-9,13 z"},t);
 var r=el("rect",{"class":"box",x:0,y:0,rx:12,height:58},t);
 var nm=el("text",{"class":"nm",x:15,y:28},t);nm.textContent=a.name;
 var sp=el("text",{"class":"sp",x:16,y:47},t);sp.textContent=a.sp;
 var w=Math.max(nm.getComputedTextLength(),sp.getComputedTextLength())+30;
 r.setAttribute("width",w.toFixed(1));a.tag=t;a.tw=w;
 return a;
});

var props=[].slice.call(document.querySelectorAll(".prop"));

function layout(){
 var vw=window.innerWidth,vh=window.innerHeight;
 W=Math.max(240,H*vw/vh);
 stage.setAttribute("viewBox","0 0 "+W.toFixed(1)+" "+H);
 var k=clamp(Math.pow(W/1600,0.42),0.3,1.18);
 var gap=Math.max(18,W*0.04),total=0,i;
 for(i=0;i<A.length;i++){A[i].ss=A[i].s*k;total+=A[i].bb.width*A[i].ss;}
 var need=total+gap*(A.length-1),avail=W*0.94;
 if(need>avail){var f=avail/need;gap*=f;total*=f;for(i=0;i<A.length;i++)A[i].ss*=f;}
 var x=(W-(total+gap*(A.length-1)))/2;
 for(i=0;i<A.length;i++){
  var a=A[i],w=a.bb.width*a.ss,cx=x+w/2;
  var tx=cx-(a.bb.x+a.bb.width/2)*a.ss,ty=a.gy-(a.bb.y+a.bb.height)*a.ss;
  a.g.setAttribute("transform","translate("+tx.toFixed(1)+","+ty.toFixed(1)+") scale("+a.ss.toFixed(3)+")");
  a.cx=cx;a.top=a.gy+a.bb.y*a.ss;
  a.tag.setAttribute("transform","translate("+(cx-a.tw/2).toFixed(1)+","+(a.top-72).toFixed(1)+")");
  x+=w+gap;
 }
 for(i=0;i<props.length;i++){
  var p=props[i],ps=(+p.getAttribute("data-s"))*k;
  p.setAttribute("transform","translate("+(+p.getAttribute("data-fx")*W).toFixed(1)+","+p.getAttribute("data-gy")+") scale("+ps.toFixed(3)+")");
 }
 function place(list){for(var j=0;j<list.length;j++){var t=list[j],s=t.s*k;
  t.g.setAttribute("transform","translate("+(t.fx*W).toFixed(1)+","+t.gy.toFixed(1)+") scale("+s.toFixed(3)+")");}}
 place(midGrass);place(fgGrass);
 sunX=clamp(W*0.84,150,W-150);
}

var px=0,py=0;
function parallax(){
 document.getElementById("cloudLayer").setAttribute("transform","translate("+(px*20).toFixed(1)+","+(py*8).toFixed(1)+")");
 document.getElementById("birdLayer").setAttribute("transform","translate("+(px*30).toFixed(1)+","+(py*12).toFixed(1)+")");
 document.getElementById("sun").setAttribute("transform","translate("+(sunX+px*12).toFixed(1)+","+(150+py*6).toFixed(1)+")");
}

var raf=null;
function relayout(){if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){raf=null;layout();parallax();});}
layout();parallax();
window.addEventListener("resize",relayout);
window.addEventListener("pointermove",function(e){
 px=(e.clientX/window.innerWidth-0.5)*2;py=(e.clientY/window.innerHeight-0.5)*2;
 if(!paused)parallax();
},{passive:true});

var last=performance.now(),t=0;
function frame(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 if(!paused){
  t+=dt;
  for(var i=0;i<clouds.length;i++){
   var c=clouds[i],lim=W+430*c.s;
   c.x+=c.v*dt; if(c.x>lim)c.x=-430*c.s-rnd()*140;
   c.g.setAttribute("transform","translate("+c.x.toFixed(1)+","+(c.y+Math.sin(t*0.25+c.ph)*7).toFixed(1)+") scale("+c.s+")");
  }
  for(var j=0;j<birds.length;j++){
   var b=birds[j],blim=W+90;
   b.x+=b.v*dt; if(b.x>blim)b.x=-90-rnd()*160;
   b.g.setAttribute("transform","translate("+b.x.toFixed(1)+","+(b.y+Math.sin(t*0.8+b.ph)*14).toFixed(1)+") scale("+b.s+")");
  }
  parallax();
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* interactions */
function lit(a,on){a.g.classList.toggle("lit",on);a.tag.classList.toggle("on",on);}
function burst(a){
 var bx=a.cx,by=a.gy-a.bb.height*a.ss*0.55;
 for(var i=0;i<9;i++){
  var ang=(i/9)*Math.PI*2+rnd()*0.5,r=42+rnd()*40;
  var c=el("circle",{"class":"spark",cx:bx.toFixed(1),cy:by.toFixed(1),r:(3.5+rnd()*3).toFixed(1)},stage);
  c.style.setProperty("--dx",(Math.cos(ang)*r).toFixed(1)+"px");
  c.style.setProperty("--dy",(Math.sin(ang)*r-34).toFixed(1)+"px");
  setTimeout(function(n){return function(){if(n.parentNode)n.parentNode.removeChild(n);};}(c),1000);
 }
 a.tag.classList.add("on");
 setTimeout(function(){if(!a.g.classList.contains("lit"))a.tag.classList.remove("on");},1400);
}
A.forEach(function(a){
 a.g.addEventListener("mouseenter",function(){lit(a,true);});
 a.g.addEventListener("mouseleave",function(){lit(a,false);});
 a.g.addEventListener("click",function(){burst(a);});
 var btn=document.createElement("button");
 btn.type="button";btn.className="herd";
 btn.innerHTML='<span class="dot" style="background:'+a.color+'"></span><span><span class="nm">'+
  a.name+'</span><br><span class="sp">'+a.sp+'</span></span>';
 btn.addEventListener("mouseenter",function(){lit(a,true);});
 btn.addEventListener("mouseleave",function(){lit(a,false);});
 btn.addEventListener("focus",function(){lit(a,true);});
 btn.addEventListener("blur",function(){lit(a,false);});
 btn.addEventListener("click",function(){burst(a);});
 document.getElementById("roll").appendChild(btn);
});

var bN=document.getElementById("bNames"),bB=document.getElementById("bBreeze"),bS=document.getElementById("bStill");
bN.addEventListener("click",function(){
 var on=tagLayer.classList.toggle("all");this.setAttribute("aria-pressed",on?"true":"false");
});
bB.addEventListener("click",function(){
 var on=stage.classList.toggle("calm");this.setAttribute("aria-pressed",on?"false":"true");
 this.textContent=on?"Breeze off":"Breeze";
});
bS.addEventListener("click",function(){
 paused=!paused;
 if(paused){stage.pauseAnimations();this.textContent="Back to life";}
 else{stage.unpauseAnimations();last=performance.now();this.textContent="Hold still";}
 this.setAttribute("aria-pressed",paused?"true":"false");
});
})();
</script>
