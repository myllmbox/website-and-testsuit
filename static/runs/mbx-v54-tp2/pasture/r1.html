

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Pasture — a field of bouncing livestock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#cbe8f8;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0e2e18}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;--mx:0;--my:0;cursor:crosshair}
#sunL,#clouds,#birds,#far{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#sunL{transform:translate(calc(var(--mx)*12px),calc(var(--my)*8px))}
#clouds{transform:translate(calc(var(--mx)*-26px),calc(var(--my)*-9px))}
#birds{transform:translate(calc(var(--mx)*-38px),calc(var(--my)*-14px))}
#far{transform:translate(calc(var(--mx)*-9px),calc(var(--my)*-3px))}

/* ---------- motion ---------- */
@keyframes hop{
 0%{transform:translateY(0) scale(1.03,.95)}
 16%{transform:translateY(-4px) scale(.98,1.03)}
 46%{transform:translateY(-18px) scale(.97,1.04)}
 76%{transform:translateY(-3px) scale(1.02,.98)}
 100%{transform:translateY(0) scale(1.03,.95)}
}
@keyframes hopBig{
 0%{transform:translateY(0) scale(1.07,.9)}
 20%{transform:translateY(-10px) scale(.96,1.06)}
 50%{transform:translateY(-40px) scale(.95,1.08)}
 80%{transform:translateY(-6px) scale(1.05,.94)}
 100%{transform:translateY(0) scale(1.07,.9)}
}
.hopper{transform-box:fill-box;transform-origin:50% 100%;animation-name:hop;animation-timing-function:cubic-bezier(.3,.05,.5,1);animation-iteration-count:infinite;will-change:transform}
@keyframes shade{0%{transform:scale(1);opacity:.3}46%{transform:scale(.74);opacity:.14}100%{transform:scale(1);opacity:.3}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation-name:shade;animation-timing-function:cubic-bezier(.3,.05,.5,1);animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--t,1200px))}}
.drifter{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.bird{transform-box:fill-box;transform-origin:50% 50%;animation:flap .55s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 140s linear infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.07)}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 7.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.sway{transform-box:fill-box;transform-origin:50% 96%;animation:sway 8s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.wag{transform-box:fill-box;transform-origin:100% 4%;animation:wag 2.9s ease-in-out infinite}
@keyframes ping{0%{transform:scale(.35);opacity:.6}100%{transform:scale(1.55);opacity:0}}
.ring{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.critter{cursor:pointer;transition:opacity .35s ease}
#stage.dim .critter:not(.spot){opacity:.4}
.hey .ring{animation:ping .95s ease-out 1}
.hey .hopper{animation-name:hopBig}
.critter:hover .hopper{animation-duration:.46s!important}
.lab{font:800 11px/1 ui-sans-serif,system-ui,"Segoe UI",sans-serif;letter-spacing:.24em;text-anchor:middle;fill:#0d3318;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .3s ease}
.critter:hover .lab,.critter.spot .lab,.critter.hey .lab{opacity:1}
@media (prefers-reduced-motion:reduce){.hopper,.shadow{animation-duration:3.2s!important}.rays,.sway,.wag{animation:none}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.tl{position:absolute;left:clamp(16px,3.2vw,46px);top:clamp(16px,3.4vh,40px);max-width:min(52vw,430px)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#15603a}
.eyebrow::before{content:"";width:38px;height:3px;border-radius:2px;background:#15603a}
h1{margin-top:8px;font-family:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(40px,7vw,78px);line-height:.84;letter-spacing:-.03em;color:#0a2a15;text-shadow:0 2px 0 rgba(255,255,255,.55),0 14px 30px rgba(8,44,18,.2)}
h1 em{display:block;margin-top:.14em;font-style:italic;font-weight:400;font-size:.48em;letter-spacing:.03em;color:#2d7b44}
.sub{margin-top:14px;max-width:31ch;font-size:12.5px;line-height:1.6;font-weight:500;color:#17452a}
.legend{position:absolute;left:clamp(16px,3.2vw,46px);bottom:clamp(16px,3.6vh,40px);display:flex;gap:9px;flex-wrap:wrap;max-width:74vw}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 15px 10px 11px;border:1.7px solid #0a2a15;border-radius:999px;background:#fffdf1;color:#0a2a15;font:800 10.5px/1 ui-sans-serif,system-ui,"Segoe UI",sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 rgba(10,42,21,.25);transition:transform .2s cubic-bezier(.34,1.5,.6,1),background .2s,color .2s,box-shadow .2s}
.chip:hover,.chip:focus-visible,.chip.on{outline:none;transform:translateY(-4px);background:#0a2a15;color:#f4ffe4;box-shadow:0 8px 0 rgba(10,42,21,.28)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,#333);box-shadow:0 0 0 2px rgba(10,42,21,.32);transition:transform .25s,border-radius .25s}
.chip:hover .dot,.chip:focus-visible .dot,.chip.on .dot{transform:scale(1.35) rotate(45deg);border-radius:3px}
.br{position:absolute;right:clamp(16px,3.2vw,46px);bottom:clamp(16px,3.6vh,40px);text-align:right;font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#18492b;opacity:.72;line-height:1.9}
@media (max-width:720px){.sub{display:none}.br{display:none}h1{font-size:clamp(34px,10vw,52px)}}
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An animated pasture with a cow, a horse, a sheep and a pig bouncing on the grass"></svg>

<div id="hud">
  <div class="tl">
    <p class="eyebrow">Field No. 4 &nbsp;&middot;&nbsp; dawn grazing</p>
    <h1>Morning<em>Pasture</em></h1>
    <p class="sub">Four residents, one meadow, no shortcuts: every horn, hoof and curl of wool is an SVG primitive. Hover a name to find them, click to say hello.</p>
  </div>
  <div class="legend" id="legend"></div>
  <p class="br">vector livestock<br>hop loop 0.78&ndash;1.02 s</p>
</div>

<script>
(function(){
'use strict';
var stage=document.getElementById('stage'),legend=document.getElementById('legend');
var INK='#33291f',W=0,H=0,seed=1;
function resetSeed(){seed=987654321;}
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function rr(a,b){return a+rnd()*(b-a);}
function f(n){return Math.round(n*10)/10;}

/* a closed ring of arcs -> wool / canopy silhouettes */
function fluff(cx,cy,rx,ry,n,bulge){
  var p=[],i,a,d;
  for(i=0;i<n;i++){a=i/n*Math.PI*2-Math.PI/2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}
  d='M '+f(p[0][0])+' '+f(p[0][1]);
  for(i=0;i<n;i++){
    var q=p[(i+1)%n],dist=Math.sqrt(Math.pow(q[0]-p[i][0],2)+Math.pow(q[1]-p[i][1],2)),r=dist/2*bulge;
    d+=' A '+f(r)+' '+f(r)+' 0 0 1 '+f(q[0])+' '+f(q[1]);
  }
  return d+' Z';
}
function leg(x,h,w,fill,hoof){
  return '<rect x="'+f(x-w/2)+'" y="'+f(-h)+'" width="'+w+'" height="'+(h+3)+'" rx="'+f(w*.42)+'" fill="'+fill+'"/>'+
         '<rect x="'+f(x-w/2-1)+'" y="-13" width="'+(w+2)+'" height="13" rx="4" fill="'+hoof+'" stroke-width="2"/>';
}

/* ---------------- definitions ---------------- */
function defs(){return '<defs>'+
'<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5db3e8"/><stop offset=".4" stop-color="#a3d8f3"/><stop offset=".74" stop-color="#d6effb"/><stop offset="1" stop-color="#f5fbf3"/></linearGradient>'+
'<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cbc64"/><stop offset=".2" stop-color="#55a249"/><stop offset="1" stop-color="#2b6d30"/></linearGradient>'+
'<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfeef9"/></linearGradient>'+
'<radialGradient id="sun"><stop offset="0" stop-color="#fffce4"/><stop offset=".6" stop-color="#ffdb47"/><stop offset="1" stop-color="#f6b81c"/></radialGradient>'+
'<radialGradient id="halo"><stop offset="0" stop-color="#fff2a3" stop-opacity=".8"/><stop offset=".48" stop-color="#ffe873" stop-opacity=".33"/><stop offset="1" stop-color="#ffe873" stop-opacity="0"/></radialGradient>'+
'<radialGradient id="vig" cx=".5" cy=".46" r=".8"><stop offset=".52" stop-color="#0b3a18" stop-opacity="0"/><stop offset="1" stop-color="#0b3a18" stop-opacity=".22"/></radialGradient>'+
'<pattern id="tex" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(-3)">'+
'<path d="M8 52 q4-15 9-21" stroke="#1d5c25" stroke-width="2.6" fill="none" opacity=".14" stroke-linecap="round"/>'+
'<path d="M30 52 q1-11 7-17" stroke="#1d5c25" stroke-width="2.2" fill="none" opacity=".1" stroke-linecap="round"/>'+
'<path d="M44 34 q-5-9-11-12" stroke="#e2f4bb" stroke-width="2" fill="none" opacity=".15" stroke-linecap="round"/></pattern>'+
'<clipPath id="cowBody"><rect x="-78" y="-142" width="156" height="92" rx="44"/></clipPath>'+
'<clipPath id="pigBody"><ellipse cx="-2" cy="-56" rx="50" ry="36"/></clipPath>'+
'</defs>';}

/* ---------------- sky furniture ---------------- */
function rays(r){
  var o='',i,a,l,w;
  for(i=0;i<12;i++){a=i*30;l=(i%2)?26:42;w=(i%2)?5:7.5;
    o+='<path d="M '+(-w)+' '+f(-r-9)+' L '+w+' '+f(-r-9)+' L 0 '+f(-r-9-l)+' Z" transform="rotate('+a+')" fill="#ffdf5c" opacity="'+((i%2)?.72:.95)+'"/>';}
  return o;
}
function cloud(s){
  var p=[[0,4,42],[34,-10,34],[72,0,28],[102,10,20],[-32,12,26],[54,14,30],[16,16,34]],o='<g>',i,q;
  for(i=0;i<p.length;i++){q=p[i];o+='<ellipse cx="'+f(q[0]*s)+'" cy="'+f(q[1]*s)+'" rx="'+f(q[2]*s)+'" ry="'+f(q[2]*s*.72)+'" fill="url(#cloud)"/>';}
  o+='<ellipse cx="'+f(30*s)+'" cy="'+f(20*s)+'" rx="'+f(66*s)+'" ry="'+f(12*s)+'" fill="#cfe6f4" opacity=".5"/>';
  return o+'</g>';
}
function clouds(hy){
  var o='<g id="clouds">',n=Math.max(4,Math.min(6,Math.round(W/360))),i,y,sc,dur;
  for(i=0;i<n;i++){
    y=rr(34,hy*.52);sc=rr(.65,1.5);dur=rr(56,112);
    o+='<g transform="translate(-290,'+f(y)+')"><g class="drifter" style="--t:'+f(W+580)+'px;animation-duration:'+f(dur)+'s;animation-delay:'+f(-rr(0,dur))+'s">'+cloud(sc)+'</g></g>';
  }
  return o+'</g>';
}
function birds(hy){
  var o='<g id="birds" fill="none" stroke="#3f6279" stroke-width="2.4" stroke-linecap="round">',g,i,s,y,dur;
  for(g=0;g<2;g++){
    y=rr(hy*.14,hy*.44);s=rr(.7,1.1);dur=rr(40,66);
    o+='<g transform="translate(-140,'+f(y)+')"><g class="drifter" style="--t:'+(W+280)+'px;animation-duration:'+f(dur)+'s;animation-delay:'+f(-rr(0,dur))+'s">';
    for(i=0;i<3;i++)o+='<g transform="translate('+f(i*34*s)+','+f(rr(-12,14))+') scale('+f(s)+')"><path class="bird" style="animation-delay:'+f(-i*.17)+'s" d="M -9 0 Q -4 -7 0 0 Q 4 -7 9 0"/></g>';
    o+='</g></g>';
  }
  return o+'</g>';
}
function fence(hy){
  var y=hy+Math.max(12,(H-hy)*.11),ph=Math.max(20,(H-hy)*.14),x,o='<g opacity=".9" stroke="'+INK+'" stroke-width="1.8">';
  for(x=-24;x<W+30;x+=118)o+='<rect x="'+f(x)+'" y="'+f(y-ph)+'" width="9" height="'+f(ph)+'" rx="3" fill="#8a6540"/>';
  o+='<rect x="-24" y="'+f(y-ph*.74)+'" width="'+(W+48)+'" height="7" rx="3" fill="#98734b"/>';
  o+='<rect x="-24" y="'+f(y-ph*.34)+'" width="'+(W+48)+'" height="7" rx="3" fill="#98734b"/></g>';
  return o;
}
function tree(x,gy,s,d){
  var th=104*s,cy=-(th+30*s),hi='',i,o;
  for(i=0;i<5;i++)hi+='<circle cx="'+f(rr(-38,42)*s)+'" cy="'+f(cy+rr(-26,22)*s)+'" r="'+f(rr(15,25)*s)+'" fill="#59a84e" opacity=".9"/>';
  hi+='<circle cx="'+f(-20*s)+'" cy="'+f(cy-22*s)+'" r="'+f(16*s)+'" fill="#7cc262" opacity=".8"/>';
  o='<g transform="translate('+f(x)+','+f(gy)+')">';
  o+='<ellipse cx="0" cy="7" rx="'+f(58*s)+'" ry="'+f(11*s)+'" fill="#1c4a22" opacity=".22"/>';
  o+='<path d="M '+f(-13*s)+' 5 C '+f(-10*s)+' '+f(-th*.55)+' '+f(-17*s)+' '+f(-th*.78)+' '+f(-11*s)+' '+f(-th)+' L '+f(11*s)+' '+f(-th)+' C '+f(17*s)+' '+f(-th*.78)+' '+f(10*s)+' '+f(-th*.55)+' '+f(13*s)+' 5 Z" fill="#7a5433" stroke="'+INK+'" stroke-width="2.4"/>';
  o+='<path d="M '+f(-2*s)+' '+f(-th*.7)+' L '+f(-30*s)+' '+f(-th*.88)+'" stroke="#7a5433" stroke-width="'+f(7*s)+'" stroke-linecap="round"/>';
  o+='<path d="M '+f(-4*s)+' '+f(-th*.6)+' q '+f(6*s)+' '+f(-14*s)+' '+f(-2*s)+' '+f(-24*s)+'" fill="none" stroke="#5d3f26" stroke-width="'+f(3*s)+'" opacity=".6"/>';
  o+='<g class="sway" style="animation-delay:'+d+'s">';
  o+='<ellipse cx="'+f(-44*s)+'" cy="'+f(cy+18*s)+'" rx="'+f(38*s)+'" ry="'+f(30*s)+'" fill="#2f6b37"/>';
  o+='<ellipse cx="'+f(44*s)+'" cy="'+f(cy+22*s)+'" rx="'+f(34*s)+'" ry="'+f(27*s)+'" fill="#2f6b37"/>';
  o+='<path d="'+fluff(0,cy,66*s,50*s,13,1.1)+'" fill="#43903f" stroke="'+INK+'" stroke-width="2.4"/>'+hi+'</g></g>';
  return o;
}
function bushes(hy,k){
  var spots=[.13,.29,.66,.83],o='',i,x,y,s;
  for(i=0;i<spots.length;i++){
    x=W*spots[i]+rr(-30,30);y=hy+(H-hy)*rr(.09,.26);s=rr(.5,.85)*k;
    o+='<g transform="translate('+f(x)+','+f(y)+')"><ellipse cx="0" cy="3" rx="'+f(30*s)+'" ry="'+f(6*s)+'" fill="#1c4a22" opacity=".2"/>'+
       '<path d="'+fluff(0,-15*s,30*s,16*s,9,1.12)+'" fill="#3f8a44" stroke="'+INK+'" stroke-width="2.2"/>'+
       '<circle cx="'+f(-8*s)+'" cy="'+f(-22*s)+'" r="'+f(9*s)+'" fill="#63b155" opacity=".85"/></g>';
  }
  return o;
}
function foreground(hy,k){
  var o='<g>',rows=[{y0:hy+10,y1:H*.86,n:Math.round(W/26),h:10,c:'#2c6d31',op:.42},{y0:H*.84,y1:H+4,n:Math.round(W/15),h:26,c:'#1d5924',op:.6}],r,i,x,y,h,d;
  for(r=0;r<rows.length;r++){
    for(i=0;i<rows[r].n;i++){
      x=rr(-12,W+12);y=rr(rows[r].y0,rows[r].y1);h=rr(rows[r].h*.55,rows[r].h)*Math.max(k,.7);d=rr(-4,4);
      o+='<path d="M '+f(x)+' '+f(y)+' q '+f(d)+' '+f(-h*.6)+' '+f(d*1.9)+' '+f(-h)+'" stroke="'+rows[r].c+'" stroke-width="'+f(Math.max(1.6,h*.15))+'" fill="none" opacity="'+rows[r].op+'" stroke-linecap="round"/>';
    }
  }
  var cols=['#fdfdf4','#f7e08a','#f0a6c8','#cbb6ef','#fff3c4'];
  for(i=0;i<14;i++){
    x=rr(10,W-10);y=rr(hy+(H-hy)*.2,H*.94);var fc=cols[i%cols.length],fr=rr(3,4.6)*Math.max(k,.7);
    o+='<g transform="translate('+f(x)+','+f(y)+')"><circle r="'+f(fr*1.2)+'" cx="'+f(-fr)+'" cy="0" fill="'+fc+'"/><circle r="'+f(fr*1.2)+'" cx="'+f(fr)+'" cy="0" fill="'+fc+'"/><circle r="'+f(fr*1.2)+'" cx="0" cy="'+f(-fr)+'" fill="'+fc+'"/><circle r="'+f(fr*1.2)+'" cx="0" cy="'+f(fr)+'" fill="'+fc+'"/><circle r="'+f(fr*.62)+'" fill="#f3c33c"/></g>';
  }
  return o+'</g>';
}

/* ---------------- the four residents ---------------- */
function cow(){
  var b='#faf3e4',sh='#e8dbc2',pk='#f2a0b5',pkd='#c26384',pt='#302a28',g=[];
  g.push('<g stroke="'+INK+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="'+b+'">');
  g.push('<g class="wag" style="animation-delay:-1.1s"><path d="M -74 -128 C -104 -114 -110 -74 -96 -44" fill="none" stroke="'+sh+'" stroke-width="9"/><path d="M -100 -50 q -12 6 -8 18 q 8 10 16 0 q 4 -12 -8 -18 z" fill="'+pt+'" stroke="none"/></g>');
  g.push(leg(-56,60,17,sh,'#4b3f35'));g.push(leg(30,60,17,sh,'#4b3f35'));
  g.push('<rect x="-78" y="-142" width="156" height="92" rx="44" fill="'+b+'"/>');
  g.push('<g clip-path="url(#cowBody)" stroke="none"><ellipse cx="-44" cy="-124" rx="27" ry="20" fill="'+pt+'" transform="rotate(-10 -44 -124)"/><ellipse cx="4" cy="-62" rx="30" ry="18" fill="'+pt+'"/><ellipse cx="56" cy="-124" rx="20" ry="24" fill="'+pt+'"/><ellipse cx="-72" cy="-74" rx="19" ry="24" fill="'+pt+'"/></g>');
  g.push('<rect x="-78" y="-142" width="156" height="92" rx="44" fill="none"/>');
  g.push('<ellipse cx="20" cy="-46" rx="21" ry="14" fill="'+pk+'" stroke-width="2.2"/><rect x="11" y="-40" width="7" height="13" rx="3.5" fill="'+pkd+'" stroke="none"/><rect x="24" y="-40" width="7" height="13" rx="3.5" fill="'+pkd+'" stroke="none"/>');
  g.push(leg(-34,63,18,b,'#57463a'));g.push(leg(50,63,18,b,'#57463a'));
  g.push('<path d="M 46 -132 C 62 -140 76 -136 86 -124 L 74 -96 C 60 -104 50 -114 42 -120 Z" fill="'+sh+'"/>');
  g.push('<g transform="translate(90,-130) rotate(6)">'+
    '<ellipse cx="-30" cy="-14" rx="16" ry="9" fill="'+b+'" transform="rotate(-26 -30 -14)"/>'+
    '<path d="M -10 -30 q -11 -15 2 -25 q 0 15 8 23 z" fill="#efe1bd"/>'+
    '<path d="M 16 -32 q 11 -14 23 -13 q -11 8 -11 23 z" fill="#efe1bd"/>'+
    '<ellipse cx="2" cy="0" rx="37" ry="30" fill="'+b+'"/>'+
    '<circle cx="17" cy="-7" r="11" fill="'+pt+'" stroke="none"/>'+
    '<ellipse cx="2" cy="0" rx="37" ry="30" fill="none"/>'+
    '<ellipse cx="14" cy="14" rx="25" ry="16" fill="'+pk+'" stroke-width="2.2"/>'+
    '<ellipse cx="7" cy="11" rx="3.6" ry="2.8" fill="'+pkd+'" stroke="none"/><ellipse cx="23" cy="10" rx="3.6" ry="2.8" fill="'+pkd+'" stroke="none"/>'+
    '<circle cx="-8" cy="-8" r="5" fill="'+INK+'" stroke="none"/><circle cx="16" cy="-6" r="4.4" fill="'+INK+'" stroke="none"/>'+
    '<circle cx="-6.4" cy="-9.6" r="1.7" fill="#fff" stroke="none"/><circle cx="17.4" cy="-7.4" r="1.5" fill="#fff" stroke="none"/>'+
    '<ellipse cx="26" cy="-22" rx="14" ry="8" fill="'+b+'" transform="rotate(22 26 -22)"/>'+
    '</g>');
  g.push('</g>');return g.join('');
}
function sheep(){
  var w='#fcfaf1',w2='#efeade',d='#4b4553',dk='#39343f',g=[],i;
  g.push('<g stroke="'+INK+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="'+w+'">');
  g.push(leg(-26,40,11,d,'#232028'));g.push(leg(14,40,11,d,'#232028'));
  g.push('<path d="'+fluff(0,-66,52,35,13,1.09)+'" fill="'+w+'"/>');
  g.push('<g stroke="none">');

}

/* ---------------- layout ---------------- */
var SPECIES=[
  {k:'cow',   name:'Cow',   build:cow,   s:.74,top:186,hw:112,col:'#33291f',dur:.86,delay:-.31},
  {k:'horse', name:'Horse', build:horse, s:.68,top:250,hw:136,col:'#7a4c2a',dur:1.0,delay:-.74},
  {k:'sheep', name:'Sheep', build:sheep, s:.9, top:122,hw:74, col:'#4b4553',dur:.78,delay:-.12},
  {k:'pig',   name:'Pig',   build:pig,   s:.8, top:116,hw:82, col:'#e97f9d',dur:.82,delay:-.53}
];
var LAYOUT=[
  {k:'horse',x:.175,row:0,mul:.93},
  {k:'cow',  x:.375,row:1,mul:1.05},
  {k:'sheep',x:.585,row:0,mul:.93},
  {k:'pig',  x:.785,row:1,mul:1.06}
];
function critters(hy,k){
  var o='<g id="critters">',i,sp,L,s,x,y;
  for(i=0;i<LAYOUT.length;i++){
    L=LAYOUT[i];
    sp=SPECIES.filter(function(z){return z.k===L.k;})[0];
    s=sp.s*k*L.mul;x=L.x*W;y=hy+(H-hy)*(L.row?.66:.30);
    o+='<g class="critter" data-k="'+sp.k+'" role="button" tabindex="0" aria-label="'+sp.name+' standing in the pasture" transform="translate('+f(x)+','+f(y)+')">'+
       '<ellipse class="shadow" cx="0" cy="5" rx="'+f(sp.hw*s)+'" ry="'+f(Math.max(7,11*s))+'" fill="#123f1a" style="animation-duration:'+sp.dur+'s;animation-delay:'+sp.delay+'s"/>'+
       '<ellipse class="ring" cx="0" cy="5" rx="'+f(sp.hw*s*1.15)+'" ry="'+f(Math.max(9,14*s))+'" fill="none" stroke="#f7ffea" stroke-width="3"/>'+
       '<g class="hopper" style="animation-duration:'+sp.dur+'s;animation-delay:'+sp.delay+'s"><g transform="scale('+f(s)+')">'+sp.build()+'</g></g>'+
       '<text class="lab" x="0" y="'+f(-sp.top*s-18)+'">'+sp.name.toUpperCase()+'</text>'+
       '</g>';
  }
  return o+'</g>';
}

function render(){
  resetSeed();
  W=window.innerWidth;H=window.innerHeight;
  var hy=Math.round(H*.65),k=Math.max(.5,Math.min(1,Math.min(W/1420,H/840)));
  var R0=Math.max(32,Math.min(58,H*.062));
  var P=[];
  P.push(defs());
  P.push('<rect x="0" y="0" width="'+W+'" height="'+(hy+2)+'" fill="url(#sky)"/>');
  P.push('<g transform="translate('+f(W*.81)+','+f(Math.max(84,H*.17))+')"><g id="sunL"><g class="glow"><circle r="'+f(R0*3.2)+'" fill="url(#halo)"/></g><g class="rays">'+rays(R0)+'</g><circle r="'+f(R0)+'" fill="url(#sun)"/><circle cx="'+f(-R0*.22)+'" cy="'+f(-R0*.22)+'" r="'+f(R0*.55)+'" fill="#fff9cf" opacity=".5"/></g></g>');
  P.push(clouds(hy));
  P.push(birds(hy));
  P.push('<rect x="0" y="'+hy+'" width="'+W+'" height="'+(H-hy)+'" fill="url(#grass)"/>');
  P.push('<rect x="0" y="'+hy+'" width="'+W+'" height="'+(H-hy)+'" fill="url(#tex)" opacity=".75"/>');
  P.push('<rect x="0" y="'+hy+'" width="'+W+'" height="4" fill="#a9dc82" opacity=".55"/>');
  P.push('<rect x="0" y="'+(hy+4)+'" width="'+W+'" height="2" fill="#245b27" opacity=".5"/>');
  P.push('<g>'+fence(hy)+bushes(hy,k)+'</g>');
  P.push('<g id="far">'+tree(W*.055,hy+(H-hy)*.34,1.05*k,-1.2)+tree(W*.47,hy+(H-hy)*.13,.5*k,-3.6)+tree(W*.935,hy+(H-hy)*.42,.92*k,-5.1)+'</g>');
  P.push(critters(hy,k));
  P.push(foreground(hy,k));
  P.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#vig)" pointer-events="none"/>');
  stage.innerHTML=P.join('');
}

/* ---------------- interaction ---------------- */
function each(fn){[].forEach.call(stage.querySelectorAll('.critter'),fn);}
function focusOn(k){
  each(function(el){el.classList.toggle('spot',el.getAttribute('data-k')===k);});
  stage.classList.toggle('dim',!!k);
  [].forEach.call(legend.children,function(c){c.classList.toggle('on',!!k&&c.getAttribute('data-k')===k);});
}
function cheer(k){
  each(function(el){
    if(el.getAttribute('data-k')!==k)return;
    el.classList.remove('hey');
    el.getBoundingClientRect();
    el.classList.add('hey');
    window.setTimeout(function(){el.classList.remove('hey');},1000);
  });
}
SPECIES.forEach(function(sp){
  var b=document.createElement('button');
  b.className='chip';b.type='button';b.setAttribute('data-k',sp.k);
  b.innerHTML='<span class="dot" style="--c:'+sp.col+'"></span>'+sp.name;
  b.addEventListener('mouseenter',function(){focusOn(sp.k);});
  b.addEventListener('mouseleave',function(){focusOn(null);});
  b.addEventListener('focus',function(){focusOn(sp.k);});
  b.addEventListener('blur',function(){focusOn(null);});
  b.addEventListener('click',function(){focusOn(sp.k);cheer(sp.k);});
  legend.appendChild(b);
});
stage.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.critter'):null;
  if(t){focusOn(t.getAttribute('data-k'));cheer(t.getAttribute('data-k'));}
});
stage.addEventListener('keydown',function(e){
  var t=e.target.closest?e.target.closest('.critter'):null;
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();focusOn(t.getAttribute('data-k'));cheer(t.getAttribute('data-k'));}
});
stage.addEventListener('mouseover',function(e){
  var t=e.target.closest?e.target.closest('.critter'):null;
  if(t)focusOn(t.getAttribute('data-k'));
});
stage.addEventListener('mouseleave',function(){focusOn(null);});
window.addEventListener('mousemove',function(e){
  stage.style.setProperty('--mx',((e.clientX/W)-.5).toFixed(3));
  stage.style.setProperty('--my',((e.clientY/H)-.5).toFixed(3));
},{passive:true});
var tId;
window.addEventListener('resize',function(){clearTimeout(tId);tId=setTimeout(render,140);});
render();
})();
</script>
