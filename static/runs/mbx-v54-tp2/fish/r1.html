

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DRIFT — Pelagic Survey, Station 07</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#04202f}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none;color:#eaf6fb;
  font:400 13px/1.55 ui-sans-serif,"Segoe UI",Helvetica,sans-serif}
.hud>*{pointer-events:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* masthead */
.mast{position:absolute;top:clamp(14px,3.2vh,34px);left:clamp(14px,3vw,44px);max-width:min(44ch,44vw)}
.stamp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.26em;
  text-transform:uppercase;color:#5fd8e8;display:flex;gap:9px;align-items:center;text-shadow:0 1px 8px rgba(2,20,34,.9)}
.stamp::before{content:"";width:28px;height:1px;background:#5fd8e8;opacity:.65}
.live{width:6px;height:6px;border-radius:50%;background:#ff8a3d;box-shadow:0 0 0 0 rgba(255,138,61,.7);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,61,.55)}70%{box-shadow:0 0 0 9px rgba(255,138,61,0)}100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}}
h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:400;
  font-size:clamp(44px,7.6vw,104px);line-height:.86;letter-spacing:-.025em;margin:.12em 0 .16em;
  text-shadow:0 10px 34px rgba(2,18,32,.75)}
h1 em{font-style:italic;color:#8ee6f4}
.lede{margin:0;color:#9dc3d8;max-width:33ch;font-size:12.5px}
.lede b{color:#d8f2fb;font-weight:600}

/* legend */
.legend{position:absolute;left:clamp(14px,3vw,44px);bottom:clamp(14px,3vh,34px);width:min(330px,74vw);
  background:linear-gradient(180deg,rgba(6,38,56,.86),rgba(3,21,33,.93));
  border:1px solid rgba(158,209,232,.24);border-left:3px solid #5fd8e8;padding:12px 13px 10px;
  box-shadow:0 18px 46px rgba(1,12,22,.55)}
.legend h2{margin:0 0 6px;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;color:#7fb6cf;font-weight:600}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;width:100%;
  background:none;border:0;border-top:1px solid rgba(158,209,232,.16);padding:9px 6px 9px 7px;
  color:inherit;text-align:left;cursor:pointer;transition:background .25s,transform .25s}
.row:first-of-type{border-top:0}
.row:hover,.row:focus-visible{background:rgba(95,216,232,.12);transform:translateX(5px);outline:none}
.row.on{background:rgba(95,216,232,.17)}
.sw{position:relative;width:27px;height:14px;border-radius:50% 7px 7px 50%/50%}
.sw::after{content:"";position:absolute;left:-9px;top:1px;border:6px solid transparent;border-right-color:inherit}
.nm{font-family:Georgia,serif;font-size:15px;line-height:1.15}
.nm i{display:block;font-size:10.5px;font-style:italic;color:#84aec6;letter-spacing:.02em}
.st{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5fd8e8;text-align:right;white-space:nowrap}
.st i{display:block;color:#7fb6cf;font-style:normal}

/* console */
.console{position:absolute;right:clamp(14px,3vw,44px);bottom:clamp(14px,3vh,34px);display:flex;align-items:center;
  gap:14px;padding:10px 14px;background:rgba(3,21,33,.9);border:1px solid rgba(158,209,232,.24);
  box-shadow:0 18px 46px rgba(1,12,22,.5)}
button.ctl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#eaf6fb;background:transparent;border:1px solid rgba(158,209,232,.45);padding:8px 13px;cursor:pointer;
  transition:background .2s,color .2s,letter-spacing .2s}
button.ctl:hover{background:#5fd8e8;color:#04222f;letter-spacing:.26em}
.lbl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7fb6cf}
input[type=range]{width:112px;accent-color:#5fd8e8;cursor:pointer;background:none}
.read{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#d8f2fb;text-align:right;min-width:96px}
.read b{color:#f6c44a;font-weight:600;font-size:15px}
.read span{display:block;color:#7fb6cf;font-size:9px;letter-spacing:.16em}

/* depth gauge */
.gauge{position:absolute;right:clamp(14px,3vw,44px);top:20%;height:52%;width:9px;
  border:1px solid rgba(158,209,232,.3);background:linear-gradient(180deg,#63c9e4,#0d4266 55%,#052036)}
.mk{position:absolute;left:-7px;width:23px;height:2px;background:#f6c44a;box-shadow:0 0 10px rgba(246,196,74,.9)}
.gauge::after{content:"DEPTH";position:absolute;right:16px;top:50%;writing-mode:vertical-rl;
  font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.3em;color:#5f8ba3}

/* svg bits */
.mote{fill:#dff4ff;animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}12%{opacity:.5}88%{opacity:.35}100%{transform:translate(26px,-980px);opacity:0}}
.fish{cursor:pointer;transition:filter .35s}
.fish.hot{filter:drop-shadow(0 0 16px rgba(126,232,255,.9))}
.tag{opacity:0;transition:opacity .4s ease}
.tag.on{opacity:1}
.tag rect{fill:rgba(3,24,38,.88);stroke:rgba(158,209,232,.45)}
.tag text{fill:#bfeeff;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em}
.tag circle{fill:#5fd8e8}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mast,.legend,.console,.gauge{animation:rise 1s cubic-bezier(.16,.8,.24,1) both}
.legend{animation-delay:.28s}.console{animation-delay:.42s}.gauge{animation-delay:.56s}
</style>
</head>

<div class="hud">
 <header class="mast">
  <div class="stamp"><span class="live"></span>Pelagic survey · station 07 · sector K</div>
  <h1>Drift<em>line</em></h1>
  <p class="lede">Two residents cross the frame at <b>very different speeds</b>. Hover the field key, click either fish, or tap the water to release a burst of bubbles.</p>
 </header>

 <aside class="legend">
  <h2>Field key</h2>
  <button class="row" data-f="0" aria-pressed="false">
   <span class="sw" style="background:linear-gradient(90deg,#ffd894,#d13f27);color:#ff8a3d"></span>
   <span class="nm">Emberfin Darter<i>Amblypterus velox</i></span>
   <span class="st">0.92×<i>168 u/s</i></span>
  </button>
  <button class="row" data-f="1" aria-pressed="false">
   <span class="sw" style="background:linear-gradient(90deg,#ffeeb4,#bd7512);color:#f6c44a"></span>
   <span class="nm">Sunburst Bream<i>Cyclichthys solaris</i></span>
   <span class="st">1.22×<i>52 u/s</i></span>
  </button>
 </aside>

 <div class="console">
  <button class="ctl" id="toggle">Pause</button>
  <label class="lbl" for="cur">Current</label>
  <input id="cur" type="range" min="0.2" max="2.2" step="0.05" value="1"/>
  <div class="read"><b id="depth">28.0</b> m<span id="clock">t+00:00</span></div>
 </div>

 <div class="gauge"><div class="mk" id="mk" style="top:34%"></div></div>
</div>

<script>
(function(){
 var NS="http://www.w3.org/2000/svg", VW=1600, VH=900;
 var scene=document.getElementById("scene");
 var bubLayer=document.getElementById("bubbles");
 var motes=document.getElementById("motes");
 var paused=false, cur=1, t=0, last=performance.now(), elapsed=0;

 /* --- drifting plankton --- */
 for(var i=0;i<26;i++){
  var m=document.createElementNS(NS,"circle");
  m.setAttribute("cx",(Math.random()*VW).toFixed(0));
  m.setAttribute("cy",(260+Math.random()*600).toFixed(0));
  m.setAttribute("r",(0.7+Math.random()*1.9).toFixed(1));
  m.setAttribute("class","mote");
  m.style.animationDuration=(18+Math.random()*28).toFixed(1)+"s";
  m.style.animationDelay=(-Math.random()*46).toFixed(1)+"s";
  m.style.opacity=(0.08+Math.random()*0.3).toFixed(2);
  motes.appendChild(m);
 }

 /* --- fish --- */
 var F=[
  {g:document.getElementById("f0"),tail:document.getElementById("t0"),fin:document.getElementById("p0"),
   sh:document.getElementById("sh0"),tag:document.getElementById("tg0"),
   x:240,y:318,dir:1,sp:168,s:0.92,bob:30,bf:0.55,wag:7.6,half:190,tx:-122,fx:46,fy:9,ph:0.4,top:112},
  {g:document.getElementById("f1"),tail:document.getElementById("t1"),fin:document.getElementById("p1"),
   sh:document.getElementById("sh1"),tag:document.getElementById("tg1"),
   x:1180,y:560,dir:-1,sp:52,s:1.22,bob:17,bf:0.27,wag:3.1,half:225,tx:-82,fx:28,fy:24,ph:2.1,top:138}
 ];
 F.forEach(function(f){f.boost=1;f.hot=0;
  f.g.addEventListener("mouseenter",function(){setHot(f.idx,true);});
  f.g.addEventListener("mouseleave",function(){setHot(f.idx,false);});
  f.g.addEventListener("click",function(e){e.stopPropagation();dart(f);});
  f.idx=F.length?0:0;
 });
 F[0].idx=0; F[1].idx=1;

 function setHot(i,on){var f=F[i];f.hot=on?1:0;f.g.classList.toggle("hot",!!on);f.tag.classList.toggle("on",!!on);}

 function dart(f){f.boost=3.1;}

 document.querySelectorAll(".row").forEach(function(r){
  var i=+r.getAttribute("data-f");
  r.addEventListener("mouseenter",function(){setHot(i,true);});
  r.addEventListener("mouseleave",function(){setHot(i,false);});
  r.addEventListener("focus",function(){setHot(i,true);});
  r.addEventListener("blur",function(){setHot(i,false);});
  r.addEventListener("click",function(){dart(F[i]);r.classList.add("on");setTimeout(function(){r.classList.remove("on");},900);});
 });

 /* --- bubbles --- */
 var VENTS=[{x:420,w:24},{x:856,w:20},{x:1332,w:26},{x:960,w:34},{x:190,w:18}];
 var bubbles=[];
 function seed(b,x,y){
  var v=VENTS[(Math.random()*VENTS.length)|0];
  b.r=3+Math.random()*10;
  b.bx=(x==null)?v.x+(Math.random()*2-1)*v.w:x;
  b.x=b.bx;
  b.y=(y==null)?792-Math.random()*8:y;
  b.vy=96-b.r*4.3;
  b.amp=5+Math.random()*18;
  b.sw=0.5+Math.random()*1.2;
  b.ph=Math.random()*6.283;
  b.c.setAttribute("r",b.r.toFixed(1));
  b.h.setAttribute("r",(b.r*0.3).toFixed(1));
  b.h.setAttribute("cx",(-b.r*0.33).toFixed(1));
  b.h.setAttribute("cy",(-b.r*0.35).toFixed(1));
 }
 for(i=0;i<18;i++){
  var g=document.createElementNS(NS,"g");
  var c=document.createElementNS(NS,"circle");
  c.setAttribute("fill","url(#bub)"); c.setAttribute("stroke","rgba(228,250,255,.5)"); c.setAttribute("stroke-width","1");
  var h=document.createElementNS(NS,"circle"); h.setAttribute("fill","rgba(255,255,255,.85)");
  g.appendChild(c); g.appendChild(h); bubLayer.appendChild(g);
  var b={el:g,c:c,h:h}; seed(b);
  b.y=Math.random()*800; /* stagger the initial column */
  bubbles.push(b);
 }

 /* --- click to release bubbles --- */
 function svgPoint(cx,cy){
  var pt=scene.createSVGPoint(); pt.x=cx; pt.y=cy;
  var m=scene.getScreenCTM(); if(!m) return {x:cx,y:cy};
  var p=pt.matrixTransform(m.inverse()); return {x:p.x,y:p.y};
 }
 scene.addEventListener("pointerdown",function(e){
  var p=svgPoint(e.clientX,e.clientY);
  for(var k=0;k<7;k++){
   var b=bubbles[(Math.random()*bubbles.length)|0];
   seed(b,p.x+(Math.random()*40-20),p.y+(Math.random()*24-12));
   b.vy*=1.1;
  }
 });

 /* --- controls --- */
 var tg=document.getElementById("toggle");
 tg.addEventListener("click",function(){paused=!paused;tg.textContent=paused?"Resume":"Pause";});
 document.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();tg.click();}});
 var curEl=document.getElementById("cur");
 curEl.addEventListener("input",function(){cur=parseFloat(curEl.value)||1;});
 var depthEl=document.getElementById("depth"), clockEl=document.getElementById("clock"), mk=document.getElementById("mk");

 /* --- main loop --- */
 function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  var d=paused?0:dt*cur; t+=d; elapsed+=d;

  for(var i=0;i<F.length;i++){
   var f=F[i];
   if(f.boost>1.001) f.boost+=(1-f.boost)*Math.min(1,d*1.4); else f.boost=1;
   f.x+=f.dir*f.sp*f.boost*d;
   var lim=VW+f.half+90;
   if(f.dir>0&&f.x>lim) f.x=-f.half-90;
   if(f.dir<0&&f.x<-lim) f.x=VW+f.half+90;
   var wob=Math.sin(t*f.bf+f.ph);
   var y=f.y+wob*f.bob;
   var pitch=Math.cos(t*f.bf+f.ph)*5.5;
   var wag=Math.sin(t*f.wag*(0.7+f.boost*0.3)+f.ph)*(11+f.boost*3);
   var finw=Math.sin(t*f.wag*0.85+1.2+f.ph)*17;
   f.g.setAttribute("transform","translate("+f.x.toFixed(1)+" "+y.toFixed(1)+") scale("+(f.dir*f.s)+" "+f.s+") rotate("+(pitch*f.dir).toFixed(2)+")");
   f.tail.setAttribute("transform","translate("+f.tx+" 0) rotate("+wag.toFixed(2)+")");
   f.fin.setAttribute("transform","translate("+f.fx+" "+f.fy+") rotate("+finw.toFixed(2)+")");
   f.sh.setAttribute("cx",f.x.toFixed(1));
   f.sh.setAttribute("opacity",(0.34-Math.abs(y-560)/2600).toFixed(2));
   var ty=Math.max(70,y-f.top*f.s-14);
   f.tag.setAttribute("transform","translate("+Math.max(100,Math.min(VW-100,f.x)).toFixed(0)+" "+ty.toFixed(0)+")");
  }

  for(i=0;i<bubbles.length;i++){
   var b=bubbles[i];
   b.y-=b.vy*d;
   b.x=b.bx+Math.sin(t*b.sw+b.ph)*b.amp;
   if(b.y<-24){ seed(b); }
   b.el.setAttribute("transform","translate("+b.x.toFixed(1)+" "+b.y.toFixed(1)+")");
  }

  var dp=28+Math.sin(t*0.08)*4.6+Math.sin(t*0.31)*0.4;
  depthEl.textContent=dp.toFixed(1);
  mk.style.top=(24+Math.sin(t*0.08)*11).toFixed(1)+"%";
  var s=Math.floor(elapsed);
  clockEl.textContent="t+"+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
})();
</script>
</body>
</html>
