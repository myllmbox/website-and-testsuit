

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift — Reef Sector 04</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#03141f;color:#e9f7ff;
 font-family:"Trebuchet MS","Lucida Sans Unicode","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.d{font-family:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif}
#sea{position:fixed;inset:0;display:block;width:100vw;height:100vh;cursor:crosshair}
.kick{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8fd0e8}
.panel{position:fixed;background:linear-gradient(180deg,rgba(6,32,49,.80),rgba(3,17,29,.88));
 border:1px solid rgba(159,225,247,.18);padding:15px 18px;box-shadow:0 24px 60px -26px #000;
 opacity:0;transform:translateY(16px);backdrop-filter:blur(5px);
 transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
body.ready .panel{opacity:1;transform:none}
.log{left:26px;top:26px;max-width:326px;border-left:3px solid #ff8a3d;transition-delay:.12s}
.log h1{margin:3px 0 7px;font-size:58px;line-height:.88;font-weight:400;color:#f4fbff;
 letter-spacing:.01em;text-shadow:0 8px 26px rgba(0,0,0,.55)}
.log h1 i{color:#ff9b57}
.sub{margin:0 0 12px;font-size:12.5px;line-height:1.6;color:#bcdcea}
.sub em{font-style:normal;color:#f0dcae;border-bottom:1px dotted rgba(240,220,174,.45)}
.spec{list-style:none;margin:0;padding:9px 0 0;border-top:1px solid rgba(159,225,247,.16)}
.spec li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;transition:transform .3s ease}
.spec li:hover{transform:translateX(5px)}
.spec i{width:23px;height:9px;flex:0 0 auto;border-radius:7px 2px 7px 2px}
.spec b{font-weight:400;font-size:15.5px;color:#eefaff}
.spec small{margin-left:auto;color:#84bed8;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.ctrl{left:26px;bottom:26px;padding:13px 16px;transition-delay:.34s;cursor:default}
.chips{display:flex;gap:6px;margin:9px 0 10px}
.chips button{font:inherit;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#cdeaf7;
 background:rgba(146,214,238,.09);border:1px solid rgba(159,225,247,.25);padding:7px 13px;cursor:pointer;
 transition:background .25s,transform .25s,color .25s,border-color .25s}
.chips button:hover{background:rgba(159,225,247,.22);transform:translateY(-2px)}
.chips button.on{background:#ff8a3d;border-color:#ffb87e;color:#2a1006;font-weight:700}
.ghost{font:inherit;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#f0dcae;
 background:none;border:1px dashed rgba(240,220,174,.45);padding:8px 14px;cursor:pointer;
 transition:background .25s,color .25s,letter-spacing .25s}
.ghost:hover{background:rgba(240,220,174,.15);color:#fff;letter-spacing:.25em}
.meters{position:fixed;right:26px;bottom:26px;display:grid;grid-template-columns:auto auto;gap:5px 20px;
 font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8fd0e8;opacity:0;transform:translateY(16px);
 transition:opacity 1s .5s ease,transform 1s .5s cubic-bezier(.2,.8,.2,1)}
body.ready .meters{opacity:1;transform:none}
.meters b{justify-self:end;color:#f4fbff;font-family:"Palatino Linotype",Georgia,serif;font-size:17px;
 font-weight:400;letter-spacing:0}
.edge{position:fixed;right:9px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
 font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;color:rgba(143,208,232,.5);white-space:nowrap;pointer-events:none}
.hint{position:fixed;left:50%;top:28px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;
 text-transform:uppercase;color:rgba(233,247,255,.66);opacity:0;transition:opacity 1.1s;pointer-events:none}
body.ready .hint{opacity:1}
body.clicked .hint{opacity:0}
.fish{cursor:pointer}
.tag{font-family:"Palatino Linotype",Georgia,serif;font-size:15px;letter-spacing:.14em;fill:#f4fbff;
 opacity:0;text-shadow:0 3px 12px #000;transition:opacity .4s}
.fish:hover .tag{opacity:.95}
.ray{transform-box:view-box;transform-origin:50% 0;animation:sway 15s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-34px) skewX(1.5deg)}to{transform:translateX(44px) skewX(-4deg)}}
#rays{animation:br 11s ease-in-out infinite alternate}
@keyframes br{from{opacity:.42}to{opacity:.85}}
.surf{animation:shim 7.5s ease-in-out infinite alternate}
@keyframes shim{from{transform:translate(-16px,0)}to{transform:translate(20px,4px)}}
.caus{animation:ca 9s ease-in-out infinite alternate}
@keyframes ca{from{transform:translate(-42px,0) scaleX(1)}to{transform:translate(48px,0) scaleX(1.12)}}
#plank{animation:pd 64s linear infinite}
@keyframes pd{from{transform:translate(0,0)}to{transform:translate(34px,-46px)}}
@keyframes tw{from{opacity:.05}to{opacity:.55}}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .58s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
.pec{transform-box:fill-box;transform-origin:15% 5%;animation:flap .95s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}
.dorsal{transform-box:fill-box;transform-origin:50% 100%;animation:fin 1.3s ease-in-out infinite alternate}
@keyframes fin{from{transform:rotate(-3.5deg) scaleY(.94)}to{transform:rotate(3.5deg) scaleY(1.06)}}
#fishB .tail{animation-duration:.3s}
@media (prefers-reduced-motion:reduce){.tail,.pec,.dorsal,.ray,.surf,.caus,#plank{animation:none}}
</style>
</head>

<div class="panel log">
 <div class="kick">reef sector 04 &middot; field log</div>
 <h1 class="d">Drift<i>.</i></h1>
 <p class="sub">Two residents of the <em>sand shelf</em>, logged at the tidal window while the surge slackens.</p>
 <ul class="spec">
  <li><i style="background:linear-gradient(90deg,#ffd79a,#ff8f42,#cf3524)"></i><b class="d">Ember darter</b><small>34 cm</small></li>

 </div>

</div>

<div class="meters">
 <span>depth</span><b id="mD" class="d">12.0 m</b>
 <span>temp</span><b id="mT" class="d">18.4 &deg;C</b>
 <span>fauna</span><b id="mF" class="d">2</b>
 <span>bubbles</span><b id="mB" class="d">0</b>
</div>

<div class="edge">live svg &middot; primitives only &middot; 11 m</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg",W=1600,H=900,FY=772;
var svg=document.getElementById("sea");
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function r(a,b){return a+Math.random()*(b-a)}

/* plankton */
var pk=document.getElementById("plank"),i,c;
for(i=0;i<54;i++){
 c=el("circle",{cx:r(0,W)|0,cy:r(40,FY+10)|0,r:r(.5,2.4).toFixed(2),fill:"#e6faff",opacity:r(.05,.36).toFixed(2)});
 c.style.animation="tw "+r(3,9).toFixed(1)+"s ease-in-out "+(-r(0,8)).toFixed(1)+"s infinite alternate";
 pk.appendChild(c);
}

/* grass tufts */
var gr=document.getElementById("grass");
for(i=0;i<24;i++){
 var gx=r(-10,W+10),gh=r(28,88),gd=Math.random()<.5?-1:1;
 gr.appendChild(el("path",{d:"M"+gx.toFixed(0)+" "+(FY+22)+" Q"+(gx+gd*gh*.45).toFixed(0)+" "+(FY-gh*.45).toFixed(0)+" "+(gx+gd*gh*.92).toFixed(0)+" "+(FY-gh).toFixed(0),
  fill:"none",stroke:"#1c5b39","stroke-width":r(1.6,4).toFixed(1),"stroke-linecap":"round",opacity:r(.45,.9).toFixed(2)}));
}

/* seaweed */
var weeds=[];
function weed(x,h,w,fill,front,amp,sp){
 var g=document.getElementById(front?"weedsFront":"weedsBack");
 var p=el("path",{fill:fill,opacity:front?.93:.8});g.appendChild(p);
 weeds.push({x:x,h:h,w:w,p:p,amp:amp,sp:sp,ph:r(0,6.28),n:14});
}
weed(118,252,13,"url(#gk1)",0,22,.55); weed(332,182,10,"url(#gk2)",0,18,.72);
weed(612,300,15,"url(#gk1)",0,26,.45); weed(884,158,9,"url(#gk2)",0,15,.82);
weed(1142,272,14,"url(#gk1)",0,24,.5); weed(1424,208,11,"url(#gk2)",0,20,.63);
weed(232,334,17,"url(#gk2)",1,30,.4);  weed(764,342,16,"url(#gk2)",1,28,.52);
weed(1288,300,15,"url(#gk2)",1,26,.46);
function build(w,t){
 var L=[],R=[],j,f,y,sw,x,tw;
 for(j=0;j<=w.n;j++){f=j/w.n;y=FY+14-f*w.h;
  sw=(Math.sin(t*w.sp+w.ph+f*2.6)*w.amp+.3*w.amp*Math.sin(t*w.sp*.7+f*1.6))*f*f;
  x=w.x+sw;tw=w.w*(1-.86*f);
  L.push(x.toFixed(1)+" "+y.toFixed(1));R.push((x+tw).toFixed(1)+" "+y.toFixed(1));}
 w.p.setAttribute("d","M"+L.join("L")+"L"+R.reverse().join("L")+"Z");
}

/* bubbles */
var bg=document.getElementById("bubbles"),BS=[],VENTS=[118,232,332,612,764,884,1142,1288,1424];
function mkB(){
 var g=el("g",{opacity:0}),o=el("circle",{fill:"url(#gBub)",stroke:"#eafaff","stroke-opacity":.5,"stroke-width":1}),
     h=el("circle",{fill:"#fff",opacity:.9});
 g.appendChild(o);g.appendChild(h);bg.appendChild(g);return {g:g,o:o,h:h};
}
function seed(b,y0,y1){
 b.r=r(2.2,11)*(Math.random()<.16?1.5:1);
 var v=VENTS[(Math.random()*VENTS.length)|0];
 b.bx=v+r(-24,24);b.y=r(y0,y1);b.amp=r(4,17);b.ph=r(0,6.28);b.sp=r(.7,1.8);
 b.vy=26+240/(b.r+3);paint(b);
}
function paint(b){
 b.o.setAttribute("r",b.r.toFixed(1));
 b.h.setAttribute("r",(b.r*.24+.3).toFixed(1));
 b.h.setAttribute("cx",(-b.r*.3).toFixed(1));
 b.h.setAttribute("cy",(-b.r*.32).toFixed(1));
}
for(i=0;i<26;i++){var b0=mkB();seed(b0,-30,FY+30);BS.push(b0);}
function burst(x,y,n){
 for(var k=0;k<n;k++){
  if(BS.length>80)break;
  var b=mkB();seed(b,0,1);
  b.r=r(1.8,7);b.bx=x+r(-16,16);b.x=b.bx;b.y=y+r(-12,12);
  b.vy=r(34,72);b.amp=r(3,12);paint(b);BS.push(b);
 }
}

/* fish */
var fish=[
 {g:document.getElementById("fishA"),x:260,by:344,y:344,spd:46,dir:1,bob:15,bp:0},
 {g:document.getElementById("fishB"),x:1180,by:596,y:596,spd:136,dir:-1,bob:10,bp:2.1}
];
fish.forEach(function(f){
 f.flip=f.g.querySelector(".flip");
 f.flip.setAttribute("transform","scale("+f.dir+",1)");
 f.boost=1;
 f.g.addEventListener("mouseenter",function(){f.boost=1.75;});
 f.g.addEventListener("mouseleave",function(){f.boost=1;});
});

/* pointer */
function pt(e){
 var rc=svg.getBoundingClientRect(),s=Math.max(rc.width/W,rc.height/H);
 return {x:(e.clientX-rc.left-(rc.width-W*s)/2)/s,y:(e.clientY-rc.top-(rc.height-H*s)/2)/s};
}
var px=W*.5,py=H*.45,has=false;
svg.addEventListener("pointermove",function(e){var p=pt(e);px=p.x;py=p.y;has=true;});
svg.addEventListener("pointerdown",function(e){var p=pt(e);burst(p.x,p.y,9);document.body.classList.add("clicked");});
document.getElementById("puff").addEventListener("click",function(){
 var v=VENTS[(Math.random()*VENTS.length)|0];burst(v+r(-14,14),FY+6,13);
});
var chips=document.querySelectorAll(".chips button"),mult=1;
Array.prototype.forEach.call(chips,function(b){
 b.addEventListener("click",function(){
  document.querySelector(".chips .on").classList.remove("on");
  b.classList.add("on");mult=parseFloat(b.getAttribute("data-m"));
 });
});

/* meters */
var mD=document.getElementById("mD"),mT=document.getElementById("mT"),mB=document.getElementById("mB"),tick=0;

/* loop */
var last=0,t0=performance.now();
function frame(now){
 var dt=Math.min(.05,(now-last)/1000)||0;last=now;var T=(now-t0)/1000;
 var k,f,sp,yy,tilt,b,op;
 for(k=0;k<fish.length;k++){
  f=fish[k];sp=f.spd*mult*f.boost;
  f.x+=sp*dt*f.dir;
  if(f.dir>0&&f.x>W+200)f.x=-200;
  if(f.dir<0&&f.x<-200)f.x=W+200;
  var tgt=f.by+(has?(py-H*.55)*.09:14*Math.sin(T*.21+k));
  if(tgt<215)tgt=215; if(tgt>668)tgt=668;
  f.y+=(tgt-f.y)*Math.min(1,dt*1.1);
  yy=f.y+Math.sin(T*.9+f.bp)*f.bob;
  tilt=Math.cos(T*.9+f.bp)*4*f.dir;
  f.g.setAttribute("transform","translate("+f.x.toFixed(1)+","+yy.toFixed(1)+") rotate("+tilt.toFixed(2)+")");
 }
 for(k=0;k<BS.length;k++){
  b=BS[k];
  b.y-=b.vy*mult*dt;
  b.x=b.bx+Math.sin(T*b.sp+b.ph)*b.amp;
  op=Math.min(1,(FY+34-b.y)/58);
  if(b.y<95)op=Math.min(op,Math.max(0,(b.y+34)/129));
  b.g.setAttribute("transform","translate("+b.x.toFixed(1)+","+b.y.toFixed(1)+")");
  b.g.setAttribute("opacity",op.toFixed(2));
  if(b.y<-34)seed(b,FY+2,FY+34);
 }
 for(k=0;k<weeds.length;k++)build(weeds[k],T);
 if(++tick%8===0){
  var d=(has?py/H*36+2:12+5*Math.sin(T*.3));
  mD.firstChild.nodeValue=d.toFixed(1)+" m";
  mT.firstChild.nodeValue=(19.2-d*.28+.3*Math.sin(T*.5)).toFixed(1)+" \u00B0C";
  mB.firstChild.nodeValue=BS.length;
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
requestAnimationFrame(function(){document.body.classList.add("ready");});
})();
