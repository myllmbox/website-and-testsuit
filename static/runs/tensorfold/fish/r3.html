<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelagic Drift — an SVG reef window</title>
<!-- procedural reef window: light shafts, swaying kelp, drifting plankton, two swimmers, rising bubbles. -->
<style>
  :root{
    --bone:#F5F2E9; --aqua:#CFEFFA; --gold:#F3DFB4; --ink:#041A2E;
    --display:"Didot","Bodoni MT","Hoefler Text",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#062036}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #tank{display:block;width:100vw;height:100vh}
  .ui{position:fixed;z-index:3;pointer-events:none;animation:rise .9s .12s cubic-bezier(.2,.75,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .masthead{left:clamp(16px,3vw,46px);top:clamp(18px,3.4vh,42px);max-width:min(52vw,560px)}
  .eyebrow{margin:0 0 8px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(214,244,255,.72);text-shadow:0 1px 10px rgba(4,26,44,.75)}
  .masthead h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,5.8vw,74px);
    line-height:.9;letter-spacing:.004em;color:var(--bone);text-shadow:0 2px 26px rgba(3,22,38,.62)}
  .rule{width:58px;height:2px;margin:16px 0 12px;background:linear-gradient(90deg,rgba(243,223,180,0),rgba(243,223,180,.95),rgba(243,223,180,0))}
  .sub{margin:0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(207,239,250,.78);
    text-shadow:0 1px 12px rgba(4,26,44,.7)}

  .key{left:clamp(16px,3vw,46px);bottom:clamp(18px,3.4vh,40px);padding:12px 15px 13px;
    display:grid;grid-template-columns:auto 1fr;gap:5px 11px;align-items:center;
    background:rgba(4,26,44,.8);border-left:2px solid rgba(243,223,180,.45);
    -webkit-backdrop-filter:blur(7px) saturate(1.25);backdrop-filter:blur(7px) saturate(1.25)}
  .key h2{grid-column:1/-1;margin:0 0 7px;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;
    color:rgba(243,223,180,.88);display:flex;align-items:center;gap:9px}
  .key h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(243,223,180,.5),rgba(243,223,180,0))}
  .sw{display:block;width:26px;height:14px}
  .sw .fin,.sw .tail{opacity:.9}
  .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua)}
  .tag em{font-family:var(--display);font-style:italic;text-transform:none;letter-spacing:.01em;
    font-size:14px;color:var(--gold);display:block;margin-top:2px}
  .current{right:clamp(16px,3vw,46px);bottom:clamp(18px,3.4vh,40px);display:flex;align-items:center;gap:9px;
    padding:9px 13px;background:rgba(4,26,44,.74);border-left:2px solid rgba(243,223,180,.4);
    font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,223,180,.9)}
  .current .arr{width:22px;height:8px;flex:none}
  @media (max-width:640px){.key,.current{display:none}.masthead{max-width:86vw}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg id="tank" aria-hidden="true" role="presentation" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs>
  <g id="scene">
    <rect id="bg" x="-40" y="-40" width="1520" height="980" fill="url(#water)"/>
    <rect id="haze" x="-40" y="-40" width="1520" height="980" fill="url(#hazeG)"/>
    <g id="rays" filter="url(#soft)" opacity=".16" style="mix-blend-mode:screen"></g>
    <g id="motes" opacity=".9"></g>
    <g id="rockBack" opacity=".46"></g>
    <g id="floraBack" filter="url(#blur2)" opacity=".42"></g>
    <path id="duneFar" stroke="#F9E7C1" stroke-opacity=".3" stroke-width="1.6" fill="url(#sand2)"/>
    <path id="duneNear" stroke="#FAEACB" stroke-opacity=".38" stroke-width="2" fill="url(#sand1)"/>
    <g id="ridge" fill="#33506A" stroke="#1B2E44" stroke-opacity=".5" stroke-width="1.2"></g>
    <g id="pebbles"></g>
    <g id="shells"></g>
    <g id="floraFront" filter="url(#blur1)"></g>
    <g id="bubbles"></g>
    <g id="fish"></g>
    <g id="labels"></g>
  </g>
</svg>

<div class="ui masthead">
  <p class="eyebrow">Tank 04 — reef window</p>
  <h1>Pelagic<br>Drift</h1>
  <div class="rule"></div>
  <p class="sub">Two swimmers &middot; one sediment &middot; bubbles without end</p>
</div>

<div class="ui key">
  <h2>Field key</h2>
  <svg class="sw" viewBox="0 0 26 14" aria-hidden="true">
    <polygon class="tail" points="3,2 3,12 11,8.6 11,5.4" fill="#8F3620"></polygon>
    <path class="fin" d="M12 3 L17 0 L20 4.4 Z" fill="#8F3620"></path>
    <ellipse cx="14" cy="7" rx="9.5" ry="6.6" fill="#FF7A45"></ellipse>
    <circle cx="19.8" cy="5.2" r="2.1" fill="#FFF7E6"></circle>
    <circle cx="20.5" cy="5.2" r="1" fill="#17293C"></circle>
  </svg>
  <div class="em">Slow grazer<em>Cerume puncher</em></div>
  <svg class="sw" viewBox="0 0 26 14" aria-hidden="true">
    <polygon class="tail" points="1,1.5 1,12.5 9,9 9,4" fill="#5B4BD1"></polygon>
    <path class="fin" d="M13 3 L17 -0.4 L20 3.8 Z" fill="#7A6BEA"></path>
    <ellipse cx="12" cy="7" rx="11" ry="4.1" fill="#1FE6CC"></ellipse>
    <circle cx="19.6" cy="6.1" r="1.7" fill="#FFF7E6"></circle>
    <circle cx="20.2" cy="6.1" r=".85" fill="#17293C"></circle>
  </svg>
  <div class="em">Fast runner<em>Long mackerel</em></div>
</div>

<div class="ui current">
  <svg class="arr" viewBox="0 0 22 8" aria-hidden="true">
    <path d="M1 4 H19 M14.5 0.8 L19 4 L14.5 7.2" fill="none" stroke="#F3E6C8"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <span>Drift</span>
</div>

<script>
(function(){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('tank'), stage=document.getElementById('scene');
  var W=window.innerWidth||document.documentElement.clientWidth;
  var H=window.innerHeight||document.documentElement.clientHeight;

  var rand=function(a,b){return a+Math.random()*(b-a);};
  var pick=function(a){return a[(Math.random()*a.length)|0];};
  var r2=function(n){return Math.round(n*100)/100;};

  /* ---------- gradients, filters ---------- */
  function defsMarkup(w,h){
    var top=Math.round(h*0.68);
    var rays='';
    [[120,70,-7,13],[430,104,4,9],[760,58,-3,14],[1010,96,7,10],[1330,84,-5,12]].forEach(function(r,i){
      rays+='<g transform="translate('+r[0]+','+(-h*0.03)+') rotate('+r[2]+') scale('+(r[1]/62)+','+(1+r[3]/120)+')">'
          + '<polygon points="0,0 62,0 34,'+top+' -34,'+top+'" fill="#E8FBFF"/></g>';
    });
    return ''
    +'<linearGradient id="water" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="'+h+'" data-fx="water">'
      +'<stop offset="0" stop-color="#86DBEE"/><stop offset=".3" stop-color="#2A8FC2"/>'
      +'<stop offset=".66" stop-color="#14568A"/><stop offset="1" stop-color="#06203C"/></linearGradient>'
    +'<radialGradient id="hazeG" gradientUnits="userSpaceOnUse" cx="'+(w*0.53)+'" cy="'+(h*0.86)+'" r="'+(h*0.78)+'" data-fx="haze">'
      +'<stop offset="0" stop-color="#02141F" stop-opacity=".6"/><stop offset=".55" stop-color="#052239" stop-opacity=".24"/>'
      +'<stop offset="1" stop-color="#0A3049" stop-opacity="0"/></radialGradient>'
    +'<linearGradient id="rayG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="'+top+'">'
      +'<stop offset="0" stop-color="#E8FBFF" stop-opacity=".9"/><stop offset="1" stop-color="#E8FBFF" stop-opacity="0"/></linearGradient>'
    +'<linearGradient id="sand1" gradientUnits="userSpaceOnUse" x1="0" y1="'+(h*0.8)+'" x2="0" y2="'+h+'">'
      +'<stop offset="0" stop-color="#E8CFA0"/><stop offset=".45" stop-color="#C09A66"/><stop offset="1" stop-color="#6E5230"/></linearGradient>'
    +'<linearGradient id="sand2" gradientUnits="userSpaceOnUse" x1="0" y1="'+(h*0.82)+'" x2="0" y2="'+h+'">'
      +'<stop offset="0" stop-color="#C8A26C"/><stop offset="1" stop-color="#7B5B38"/></linearGradient>'
    +'<radialGradient id="bub" gradientUnits="objectBoundingBox" cx=".35" cy=".3" r=".72">'
      +'<stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset=".55" stop-color="#B4EEFF" stop-opacity=".12"/>'
      +'<stop offset="1" stop-color="#FFFFFF" stop-opacity=".3"/></radialGradient>'
    +'<linearGradient id="bodyA" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">'
      +'<stop offset="0" stop-color="#FFCB63"/><stop offset=".5" stop-color="#F4633A"/><stop offset="1" stop-color="#AF2B19"/></linearGradient>'
    +'<linearGradient id="tailA" gradientUnits="objectBoundingBox" x1="1" y1="0" x2="0" y2="0">'
      +'<stop offset="0" stop-color="#2B4A63"/><stop offset="1" stop-color="#122C42"/></linearGradient>'
    +'<linearGradient id="bodyB" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">'
      +'<stop offset="0" stop-color="#1FE6CC"/><stop offset=".5" stop-color="#1479BE"/><stop offset="1" stop-color="#0C4392"/></linearGradient>'
    +'<filter id="soft" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="15"/></filter>'
    +'<filter id="blur1" x="-30%" y="-12%" width="160%" height="132%"><feGaussianBlur stdDeviation="1.2"/></filter>'
    +'<filter id="blur2" x="-30%" y="-12%" width="160%" height="132%"><feGaussianBlur stdDeviation="2.4"/></filter>';
  }

  var defs=document.getElementById('defs');
  function applyDefs(){ defs.innerHTML=defsMarkup(W,H); }
  applyDefs();

  function el(tag,at,parent,txt){
    var e=document.createElementNS(NS,tag);
    for(var k in at) e.setAttribute(k,at[k]);
    if(parent) parent.appendChild(e);
    if(txt!=null) e.textContent=txt;
    return e;
  }
  function q(id){return document.getElementById(id);}

  /* ---------- sediment profile ---------- */
  function seabedPath(amp,base,step){
    var d='M-40,'+(H+40)+' V'+Math.round(base);
    for(var x=-40;x<W+80;x+=step){
      var y=base-amp*(0.5+0.5*Math.abs(Math.sin(x*0.008)+0.6*Math.sin(x*0.021+1.2)));
      d+=' L'+Math.round(x)+','+Math.round(y);
    }
    return d+' L'+(W+40)+','+Math.round(base)+' V'+(H+40)+' Z';
  }
  function sandY(x){
    var s=Math.sin(x*0.008)+0.6*Math.sin(x*0.021+1.2);
    return H*0.925-H*0.06*(0.5+0.5*Math.abs(s));
  }

  /* ---------- scene assembly ---------- */
  var PLANTS=[];
  function leaf(p,cx,cy,rx,ry,rot,fill,op){
    var t='rotate('+rot+' '+r2(cx)+' '+r2(cy)+') translate('+r2(cx)+' '+r2(cy)+')';
    el('ellipse',{cx:0,cy:0,rx:r2(rx),ry:r2(ry),transform:t,fill:fill,'fill-opacity':op},p);
  }
  function bladder(p,cx,cy,r){
    var c={cx:r2(cx),cy:r2(cy),r:r2(r),fill:'#12805F','fill-opacity':'.6'};
    el('circle',c,p);
    c.cx=r2(cx+r*0.7); c.cy=r2(cy-r*0.9); c.r=r2(r*0.72); c.fill='#1CBFA1'; c['fill-opacity']='.5';
    el('circle',c,p);
  }
  /* big kelp: a wavy stem ribbon + stacked leaf ellipses */
  var KELP='<path d="M0,0 C5,-18 -6,-36 3,-56 C11,-74 -4,-92 4,-116 C10,-134 0,-150 5,-170 C8,-184 2,-196 6,-210 C2,-216 -4,-212 -6,-200 C-2,-186 2,-174 1,-160 C-3,-140 4,-124 -1,-104 C-6,-86 4,-70 -3,-48 C-8,-30 2,-14 0,0 Z" fill="#1E9C6A" fill-opacity=".72"/>'
    +'<path d="M2,-18 C12,-34 10,-58 2,-76 C10,-96 8,-118 2,-136 C7,-154 4,-172 1,-190 C-3,-202 -1,-214 2,-224 C-3,-212 -6,-196 -3,-176 C-7,-154 -4,-134 -4,-114 C-6,-90 -8,-64 -2,-44 C-6,-26 -8,-10 -2,0 Z" fill="#0E6F45" fill-opacity=".82"/>'
    +'<ellipse cx="7" cy="-42" rx="7" ry="17" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="-6" cy="-104" rx="6" ry="15" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="4" cy="-170" rx="5" ry="13" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="-5" cy="-232" rx="7" ry="17" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="3" cy="-296" rx="6" ry="15" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="-1" cy="-352" rx="5" ry="12" fill="#16B27C" fill-opacity=".5"/>'
    +'<ellipse cx="2" cy="-404" rx="4" ry="9" fill="#16B27C" fill-opacity=".5"/>';
  var BUSH='<ellipse cx="0" cy="-12" rx="7" ry="17" transform="rotate(-22 0 -12)"/>'
    +'<ellipse cx="0" cy="-32" rx="8" ry="19" transform="rotate(9 0 -32)"/>'
    +'<ellipse cx="0" cy="-54" rx="7" ry="16" transform="rotate(-14 0 -54)"/>'
    +'<ellipse cx="0" cy="-74" rx="5.5" ry="13" transform="rotate(15 0 -74)"/>'
    +'<circle cx="4" cy="-22" r="5"/><circle cx="-5" cy="-42" r="4.2"/><circle cx="3" cy="-62" r="3.6"/>';

  function plant(x,baseY,s,flip,h,layer){
    var g=el('g',{},layer);
    g.innerHTML='<g transform="translate(0,'+(-h)+')"><g transform="matrix(1,0,'+(flip?-0.34:0.34)+',1,0,0)">'+layer.__body+'</g></g>';
    var p=document.querySelector('.sw[data-i="'+PLANTS.length+'"]');
    PLANTS.push({g:g,x:x,y:baseY,s:s,flip:flip,h:h});
    return g;
  }

  var BUBREG=[[0.30,0.10],[0.38,0.16],[0.10,0.13],[0.03,0.05],[0.04,0.14],[0.11,0.13],[0.13,0.15],[0.18,0.11]];

  function seabedFill(){
    q('duneFar').setAttribute('d',seabedPath(H*0.038,H*0.9,H*0.085));
    q('duneNear').setAttribute('d',seabedPath(H*0.052,H*0.925,H*0.062));

    var rb=q('rockBack'); rb.innerHTML='';
    el('ellipse',{cx:r2(W*0.8),cy:r2(H*0.855),rx:r2(W*0.28),ry:r2(H*0.115)},rb);
    el('ellipse',{cx:r2(W*0.615),cy:r2(H*0.885),rx:r2(W*0.145),ry:r2(H*0.07)},rb);

    var pf=q('floraBack'); pf.innerHTML='';
    function addBack(b){ var g=el('g',{},pf); g.innerHTML=b; return g; }
    var k1=el('g',{},pf); k1.innerHTML='<g>'+KELP+'</g>';
    el('g',{transform:'matrix(1,0,0.34,1,0,0)',fill:'#0C6B48'},k1)
      .appendChild(el('path',{d:'M0,0 C6,-18 -4,-36 3,-56 C10,-74 -3,-92 4,-116 C10,-134 1,-150 6,-172 C9,-186 3,-198 7,-212 C3,-218 -3,-214 -5,-202 C-1,-188 3,-176 2,-162 C-2,-142 5,-126 0,-106 C-5,-88 5,-72 -2,-50 C-7,-32 2,-14 0,0 Z',fill:'#12795A','fill-opacity':'.55'}));
    var k2=el('g',{},pf); k2.innerHTML='<g>'+BUSH+'</g>';
    el('g',{transform:'matrix(1,0,-0.3,1,0,0)',fill:'#1E9C6A'},k2).appendChild(el('path',{d:'M0,0 C4,-18 -5,-36 2,-56 C9,-74 -3,-92 4,-114 C8,-128 2,-140 5,-152 C1,-158 -3,-152 -4,-142 C-1,-130 2,-118 1,-104 C-3,-84 3,-68 -2,-48 C-6,-30 2,-14 0,0 Z',fill:'#0F7A4E','fill-opacity':'.6'}));

    var fr=q('floraFront'); fr.innerHTML='';

    var pe=q('pebbles'); pe.innerHTML='';
    el('g',{fill:'#6E5636','fill-opacity':'.55'},pe);
    var pegg=pe.firstChild;
    for(var i=0;i<20;i++){
      var x=rand(40,W-40);
      el('ellipse',{cx:r2(x),cy:r2(sandY(x)+rand(1,4)),rx:r2(rand(3,10)),ry:r2(rand(1.4,4)),transform:'rotate('+r2(rand(-18,18))+' '+r2(x)+' '+r2(sandY(x))+')'},pegg);
    }
    var sh=q('shells'); sh.innerHTML='';
    var shG=el('g',{fill:'none',stroke:'#F6E3BC','stroke-opacity':'.4','stroke-width':'1.1'},sh);
    for(var j=0;j<4;j++){
      var sx=rand(120,W-140), sy=sandY(sx)+rand(2,7), sr=rand(6,9.5), sg=el('g',{transform:'translate('+r2(sx)+' '+r2(sy)+')'},shG);
      for(var k=1;k<7;k++) el('line',{x1:0,y1:0,x2:r2(Math.sin(k*0.48)*sr),y2:r2(-Math.cos(k*0.48)*sr*0.92)},sg);
    }

    var rr=q('ridge'); rr.innerHTML='';
    for(var m=0;m<6;m++){
      var x1=rand(20,W*0.36), y1=rand(H*0.8,H*0.87);
      var x2=rand(W*0.74,W*0.95), y2=rand(H*0.82,H*0.895);
      el('ellipse',{cx:r2(x1),cy:r2(y1),rx:r2(rand(30,64)),ry:r2(rand(11,23))},rr);
      el('ellipse',{cx:r2(x2),cy:r2(y2),rx:r2(rand(26,58)),ry:r2(rand(10,20))},rr);
    }
    el('g',{transform:'translate(176,'+Math.round(H*0.918)+') scale(1.05)'},fr).appendChild(
      (function(){var g=el('g',{fill:'#1F8F63','fill-opacity':'.92'});
        g.innerHTML='<path d="M0,0 C3,-22 -5,-44 1,-66 C6,-84 0,-102 4,-118 C1,-124 -3,-118 -4,-108 C-1,-94 2,-82 1,-68 C-2,-46 4,-26 0,-4 Z" fill="#1B7C58" fill-opacity=".9"/>'
        +'<path d="M-2,-34 C-12,-44 -16,-56 -10,-64 C-14,-76 -10,-86 -4,-92 C-9,-80 -13,-72 -8,-64 C-13,-54 -9,-44 -2,-34 Z" fill="#17B494" fill-opacity=".55"/>'
        +'<path d="M2,-54 C11,-64 15,-76 10,-84 C14,-94 11,-102 6,-108 C11,-98 14,-92 9,-84 C14,-74 10,-64 2,-54 Z" fill="#17B494" fill-opacity=".5"/>';
        return g;})());

    var tube=el('g',{transform:'translate(244,'+Math.round(H*0.902)+')'},fr);
    var tb=el('g',{fill:'#B02A6E','fill-opacity':'.9',stroke:'#F062A8','stroke-opacity':'.4','stroke-width':'1.4'},tube);
    el('path',{d:'M0,0 L0,-58'},tb); el('path',{d:'M11,3 L17,-42'},tb);
    el('path',{d:'M-11,1 L-15,-34'},tb);
    var bulb=el('g',{fill:'#E0418A','fill-opacity':'.95'},tube);
    el('circle',{cx:0,cy:-60,r:5.4},bulb); el('circle',{cx:18,cy:-44,r:4.4},bulb);
    el('circle',{cx:-16,cy:-36,r:3.6},bulb); el('circle',{cx:7,cy:-24,r:3},bulb);

    var kelpFront=el('g',{},fr); kelpFront.innerHTML='<g>'+KELP+'</g>';
    el('g',{transform:'matrix(1,0,0.34,1,0,0)',fill:'#0E6F45'},kelpFront)
      .appendChild(el('path',{d:'M0,0 C5,-18 -6,-36 3,-56 C11,-74 -4,-92 4,-116 C10,-134 0,-150 5,-170 C8,-184 2,-196 6,-210 C2,-216 -4,-212 -6,-200 C-2,-186 2,-174 1,-160 C-3,-140 4,-124 -1,-104 C-6,-86 4,-70 -3,-48 C-8,-30 2,-14 0,0 Z',fill:'#0E6F45','fill-opacity':'.85'}));
    var bushFront=el('g',{},fr); bushFront.innerHTML='<g>'+BUSH+'</g>';

    PLANTS.push({layer:pf,ref:k1,x:W*0.24,y:H*0.905,s:1.38,flip:false,h:H*0.47});
    PLANTS.push({layer:pf,ref:k2,x:W*0.885,y:H*0.893,s:1.12,flip:true,h:H*0.39});
    PLANTS.push({layer:fr,ref:kelpFront,x:W*0.705,y:H*0.918,s:1.5,flip:false,h:H*0.52});
    PLANTS.push({layer:fr,ref:bushFront,x:W*0.135,y:H*0.908,s:1.1,flip:true,h:H*0.31});

    var rk=q('rockBack');
    rk.setAttribute('fill','#2A4763'); rk.setAttribute('fill-opacity','.4');
    var rbB=q('floraBack');
    var bubbles=q('bubbles'); bubbles.innerHTML='';
    var list=[];
    var kinds=[24,17,11,7,4.5,2.8];
    function makeBubble(){
      var reg=pick(BUBREG), r=rand(1.6,4.4), y=H*(1-reg[1])-rand(0,14);
      var c=el('circle',{r:r2(r),fill:'url(#bub)',stroke:'#D8F5FF','stroke-opacity':'.55','stroke-width':'.75'},bubbles);
      return {el:c,r:r,fx:reg[0],fy:y/H};
    }
    for(var b=0;b<24;b++) list.push(makeBubble());
    return list;
  }

  /* ---------- fish ---------- */
  var PARROT='<polygon points="-14,-5 -41,-21 -41,21 -14,6" fill="url(#tailA)" stroke="#16283D" stroke-opacity=".4" stroke-width="1.4"/>'
    +'<path d="M-14,-6 C-22,-24 -14,-32 -2,-26 C 8,-21 16,-12 24,-3 C 31,3 36,5 40,3 L 41,5 C 36,10 30,12 24,11 C 12,17 -2,14 -11,6 Z" fill="url(#bodyA)"/>'
    +'<ellipse cx="14" cy="0" rx="27" ry="19" fill="url(#bodyA)" stroke="#5B1E0C" stroke-opacity=".45" stroke-width="1.4"/>'
    +'<path d="M-6,-17 C3,-31 22,-35 37,-24 C27,-20 13,-13 3,-10 Z" fill="#8F3620" fill-opacity=".95"/>'
    +'<path d="M-1.5,13 C4,23 13,26 18,20 C11,16 5,14 -1.5,13 Z" fill="#8F3620" fill-opacity=".85"/>'
    +'<path d="M3,10 C15,6 25,9 31,15 C21,19 11,19 3,16 Z" fill="#8F3620" fill-opacity=".9"/>'
    +'<path d="M-4,-11 C6,-7 12,0 6,9" fill="none" stroke="#6E1D14" stroke-opacity=".38" stroke-width="4.5" stroke-linecap="round"/>'
    +'<circle cx="19" cy="-4" r="11" fill="#FFE9B4" fill-opacity=".55"/>'
    +'<circle cx="18" cy="-6" r="6" fill="#FFF7E6"/>'
    +'<circle cx="19.6" cy="-6" r="2.9" fill="#17293C"/>'
    +'<path d="M41,2 Q37.5,5.5 33.5,6.5" fill="none" stroke="#47140B" stroke-opacity=".92" stroke-width="1.9" stroke-linecap="round"/>'
    +'<path d="M41,2 L34,1.2" fill="none" stroke="#47140B" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>'
    +'<circle cx="41" cy="2" r="1.2" fill="#47140B" fill-opacity=".7"/>';

  var MACK='<polygon points="-26,-5 -53,-18 -53,17 -26,5" fill="#124C86" fill-opacity=".9" stroke="#0A2A56" stroke-opacity=".45" stroke-width="1.1"/>'
    +'<path d="M-26,-4 C0,-14 22,-11 42,-1 C22,10 0,12 -26,4 Z" fill="url(#bodyB)"/>'
    +'<ellipse cx="2" cy="0" rx="34" ry="9" fill="url(#bodyB)" stroke="#07294E" stroke-opacity=".4" stroke-width="1.1"/>'
    +'<path d="M-20,5 C-10,13 6,13 16,7 C4,9 -8,9 -20,5 Z" fill="#0B3F72" fill-opacity=".6"/>'
    +'<path d="M6,-8 C14,-24 30,-24 40,-11 C28,-9 16,-8 6,-8 Z" fill="#7A6BEA" fill-opacity=".9"/>'
    +'<circle cx="25" cy="-2" r="3" fill="#FFF7E6"/>'
    +'<circle cx="26.1" cy="-2" r="1.5" fill="#152238"/>'
    +'<path d="M42,-1 L35,3.5" fill="none" stroke="#06264B" stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round"/>'
    +'<path d="M42,-1 L36,0.4" fill="none" stroke="#06264B" stroke-opacity=".5" stroke-width="1"/>'
    +'<circle cx="42" cy="-1" r="1" fill="#06264B" fill-opacity=".6"/>';

  var fg=q('fish');
  function mkFish(markup,speed,depth,margin){
    var g=el('g',{},fg); g.innerHTML='<g>'+markup+'</g>';
    var bb=g.getBBox();
    return {el:g,inner:g.firstChild,l:bb.width,h:bb.height,x:0,y:0,dir:1,cxp:0.5,cyp:0.45,sp:speed,depth:depth,margin:margin,ph:rand(0,6.283)};
  }
  var big=mkFish(PARROT,62,58,90), small=mkFish(MACK,162,42,60);

  function layout(f){
    var s=Math.min(f.depth/f.h,(W*0.24)/f.l);
    s=Math.min(s,2.1); s=Math.max(s,0.55);
    var sc=(f.x<W*0.5)?-1:1;
    f.el.setAttribute('transform','translate('+r2(f.x)+' '+r2(f.y)+') scale('+r2(s*sc)+' '+r2(s)+')');
  }
  function resetFish(f,dir,edge){
    var l=f.l;
    var cy=Math.min(sandY(clamp(f.x,-40,W+40))-28,Math.max(H*0.14,H*0.45));
    f.y=Math.min(H*0.45,sandY(clamp(f.x,-40,W+40))-28);
    f.x=edge*(W*0.5+l)+Math.sign(edge)*0;
    f.dir=dir; f.cxp=f.x/W; f.cyp=f.y/H; f.ph=rand(0,6.283); layout(f);
  }
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}

  /* ---------- plankton motes ---------- */
  var motes=[];
  (function(){
    var layer=q('motes');
    for(var i=0;i<44;i++){
      var c=el('circle',{r:r2(rand(0.7,2.3)),fill:'#CFF2FF','fill-opacity':r2(rand(0.1,0.24))},layer);
      motes.push({el:c,fx:rand(0,1),fy:rand(0,1),vx:-rand(3,17),vy:rand(-3,3),ph:rand(0,6.283),sp:rand(0.4,1.1)});
    }
  })();

  /* ---------- build / rebuild ---------- */
  var bubbles;
  function place(p){
    p.ref.parentNode.setAttribute('transform','translate('+r2(p.x)+' '+r2(p.y)+') scale('+r2(p.s)+')'+(p.flip?' scale(-1,1)':''));
  }
  function build(){
    for(var i=0;i<PLANTS.length;i++) PLANTS[i].layer.innerHTML='';
    var list=seabedFill();
    PLANTS.forEach(function(p){ p.layer.appendChild(p.ref); place(p); });
    bubbles=list;
  }
  build();
  function placeLabels(){
    var lab=q('labels'); lab.innerHTML='';
    [[big,'Cerume puncher','Slow grazer',0.22],[small,'Long mackerel','Fast runner',0.62]].forEach(function(c){
      var g=el('g',{transform:'translate(28 '+(H-132)+')'},lab);
      el('rect',{x:0,y:0,width:238,height:58,rx:3,fill:'#041A2E','fill-opacity':'.9'},g);
      el('line',{x1:0,y1:24,x2:238,y2:24,stroke:'#F3DFB4','stroke-opacity':'.42','stroke-width':1},g);
      el('text',{x:14,y:48,'font-family':'Didot,Georgia,serif','font-size':24,fill:'#F7E7C6'},g).textContent=c[1];
      el('text',{x:14,y:16,'font-family':'ui-monospace,Menlo,monospace','font-size':11,'letter-spacing':'.16em',fill:'#A9DCF0'},g).textContent=c[2];
      el('circle',{cx:224,cy:14,r:3,fill:c[3]<0?'#F4633A':'#1FE6CC','fill-opacity':'.9'},g);
      el('text',{x:214,y:48,'font-family':'ui-monospace,Menlo,monospace','font-size':10,'letter-spacing':'.1em',fill:'#95CFE6'},g).textContent=(c[3]<0?'westward':'eastward');
      el('text',{x:228,y:16,'font-family':'ui-monospace,Menlo,monospace','font-size':10,fill:'#A9DCF0'},g).textContent='2';
      var idx=lab.lastChild; idx.setAttribute('text-anchor','end'); idx.setAttribute('x',214);
    });
  }
  function reset(f,dir,edge){
    var pad=f.l*f.depth/f.h*1.7;
    f.x=edge*(W*0.5+pad); f.dir=dir;
    f.y=Math.min(H*0.45,sandY(clamp(f.x,-60,W+60))-28);
    f.cxp=f.x/W; f.cyp=f.y/H; f.ph=rand(0,6.283); layout(f);
  }
  reset(big,-1,-1); reset(small,1,1); placeLabels();

  var raf=null;
  function start(){ if(raf===null) raf=requestAnimationFrame(tick); }

  var last=performance.now(), t0=performance.now();
  function tick(now){
    raf=requestAnimationFrame(tick);
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    var t=(now-t0)/1000;
    var sp=(W*H)/(1440*900);

    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      var v=Math.min(72,Math.max(15,58/(b.r+1.9)));
      b.fy-=(v*dt*sp)/H;
      b.fx+=Math.sin(b.ph+t*0.9)*12*dt*sp/W;
      if(b.fy*H+b.r<0){
        var reg=pick(BUBREG);
        b.fx=rand(0,1); b.r=rand(1.6,4.4);
        b.fx=clamp(b.fx+rand(-0.06,0.06),-0.02,1.02);
        b.fy=clamp(1-reg[1]-rand(0,14/H),0,1.2);
        b.r=rand(1.6,4.4); b.v=0;
        b.el.setAttribute('r',r2(b.r));
      }
      b.el.setAttribute('cx',r2(b.fx*W));
      b.el.setAttribute('cy',r2(b.fy*H));
    }

    var fish=[big,small];
    for(var k=0;k<2;k++){
      var f=fish[k];
      var x=f.x+f.dir*f.sp*dt*sp;
      var lim=W*0.5+f.l+f.margin;
      if(x>lim) x=-lim; else if(x<-lim) x=lim;
      f.x=x; f.cxp=x/W;
      var cy=Math.min(H*0.45,sandY(clamp(x,-60,W+60))-28);
      var cy2=Math.max(H*0.13,cy+f.depth*0.34*Math.sin(t*0.6+f.ph));
      f.y=cy2; f.cyp=cy2/H;
      layout(f);
    }

    for(var m=0;m<motes.length;m++){
      var mo=motes[m];
      mo.fx+=(mo.vx*dt*sp)/W*(0.6+0.4*Math.sin(t*mo.sp+mo.ph));
      mo.fy+=Math.cos(t*0.45+mo.ph)*7*dt*sp/H;
      if(mo.fx<-0.02) mo.fx=1.02; if(mo.fx>1.02) mo.fx=-0.02;
      if(mo.fy>1.02) mo.fy=-0.02; if(mo.fy<-0.02) mo.fy=1.02;
      mo.el.setAttribute('cx',r2(mo.fx*W));
      mo.el.setAttribute('cy',r2(mo.fy*H));
    }
  }
  raf=requestAnimationFrame(tick);

  /* ---------- keep the window correct on resize ---------- */
  var lastW=W,lastH=H,timer=null;
  function rebuild(){
    applyDefs();
    q('bg').setAttribute('x',-40); q('haze').setAttribute('x',-40);
    q('bg').setAttribute('y',-40); q('haze').setAttribute('y',-40);
    q('bg').setAttribute('width',W+80); q('haze').setAttribute('width',W+80);
    q('bg').setAttribute('height',H+80); q('haze').setAttribute('height',H+80);
    build();
    placeLabels();
    reset(big,-1,-1); reset(small,1,1);
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      b.fy=Math.min(b.fy,1-0.02); b.fx=clamp(b.fx,-0.02,1.02);
      b.el.setAttribute('cx',r2(b.fx*W)); b.el.setAttribute('cy',r2(b.fy*H));
    }
  }
  window.addEventListener('resize',function(){
    var w=window.innerWidth||document.documentElement.clientWidth;
    var h=window.innerHeight||document.documentElement.clientHeight;
    if(w===lastW&&h===lastH) return;
    lastW=W=w; lastH=H=h;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    clearTimeout(timer); timer=setTimeout(rebuild,120);
  });

  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){ last=performance.now(); }
  });
})();
</script>
</body>
</html>
