<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Pasture — a bouncing four species field</title>
<style>
/* ─── STAGE ─────────────────────────────────────────────────────────────
   The pasture is authored as ONE full viewport SVG, but drawn into two
   proportional layers (#layerFar / #layerNear) that are re-projected to the
   exact viewport box on load and resize, so the sky band keeps its 65 %
   height and the horizon line stays a *line* at any window shape — portrait
   or ultrawide — while a handful of scattered props are placed in
   viewport-proportional coordinates (data-fx), keeping the field populated.
   ───────────────────────────────────────────────────────────────────── */
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#a5dcf2}
body{font:500 clamp(8px,1.05vw,12px)/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     letter-spacing:.12em;text-transform:uppercase}

#stage{position:fixed;inset:0;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(122% 68% at 70% 106%, rgba(43,116,58,.92), rgba(43,116,58,0) 60%),
    radial-gradient(80% 46% at 14% 8%, rgba(255,251,224,.62), rgba(255,251,224,0) 72%),
    linear-gradient(#a5dcf2 0%,#c6e9f5 44.5%,#eef6df 64.6%,
                   #78bd5b 65.1%,#4e9c48 73%,#2c6b36 100%);
  transform:translateY(22px) scale(1.03);opacity:0;
  animation:reveal 1s .1s cubic-bezier(.2,.75,.25,1) forwards}
#stage.sharp{filter:saturate(1.03) contrast(1.05) brightness(1.01)}
@keyframes reveal{to{opacity:1;transform:none}}

.slab{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.actor{will-change:transform}

/* clouds: born off one edge, die off the other, then wrap */
#clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.cloud{position:fixed;left:50%;margin-left:-190px;width:380px;height:176px;
  transform:translateX(-50%);transform:translateX(-50%) translate3d(-112%,0,0);
  transform:translate3d(-112%,0,0);opacity:.9}
@keyframes driftL{from{transform:translate3d(112%,0,340px)}to{transform:translate3d(-112%,0,-340px)}}
@keyframes driftR{from{transform:translate3d(-112%,0,-340px)}to{transform:translate3d(112%,0,340px)}}
.drift{animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}

/* the four herds bounce — staggered so nothing lands in sync */
@keyframes bounceA{0%,100%{transform:translate3d(0,0,0)}58%{transform:translate3d(0,-13px,0)}}
@keyframes bounceB{0%,100%{transform:translate3d(0,0,0)}56%{transform:translate3d(0,-16px,0)}}
@keyframes bounceC{0%,100%{transform:translate3d(0,0,0)}54%{transform:translate3d(0,-14px,0)}}
@keyframes bounceD{0%,100%{transform:translate3d(0,0,0) scale(1,1)}
  28%{transform:translate3d(0,-12px,0) scale(.982,1.045)}
  64%{transform:translate3d(0,0,0) scale(1.045,.965)}}
@keyframes shPulse{0%,100%{transform:scale(1,1);opacity:.42}52%{transform:scale(.8,.66);opacity:.2}}
@keyframes flap{0%,100%{transform:scale(1,1)}50%{transform:scale(1.14,.72)}}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
@keyframes tick{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
.sway{animation:sway 8.4s ease-in-out infinite}
.sway2{animation:sway 9.6s ease-in-out -3.1s infinite reverse}
.tick{animation:tick 3.1s ease-in-out infinite}

#mist{opacity:.85}
#tuftsFar{opacity:.78}
#tuftsNear{opacity:.95}
#layerNear{z-index:4}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(124% 92% at 50% 42%, rgba(16,48,26,0) 44%, rgba(16,48,26,.4) 100%);
  mix-blend-mode:multiply}

.tag{position:fixed;z-index:6;display:flex;align-items:center;gap:.55em;padding:.42em .78em;
  color:#14301f;pointer-events:none;white-space:nowrap;
  background:rgba(255,253,242,.9);border:1px solid rgba(255,253,242,.45);border-radius:2px;
  box-shadow:0 10px 20px -12px rgba(14,44,24,.95);
  opacity:0;transform:translate(-50%,-50%) scale(.86);transition:opacity .5s,transform .5s}
.tag i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tag b{font-weight:600;font-size:.95em}
.tag span{font-weight:400;letter-spacing:.2em;opacity:.52}
.tag.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:30s!important}}
</style>

<script>
(function(){
 "use strict";
 var W=0,H=0,anchors=[],timers=[];

 /* seedable pseudo-random: the pasture composes itself identically every time */
 function rnd(s){s=(s*9301+49297)%233280;return s/233280;}

 function place(o){
  var f=o.dataset.fx.split(","),s=parseFloat(o.dataset.sfx||1);
  o.setAttribute("transform","translate("+(f[0]/100*W*s).toFixed(2)+","+(f[1]/100*H*s).toFixed(2)+")");
 }

 /* ── clouds: every one is a stack of five or more overlapping disks ── */
 function cloud(el,seed){
  var x=28,base="M28 118h324a15 15 0 0 0 0-30H28a15 15 0 0 0 0 30z",n=6+Math.round(rnd(seed)*3);
  for(var i=0;i<n;i++){var r=20+rnd(seed+i*7)*26;x+=r*(0.62+rnd(seed+i*3)*0.55);
   base+="M"+x.toFixed(1)+" "+(116-r).toFixed(1)+"a"+r.toFixed(1)+" "+r.toFixed(1)+" 0 1 0 0.1 0z";}
  el.innerHTML='<path d="'+base+'" fill="#ffffff" opacity=".92"/>'
   +'<path d="'+base+'" transform="translate(-8,7)" fill="#bcd6de" opacity=".3"/>';
 }

 /* ── grazing shadows keep their ground contact on the compression frame ── */
 function squash(g,p){
  var b=g.getBBox(),s=g.closest("svg"),i=s.ownerDocument.createElementNS("http://www.w3.org/2000/svg","ellipse");
  i.setAttribute("cx",(b.x+b.width/2).toFixed(1));
  i.setAttribute("cy",(b.y+b.height+(p===undefined?6:p)).toFixed(1));
  i.setAttribute("rx",(b.width/2*0.94).toFixed(1));
  i.setAttribute("ry",Math.max(9,b.height*0.13).toFixed(1));
  i.setAttribute("fill","url(#shadG2)");
  i.setAttribute("transform",g.parentNode.getAttribute("transform"));
  i.style.willChange="transform";
  i.style.animation="shPulse "+(0.70+Math.random()*0.24).toFixed(2)+"s ease-in-out infinite";
  i.style.animationDelay="-"+(Math.random()*0.7).toFixed(2)+"s";
  s.insertBefore(i,s.firstChild.nextSibling);
  return i;
 }

 /* ── blade fringe + scattered clumps, projected to true viewport space ── */
 function blades(seed,base,amp,count,span,amp2,amp3,count3,span3){
  var s="M-40 "+base,step=span/count,x=-40;
  for(var i=0;i<count;i++){x+=step;var h=rnd(seed+i)*amp+amp2;
   s+="L"+x.toFixed(1)+" "+(base-h).toFixed(1)+"L"+(x+step*0.4).toFixed(1)+" "+base;}
  s+="L1620 "+base;
  for(var j=0;j<count3;j++){var cx=50+rnd(seed+900+j)*span3;s+="M"+cx.toFixed(1)+" "+(base+4)
   +"c0 -8 -3 -15 -7 -19 5 1 8 9 8 19c0 -9 3 -14 6 -16 -4 3 -6 9 -6 16z";}
  return s;
 }

 function build(){
  W=innerWidth;H=innerHeight;
  var near=document.getElementById("layerNear"),far=document.getElementById("layerFar");
  var gN=near.querySelector("#groundNear"),hL=near.querySelector("#horizonLine");
  var tN=near.querySelector("#tuftsNear"),fN=near.querySelector("#tuftsFar");

  /* the exact viewport proportional space used by both background layers */
  [near,far].forEach(function(s){s.setAttribute("viewBox","0 0 100 100");});

  gN.setAttribute("x","-1");gN.setAttribute("y","65");
  gN.setAttribute("width","102");gN.setAttribute("height","36");
  hL.setAttribute("x1","-1");hL.setAttribute("x2","101");

  document.querySelectorAll(".fx").forEach(function(o){
   o.setAttribute("x","-1");o.setAttribute("y",0);o.setAttribute("width","102");o.setAttribute("height",100);
   place(o);
  });
  document.getElementById("mist").setAttribute("d",
   blades(11,65.9,1.1,86,41,1.4,100,1.2,14,8));
  fN.setAttribute("d",blades(23,65,1.1,92,40,1.5,120,1.2,15,9));
  tN.setAttribute("d",blades(37,65,1.2,92,40,1.6,120,1.4,15,10));

  /* drifting clouds, spaced out and given fresh offsets so they never march in step */
  var cs=[].slice.call(document.querySelectorAll(".cloud"));
  cs.forEach(function(el,i){
   var r=rnd(i*17+3);
   el.classList.remove("drift");el.style.animation="none";
   var x=Math.floor(r*(W+720))-360;
   el.style.transform="translate3d("+x+"px,0,0)";
   void el.offsetWidth;
   el.style.animation=(r<0.5?"driftR":"driftL")+" "+(52000+r*22000).toFixed(0)+"ms linear infinite";
   el.style.animationDelay="-"+Math.floor(r*70000)+"ms";
   el.classList.add("drift");
  });

  /* gliders */
  [].slice.call(document.querySelectorAll("svg[aria-hidden] > g[fill=none] > g")).forEach(function(g,i){
   g.style.animationName="flap";
   g.style.animationDuration=(0.5+Math.random()*0.22).toFixed(2)+"s";
  });

  /* restart every bounce on a new rhythm so the herd never falls into lockstep */
  anchors=[];timers.forEach(clearInterval);timers.length=0;
  document.querySelectorAll("g.actor").forEach(function(o){
   if(!o.dataset.o)return;
   anchors.push(o);
   var p=o.previousElementSibling;
   if(p&&p.classList&&p.classList.contains("shadow"))anchors.push(p);
   var dur=(0.70+Math.random()*0.22).toFixed(2);
   o.style.animationDuration=dur+"s";o.style.animationDelay="-"+(Math.random()*0.7).toFixed(2)+"s";
   if(p&&p.classList&&p.classList.contains("shadow")){p.style.animationDuration=dur+"s";p.style.animationDelay=o.style.animationDelay;}
  });
 }

 /* ── the four herds, composed and placed ── */
 var HERD=[
  {key:"cow",   x:14, y:73, h:16, s:"cream coat, three black patches, pink nose + udder",c:"#e8dcc6",t:"right",n:8},
  {key:"horse", x:37, y:71, h:24, s:"brown, long neck, long legs, dark mane",            c:"#5e3f2a",t:"left", n:7},
  {key:"sheep", x:62, y:73, h:17, s:"wool of eleven overlapping discs",                  c:"#6d6a72",t:"right",n:6},
  {key:"pig",   x:85, y:73, h:18, s:"pink, snout with two nostrils, curly tail",          c:"#c8828f",t:"left", n:5}
 ];

 function compose(){
  var stage=document.getElementById("stage");

  /* wrap each actor in an anchor so the landing gap between bounces stays put */
  document.querySelectorAll(".actor[data-o]").forEach(function(o){
   var b=o.getBBox(),a=document.createElementNS("http://www.w3.org/2000/svg","g");
   a.setAttribute("transform","translate("+b.x.toFixed(1)+","+b.y.toFixed(1)+")");
   o.parentNode.insertBefore(a,o);
   a.appendChild(o);
   o.setAttribute("transform","translate("+(-b.x).toFixed(1)+","+(-b.y).toFixed(1)+")");
   o.dataset.o=(b.x+b.width/2)+"px "+(b.y+b.height/2)+"px";
   o.style.transformOrigin=o.dataset.o;
  });

  var sheep=document.querySelector("#sheep");
  [sheep,document.querySelector("#pig")].forEach(function(g){
   [].slice.call(g.children).forEach(function(c){
    c.addEventListener("pointerenter",function(){
     var e=c.cloneNode(true);e.setAttribute("opacity",".28");c.parentNode.appendChild(e);});
    c.addEventListener("pointerleave",function(){
     var e=c.nextElementSibling;if(e&&e.getAttribute("opacity")===".28")e.remove();});
   });
  });

  document.querySelectorAll("#layerNear g.actor[data-o]").forEach(function(g){
   if(g.parentElement&&g.parentElement.id!=="layerNear")squash(g);
  });

  HERD.forEach(function(h,i){
   var slot=document.createElement("div");
   slot.className="herd";
   slot.dataset.fx=h.x+","+h.y;
   slot.innerHTML='<div class="tag"><i style="background:'+h.c+'"></i><b>'+h.key.toUpperCase()
    +'</b><span>'+h.s+'</span><span>&times;'+h.n+'</span></div>';
   stage.appendChild(slot);
  });
 }

function boot(){
  build();compose();
  document.querySelectorAll(".tag").forEach(function(t,i){
   setTimeout(function(){t.style.opacity=1;t.style.transform="translate(-50%,-50%) scale(1)";},900+i*120);
  });
 }
 if(document.readyState!=="loading")boot();
})();
</script>
