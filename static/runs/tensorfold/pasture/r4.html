<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twelve Acre Pasture — bouncing livestock</title>
<style>
  :root{--ink:#08150f;--paper:#f4fbf2;--glass:rgba(8,24,16,.52)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0b1a12;
    font-family:Verdana,Tahoma,"DejaVu Sans",system-ui,sans-serif}
  #stage{display:block;width:100vw;height:100vh;touch-action:manipulation}

  /* ---------- ambient motion ---------- */
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .bounce{animation-name:bounce;animation-timing-function:cubic-bezier(.4,0,.4,1);
    animation-iteration-count:infinite;will-change:transform}
  .b1{animation-duration:.78s;animation-delay:-.15s}
  .b2{animation-duration:.70s;animation-delay:-.55s}
  .b3{animation-duration:.68s;animation-delay:-.32s}
  .b4{animation-duration:.86s;animation-delay:-.78s}

  @keyframes squash{0%,100%{transform:scale(1,1);opacity:.24}50%{transform:scale(1.12,.68);opacity:.13}}
  .sh{transform-box:fill-box;transform-origin:center;animation:squash .78s ease-in-out infinite}

  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1920px)}}
  .cl{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  .c1{animation-duration:74s;animation-delay:-24s}
  .c2{animation-duration:58s;animation-delay:-42s}
  .c3{animation-duration:88s;animation-delay:-12s}
  .c4{animation-duration:100s;animation-delay:-70s}

  @keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-16px,-9px) rotate(16deg)}}
  .gull{animation:bob 5.4s ease-in-out infinite}
  .g2{animation-duration:6.8s;animation-delay:-2.1s}
  .g3{animation-duration:4.6s;animation-delay:-3.4s}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 44s linear infinite;transform-origin:1318px 152px}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:.88}}
  .glow{animation:pulse 7.5s ease-in-out infinite}

  @keyframes flick{0%,100%{transform:rotate(0)}50%{transform:rotate(-13deg)}}
  .tail{animation:flick 2.5s ease-in-out infinite;transform-origin:1076px 664px}
  @keyframes flap{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-11deg)}}
  .ear{animation:flap 2.9s ease-in-out infinite;transform-origin:504px 654px}

  @keyframes flutter{0%,100%{transform:scaleX(1) rotate(-4deg)}50%{transform:scaleX(.38) rotate(7deg)}}
  .bop{transform-box:fill-box;transform-origin:50% 55%;animation:flutter .26s linear infinite}

  /* ---------- interaction ---------- */
  #livestock{pointer-events:auto}
  #stage *{pointer-events:none}
  #stage[data-focus] .bounce{animation-duration:2.4s;animation-timing-function:ease-in-out}
  #stage[data-focus] .sh,#stage[data-focus] .butterfly{animation-play-state:paused}
  #stage[data-focus="cow"] #sheep,#stage[data-focus="cow"] #pig,#stage[data-focus="cow"] #horse,
  #stage[data-focus="sheep"] #cow,#stage[data-focus="sheep"] #pig,#stage[data-focus="sheep"] #horse,
  #stage[data-focus="pig"] #cow,#stage[data-focus="pig"] #sheep,#stage[data-focus="pig"] #horse,
  #stage[data-focus="horse"] #cow,#stage[data-focus="horse"] #sheep,#stage[data-focus="horse"] #pig{
    opacity:.45;filter:saturate(.5) brightness(.95)}
  #cow,#pig,#sheep,#horse{transition:opacity .4s ease,filter .4s ease}
  :root[data-paused="on"] *{animation-play-state:paused!important}

  /* ---------- HUD ---------- */
  .panel{position:fixed;top:24px;left:26px;width:min(336px,calc(100vw - 44px));
    padding:16px 18px 15px;color:#eef7ef;background:var(--glass);
    border:1px solid rgba(255,255,255,.22);border-left:3px solid #7fd98a;
    border-radius:5px 15px 15px 5px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 20px 48px rgba(0,12,6,.4)}
  .panel button,.hint{cursor:pointer}
  .panel:hover{transform:translateY(-2px)}
  .eyebrow{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.28em;
    text-transform:uppercase;color:#a9d6ba;margin-bottom:7px}
  .live{display:inline-flex;align-items:center;gap:6px;color:#8ff0ad}
  .live i{width:6px;height:6px;border-radius:50%;background:#8ff0ad;box-shadow:0 0 9px #8ff0ad;
    animation:blip 1.7s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  h1{margin:0;font:400 27px/1.06 Georgia,"Iowan Old Style",Palatino,serif;color:#f4fbf2;letter-spacing:.005em}
  h1 em{font-style:italic;color:#ffe9a3}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 11px}
  .meta span{padding:3px 7px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#c5e6cb;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:2px}
  .legend{display:grid;gap:5px}
  .chip{display:flex;align-items:center;gap:9px;width:100%;font:inherit;color:#dcebe0;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);
    border-left:2px solid transparent;border-radius:2px;padding:6px 9px;transition:.22s}
  .chip:hover{background:rgba(255,255,255,.15);border-left-color:currentColor;
    transform:translateX(5px);color:#fff;letter-spacing:.05em}
  .chip .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
  .chip b{flex:0 0 58px;font-size:12.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
  .chip em{font-style:normal;font-size:10px;opacity:.78;letter-spacing:.03em}
  .hint{width:max-content;margin-top:9px;padding:6px 11px;color:var(--paper);border-left-color:#f0b429}
  .hint b{color:#ffe9a3;font-weight:400}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

        <circle cx="1296" cy="612" r="2.6" fill="#2e2622"/>
        <circle cx="1280" cy="604" r="4" fill="#eef2f4"/><circle cx="1280" cy="604" r="2.1" fill="#1c1a1a"/>
        <circle cx="1268" cy="603" r="3.4" fill="#eef2f4" opacity=".8"/><circle cx="1268" cy="603" r="1.8" fill="#1c1a1a" opacity=".8"/>
        <path d="M1270,580l-4-16l14 12Z" fill="#6d452c"/><path d="M1284,582l3-14l12 13Z" fill="#8a5636"/>
      </g>
    </g>

    <g id="flora"></g>
  </g>

  <div class="panel" id="panel">
    <div class="eyebrow">Field study №01 · <span class="live"><i></i>bouncing</span></div>
    <h1>Twelve Acre<br><em>Pasture</em></h1>
    <div class="meta"><span>4 species</span><span>3 clouds</span><span>2 broadleaf + 2 firs</span><span>132px blades</span></div>
    <div class="legend">
      <button class="chip" data-k="cow" type="button"><span class="dot" style="background:#f2ece2;border:1px solid #2a2429"></span><b>Cow</b><em>four legs · three black patches · pink muzzle</em></button>
      <button class="chip" data-k="sheep" type="button"><span class="dot" style="background:#f7f4ee;border:1px solid #2e2936"></span><b>Sheep</b><em>knit wool · four dark hooves · wool cap</em></button>
      <button class="chip" data-k="pig" type="button"><span class="dot" style="background:#f4a0bb"></span><b>Pig</b><em>two prick ears · twin-nostril snout · curl tail</em></button>
      <button class="chip" data-k="horse" type="button"><span class="dot" style="background:#8a5636"></span><b>Horse</b><em>long neck · dark mane &amp; tail · four long legs</em></button>
    </div>
    <div class="hint">Hover a herd-listen or any animal to focus · <b id="st">running</b></div>
  </div>
</svg>

<script>
(function(){
  var SVG="http://www.w3.org/2000/svg",
      stage=document.getElementById("stage"),
      trees=document.getElementById("trees"),
      flora=document.getElementById("flora"),
      panel=document.getElementById("panel"),
      status=document.getElementById("st");
  if(!stage||!trees||!flora)return;

  function n(t,a){var e=document.createElementNS(SVG,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function mk(t,a,p){var e=n(t,a);(p||flora).appendChild(e);return e;}
  function rnd(a,b){return a+Math.random()*(b-a);}

  /* ---------- trees: tapered brown trunks + layered green canopies ---------- */
  function leafy(x,y,s,rG,ry,g,gy){
    var t=n("g",{transform:"translate("+x+" "+y+") scale("+s+")"});
    t.appendChild(n("ellipse",{cx:6,cy:-2,rx:34,ry:9,fill:"#245c25","fill-opacity":.26}));
    t.appendChild(n("path",{d:"M-9,0 L-5,-56 L5,-56 L9,0 Z",fill:"#7a4a26"}));
    var blobs=[
      {cx:0,cy:-98,r:38,c:rG,o:.92},{cx:-26,cy:-78,r:30,c:g,o:.92},
      {cx:26,cy:-82,r:29,c:g,o:.92},{cx:-6,cy:-120,r:29,c:ry,o:.82},
      {cx:20,cy:-106,r:23,c:ry,o:.62},{cx:-32,cy:-98,r:21,c:g,o:.5}
    ];
    blobs.forEach(function(b){t.appendChild(n("circle",{cx:b.cx,cy:b.cy,r:b.r,fill:b.c,"fill-opacity":b.o}));});
    t.appendChild(n("circle",{cx:-2,cy:-134,r:14,fill:"#ffe9a3",opacity:.4}));
    trees.appendChild(t);
  }
  function fir(x,y,s){
    var t=n("g",{transform:"translate("+x+" "+y+") scale("+s+")"});
    t.appendChild(n("rect",{x:-5,y:-12,width:10,height:14,fill:"#6b4224"}));
    t.appendChild(n("path",{d:"M0,-94 L25,-44 L-25,-44 Z",fill:"#26543a"}));
    t.appendChild(n("path",{d:"M0,-72 L20,-26 L-20,-26 Z",fill:"#2c6242"}));
    t.appendChild(n("path",{d:"M0,-52 L15,-6 L-15,-6 Z",fill:"#33704a"}));
    trees.appendChild(t);
  }
  leafy(92,632,1.05,"127,199,148","207,241,170",0);
  leafy(1512,654,1.05,"127,199,148","207,241,170",1);
  leafy(624,616,.62,"120,190,140","200,236,164",0);
  fir(1438,614,.84); fir(1554,636,.68);

  /* ---------- scattered blades + flowers ---------- */
  function grassBlade(x,y,s,h){
    var p=n("path",{d:"M0,0 L2,"+(-11*s)+" L4.4,0 L6.8,"+(-14*s)+" L9,0",
      fill:"rgba("+h+")",opacity:.72});
    p.setAttribute("transform","translate("+x+" "+y+")");
    p.setAttribute("class","blade");
    p.style.transformOrigin=x+"px "+y+"px";
    p.style.transform="rotate("+rnd(-7,7).toFixed(2)+"deg)";
    p.style.animation="blade "+rnd(2.4,4.2).toFixed(2)+"s ease-in-out infinite";
    p.style.animationDelay="-"+rnd(0,3.2).toFixed(2)+"s";
    flora.appendChild(p);
  }
  var style=document.createElement("style");
  style.textContent="@keyframes blade{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}";
  document.head.appendChild(style);

  function flower(x,y,c){
    var g=n("g",{transform:"translate("+x+" "+y+")"});
    for(var i=0;i<5;i++){var a=i/5*6.283;
      g.appendChild(n("circle",{cx:(Math.cos(a)*3.6).toFixed(2),cy:(Math.sin(a)*3.6).toFixed(2),r:2.6,fill:c}));}
    g.appendChild(n("circle",{r:2.1,fill:"#ffe9a3"}));
    flora.appendChild(g);
  }
  for(var i=0;i<74;i++){
    var y=Math.round(596+Math.pow(Math.random(),.7)*296);
    var x=Math.round(Math.random()*1600);
    var s=Math.max(.55,Math.min(1.7,(y-572)/300));
    grassBlade(x,y,s,"48,116,54");
    if(Math.random()<.28) flower(x+rnd(-9,9),y-rnd(2,8),Math.random()<.5?"#fbe7ef":"#fdf6e3");
    if(Math.random()<.12) flower(x+rnd(-6,6),y-rnd(2,6),"#f0b429");
  }
  grassBlade(210,624,.9,"48,116,54"); grassBlade(1512,648,.9,"48,116,54");

  /* ---------- butterflies, all fluttering out of phase ---------- */
  function butterfly(x,y,c){
    var outer=n("g",{transform:"translate("+x+" "+y+")","class":"butterfly"});
    var g=n("g",{}); g.setAttribute("class","bop");
    g.appendChild(n("path",{d:"M0,0 L-11,-9 L-13,1 L-3,3 Z",fill:c,opacity:.82}));
    g.appendChild(n("path",{d:"M0,0 L11,-9 L13,1 L3,3 Z",fill:c,opacity:.82}));
    g.appendChild(n("ellipse",{cx:0,cy:0,rx:1.9,ry:4.6,fill:"#33291f"}));
    g.appendChild(n("path",{d:"M-1,-4 L-4,-11 M1,-4 L4,-11",stroke:"#33291f","stroke-width":.9,fill:"none"}));
    g.style.animationDuration=rnd(.2,.36).toFixed(3)+"s";
    g.style.animationDelay="-"+rnd(0,.3).toFixed(3)+"s";
    outer.appendChild(g);
    flora.appendChild(outer);
  }
  butterfly(470,628,"#ffe9a3");
  butterfly(1112,704,"#ffd27f");
  butterfly(250,700,"#f8f2ff");
  butterfly(1332,660,"#ffe9a3");

  /* ---------- pointer focus: hover the card or a beast to single it out ---------- */
  var keys=["cow","pig","sheep","horse"];
  function focus(k){
    if(k){stage.setAttribute("data-focus",k);} else {stage.removeAttribute("data-focus");}
  }
  var current=null;
  panel.addEventListener("mousemove",function(e){
    var c=e.target.closest?e.target.closest(".chip"):null;
    if(c){ if(current!==c.dataset.k){current=c.dataset.k;focus(current);status.textContent="focused";} }
    else if(current){current=null;focus(null);status.textContent="running";}
  });
  stage.addEventListener("mousemove",function(e){
    var b=e.target.closest?e.target.closest("#livestock > g"):null;
    var k=b?b.id:null;
    if(k!==current){current=k;focus(k);status.textContent=k?"focused":"running";}
  });
  stage.addEventListener("mouseleave",function(){current=null;focus(null);status.textContent="running";});

  /* ---------- click anywhere to still the world, then wake it ---------- */
  window.addEventListener("click",function(){
    var on=document.documentElement.getAttribute("data-paused")==="on";
    document.documentElement.setAttribute("data-paused",on?"off":"on");
    if(status) status.textContent=on?"running":"held";
  });

  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.documentElement.setAttribute("data-paused","on");
    if(status) status.textContent="held";
  }
})();
</script>
</body>
</html>
