<meta name="color-scheme" content="light">
<title>Pasture at Rest</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#a8dcf0}
  #scene{display:block;width:100%;height:100%}
  .hop{
    animation-name:bounce;
    animation-timing-function:cubic-bezier(.30,0,.50,1);
    animation-duration:.72s;
    animation-iteration-count:infinite;
    animation-direction:alternate;
    transform-box:view-box;
  }
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-15px)}}
  .sway{
    animation-name:sway;
    animation-timing-function:ease-in-out;
    animation-duration:7.5s;
    animation-iteration-count:infinite;
    animation-direction:alternate;
    transform-box:view-box;
    transform-origin:0 -42px;
  }
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
</style>
</head>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('scene');
  var W=1600,H=1000;
  var S=function(x,y,s,a){
    var t='translate('+x.toFixed(2)+' '+y.toFixed(2)+')';
    if(s!==undefined&&s!==1) t+=' scale('+s+')';
    if(a) t+=' rotate('+a.toFixed(2)+')';
    return t;
  };
  /* sun rays: 12 triangles fanning out of the disc */
  var rays=document.getElementById('rays'),i,r;
  for(i=0;i<12;i++){
    r=document.createElementNS(NS,'polygon');
    r.setAttribute('points','52,-5.4 94,0 52,5.4');
    r.setAttribute('transform','rotate('+(22.5+i*30)+')');
    rays.appendChild(r);
  }
  var items=[].slice.call(document.querySelectorAll('.animal,.tree,.decor'));
  items.forEach(function(el){
    el.setAttribute('transform',S(parseFloat(el.dataset.x),parseFloat(el.dataset.y),parseFloat(el.dataset.s||1)));
    el.dataset.fx=parseFloat(el.dataset.x)/1600;
  });
  var hops=document.querySelectorAll('.hop');
  for(i=0;i<hops.length;i++){
    var a=hops[i],p=a.parentNode;
    a.style.animationDuration=p.dataset.dur||'.72s';
    a.style.animationDelay=p.dataset.delay||'0s';
    if(p.dataset.amp) a.style.animationName='bounce',a.style.setProperty('--x','');
  }
  var clouds=[].slice.call(document.querySelectorAll('.cloud')).map(function(g){
    return {el:g,x:parseFloat(g.dataset.x),y:parseFloat(g.dataset.y),
            d:parseFloat(g.dataset.d),v:parseFloat(g.dataset.v)};
  });
  function place(){
    var ar=Math.max(.35,Math.min(3,window.innerWidth/window.innerHeight));
    W=Math.round(H*ar);
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    items.forEach(function(el){
      var x=parseFloat(el.dataset.fx)*W;
      if(el.classList.contains('decor')){
        x=Math.max(14,Math.min(W-14,x));
        var r=el.getBBox();
        el.setAttribute('transform',S(x,r.y+r.height,1,(x*41)%7-3.5));
      }else{
        el.setAttribute('transform',S(x,parseFloat(el.dataset.y),parseFloat(el.dataset.s||1)));
      }
    });
    var f=1600/W;
    clouds.forEach(function(c){
      c.x=Math.max(-140,Math.min(W+140,c.x*f));
      c.y=Math.max(40,Math.min(300,c.y*f));
    });
  }
  var last=performance.now();
  function drift(t){
    var dt=Math.min(.05,(t-last)/1000);last=t;
    for(var k=0;k<clouds.length;k++){
      var c=clouds[k];
      c.x+=c.v*dt;
      if(c.x-130>W){c.x=-130;c.y=42+((c.y*13)%210);}
      c.el.setAttribute('transform',S(c.x,c.y,c.d));
    }
    requestAnimationFrame(drift);
  }
  place();
  requestAnimationFrame(drift);
  if(typeof svg.pauseAnimations==='function') svg.pauseAnimations();
  window.addEventListener('resize',place);
})();
</script>
