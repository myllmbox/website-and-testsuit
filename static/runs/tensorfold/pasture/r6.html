<title> bouncing pasture
</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#bfe0f0}
  #pasture{position:fixed;top:0;left:0;display:block;width:100vw;height:100vh}
  .hop-inner{animation:hop .82s ease-in-out infinite;will-change:transform}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .hopS{animation-name:hopS;animation-duration:.72s}
  @keyframes hopS{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .hopD{animation-duration:.92s;animation-name:hopD}
  @keyframes hopD{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-2180px)}}
  .flap{animation:flap .38s ease-in-out infinite alternate;will-change:opacity}
  @keyframes flap{from{opacity:.95}to{opacity:.2}}
</style>
</head>

<script>
(function(){
  var svg=document.getElementById('pasture');
  var sky=document.getElementById('sky');
  var grass=document.getElementById('grass');
  var hud=document.getElementById('hud');
  var animals=[].slice.call(document.querySelectorAll('.hop-inner'));
  var shadows=['shH','shC','shP','shS'].map(function(i){return document.getElementById(i);});
  function layout(){
    var vw=window.innerWidth,vh=window.innerHeight;
    var k=Math.max(vw/1600,vh/900),ox=800-vw/(2*k),oy=450-vh/(2*k),sw=vw/k,sh=vh/k;
    sky.setAttribute('x',ox-40); sky.setAttribute('y',oy-40);
    sky.setAttribute('width',sw+80); sky.setAttribute('height',Math.max(sh+80,645));
    grass.setAttribute('x',ox-40); grass.setAttribute('width',sw+80); grass.setAttribute('height',sh);
    hud.setAttribute('x',ox+26); hud.setAttribute('y',oy+26);
    var s=Math.min(1,Math.max(0.6,sh/900));
    for(var i=0;i<animals.length;i++){
      var a=animals[i],d=a.parentNode.getAttribute('transform').match(/translate\((-?[\d.]+),(-?[\d.]+)\)/);
      a.parentNode.setAttribute('transform','translate('+d[1]+','+d[2]+') scale('+s.toFixed(3)+')');
      var b=a.getBBox(),shEl=shadows[i];
      if(shEl){shEl.setAttribute('cx',(+d[1])+b.x+b.width*0.5);shEl.setAttribute('cy',(+d[2])+b.y+b.height+4);
        shEl.setAttribute('rx',b.width*0.42*s);shEl.setAttribute('ry',9*s);}
    }
  }
  layout();
  window.addEventListener('resize',layout,false);
})();
</script>
