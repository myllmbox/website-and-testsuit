<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Reef</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b2d55}
#sea{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<svg id="sea" width="100vw" height="100vh" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated underwater reef with two fish, rising bubbles and swaying seaweed">
<defs>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8ed9ea"/>
<stop offset="0.45" stop-color="#3f8fc0"/>
<stop offset="1" stop-color="#0b2d55"/>
</linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="fc1"><ellipse cx="0" cy="0" rx="85" ry="58"/></clipPath>
<clipPath id="fc2"><ellipse cx="0" cy="0" rx="52" ry="15"/></clipPath>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="url(#water)"/>
<g id="rays"></g>
<g id="floorBack"></g>
<g id="weeds"></g>
<g id="floorFront"></g>
<g id="bubbles"></g>
<g id="fish1">
<g class="tail"><path d="M -64 0 L -132 -42 Q -144 0 -132 42 Z" fill="#e2711d"/></g>
<path d="M -52 -44 C -28 -88 12 -92 46 -50 C 14 -62 -20 -60 -52 -44 Z" fill="#e2711d"/>
<ellipse rx="85" ry="58" fill="#f5942f"/>
<g clip-path="url(#fc1)">
<ellipse cy="20" rx="80" ry="42" fill="#ffb257"/>
<rect x="-58" y="-62" width="17" height="124" rx="8" fill="#fdf3e2" transform="rotate(-7)"/>
<rect x="-1" y="-62" width="19" height="124" rx="9" fill="#fdf3e2" transform="rotate(-4)"/>
<rect x="33" y="-62" width="14" height="124" rx="7" fill="#fdf3e2" transform="rotate(-1)"/>
</g>
<g class="pfin" transform="translate(8,10)"><path d="M 0 0 C 26 6 36 28 16 42 C 4 28 -3 14 0 0 Z" fill="#e2711d" opacity="0.95"/></g>
<circle cx="58" cy="-16" r="10" fill="#ffffff"/>
<circle cx="61" cy="-16" r="4.6" fill="#1b2a36"/>
<circle cx="62.6" cy="-18" r="1.7" fill="#ffffff"/>
<path d="M 82 4 Q 73 13 61 10" fill="none" stroke="#a34e10" stroke-width="3" stroke-linecap="round"/>
</g>
<g id="fish2">
<g class="tail"><path d="M 46 0 C 66 -5 78 -16 92 -28 C 83 -9 83 9 92 28 C 78 16 66 5 46 0 Z" fill="#1e8078"/></g>
<path d="M -38 -14 C -12 -32 24 -32 46 -14 C 22 -22 -10 -22 -38 -14 Z" fill="#1e8078"/>
<ellipse rx="52" ry="15" fill="#2fa9a0"/>
<g clip-path="url(#fc2)">
<ellipse cy="7" rx="50" ry="9" fill="#8fddcf"/>
<path d="M -46 1 Q 0 8 46 -1" fill="none" stroke="#c9f2e8" stroke-width="3" opacity="0.65"/>
</g>
<g class="pfin" transform="translate(-7,5)"><path d="M 0 0 C 16 3 22 15 9 22 C 2 13 -2 7 0 0 Z" fill="#1e8078" opacity="0.95"/></g>
<circle cx="-38" cy="-4" r="6.2" fill="#ffffff"/>
<circle cx="-40.2" cy="-4" r="2.9" fill="#12262e"/>
<circle cx="-41.4" cy="-5.5" r="1" fill="#ffffff"/>
<path d="M -47 3 Q -40 8 -33 6" fill="none" stroke="#14514c" stroke-width="2.4" stroke-linecap="round"/>
</g>
</svg>
<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg",TAU=Math.PI*2;
var W=window.innerWidth||1200,H=window.innerHeight||800,floorY=H*0.87;
var raysG=document.getElementById("rays"),backG=document.getElementById("floorBack"),
weedG=document.getElementById("weeds"),frontG=document.getElementById("floorFront"),
bubG=document.getElementById("bubbles"),
f1=document.getElementById("fish1"),f2=document.getElementById("fish2");
function rnd(i){var s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function fx(n){return Math.round(n*10)/10;}
var vents=[0.18,0.47,0.78],weeds=[],bubbles=[],rayEls=[];
var fish=[
{el:f1,x:W*0.3,dir:1,sp:95,yf:0.5,amp:15,bf:0.8,wag:5.2,ph:0,tail:f1.querySelector(".tail"),pfin:f1.querySelector(".pfin"),tp:-64,pb:"translate(8,10)"},
{el:f2,x:W*0.75,dir:-1,sp:165,yf:0.27,amp:10,bf:1.35,wag:7.4,ph:2.1,tail:f2.querySelector(".tail"),pfin:f2.querySelector(".pfin"),tp:46,pb:"translate(-7,5)"}
];
function sandWave(x,s){return Math.sin(x*0.006+1.7+s)*7+Math.sin(x*0.017+0.4+s*2)*4;}
function sandPath(shift,seed){
var d="M -10 "+fx(floorY+shift+sandWave(-10,seed)),x;
for(x=90;x<W+110;x+=90){d+=" L "+x+" "+fx(floorY+shift+sandWave(x,seed));}
d+=" L "+(W+10)+" "+(H+10)+" L -10 "+(H+10)+" Z";
return d;
}
function weedD(sp,t){
var bx=sp.fx*W,N=12,i,f,xx,yy,w2,L=[],R=[];
for(i=0;i<=N;i++){
f=i/N;
yy=(floorY+16)-f*(sp.h+16);
xx=bx+Math.sin(f*2.4+sp.ph+t*0.85)*sp.w*0.85*f+Math.sin(f*1.2-t*0.55+sp.ph*1.7)*7*f;
w2=sp.w*(1-0.92*f)*0.5;
L.push(fx(xx-w2)+" "+fx(yy));R.push(fx(xx+w2)+" "+fx(yy));
}
var d="M "+L[0];
for(i=1;i<=N;i++)d+=" L "+L[i];
d+=" L "+R[N];
for(i=N-1;i>=0;i--)d+=" L "+R[i];
return d+" Z";
}
function buildStatic(){
var i,x,tw,dr,html="",hb=H*0.85,rxs=[0.14,0.36,0.6,0.84];
for(i=0;i<4;i++){
x=rxs[i]*W;tw=60+rnd(i*3+2)*70;dr=60+rnd(i*5+4)*90;
html+="<polygon points=\""+fx(x)+",-10 "+fx(x+tw)+",-10 "+fx(x+tw*0.55+dr)+","+fx(hb)+" "+fx(x+dr)+","+fx(hb)+"\" fill=\"url(#ray)\"/>";
}
raysG.innerHTML=html;rayEls=raysG.querySelectorAll("polygon");
backG.innerHTML="<path d=\""+sandPath(0,0)+"\" fill=\"#a97d52\"/>";
weedG.innerHTML="";weeds=[];
var specs=[
{fx:0.12,h:0.22,w:15,c:"#2c7d4f",ph:0.4},
{fx:0.155,h:0.15,w:11,c:"#37925e",ph:2.3},
{fx:0.58,h:0.26,w:17,c:"#256b43",ph:4.1},
{fx:0.615,h:0.17,w:12,c:"#3da068",ph:1.2},
{fx:0.87,h:0.2,w:14,c:"#2c7d4f",ph:5.2}
];
for(i=0;i<specs.length;i++){
var p=document.createElementNS(NS,"path");
p.setAttribute("fill",specs[i].c);p.setAttribute("opacity","0.95");
weedG.appendChild(p);specs[i].el=p;weeds.push(specs[i]);
}
html="<path d=\""+sandPath(9,2.1)+"\" fill=\"#d2a86e\"/>";
var rocks=[[0.30,34,15,"#7d6c58"],[0.52,22,10,"#8d7c66"],[0.71,40,18,"#6e6050"],[0.94,26,12,"#7d6c58"]];
for(i=0;i<rocks.length;i++){
x=rocks[i][0]*W;
html+="<ellipse cx=\""+fx(x)+"\" cy=\""+fx(floorY+rocks[i][2]*0.4)+"\" rx=\""+rocks[i][1]+"\" ry=\""+rocks[i][2]+"\" fill=\""+rocks[i][3]+"\"/>";
}
var pc=["#b98f5e","#a37b4e","#c7a06e","#93683f"];
for(i=0;i<16;i++){
x=rnd(i*7+3)*W;
var py=floorY+26+rnd(i*11+6)*(H-floorY-44),pr=4+rnd(i*13+8)*9;
html+="<ellipse cx=\""+fx(x)+"\" cy=\""+fx(py)+"\" rx=\""+fx(pr)+"\" ry=\""+fx(pr*0.5)+"\" fill=\""+pc[i%4]+"\" transform=\"rotate("+fx(rnd(i*17+2)*60-30)+" "+fx(x)+" "+fx(py)+")\"/>";
}
for(i=0;i<vents.length;i++){
x=vents[i]*W;
html+="<ellipse cx=\""+fx(x)+"\" cy=\""+fx(floorY+14)+"\" rx=\"22\" ry=\"9\" fill=\"#6e5a44\"/>"+
"<ellipse cx=\""+fx(x-4)+"\" cy=\""+fx(floorY+11)+"\" rx=\"11\" ry=\"5\" fill=\"#83705a\"/>";
}
frontG.innerHTML=html;
}
function paintBubble(b){
var sw=Math.max(1,b.r*0.22);
b.el.innerHTML="<circle r=\""+fx(b.r)+"\" fill=\"rgba(205,238,255,0.12)\" stroke=\"rgba(228,248,255,0.62)\" stroke-width=\""+fx(sw)+"\"/>"+
"<circle cx=\""+fx(-b.r*0.36)+"\" cy=\""+fx(-b.r*0.36)+"\" r=\""+fx(Math.max(0.9,b.r*0.24))+"\" fill=\"rgba(255,255,255,0.72)\"/>";
}
function makeBubble(i){
var g=document.createElementNS(NS,"g");
bubG.appendChild(g);
var b={el:g,v:i%vents.length,off:(rnd(i*13+7)-0.5)*30,y:floorY-rnd(i*17+9)*H*0.7,
r:3+rnd(i*11+5)*6.5,ph:rnd(i*23+13)*TAU,swA:6+rnd(i*29+17)*10,swF:0.6+rnd(i*31+19)*0.9,sp:0};
b.sp=34+(10-b.r)*7+rnd(i*19+11)*14;
paintBubble(b);
b.el.setAttribute("transform","translate("+fx(vents[b.v]*W+b.off)+","+fx(b.y)+")");
return b;
}
for(var i=0;i<9;i++)bubbles.push(makeBubble(i));
function setFish(f,t){
var y=H*f.yf+Math.sin(t*f.bf+f.ph)*f.amp;
var tilt=(f.dir>0?-1:1)*Math.cos(t*f.bf+f.ph)*5;
f.el.setAttribute("transform","translate("+fx(f.x)+","+fx(y)+") rotate("+fx(tilt)+")");
f.tail.setAttribute("transform","rotate("+fx(Math.sin(t*f.wag+f.ph)*8)+" "+f.tp+" 0)");
f.pfin.setAttribute("transform",f.pb+" rotate("+fx(Math.sin(t*f.wag*1.7+f.ph+1.3)*13)+")");
}
buildStatic();
setFish(fish[0],0);setFish(fish[1],0);
var last=performance.now();
function frame(now){
var dt=Math.min(0.05,(now-last)/1000);last=now;
var t=now/1000,i,f,m=180;
for(i=0;i<fish.length;i++){
f=fish[i];
f.x+=f.dir*f.sp*dt;
if(f.dir>0&&f.x>W+m)f.x=-m;else if(f.dir<0&&f.x<-m)f.x=W+m;
setFish(f,t);
}
for(i=0;i<weeds.length;i++)weeds[i].el.setAttribute("d",weedD(weeds[i],t));
for(i=0;i<bubbles.length;i++){
var b=bubbles[i];
b.y-=b.sp*dt;
if(b.y<-20){
b.y=floorY+4+Math.random()*10;
b.off=(Math.random()-0.5)*34;
b.r=3+Math.random()*6.5;
b.sp=34+(10-b.r)*7+Math.random()*14;
paintBubble(b);
}
b.el.setAttribute("transform","translate("+fx(vents[b.v]*W+b.off+Math.sin(t*b.swF+b.ph)*b.swA)+","+fx(b.y)+")");
}
for(i=0;i<rayEls.length;i++)rayEls[i].setAttribute("opacity",(0.55+0.45*Math.sin(t*0.25+i*1.9)).toFixed(3));
requestAnimationFrame(frame);
}
window.addEventListener("resize",function(){
W=window.innerWidth;H=window.innerHeight;floorY=H*0.87;
buildStatic();
for(var j=0;j<bubbles.length;j++)if(bubbles[j].y>floorY-6)bubbles[j].y=floorY-6;
});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
