<script>
(function(){
"use strict";
var svg=document.getElementById("scene"),
sky=document.getElementById("sky"),
grass=document.getElementById("grass"),
strip=document.getElementById("strip"),
sun=document.getElementById("sun"),
fp=document.getElementById("fp"),
fr1=document.getElementById("fr1"),
fr2=document.getElementById("fr2"),
tufts=document.getElementById("tufts"),
actors=[].slice.call(document.querySelectorAll(".actor")),
clouds=[].slice.call(document.querySelectorAll(".cloud")).map(function(el){return{el:el,y:+el.dataset.y,s:+el.dataset.s,v:+el.dataset.v,f:+el.dataset.f,x:0,init:false};}),
birds=[].slice.call(document.querySelectorAll(".bird")).map(function(el){return{el:el,y:+el.dataset.y,s:+el.dataset.s||1,v:+el.dataset.v,f:+el.dataset.f,x:0,init:false};}),
W=1600;
function rnd(n){var s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s);}
function layout(){
var aspect=innerWidth/Math.max(1,innerHeight);
W=Math.max(320,Math.round(900*aspect));
var CS=Math.max(0.42,Math.min(1.08,W/1600));
svg.setAttribute("viewBox","0 0 "+W+" 900");
var ex=-W,ew=W*3;
sky.setAttribute("x",ex);sky.setAttribute("width",ew);
grass.setAttribute("x",ex);grass.setAttribute("width",ew);
strip.setAttribute("x",ex);strip.setAttribute("width",ew);
fp.setAttribute("x2",W+80);fr1.setAttribute("x2",W+80);fr2.setAttribute("x2",W+80);
sun.setAttribute("transform","translate("+(W*0.78).toFixed(1)+" 148)");
actors.forEach(function(g){
var x=(+g.dataset.fx)*W,y=+g.dataset.dy,s=(+g.dataset.s)*CS;
g.setAttribute("transform","translate("+x.toFixed(1)+" "+y+") scale("+s.toFixed(3)+")");
});
var h="",i,x,y,sc;
for(i=0;i<30;i++){
x=(rnd(i+1)*W).toFixed(1);y=(600+rnd(i+41)*286).toFixed(1);sc=(0.8+rnd(i+83)*0.8).toFixed(2);
h+='<g transform="translate('+x+' '+y+') scale('+sc+')"><path d="M0 0 C-1 -5 -4 -8 -7 -10 M0 0 C0 -6 1 -10 1 -13 M0 0 C2 -5 5 -7 8 -9" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-linecap="round"/></g>';
}
for(i=0;i<9;i++){
x=(rnd(i+200)*W).toFixed(1);y=(612+rnd(i+260)*266).toFixed(1);sc=(0.8+rnd(i+300)*0.6).toFixed(2);
h+='<g transform="translate('+x+' '+y+') scale('+sc+')"><line y2="-9" stroke="#2e7d32" stroke-width="2"/><circle cy="-12" r="4.2" fill="#ffffff"/><circle cy="-12" r="2" fill="#ffcf3f"/></g>';
}
tufts.innerHTML=h;
clouds.concat(birds).forEach(function(o){
if(!o.init){o.init=true;o.x=o.f*W;}
if(o.x>W+200)o.x=-210;
if(o.x<-210)o.x=W+200;
});
}
var last=performance.now();
function tick(now){
var dt=Math.min(0.06,(now-last)/1000);last=now;
clouds.forEach(function(c){
c.x+=c.v*dt;
if(c.x>W+200)c.x=-210;
c.el.setAttribute("transform","translate("+c.x.toFixed(1)+" "+c.y+") scale("+c.s+")");
});
birds.forEach(function(b){
b.x-=b.v*dt;
if(b.x<-210)b.x=W+200;
b.el.setAttribute("transform","translate("+b.x.toFixed(1)+" "+b.y+") scale("+b.s+")");
});
requestAnimationFrame(tick);
}
addEventListener("resize",layout);
layout();
requestAnimationFrame(tick);
})();
</script>
