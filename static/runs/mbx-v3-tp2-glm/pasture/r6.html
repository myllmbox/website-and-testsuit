<!DOCTYPE html>

<title>Bouncing Pasture</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8fd0f2}
  svg{display:block;width:100vw;height:100vh}
  .hop{animation:hop .85s ease-in-out infinite}
  .h1{animation-duration:.92s;animation-delay:-.12s}
  .h2{animation-duration:.74s;animation-delay:-.38s}
  .h3{animation-duration:.82s;animation-delay:-.55s}
  .h4{animation-duration:.88s;animation-delay:-.26s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  .k1{animation-duration:95s;animation-delay:-30s}
  .k2{animation-duration:130s;animation-delay:-60s}
  .k3{animation-duration:75s;animation-delay:-30s}
  .k4{animation-duration:110s;animation-delay:-70s}
  @keyframes drift{from{transform:translateX(-900px)}to{transform:translateX(2600px)}}
</style>

<script>
(function(){
  var s=document.getElementById('scene');
  function fit(){
    var w=window.innerWidth,h=window.innerHeight,a=w/h,x,y,vw,vh;
    if(a>=16/9){vh=900;vw=900*a;x=(1600-vw)/2;y=0;}
    else{vw=1500;vh=1500/a;x=50;y=(900-vh)/2;}
    s.setAttribute('viewBox',x+' '+y+' '+vw+' '+vh);
  }
  window.addEventListener('resize',fit);
  fit();
})();
</script>
