html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#8fd0f2}
svg{display:block;width:100vw;height:100vh}
.animal{animation:hop 1s ease-in-out infinite}
.shadow{animation:shPulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cow,.sh-cow{animation-duration:.9s;animation-delay:-.12s}
.sheep,.sh-sheep{animation-duration:.68s;animation-delay:-.42s}
.pig,.sh-pig{animation-duration:.56s;animation-delay:-.24s}
.horse,.sh-horse{animation-duration:1s;animation-delay:-.61s}
.cloud{animation:drift linear infinite}
.c1{animation-duration:55s;animation-delay:-5s}
.c2{animation-duration:78s;animation-delay:-40s}
.c3{animation-duration:96s;animation-delay:-68s}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}62%{transform:translateY(2px)}80%{transform:translateY(-4px)}}
@keyframes shPulse{0%,100%{transform:scale(1)}45%{transform:scale(.8)}62%{transform:scale(1.05)}80%{transform:scale(.95)}}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1780px)}}
@media (prefers-reduced-motion:reduce){.animal,.shadow,.cloud{animation:none}}
</style>
