<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasture</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#5fb0e8 0%,#a8d8f5 62%,#8ec95c 65%,#4e9a3c 100%)}
svg{display:block;width:100vw;height:100vh}
.cloud{animation:drift linear infinite}
.c1{animation-duration:75s;animation-delay:-12s}
.c2{animation-duration:105s;animation-delay:-70s}
.c3{animation-duration:88s;animation-delay:-40s}
.c4{animation-duration:120s;animation-delay:-95s}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1620px)}}
.b-cow{animation:hop .9s ease-in-out infinite}
.b-horse{animation:hop .8s ease-in-out -0.2s infinite}
.b-sheep{animation:hop2 .68s ease-in-out -0.35s infinite}
.b-pig{animation:hop2 .58s ease-in-out -0.5s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
</style>
</head>

<pattern id="fp" width="96" height="40" patternUnits="userSpaceOnUse" y="522">

<g id="flower"><circle r="4.5" fill="#fff"/><circle r="2" fill="#ffcf3f"/></g>

<script>
(function(){
var svg=document.getElementById('scene'),w=document.getElementById('world');
function fit(){
var a=innerWidth/Math.max(innerHeight,1);
var vw=Math.min(Math.max(750*a,720),1900);
svg.setAttribute('viewBox',((1200-vw)/2)+' 0 '+vw+' 750');
if(vw<1200){var s=vw/1200;w.setAttribute('transform','translate('+(600-600*s)+' '+(488-488*s)+') scale('+s+')');}
else{w.removeAttribute('transform');}
}
fit();addEventListener('resize',fit);
})();
</script>
