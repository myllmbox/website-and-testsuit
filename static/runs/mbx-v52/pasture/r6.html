<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow &mdash; Animated Pasture</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#c8ecff}
  #scene{display:block;width:100vw;height:100vh}
  /* ---- animal bounce ---- */
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .hop{animation-name:hop;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.42,0,.58,1);will-change:transform}
  .h1{animation-duration:.66s;animation-delay:-.05s}
  .h2{animation-duration:.74s;animation-delay:-.31s}
  .h3{animation-duration:.58s;animation-delay:-.44s}
  .h4{animation-duration:.63s;animation-delay:-.18s}
  /* ---- clouds / birds ---- */
  @keyframes drift{from{transform:translateX(-330px)}to{transform:translateX(1740px)}}
  .drift{animation-name:drift;animation-iteration-count:infinite;animation-timing-function:linear;will-change:transform}
  .d1{animation-duration:72s;animation-delay:-18s}
  .d2{animation-duration:90s;animation-delay:-50s}
  .d3{animation-duration:58s;animation-delay:-27s}
  .d4{animation-duration:104s;animation-delay:-81s}
  .d5{animation-duration:54s;animation-delay:-9s}
  .d6{animation-duration:60s;animation-delay:-38s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated pasture with trees, clouds and four grazing animals">
  <title>Pasture scene</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="520">
      <stop offset="0" stop-color="#45aef2"/>
      <stop offset=".38" stop-color="#8ed0fa"/>
      <stop offset=".66" stop-color="#bfe8ff"/>
      <stop offset=".88" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#f9f6e8"/>
    </linearGradient>
    <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="0" y1="515" x2="0" y2="815">
      <stop offset="0" stop-color="#7ac64f"/>
      <stop offset=".28" stop-color="#61ac3c"/>
      <stop offset=".7" stop-color="#4c9431"/>
      <stop offset="1" stop-color="#39781f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset=".30" stop-color="#fffbcf" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#fff3a3" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffef94" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cowClip">
      <ellipse cx="0" cy="-70" rx="64" ry="36"/>
      <path d="M18,-90 L48,-128 L76,-116 L52,-80 Z"/>
      <rect x="44" y="-128" width="56" height="54" rx="20"/>
    </clipPath>
    <g id="tuft" fill="none" stroke="#38802a" stroke-width="2.4" stroke-linecap="round">
      <path d="M0,0c-4-7-6-11-5-15"/><path d="M3,0c1-8 2-12 6-15"/><path d="M-4,1c-3-6-4-9-3-13"/>
    </g>
    <g id="fl">
      <circle cx="0" cy="-3.4" r="2.6" fill="#fffdf3"/><circle cx="-3" cy="1.6" r="2.6" fill="#fffdf3"/>
      <circle cx="3" cy="1.6" r="2.6" fill="#fffdf3"/><circle cx="0" cy="0" r="2.2" fill="#ffd64a"/>
    </g>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="-3200" y="-900" width="7800" height="1420" fill="url(#sky)"/>
  <ellipse cx="1090" cy="520" rx="300" ry="76" fill="#8bc795" opacity=".75"/>
  <ellipse cx="1000" cy="520" rx="170" ry="50" fill="#79bb86" opacity=".7"/>
  <ellipse cx="1360" cy="520" rx="340" ry="58" fill="#93cfa2" opacity=".7"/>

  <!-- ================= SUN ================= -->
  <g transform="translate(1160,140)">
    <circle r="132" fill="url(#glow)"/>
    <g fill="#ffe97c" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="84s" repeatCount="indefinite"/>
      <path d="M-6,-50 L0,-140 L6,-50Z"/><path d="M-6,-50 L0,-140 L6,-50Z" transform="rotate(60)"/>
      <path d="M-6,-50 L0,-140 L6,-50Z" transform="rotate(120)"/><path d="M-6,-50 L0,-140 L6,-50Z" transform="rotate(180)"/>
      <path d="M-6,-50 L0,-140 L6,-50Z" transform="rotate(240)"/><path d="M-6,-50 L0,-140 L6,-50Z" transform="rotate(300)"/>
      <path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(30)"/><path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(90)"/>
      <path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(150)"/><path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(210)"/>
      <path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(270)"/><path d="M-4,-50 L0,-114 L4,-50Z" transform="rotate(330)"/>

    <circle r="50" fill="#ffe95c"/>
    <circle r="38" fill="#fff3a0"/>

  <!-- ================= CLOUDS ================= -->

    <ellipse cx="-36" cy="7" rx="26" ry="15"/><ellipse cx="6" cy="-17" rx="26" ry="17"/>

    <ellipse cx="-28" cy="5" rx="21" ry="12"/><ellipse cx="2" cy="-13" rx="20" ry="14"/></g></g>
  <g class="drift d3"><g transform="translate(150,255)" fill="#ffffff">
    <ellipse cx="0" cy="0" rx="23" ry="14"/><ellipse cx="21" cy="4" rx="17" ry="11"/>
    <ellipse cx="-19" cy="4" rx="15" ry="10"/></g></g>
  <g class="drift d4"><g transform="translate(150,200)" fill="#fffef9">

    <ellipse cx="-34" cy="4" rx="24" ry="13"/><ellipse cx="12" cy="-14" rx="22" ry="13"/>
    <ellipse cx="-14" cy="11" rx="30" ry="11"/></g></g>

  <!-- birds -->

  <line x1="-3200" y1="519" x2="4600" y2="519" stroke="#356625" stroke-width="3.5" opacity=".85"/>

  <g transform="translate(1015,662) scale(.9)">
    <ellipse cx="4" cy="2" rx="48" ry="9" fill="#22500f" opacity=".26"/>

      <circle cx="16" cy="-84" r="19" fill="#55a83a"/><circle cx="2" cy="-163" r="22" fill="#62ba47"/>
    </g>
  </g>

  <!-- bushes -->

    <g><circle cx="447" cy="542" r="15"/><circle cx="470" cy="545" r="19"/><circle cx="491" cy="543" r="14"/>
       <circle cx="700" cy="545" r="13"/><circle cx="721" cy="548" r="16"/><circle cx="936" cy="541" r="14"/>
       <circle cx="957" cy="544" r="18"/><circle cx="1172" cy="543" r="12"/><circle cx="1191" cy="546" r="15"/></g>

    <path d="M1020 736q140 -10 280 0"/><path d="M300 770q150 -9 300 0"/>

    <use xlink:href="#tuft" href="#tuft" x="965" y="716"/><use xlink:href="#tuft" href="#tuft" x="436" y="756"/>
    <use xlink:href="#tuft" href="#tuft" x="736" y="752"/><use xlink:href="#tuft" href="#tuft" x="1126" y="746"/>
    <use xlink:href="#tuft" href="#tuft" x="286" y="772"/><use xlink:href="#tuft" href="#tuft" x="1195" y="776"/>

    <use xlink:href="#fl" href="#fl" x="352" y="766"/><use xlink:href="#fl" href="#fl" x="1156" y="720"/>
  </g>

  <!-- ================= ANIMALS (scaled group) ================= -->
  <g id="content">

    <!-- ============== SHEEP ============== -->
    <g transform="translate(327,750) scale(.72)">
      <ellipse cx="2" cy="-3" rx="58" ry="10" fill="#22500f" opacity=".22"/>
      <g class="hop h3">
        <!-- far legs (2) -->
        <rect x="-30" y="-31" width="10" height="31" rx="5" fill="#2f2f39"/>
        <rect x="-16" y="-31" width="10" height="31" rx="5" fill="#2f2f39"/>
        <!-- tail -->
        <circle cx="-48" cy="-64" r="12" fill="#fbfaf4"/>
        <!-- wool body: many overlapping circles -->
        <g fill="#fdfcf8">
          <ellipse cx="0" cy="-58" rx="48" ry="31"/>
          <circle cx="-31" cy="-76" r="17"/><circle cx="-9" cy="-86" r="18"/><circle cx="15" cy="-80" r="16"/>

          <circle cx="7" cy="-36" r="13"/><circle cx="27" cy="-44" r="13"/>

        <g fill="none" stroke="#e4e2d7" stroke-width="2">

    </g>

    <!-- ============== COW ============== -->

      <ellipse cx="6" cy="-4" rx="76" ry="12" fill="#22500f" opacity=".22"/>

        <!-- far legs (2) -->

        <rect x="-31" y="-46" width="13" height="46" rx="6" fill="#e4e2d8"/>

        <rect x="-31" y="-9" width="13" height="9" rx="3" fill="#494652"/>

        <rect x="-20" y="-30" width="5" height="8" rx="2.5" fill="#efa7c2"/>
        <rect x="-11" y="-30" width="5" height="8" rx="2.5" fill="#efa7c2"/>
        <!-- body -->
        <ellipse cx="0" cy="-70" rx="64" ry="36" fill="#fdfdf9" stroke="#e3e1d5" stroke-width="1.6"/>

        <rect x="15" y="-9" width="13" height="9" rx="3" fill="#494652"/>
        <rect x="34" y="-9" width="13" height="9" rx="3" fill="#494652"/>
      </g>

    <!-- ============== HORSE ============== -->
    <g transform="translate(818,770) scale(.85)">
      <ellipse cx="4" cy="-4" rx="72" ry="11" fill="#22500f" opacity=".24"/>

        <path d="M58,-191c9,-7 18,-9 24,-5-6,7-12,11-20,12z" fill="#5b3a22"/>

    <!-- ============== PIG ============== -->

        <!-- head -->

<script>
(function () {
  var W = 1400, H = 800, DESIGN = 1140, PX = 700, PY = 620;
  var svg = document.getElementById('scene');
  var content = document.getElementById('content');
  function fit() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 1280;
    var vh = window.innerHeight || document.documentElement.clientHeight || 720;
    var s = Math.max(vw / W, vh / H);
    var visW = vw / s;
    var k = Math.max(0.62, Math.min(1, visW / DESIGN));
    content.setAttribute('transform',
      'translate(' + (PX * (1 - k)).toFixed(2) + ',' + (PY * (1 - k)).toFixed(2) + ') scale(' + k.toFixed(4) + ')');
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
