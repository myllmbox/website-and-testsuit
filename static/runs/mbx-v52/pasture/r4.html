@keyframes drift{from{transform:translateX(1800px)}to{transform:translateX(-350px)}}
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
.c1{animation-duration:48s;animation-delay:-11s}
