<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Bouncing Four — a pasture in SVG</title>
<style>
:root{
  --ink:#21321a; --ink-soft:rgba(31,48,22,.62);
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#a9daf3}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD ---------- */
.hud{position:fixed;left:clamp(14px,2.2vw,34px);bottom:clamp(14px,3.4vh,32px);z-index:10;pointer-events:none;max-width:64vw}
.kicker{font-family:var(--f-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);animation:fade .9s .1s both}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vw,58px);line-height:.94;letter-spacing:-.018em;color:var(--ink);margin:.16em 0 .22em;text-shadow:0 1px 0 rgba(255,255,255,.55),0 14px 30px rgba(24,44,10,.16);animation:fade 1.1s .16s both}
.title i{font-style:italic}
.sub{font-family:var(--f-body);font-size:12.5px;line-height:1.5;color:var(--ink-soft);max-width:36ch;animation:fade 1.1s .3s both}
.sub b{color:var(--ink);font-weight:600}
.chips{position:fixed;right:clamp(14px,2vw,30px);bottom:clamp(16px,3.6vh,34px);z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:74vw;animation:fade 1.2s .42s both}
.chip{cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;border:1px solid rgba(255,255,255,.75);border-radius:15px 5px 15px 5px;background:rgba(255,255,255,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 4px 14px rgba(28,50,14,.11);transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s,box-shadow .28s;font-family:var(--f-mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:rgba(31,48,22,.82)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#999);box-shadow:0 0 0 2px rgba(255,255,255,.6);transition:transform .28s}
.chip:hover,.chip.is-on{transform:translateY(-4px);background:#fff;color:#151f0f;box-shadow:0 9px 20px rgba(28,50,14,.19)}
.chip:hover i,.chip.is-on i{transform:scale(1.5)}
.stamp{position:fixed;left:13px;top:50%;z-index:10;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.36em;text-transform:uppercase;color:rgba(31,48,22,.4);pointer-events:none;animation:fade 1.6s .55s both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.stamp{animation-name:fadeSoft}
@keyframes fadeSoft{from{opacity:0}to{opacity:1}}

/* ---------- animals ---------- */
.animal{cursor:pointer}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shd .8s ease-in-out infinite}
.ring{fill:none;stroke:#fffad4;stroke-width:3;stroke-dasharray:11 13;opacity:.17;transition:opacity .35s,stroke-width .35s;animation:dash 14s linear infinite}
.animal.is-peek .ring{opacity:.85;stroke-width:4.2}
.animal.is-peek .hop{animation-duration:.3s}
@keyframes dash{to{stroke-dashoffset:-240}}
.tail{transform-box:fill-box;transform-origin:96% 6%;animation:swish 2.6s ease-in-out infinite alternate}
.swoosh{transform-box:fill-box;transform-origin:5% 50%;animation:swish 1.7s ease-in-out infinite alternate}
.muzzle{transform-box:fill-box;transform-origin:20% 100%;animation:chew 1.4s ease-in-out infinite}
.shead{transform-box:fill-box;transform-origin:70% 96%;animation:bob 1.9s ease-in-out infinite}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 3.6s ease-in-out infinite}
.hop{animation-timing-function:cubic-bezier(.36,.06,.56,1);animation-iteration-count:infinite}
.a-cow .hop{animation-name:hopA;animation-duration:.8s;animation-delay:-.05s}
.a-pig .hop{animation-name:hopC;animation-duration:.6s;animation-delay:-.31s}
.a-sheep .hop{animation-name:hopB;animation-duration:.66s;animation-delay:-.19s}
.a-horse .hop{animation-name:hopD;animation-duration:.9s;animation-delay:-.47s}
.a-cow .shadow{animation-duration:.8s;animation-delay:-.05s}
.a-pig .shadow{animation-duration:.6s;animation-delay:-.31s}
.a-sheep .shadow{animation-duration:.66s;animation-delay:-.19s}
.a-horse .shadow{animation-duration:.9s;animation-delay:-.47s}
@keyframes hopA{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes hopB{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes hopC{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes hopD{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes shd{0%,100%{transform:scale(1);opacity:.31}50%{transform:scale(.86,.8);opacity:.2}}
@keyframes swish{from{transform:rotate(-9deg)}to{transform:rotate(10deg)}}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(3.5deg)}}
@keyframes twitch{0%,72%,100%{transform:rotate(0)}80%{transform:rotate(-9deg)}88%{transform:rotate(6deg)}}

/* ---------- sky, clouds, growth ---------- */
.cloud{animation:drift linear infinite;animation-timing-function:linear}
.k1{animation-duration:74s;animation-delay:-14s}
.k2{animation-duration:98s;animation-delay:-46s}
.k3{animation-duration:62s;animation-delay:-58s}
.k4{animation-duration:118s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(1960px)}}
.birds{animation:drift 36s linear infinite;animation-delay:-9s}
.bird{animation:flap .42s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 60%}
.b2{animation-duration:.5s}.b3{animation-duration:.36s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.32)}}
.rays{animation:pulse 5.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.glow{animation:glow 5.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:.92}}
.tree{animation:sway ease-in-out infinite alternate}
.t1{animation-duration:5.4s;animation-delay:-1.1s}.t2{animation-duration:6.6s;animation-delay:-2.6s}.t3{animation-duration:4.8s;animation-delay:-.6s}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.2deg)}}
.t1{transform-origin:150px 636px}.t2{transform-origin:1444px 626px}.t3{transform-origin:830px 596px}
.blade{animation:wave ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-2.6deg)}to{transform:rotate(3deg)}}
.mote{animation:floaty linear infinite;opacity:0;fill:#fffbe0}
@keyframes floaty{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}85%{opacity:.28}100%{transform:translate(-46px,-170px);opacity:0}}
.flower{animation:petal ease-in-out infinite alternate}
@keyframes petal{from{transform:translateX(-1.4px)}to{transform:translateX(1.6px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg id="scene" role="img" aria-label="A pasture with a cow, sheep, pig and horse bouncing in place under a sun with drifting clouds">

<div class="hud">
  <div class="kicker">Field notes № 4 — midday, light wind</div>
  <h1 class="title">The Bouncing <i>Four</i></h1>
  <p class="sub" id="readout">A pasture drawn entirely from SVG primitives: sun with twelve rays, four drifting clouds, three swaying trees — <b>hover</b> an animal to have it prance.</p>
</div>
<div class="chips" id="chips">
  <div class="chip" data-a="pig"><i style="--c:#ee93aa"></i>Pig</div>
  <div class="chip" data-a="cow"><i style="--c:#f4efe2"></i>Cow</div>
  <div class="chip" data-a="sheep"><i style="--c:#f7f6ef"></i>Sheep</div>
  <div class="chip" data-a="horse"><i style="--c:#96643f"></i>Horse</div>
</div>
<div class="stamp">mbx · pasture · svg only</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('scene'), world=document.getElementById('world');
  var layers=[].slice.call(document.querySelectorAll('[data-p]'));
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}

  /* --- frame the scene: sky 65% / grass 35%, everything visible at any aspect --- */
  function layout(){
    var w=Math.max(120,window.innerWidth||1600), h=Math.max(120,window.innerHeight||900);
    var W=Math.min(6400,Math.max(900*w/h,240));
    svg.setAttribute('viewBox',(800-W/2)+' 0 '+W+' 900');
    var s=Math.min(1.5,Math.max(.30,W/1480));
    world.setAttribute('transform','translate('+(800-800*s)+' '+(585-585*s)+') scale('+s.toFixed(4)+')');
  }
  window.addEventListener('resize',layout,{passive:true}); layout();

  /* --- procedural flora: blades, stems, flowers --- */
  var flora=document.getElementById('flora'), f=document.createDocumentFragment();
  var greens=['#3c7d2a','#4a8f31','#58993a','#356f24','#67a947'];
  for(var i=0;i<150;i++){
    var x=Math.random()*1900-150, y=690+Math.random()*215, hgt=14+Math.random()*36;
    var d=(hgt*0.32)*(Math.random()<.5?-1:1);
    f.appendChild(el('path',{class:'blade',d:'M'+x.toFixed(1)+' '+y.toFixed(1)+' q'+(d*0.5).toFixed(1)+' '+(-hgt*0.65).toFixed(1)+' '+d.toFixed(1)+' '+(-hgt).toFixed(1),
      stroke:greens[i%greens.length],'stroke-width':(1.8+Math.random()*1.7).toFixed(1),fill:'none','stroke-linecap':'round',opacity:(.5+Math.random()*.45).toFixed(2)}));
    f.lastChild.style.animationDelay=(-Math.random()*4).toFixed(2)+'s';
    f.lastChild.style.animationDuration=(2.6+Math.random()*2.4).toFixed(2)+'s';
    f.lastChild.style.transformBox='fill-box'; f.lastChild.style.transformOrigin='50% 100%';
  }
  var petals=['#fffdf5','#fff3c4','#ffd9e0','#ffe08a','#f7f4ea'];
  for(var k=0;k<18;k++){
    var fx=Math.random()*1700-60, fy=612+Math.random()*265, g=el('g',{class:'flower',transform:'translate('+fx.toFixed(0)+','+fy.toFixed(0)+')'});
    g.appendChild(el('line',{x1:0,y1:0,x2:0,y2:-(7+Math.random()*8).toFixed(1),stroke:'#3c7d2a','stroke-width':1.7}));
    var col=petals[k%petals.length];
    for(var p=0;p<5;p++){var a=p/5*6.283;g.appendChild(el('circle',{cx:(Math.cos(a)*4.4).toFixed(2),cy:(Math.sin(a)*4.4-11).toFixed(2),r:3.1,fill:col}));}
    g.appendChild(el('circle',{cx:0,cy:-11,r:2.1,fill:'#e9b21f'}));
    g.style.animationDelay=(-Math.random()*3).toFixed(2)+'s';
    f.appendChild(g);
  }
  flora.appendChild(f);

  /* --- drifting pollen --- */
  var dust=document.getElementById('dust');
  for(var m=0;m<18;m++){
    var c=el('circle',{class:'mote',cx:(Math.random()*1800-100).toFixed(0),cy:(600+Math.random()*290).toFixed(0),r:(1.1+Math.random()*2.4).toFixed(1)});
    c.style.animationDuration=(7+Math.random()*9).toFixed(2)+'s';
    c.style.animationDelay=(-Math.random()*12).toFixed(2)+'s';
    dust.appendChild(c);
  }

  /* --- pointer parallax (never on the animated parts) --- */
  var tx=0,ty=0,run=false;
  function draw(){
    run=false;
    for(var i=0;i<layers.length;i++){
      var p=+layers[i].getAttribute('data-p');
      layers[i].style.transform='translate('+(tx*p).toFixed(2)+'px,'+(ty*p*.5).toFixed(2)+'px)';
    }
  }
  function onMove(cx,cy){
    tx=(cx/(window.innerWidth||1)-.5); ty=(cy/(window.innerHeight||1)-.5);
    if(!run){run=true;requestAnimationFrame(draw);}
  }
  window.addEventListener('pointermove',function(e){onMove(e.clientX,e.clientY);},{passive:true});
  window.addEventListener('scroll',function(){},{passive:true});

  /* --- species readout + chip pairing --- */
  var base=document.getElementById('readout').innerHTML;
  var info={
    cow:'<b>Cow</b> — cream coat, four black patches, pink muzzle and udder, four legs planted.',
    sheep:'<b>Sheep</b> — wool built from ten overlapping circles, dark face, four dark legs.',
    pig:'<b>Pig</b> — pink barrel, snout with two nostrils, triangular ears, one curly tail.',
    horse:'<b>Horse</b> — brown, long neck, long legs, dark mane along the crest and a sweeping tail.'
  };
  function enter(id){
    var a=document.getElementById(id); if(!a)return;
    a.classList.add('is-peek');
    document.getElementById('readout').innerHTML=info[id]||base;
    var c=document.querySelector('.chip[data-a="'+id+'"]'); if(c)c.classList.add('is-on');
  }
  function leave(id){
    var a=document.getElementById(id); if(a)a.classList.remove('is-peek');
    var c=document.querySelector('.chip[data-a="'+id+'"]'); if(c)c.classList.remove('is-on');
    document.getElementById('readout').innerHTML=base;
  }
  [].slice.call(document.querySelectorAll('.animal')).forEach(function(a){
    var id=a.id;
    a.addEventListener('pointerenter',function(){enter(id);});
    a.addEventListener('pointerleave',function(){leave(id);});
    a.addEventListener('click',function(){enter(id);setTimeout(function(){leave(id);},1700);});
  });
  [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){
    var id=c.getAttribute('data-a');
    c.addEventListener('pointerenter',function(){enter(id);});
    c.addEventListener('pointerleave',function(){leave(id);});
    c.addEventListener('click',function(){enter(id);setTimeout(function(){leave(id);},1700);});
  });
})();
</script>
