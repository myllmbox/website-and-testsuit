<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #031224;
  }

  #scene {
    position: fixed;
    left: 0;
    top: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fdefb" />
      <stop offset="45%" stop-color="#2081bd" />
      <stop offset="100%" stop-color="#031028" />
    </linearGradient>

    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d99d" />
      <stop offset="100%" stop-color="#7a5d38" />
    </linearGradient>

    <linearGradient id="fishA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe27f" />
      <stop offset="100%" stop-color="#ff7705" />
    </linearGradient>

    <linearGradient id="fishB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9f7ff" />
      <stop offset="100%" stop-color="#0f7fbd" />
    </linearGradient>
  </defs>

  <!-- Water -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#water)" />

  <!-- Seafloor -->
  <path
    fill="url(#sand)"
    d="M 0 618
       C 120 600, 180 630, 300 616
       C 420 602, 480 632, 600 619
       C 720 606, 780 634, 900 621
       C 1020 608, 1080 636, 1200 624
       L 1200 700 L 0 700 Z"
  />
  <ellipse cx="225" cy="668" rx="75" ry="28" fill="#7b6840" opacity="0.55" />
  <ellipse cx="740" cy="677" rx="95" ry="30" fill="#6f5c39" opacity="0.5" />
  <ellipse cx="1090" cy="665" rx="62" ry="24" fill="#847149" opacity="0.45" />

  <!-- Seaweed -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <g transform="translate(185, 633)">
      <path
        stroke="#237f38"
        stroke-width="14"
        d="M 0 0 C 14 -36, -14 -72, 6 -108 C 24 -138, -8 -172, 4 -206 C 14 -236, -6 -256, 0 -272"
      >
        <animateTransform
          attributeName="transform"
          type="skewX"
          values="-7;7;-7"
          dur="7s"
          repeatCount="indefinite"
        />
      </path>
    </g>

    <g transform="translate(730, 637)">
      <path
        stroke="#166534"
        stroke-width="12"
        d="M 0 0 C -12 -30, 15 -62, -4 -94 C -18 -126, 8 -160, -2 -192"
      >
        <animateTransform
          attributeName="transform"
          type="skewX"
          values="6;-6;6"
          dur="9s"
          repeatCount="indefinite"
        />
      </path>
    </g>

    <g transform="translate(1040, 631)">
      <path
        stroke="#2ea15a"
        stroke-width="11"
        d="M 0 0 C 8 -28, -9 -56, 5 -84 C -8 -112, 11 -141, 1 -170"
      >
        <animateTransform
          attributeName="transform"
          type="skewX"
          values="-5;5;-5"
          dur="8s"
          repeatCount="indefinite"
        />
      </path>
    </g>
  </g>

  <!-- Bubbles -->
  <g id="bubbles" opacity="0.8"></g>

  <!-- Large round orange fish -->
  <g id="fish1">
    <polygon points="-64,0 -134,-46 -134,46" fill="#d85605" />
    <ellipse cx="18" cy="0" rx="72" ry="55" fill="url(#fishA)" />
    <path
      d="M -8 -47 C 12 -86, 50 -60, 31 -41 C 16 -50, 3 -52, -8 -47 Z"
      fill="#ffc983"
    />
    <path
      d="M 24 20 C 9 5, 53 16, 42 53 C 38 34, 30 23, 24 20 Z"
      fill="#ff9f31"
      opacity="0.85"
    />
    <circle cx="60" cy="-14" r="13" fill="#ffffff" />
    <circle cx="64" cy="-13" r="5.5" fill="#111111" />
    <path
      d="M 88 6 Q 75 16, 83 27"
      fill="none"
      stroke="#6f3507"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>

  <!-- Small slender blue fish -->
  <g id="fish2">
    <polygon points="-66,0 -110,-24 -110,24" fill="#0a5a91" />
    <ellipse cx="10" cy="0" rx="72" ry="19" fill="url(#fishB)" />
    <path
      d="M -16 -15 C -2 -34, 26 -26, 19 -14 C 6 -19, -9 -18, -16 -15 Z"
      fill="#c9fbff"
    />
    <path
      d="M 30 -2 C 18 -18, 50 -11, 43 6 C 39 -1, 33 -1, 30 -2 Z"
      fill="#39d9ff"
      opacity="0.75"
    />
    <circle cx="56" cy="-4" r="7.5" fill="#ffffff" />
    <circle cx="59" cy="-3" r="3.2" fill="#07121c" />
    <path
      d="M 82 -3 Q 72 -10, 78 -16"
      fill="none"
      stroke="#063049"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>

<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const W = 1200;
  const FLOOR = 617;

  const fishElements = [
    document.getElementById("fish1"),
    document.getElementById("fish2")
  ];

  const fishState = [
    { el: fishElements[0], x: 140,  y: 250, v:  95, dir:  1 },
    { el: fishElements[1], x: 1020, y: 465, v: -36, dir: -1 }
  ];

  const bubbleGroup = document.getElementById("bubbles");
  const bubbles = [];

  for (let i = 0; i < 10; i++) {
    const r = 4 + Math.random() * 10;
    const g = document.createElementNS(svgNS, "g");

    const body = document.createElementNS(svgNS, "circle");
    body.setAttribute("r", r.toFixed(1));
    body.setAttribute("fill", "#dffbff");
    body.setAttribute("fill-opacity", "0.45");
    body.setAttribute("stroke", "#ffffff");
    body.setAttribute("stroke-opacity", "0.55");
    body.setAttribute("stroke-width", "1.2");

    const highlight = document.createElementNS(svgNS, "circle");
    highlight.setAttribute("r", (r * 0.46).toFixed(1));
    highlight.setAttribute("cx", (-r * 0.32).toFixed(1));
    highlight.setAttribute("cy", (-r * 0.36).toFixed(1));
    highlight.setAttribute("fill", "none");
    highlight.setAttribute("stroke", "#ffffff");
    highlight.setAttribute("stroke-opacity", "0.55");
    highlight.setAttribute("stroke-width", "1.1");

    g.appendChild(body);
    g.appendChild(highlight);
    bubbleGroup.appendChild(g);

    bubbles.push({
      el: g,
      bx: 55 + Math.random() * 1090,
      x: 0,
      y: 45 + Math.random() * (FLOOR - 45),
      r: r,
      v: 16 + 180 / (r + 4),
      phase: Math.random() * 12,
      amp: 7 + Math.random() * 15
    });
  }

  function draw() {
    for (const f of fishState) {
      f.el.setAttribute(
        "transform",
        "translate(" + f.x.toFixed(1) + "," + f.y.toFixed(1) + ") scale(" + f.dir + ",1)"
      );
    }

    for (const b of bubbles) {
      b.x = b.bx + Math.sin(b.y * 0.02 + b.phase) * b.amp;
      b.el.setAttribute(
        "transform",
        "translate(" + b.x.toFixed(1) + "," + b.y.toFixed(1) + ")"
      );
    }
  }

  let last = performance.now();

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    for (const f of fishState) {
      f.x += f.v * dt;

      if (f.v > 0 && f.x > W + 250) {
        f.x = -250;
      } else if (f.v < 0 && f.x < -250) {
        f.x = W + 250;
      }
    }

    for (const b of bubbles) {
      b.y -= b.v * dt;

      if (b.y < -b.r * 3) {
        b.y = FLOOR - Math.random() * 10;
        b.bx = 55 + Math.random() * 1090;
      }
    }

    draw();
    requestAnimationFrame(tick);
  }

  draw();
  requestAnimationFrame(tick);
</script>
</body>
</html>
