<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02203a}
svg{position:fixed;left:0;top:0;width:100vw;height:100vh}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
<defs>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#67d3ff"/>
<stop offset=".55" stop-color="#0d6ea9"/>
<stop offset="1" stop-color="#03172e"/>
</linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dfc88f"/>
<stop offset=".7" stop-color="#b1854c"/>
<stop offset="1" stop-color="#6f461f"/>
</linearGradient>
<radialGradient id="bubble" cx="35%" cy="28%" r="78%">
<stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
<stop offset="1" stop-color="#c9efff" stop-opacity=".30"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="100%" height="100%" fill="url(#water)"/>
<path id="floor" fill="url(#sand)" stroke="#82531f" stroke-width="2"/>
<g id="rocks"></g>
<g id="weeds" fill="none" stroke-linecap="round"></g>
<g id="bubbles" fill="url(#bubble)" stroke="#ffffff" stroke-opacity=".35"></g>

<g id="fish1">
<polygon points="-95,-48 -186,0 -95,48" fill="#b44f16"></polygon>
<ellipse rx="105" ry="40" fill="#f6852f"></ellipse>
<polygon points="-15,-36 30,-78 68,-36" fill="#d96118"></polygon>
<polygon points="16,14 -28,56 42,30" fill="#e2721f"></polygon>
<circle cx="75" cy="-10" r="12" fill="#ffffff"></circle>
<circle cx="78" cy="-10" r="5" fill="#102635"></circle>
<path d="M101 12 q14 8 21 -4" fill="none" stroke="#41210d" stroke-width="4" stroke-linecap="round"></path>
</g>

<g id="fish2">
<polygon points="-45,-30 -96,0 -45,30" fill="#1e7a42"></polygon>
<ellipse rx="47" ry="43" fill="#68d475"></ellipse>
<polygon points="-12,-36 15,-67 40,-36" fill="#39b669"></polygon>
<polygon points="10,18 -18,49 31,28" fill="#45c673"></polygon>
<circle cx="31" cy="-9" r="9" fill="#ffffff"></circle>
<circle cx="33" cy="-9" r="4" fill="#102635"></circle>
<path d="M42 8 q9 6 15 -2" fill="none" stroke="#163a1f" stroke-width="3" stroke-linecap="round"></path>
</g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('scene');
const floor = document.getElementById('floor');
const rocksEl = document.getElementById('rocks');
const weedsEl = document.getElementById('weeds');
const bubblesEl = document.getElementById('bubbles');
let W = 1, H = 1, floorBase = 1;

const fish = [
  {el:document.getElementById('fish1'), baseY:190, bob:7, freq:.75, ph:0, sc:1, margin:235, speed:60, x:100},
  {el:document.getElementById('fish2'), baseY:115, bob:5, freq:1.4, ph:2, sc:1, margin:130, speed:150, x:300}
];

const rocks = [];
for (let i = 0; i < 7; i++) {
  const e = document.createElementNS(NS, 'ellipse');
  e.setAttribute('fill', ['#74501f', '#8f6531', '#a98045'][i % 3]);
  rocksEl.appendChild(e);
  rocks.push({el:e, fx:Math.random(), r:10 + Math.random() * 26});
}

const weeds = [];
[
  {fx:.10, h:.17, a:22, w:13, ph:0, c:'#2f9e50'},
  {fx:.37, h:.24, a:30, w:17, ph:2, c:'#3fbf66'},
  {fx:.65, h:.15, a:18, w:11, ph:4, c:'#27824a'},
  {fx:.88, h:.20, a:25, w:14, ph:6, c:'#2e8e4d'}
].forEach(d => {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('stroke', d.c);
  p.setAttribute('stroke-width', d.w);
  weedsEl.appendChild(p);
  weeds.push({el:p, fx:d.fx, h:d.h, a:d.a, w:d.w, ph:d.ph});
});

const bubbles = [];
for (let i = 0; i < 8; i++) {
  const c = document.createElementNS(NS, 'circle');
  bubblesEl.appendChild(c);
  bubbles.push({el:c});
}

function fy(x) {
  const amp = Math.min(11, H * 0.02);
  return floorBase + Math.sin(x * 0.006) * amp + Math.sin(x * 0.013 + 2) * amp * 0.6;
}

function reset(b) {
  b.baseX = 5 + Math.random() * Math.max(1, W - 10);
  b.y = fy(b.baseX) - 4 - Math.random() * 20;
  b.r = 3 + Math.random() * 7;
  b.vy = 16 + (10 - b.r) * 8 + Math.random() * 16;
  b.ph = Math.random() * 6.283;
  b.sw = 8 + Math.random() * 12;
  b.el.setAttribute('r', b.r);
}

function layout() {
  W = Math.max(1, innerWidth);
  H = Math.max(1, innerHeight);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  floorBase = H * 0.905;

  let d = 'M 0 ' + H + ' L 0 ' + fy(0);
  const step = Math.max(16, W / 48);
  for (let x = step; x < W; x += step) d += ' L ' + x + ' ' + fy(x);
  d += ' L ' + W + ' ' + fy(W) + ' L ' + W + ' ' + H + ' Z';
  floor.setAttribute('d', d);

  rocks.forEach(r => {
    const x = W * r.fx;
    r.el.setAttribute('cx', x);
    r.el.setAttribute('cy', fy(x) - r.r * 0.15);
    r.el.setAttribute('rx', r.r * 1.45);
    r.el.setAttribute('ry', r.r * 0.55);
  });

  const s = Math.max(0.5, Math.min(1.15, Math.min(W / 900, H / 560)));

  weeds.forEach(w => {
    w.x = W * w.fx;
    w.y = fy(w.x) - 3;
    w.h = Math.max(70, H * w.h);
    w.el.setAttribute('stroke-width', w.w * s);
  });

  fish.forEach((f, i) => {
    f.sc = (i ? 0.88 : 1) * s;
    f.speed = (i ? 150 : 55) * s;
    f.margin = (i ? 130 : 235) * f.sc;
    f.baseY = Math.min((i ? 115 : 190) * f.sc + H * 0.045, floorBase * 0.42);
    f.bob = (i ? 5 : 7) * f.sc;
    f.x = i ? W * 0.68 : W * 0.25;
  });

  bubbles.forEach(reset);
}

let last = performance.now();
let t = 0;

function tick(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  t += dt;

  fish.forEach(f => {
    f.x += f.speed * dt;
    if (f.x > W + f.margin) f.x = -f.margin;
    if (f.x < -f.margin) f.x = W + f.margin;
    const y = floorBase - f.baseY + Math.sin(t * f.freq + f.ph) * f.bob;
    f.el.setAttribute('transform', 'translate(' + f.x + ',' + y + ') scale(' + f.sc + ')');
  });

  weeds.forEach(w => {
    let d = '', n = 20;
    for (let i = 0; i <= n; i++) {
      const g = i / n;
      const x = w.x + Math.sin(t * 1.3 + w.ph + g * 3.4) * w.a * g * g;
      const y = w.y - g * w.h;
      d += (i ? ' L ' : ' M ') + x + ' ' + y;
    }
    w.el.setAttribute('d', d);
  });

  bubbles.forEach(b => {
    b.y -= b.vy * dt;
    if (b.y + b.r < 0) reset(b);
    let x = b.baseX + Math.sin(t * 1.4 + b.ph) * b.sw;
    if (x < -30 || x > W + 30) {
      reset(b);
      x = b.baseX;
    }
    b.el.setAttribute('cx', x);
    b.el.setAttribute('cy', b.y);
  });

  requestAnimationFrame(tick);
}

addEventListener('resize', layout);
layout();
requestAnimationFrame(tick);
</script>
</body>
</html>
