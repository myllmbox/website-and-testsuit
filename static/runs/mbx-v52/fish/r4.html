<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #062c4b; }
#scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93dcff"/>
      <stop offset="0.45" stop-color="#1a87c7"/>
      <stop offset="1" stop-color="#062946"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2b6"/>
      <stop offset="0.45" stop-color="#cbb078"/>
      <stop offset="1" stop-color="#78522d"/>
    </linearGradient>
    <linearGradient id="bigFish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe67f"/>
      <stop offset="1" stop-color="#ff8104"/>
    </linearGradient>
    <linearGradient id="smallFish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9fbff"/>
      <stop offset="1" stop-color="#0f9fbb"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#water)"/>
  <polygon points="18,0 24,0 36,100 22,100" fill="#ffffff" opacity="0.045"/>
  <polygon points="63,0 68,0 80,100 69,100" fill="#ffffff" opacity="0.033"/>

  <g id="floor">
    <path fill="url(#sand)" d="M0 100 L0 89 C 10 86 18 87 30 88 C 42 89 50 86 60 87 C 70 88 80 86 90 88 C 96 89 98 87 100 88 L100 100 Z"/>
    <ellipse cx="22" cy="93" rx="15" ry="3.3" fill="#eed6a2" opacity="0.55"/>
    <ellipse cx="57" cy="95" rx="13" ry="2.8" fill="#b99359" opacity="0.55"/>
    <ellipse cx="89" cy="92" rx="9" ry="2.3" fill="#8a6236" opacity="0.7"/>
  </g>

  <g id="plants">
    <g id="plant1" transform="translate(17 88)">
      <path fill="#2a7e4d" d="M-1.2 0 C -3.4 -10 1.6 -15 0.4 -25 C -1.2 -35 2.8 -40 1.2 -50 L 3.2 -50 C 4.8 -40 0.8 -35 2.4 -25 C 3.6 -15 -0.6 -10 0.4 0 Z"/>
      <path fill="#41bf70" opacity="0.45" d="M-0.2 0 C -1.4 -9 2.2 -15 1.4 -24 C 0.2 -33 3.2 -38 2.0 -48 L 2.7 -48 C 3.9 -38 0.9 -33 1.7 -24 C 2.6 -15 -0.6 -9 -0.2 0 Z"/>
    </g>
    <g id="plant2" transform="translate(81 87)">
      <path fill="#238a64" d="M-1.0 0 C -3.2 -8 1.2 -13 0.3 -22 C -1.0 -30 2.6 -35 1.3 -44 L 3.1 -44 C 4.4 -35 0.9 -30 1.9 -22 C 3.1 -13 -0.7 -8 0.5 0 Z"/>
      <path fill="#55d393" opacity="0.38" d="M-0.2 0 C -1.0 -7 2.0 -13 1.1 -21 C 0.2 -29 3.0 -34 2.0 -42 L 2.6 -42 C 3.6 -34 0.8 -29 1.6 -21 C 2.7 -13 -0.5 -7 -0.2 0 Z"/>
    </g>
  </g>

  <g id="fish1" class="fish" transform="translate(18 36)">
    <polygon points="-6.9,0 -13.8,-6.8 -13.8,6.8" fill="#ff9e1d"/>
    <ellipse cx="0" cy="0" rx="7.8" ry="6.0" fill="url(#bigFish)"/>
    <polygon points="-1.6,-5.0 0.6,-11.7 6.0,-4.8" fill="#ef7900"/>
    <polygon points="-1.1,2.1 0.7,5.4 4.4,2.4" fill="#ff8b14"/>
    <ellipse cx="0.3" cy="1.9" rx="5.1" ry="2.0" fill="#fff2bd" opacity="0.30"/>
    <circle cx="4.9" cy="-1.3" r="1.15" fill="#ffffff"/>
    <circle cx="5.25" cy="-1.1" r="0.54" fill="#111111"/>
    <path d="M7.1 1.0 L8.8 1.9 L7.1 2.6 Z" fill="#652a10"/>
  </g>

  <g id="fish2" class="fish" transform="translate(68 63)">
    <polygon points="-4.8,0 -10.6,-4.5 -10.6,4.5" fill="#38d1de"/>
    <ellipse cx="0" cy="0" rx="5.2" ry="2.0" fill="url(#smallFish)"/>
    <polygon points="-1.0,-1.8 0.5,-5.9 3.5,-1.8" fill="#0f8faa"/>
    <polygon points="-0.7,0.8 0.6,2.9 2.8,0.9" fill="#28bfd4"/>
    <circle cx="3.1" cy="-0.3" r="0.74" fill="#ffffff"/>
    <circle cx="3.35" cy="-0.18" r="0.34" fill="#111111"/>
    <path d="M4.5 0.25 L5.9 0.85 L4.5 1.4 Z" fill="#0a4251"/>
  </g>

  <g id="bubbles"></g>
</svg>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var f1 = document.getElementById('fish1');
  var f2 = document.getElementById('fish2');
  var bubbleLayer = document.getElementById('bubbles');
  var plant1 = document.getElementById('plant1');
  var plant2 = document.getElementById('plant2');

  var fish1 = { x: 18, y: 36, speed: 3.1 };
  var fish2 = { x: 68, y: 63, speed: 8.0 };

  var plants = [
    { el: plant1, x: 17, y: 88, phase: 0.4, speed: 0.82, amp: 4.8 },
    { el: plant2, x: 81, y: 87, phase: 2.1, speed: 0.58, amp: 4.1 }
  ];

  var bubbles = [];
  var i, g, body, highlight, r, x, y, v, ph, amp;

  for (i = 0; i < 14; i++) {
    g = document.createElementNS(NS, 'g');
    body = document.createElementNS(NS, 'circle');
    highlight = document.createElementNS(NS, 'circle');

    r = 0.35 + Math.random() * 1.30;
    body.setAttribute('r', r.toFixed(2));
    body.setAttribute('fill', (i % 3 === 0) ? '#f4ffff' : '#bdeeff');
    body.setAttribute('opacity', (0.34 + Math.random() * 0.42).toFixed(2));

    highlight.setAttribute('cx', (-r * 0.35).toFixed(2));
    highlight.setAttribute('cy', (-r * 0.35).toFixed(2));
    highlight.setAttribute('r', (r * 0.30).toFixed(2));
    highlight.setAttribute('fill', '#ffffff');
    highlight.setAttribute('opacity', (0.35 + Math.random() * 0.32).toFixed(2));

    g.appendChild(body);
    g.appendChild(highlight);

    x = 3 + Math.random() * 94;
    y = 89 + Math.random() * 22;
    v = 1.05 + Math.max(0.2, 1.65 - r) * 2.6;
    ph = Math.random() * 6.28318;
    amp = 0.3 + Math.random() * 1.2;

    bubbles.push({ el: g, x: x, y: y, v: v, ph: ph, amp: amp });
    g.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
    bubbleLayer.appendChild(g);
  }

  function nowTime() {
    if (window.performance && performance.now) return performance.now();
    return Date.now();
  }

  if (!window.requestAnimationFrame) {
    window.requestAnimationFrame = function(cb) {
      return setTimeout(function(){ cb(Date.now()); }, 16);
    };
  }

  var last = nowTime();

  function loop(now) {
    if (typeof now !== 'number') now = nowTime();
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0 || dt > 0.05) dt = 1 / 60;

    fish1.x += fish1.speed * dt;
    if (fish1.x > 134) fish1.x = -36;
    f1.setAttribute('transform', 'translate(' + fish1.x.toFixed(2) + ' ' + fish1.y + ')');

    fish2.x += fish2.speed * dt;
    if (fish2.x > 134) fish2.x = -34;
    f2.setAttribute('transform', 'translate(' + fish2.x.toFixed(2) + ' ' + fish2.y + ')');

    for (i = 0; i < plants.length; i++) {
      var pl = plants[i];
      var angle = Math.sin(now * 0.001 * pl.speed + pl.phase) * pl.amp;
      pl.el.setAttribute('transform', 'translate(' + pl.x + ' ' + pl.y + ') rotate(' + angle.toFixed(2) + ')');
    }

    for (i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      b.y -= b.v * dt;
      var bx = b.x + Math.sin(now * 0.0008 + b.ph) * b.amp;
      if (b.y < -3) {
        b.y = 97 + Math.random() * 16;
        b.x = 3 + Math.random() * 94;
        bx = b.x;
      }
      b.el.setAttribute('transform', 'translate(' + bx.toFixed(2) + ' ' + b.y.toFixed(2) + ')');
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
