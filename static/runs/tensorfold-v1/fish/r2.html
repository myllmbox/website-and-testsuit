<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#012a4a}
svg{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<defs>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7fd2ff"/>
<stop offset=".55" stop-color="#11619c"/>
<stop offset="1" stop-color="#00101f"/>
</linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d9b87a"/>
<stop offset=".35" stop-color="#a57641"/>
<stop offset="1" stop-color="#4e2f15"/>
</linearGradient>
<radialGradient id="bubble" cx="35%" cy="30%" r="65%">
<stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
<stop offset=".35" stop-color="#c6efff" stop-opacity=".70"/>
<stop offset="1" stop-color="#7ad6ff" stop-opacity=".25"/>
</radialGradient>
<radialGradient id="fish1" cx="50%" cy="35%" r="70%">
<stop offset="0" stop-color="#ffd472"/>
<stop offset="1" stop-color="#ff7300"/>
</radialGradient>
<radialGradient id="fish2" cx="50%" cy="35%" r="70%">
<stop offset="0" stop-color="#9ff6ff"/>
<stop offset="1" stop-color="#0996ad"/>
</radialGradient>
</defs>

<rect id="bg" fill="url(#water)"/>
<g id="floorG"><rect id="floor" fill="url(#sand)"/><g id="rocks"></g></g>
<g id="plants"></g>
<g id="bubbles"></g>
<g id="fishLayer"></g>
</svg>

<script>
(function(){
var NS="http://www.w3.org/2000/svg";
function e(n,a,p){var o=document.createElementNS(NS,n),k;if(a){for(k in a){o.setAttribute(k,a[k])}}if(p){p.appendChild(o)}return o}

var bg=document.getElementById("bg");
var floorRect=document.getElementById("floor");
var rocksG=document.getElementById("rocks");
var plantsG=document.getElementById("plants");
var bubblesG=document.getElementById("bubbles");
var fishG=document.getElementById("fishLayer");

function clamp(v,a,b){return v<a?a:v>b?b:v}
var W=window.innerWidth,H=window.innerHeight;

function fishA(){
var g=e("g",{});
e("polygon",{points:"-135,0 -205,-55 -205,55",fill:"#e55900",stroke:"#8b2f00","stroke-width":3},g);
e("polygon",{points:"7,-52 -14,-112 62,-47",fill:"#ffb84d",stroke:"#a64800","stroke-width":2},g);
e("ellipse",{cx:0,cy:0,rx:90,ry:56,fill:"url(#fish1)",stroke:"#b04e00","stroke-width":3},g);
e("polygon",{points:"12,25 -8,72 56,40",fill:"#ff9e33",stroke:"#b04e00","stroke-width":2},g);
e("path",{d:"M88,15 Q101,23 110,11",fill:"none",stroke:"#692a00","stroke-width":4,"stroke-linecap":"round"},g);
e("circle",{cx:62,cy:-13,r:11,fill:"#ffffff",stroke:"#45250b","stroke-width":1.5},g);
e("circle",{cx:66,cy:-11,r:4,fill:"#111111"},g);
return g;
}

function fishB(){
var g=e("g",{});
e("polygon",{points:"-120,0 -195,-45 -195,45",fill:"#0e8ba3",stroke:"#06525f","stroke-width":2},g);
e("polygon",{points:"20,-27 0,-72 62,-22",fill:"#63e6ff",stroke:"#075a6a","stroke-width":2},g);
e("ellipse",{cx:0,cy:0,rx:125,ry:30,fill:"url(#fish2)",stroke:"#076978","stroke-width":2},g);
e("polygon",{points:"20,12 8,50 52,22",fill:"#52d9ef",stroke:"#076978","stroke-width":2},g);
e("path",{d:"M113,8 Q123,14 131,4",fill:"none",stroke:"#063c47","stroke-width":3,"stroke-linecap":"round"},g);
e("circle",{cx:96,cy:-7,r:8,fill:"#ffffff",stroke:"#074552","stroke-width":1.2},g);
e("circle",{cx:99,cy:-5,r:3,fill:"#111111"},g);
return g;
}

var gA=fishA(),gB=fishB();
fishG.appendChild(gA);
fishG.appendChild(gB);

var baseA=gA.getBBox().width, baseB=gB.getBBox().width;
var F=[
{g:gA,base:baseA,speed:.025,baseY:.30,bob:.017,bf:.00075,ph:.3,scale:1,hw:0,range:1,phase:.18},
{g:gB,base:baseB,speed:.070,baseY:.58,bob:.025,bf:.0013,ph:2.4,scale:1,hw:0,range:1,phase:.62}
];

var plants=[],rockE=[],rockData=[
{fx:.14,ry:.038,dy:.962},
{fx:.42,ry:.048,dy:.956},
{fx:.70,ry:.034,dy:.966},
{fx:.92,ry:.043,dy:.960}
];

var i;
for(i=0;i<rockData.length;i++){
rockE.push({el:e("ellipse",{fill:"#7c5731",stroke:"#4b3117","stroke-width":1.5},rocksG),d:rockData[i]});
}

function plant(fx,ph,seed){
var outer=e("g",{},plantsG),inner=e("g",{},outer),path=e("path",{fill:"none",stroke:"#2f9e44","stroke-linecap":"round","stroke-linejoin":"round"},inner);
plants.push({outer:outer,inner:inner,path:path,fx:fx,ph:ph,seed:seed});
}
plant(.13,.2,1);plant(.45,2.2,.5);plant(.77,4.1,.8);

var bubbles=[];
for(i=0;i<16;i++){
var r=2+Math.random()*8;
var el=e("circle",{r:r,fill:"url(#bubble)",stroke:"#ffffff","stroke-opacity":".35","stroke-width":1},bubblesG);
bubbles.push({el:el,r:r,fx:.05+Math.random()*.9,x:0,y:Math.random()*H,phase:Math.random()*6.28,v:18+240/(r+2)});
}

function seedD(h,s){
var a=7+s*8,b=11+s*7;
return "M0,0 C "+(-a)+","+(-h*.2)+" "+b+","+(-h*.42)+" 0,"+(-h*.63)+" C "+(-b)+","+(-h*.78)+" "+a+","+(-h*.92)+" 0,"+(-h);
}

function renderFish(f,t){
var x=-f.hw+f.phase*f.range;
var y=H*f.baseY+Math.sin(t*f.bf+f.ph)*H*f.bob;
var tilt=Math.sin(t*f.bf*1.6+f.ph)*3;
f.g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+") rotate("+tilt.toFixed(2)+") scale("+f.scale.toFixed(3)+")");
}

function layout(){
W=window.innerWidth;H=window.innerHeight;
bg.setAttribute("x",0);bg.setAttribute("y",0);bg.setAttribute("width",W);bg.setAttribute("height",H);

var fy=H*.885;
floorRect.setAttribute("x",-20);
floorRect.setAttribute("y",fy);
floorRect.setAttribute("width",W+40);
floorRect.setAttribute("height",H-fy+30);

var s=clamp(W/1100,.45,1.15);
F[0].scale=s;F[1].scale=s*.56;
F[0].hw=F[0].base*F[0].scale/2;
F[1].hw=F[1].base*F[1].scale/2;
F[0].range=W+F[0].base*F[0].scale;
F[1].range=W+F[1].base*F[1].scale;
F[0].phase%=1;F[1].phase%=1;

for(i=0;i<rockE.length;i++){
var d=rockE[i].d;
rockE[i].el.setAttribute("cx",(d.fx*W).toFixed(1));
rockE[i].el.setAttribute("cy",(d.dy*H).toFixed(1));
var rx=clamp(d.ry*W*1.6,15,W*.13);
var ry=clamp(d.ry*H*1.5,6,H*.055);
rockE[i].el.setAttribute("rx",rx.toFixed(1));
rockE[i].el.setAttribute("ry",ry.toFixed(1));
}

for(i=0;i<plants.length;i++){
var p=plants[i];
var ph=Math.max(65,H*.22);
p.path.setAttribute("d",seedD(ph,p.seed));
p.path.setAttribute("stroke-width",Math.max(4,H*.007));
p.outer.setAttribute("transform","translate("+(p.fx*W).toFixed(1)+","+(fy+7).toFixed(1)+")");
p.inner.setAttribute("transform","rotate(0)");
}

for(i=0;i<bubbles.length;i++){
var b=bubbles[i];
b.x=b.fx*W;
if(b.y>fy||b.y<-20)b.y=5+Math.random()*Math.max(10,fy-20);
}

for(i=0;i<F.length;i++)renderFish(F[i],0);
}

var last=0;
function tick(now){
if(typeof now!=="number")now=Date.now();
if(!last)last=now;
var dt=now-last;if(dt<0)dt=0;if(dt>64)dt=64;last=now;
var i,b,f;

for(i=0;i<plants.length;i++){
var p=plants[i];
p.inner.setAttribute("transform","rotate("+(Math.sin(now*.0012+p.ph)*5).toFixed(2)+")");
}

for(i=0;i<bubbles.length;i++){
b=bubbles[i];
b.y-=b.v*(H/700)*dt/1000;
if(b.y<-b.r){
b.fx=.05+Math.random()*.9;
b.x=b.fx*W;
b.y=H*.885+Math.random()*Math.max(10,H*.015);
b.phase=Math.random()*6.28;
}
b.el.setAttribute("cx",(b.x+Math.sin(now*.0009+b.phase)*5).toFixed(1));
b.el.setAttribute("cy",b.y.toFixed(1));
}

for(i=0;i<F.length;i++){
f=F[i];
var inc=((f.speed*W)+12)*dt/1000/f.range;
f.phase=(f.phase+inc)%1;
renderFish(f,now);
}
requestAnimationFrame(tick);
}

layout();
window.addEventListener("resize",layout);
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
