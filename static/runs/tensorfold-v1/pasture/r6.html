<title>Pasture Scene</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#dff6ff}
svg{display:block;width:100vw;height:100vh}
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
.c1{animation-duration:74s;animation-delay:-18s}
.c2{animation-duration:98s;animation-delay:-61s}
.c3{animation-duration:61s;animation-delay:-31s}
@keyframes drift{from{transform:translateX(-280px)}to{transform:translateX(1680px)}}
.bounce{animation-name:hop;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.b-cow{animation-duration:.74s;animation-delay:0s}
.b-sheep{animation-duration:.66s;animation-delay:.16s}
.b-pig{animation-duration:.71s;animation-delay:.32s}
.b-horse{animation-duration:.86s;animation-delay:.48s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
</style>
