.hop{animation:hop .8s ease-in-out infinite}

#horseHop{animation-duration:.68s;animation-delay:-.08s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

<script>
(function(){
var svg=document.getElementById("scene");
var sun=document.getElementById("sunG");
var tree1=document.getElementById("tree1");
var tree2=document.getElementById("tree2");
var animals=[
{pos:"cowPos",sc:"cowScale",fx:.15,sf:.85},
{pos:"sheepPos",sc:"sheepScale",fx:.35,sf:1.07},
{pos:"pigPos",sc:"pigScale",fx:.55,sf:1.16},
{pos:"horsePos",sc:"horseScale",fx:.78,sf:1}
];
var clouds=[
{id:"cloud1",fx:.15,fy:.19,cs:.95,sp:16},
{id:"cloud2",fx:.55,fy:.28,cs:.75,sp:22},
{id:"cloud3",fx:.84,fy:.13,cs:1.1,sp:11}
];
var i,c;
for(i=0;i<clouds.length;i++){c=clouds[i];c.el=document.getElementById(c.id);c.x=0;c.scale=1;}
var init=false,last=0,W=1000,H=600;
function resize(){
W=Math.max(1,window.innerWidth);
H=Math.max(1,window.innerHeight);
svg.setAttribute("viewBox","0 0 "+W+" "+H);
var base=Math.max(.25,Math.min(H/900,W/1400,1.05));
sun.setAttribute("transform","translate("+(W*.78)+","+(H*.21)+") scale("+base+")");
var treeScale=Math.max(.35,Math.min(base*1.35,1.1));
tree1.setAttribute("transform","translate("+(W*.09)+","+(H*.72)+") scale("+treeScale+")");
tree2.setAttribute("transform","translate("+(W*.9)+","+(H*.715)+") scale("+(treeScale*.95)+")");
for(i=0;i<animals.length;i++){
var p=animals[i],pg=document.getElementById(p.pos),sg=document.getElementById(p.sc);
pg.setAttribute("transform","translate("+(W*p.fx)+","+(H*.865)+")");
sg.setAttribute("transform","scale("+(base*p.sf)+")");
}
var cs=Math.max(.5,Math.min(base*1.3,1.2));
if(!init){
for(i=0;i<clouds.length;i++){c=clouds[i];c.scale=cs*c.cs;c.x=W*c.fx;}
init=true;
}else{
for(i=0;i<clouds.length;i++){
c=clouds[i];c.scale=cs*c.cs;
var span=W+380*c.scale;
c.x=((c.x+190*c.scale)%span+span)%span-190*c.scale;
}
}
}
function frame(t){
if(typeof t!=="number")t=new Date().getTime();
if(!last||typeof last!=="number")last=t;
var dt=(t-last)/1000;
last=t;
if(dt<0)dt=0;
if(dt>.1)dt=.1;
for(var i=0;i<clouds.length;i++){
var c=clouds[i];
c.x+=c.sp*c.scale*dt;
var m=200*c.scale;
if(c.x>W+m)c.x=-m; else if(c.x<-m)c.x=W+m;
c.el.setAttribute("transform","translate("+(c.x)+","+(c.fy*H)+") scale("+c.scale+")");
}
if(window.requestAnimationFrame)window.requestAnimationFrame(frame);
else window.setTimeout(function(){frame(new Date().getTime());},16);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",resize);
resize();
if(window.requestAnimationFrame)window.requestAnimationFrame(frame);
else window.setTimeout(function(){frame(new Date().getTime());},16);
})();
</script>
</body>
</html>
