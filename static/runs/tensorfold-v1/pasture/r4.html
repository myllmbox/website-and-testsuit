  tex.setAttribute('y',hy.toFixed(2));tex.setAttribute('width',VBW.toFixed(2));tex.setAttribute('height',g.toFixed(2));
  hz.setAttribute('y1',hy.toFixed(2));hz.setAttribute('y2',hy.toFixed(2));hz.setAttribute('x2',VBW.toFixed(2));
  hz2.setAttribute('y1',(hy+3).toFixed(2));hz2.setAttribute('y2',(hy+3).toFixed(2));hz2.setAttribute('x2',VBW.toFixed(2));
  sun.setAttribute('transform','translate('+(VBW*.84).toFixed(1)+','+(hy*.24).toFixed(1)+')');
  clouds.setAttribute('transform','scale('+k.toFixed(4)+',1)');
  for(i=0;i<CL.length;i++){
   n=document.getElementById(CL[i][0]);
   n.setAttribute('transform','translate(0,'+(hy*CL[i][1]).toFixed(1)+') scale('+(1/k).toFixed(4)+',1)');
  }
  for(i=0;i<TR.length;i++)document.getElementById(TR[i][0]).setAttribute('transform',
    'translate('+(VBW*TR[i][1]).toFixed(1)+','+(hy+g*TR[i][2]).toFixed(1)+') scale('+(TR[i][3]*Math.pow(VBH/H,.4)).toFixed(3)+')');
  for(i=0;i<AN.length;i++)document.getElementById(AN[i][0]).setAttribute('transform',
    'translate('+(VBW*AN[i][1]).toFixed(1)+','+(hy+g*AN[i][2]).toFixed(1)+') scale('+(AN[i][3]*s).toFixed(3)+')');
  scatter(VBW,hy,g,s);
 }

 function scatter(vw,hy,g,s){
  var seed=20240517,r;
  function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  while(deco.firstChild)deco.removeChild(deco.firstChild);
  for(var k=0;k<26;k++){
   n=tuft.cloneNode(true);n.removeAttribute('id');
   n.setAttribute('stroke',rnd()<.5?'#7fd069':'#2f7a31');
   n.setAttribute('stroke-opacity',(.14+rnd()*.3).toFixed(2));
   x=20+rnd()*(vw-40);
   n.setAttribute('transform','translate('+x.toFixed(1)+','+(hy+g*(.05+rnd()*.9)).toFixed(1)+') scale('+((.55+rnd()*1.1)*s).toFixed(2)+')');
   deco.appendChild(n);
  }
  for(var f=0;f<16;f++){
   n=flw.cloneNode(true);n.removeAttribute('id');
   x=30+rnd()*(vw-60);
   n.setAttribute('transform','translate('+x.toFixed(1)+','+(hy+g*(.12+rnd()*.8)).toFixed(1)+') scale('+((.8+rnd()*.7)*s).toFixed(2)+')');
   deco.appendChild(n);
  }
 }

 window.addEventListener('resize',fit,false);
 fit();
})();
