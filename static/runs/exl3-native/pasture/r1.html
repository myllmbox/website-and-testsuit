<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Pasture</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#eaf7ff}
  #stage{display:block;width:100vw;height:100vh}
  .hop{animation:hop .8s ease-in-out infinite;will-change:transform}
  .h1{animation-duration:.86s;animation-delay:-.12s}
  .h2{animation-duration:.74s;animation-delay:-.38s}
  .h3{animation-duration:.92s;animation-delay:-.61s}
  .h4{animation-duration:.79s;animation-delay:-.24s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  #rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .canopy{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
  .c2{animation-duration:7.4s;animation-delay:-2.2s}
  @keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" aria-label="Animated pasture with cow, sheep, pig and horse">
  <defs>
    <linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="585">
      <stop offset="0" stop-color="#4fb7ef"/>
      <stop offset=".55" stop-color="#a7dcf6"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="grassGrad" gradientUnits="userSpaceOnUse" x1="0" y1="585" x2="0" y2="900">
      <stop offset="0" stop-color="#8ad157"/>
      <stop offset=".5" stop-color="#5db443"/>
      <stop offset="1" stop-color="#3d8b33"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff8bf" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffe98a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cowClip"><ellipse cx="0" cy="-84" rx="78" ry="46"/></clipPath>
    <clipPath id="pigClip"><ellipse cx="0" cy="-66" rx="64" ry="44"/></clipPath>
    <clipPath id="horseClip"><ellipse cx="0" cy="-112" rx="88" ry="48"/></clipPath>
  </defs>

  <!-- sky (upper ~65%) and grass (lower ~35%) with clear horizon -->
  <rect id="skyRect" x="-3000" y="-3000" width="9000" height="3585" fill="url(#skyGrad)"/>
  <rect x="-3000" y="585" width="9000" height="4000" fill="url(#grassGrad)"/>
  <line x1="-3000" y1="585" x2="6000" y2="585" stroke="#2f7a2e" stroke-width="3" opacity=".5"/>

  <!-- sun: halo + rays + disc -->
  <g>
    <circle cx="1340" cy="150" r="150" fill="url(#glow)"/>
    <circle cx="1340" cy="150" r="74" fill="#fff2a8" opacity=".55"/>
    <g transform="translate(1340,150)"><g id="rays"></g></g>
    <circle cx="1340" cy="150" r="58" fill="#ffd23f"/>
  </g>

  <g id="clouds"></g>

  <!-- tree 1 -->
  <g>
    <ellipse cx="120" cy="668" rx="62" ry="12" fill="#2f7a2e" opacity=".28"/>
    <path d="M108,666 L112,520 L130,520 L134,666 Z" fill="#7a4a2b"/>
    <path d="M118,556 q-24,-6 -34,-26" stroke="#7a4a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g class="canopy">
      <circle cx="120" cy="486" r="58" fill="#4aa63c"/>
      <circle cx="72" cy="516" r="42" fill="#55b845"/>
      <circle cx="170" cy="512" r="44" fill="#55b845"/>
      <circle cx="98" cy="446" r="40" fill="#63c851"/>
      <circle cx="146" cy="444" r="38" fill="#63c851"/>
      <circle cx="120" cy="470" r="46" fill="#6ed05b"/>
    </g>
  </g>

  <!-- tree 2 -->
  <g>
    <ellipse cx="1480" cy="662" rx="66" ry="12" fill="#2f7a2e" opacity=".28"/>
    <path d="M1468,660 L1472,506 L1490,506 L1494,660 Z" fill="#6f4326"/>
    <path d="M1486,548 q26,-4 36,-24" stroke="#6f4326" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g class="canopy c2">
      <circle cx="1480" cy="470" r="62" fill="#3f9a34"/>
      <circle cx="1420" cy="500" r="44" fill="#4da83f"/>
      <circle cx="1540" cy="498" r="46" fill="#4da83f"/>
      <circle cx="1452" cy="428" r="40" fill="#5ab84a"/>
      <circle cx="1512" cy="424" r="42" fill="#5ab84a"/>
      <circle cx="1480" cy="452" r="48" fill="#66c455"/>
    </g>
  </g>

  <g id="decor"></g>

  <!-- PIG (facing left) -->
  <g transform="translate(280,810) scale(.86)">
    <ellipse cx="0" cy="-4" rx="86" ry="11" fill="#1f5c22" opacity=".22"/>
    <g class="hop h1">
      <g fill="#ee8ba4">
        <rect x="-40" y="-44" width="14" height="44" rx="6"/>
        <rect x="32" y="-44" width="14" height="44" rx="6"/>
      </g>
      <g fill="#f7a7bd">
        <rect x="-52" y="-44" width="15" height="44" rx="6"/>
        <rect x="20" y="-44" width="15" height="44" rx="6"/>
      </g>
      <g fill="#d9607d">
        <rect x="-52" y="-10" width="15" height="10" rx="4"/>
        <rect x="-40" y="-10" width="14" height="10" rx="4"/>
        <rect x="20" y="-10" width="15" height="10" rx="4"/>
        <rect x="32" y="-10" width="14" height="10" rx="4"/>
      </g>
      <path d="M60,-78 c15,-2 17,14 3,15 c-8,1 -7,-9 1,-9" stroke="#e07f9c" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-66" rx="64" ry="44" fill="#f9b1c4"/>
      <g clip-path="url(#pigClip)">
        <ellipse cx="16" cy="-94" rx="26" ry="18" fill="#ef9db2"/>
        <ellipse cx="-14" cy="-46" rx="22" ry="14" fill="#ef9db2"/>
      </g>
      <g fill="#e87f9c">
        <path d="M-88,-98 L-98,-122 L-72,-108 Z"/>
        <path d="M-58,-102 L-52,-126 L-38,-104 Z"/>
      </g>
      <circle cx="-74" cy="-76" r="34" fill="#f9b1c4"/>
      <ellipse cx="-102" cy="-70" rx="18" ry="15" fill="#e87f9c"/>
      <ellipse cx="-107" cy="-72" rx="3.5" ry="5" fill="#a84c66"/>
      <ellipse cx="-97" cy="-68" rx="3.5" ry="5" fill="#a84c66"/>
      <circle cx="-84" cy="-82" r="4.5" fill="#3c2b2f"/>
      <circle cx="-68" cy="-84" r="4.5" fill="#3c2b2f"/>
    </g>
  </g>

  <!-- COW (facing left) -->
  <g transform="translate(640,818) scale(.92)">
    <ellipse cx="0" cy="-4" rx="96" ry="12" fill="#1f5c22" opacity=".22"/>
    <g class="hop h2">
      <g fill="#e9dfce">
        <rect x="-40" y="-46" width="16" height="46" rx="6"/>
        <rect x="40" y="-46" width="16" height="46" rx="6"/>
      </g>
      <g fill="#fdf6ec">
        <rect x="-58" y="-46" width="18" height="46" rx="6"/>
        <rect x="22" y="-46" width="18" height="46" rx="6"/>
      </g>
      <g fill="#454545">
        <rect x="-58" y="-10" width="18" height="10" rx="4"/>
        <rect x="-40" y="-10" width="16" height="10" rx="4"/>
        <rect x="22" y="-10" width="18" height="10" rx="4"/>
        <rect x="40" y="-10" width="16" height="10" rx="4"/>
      </g>
      <path d="M74,-104 C92,-88 92,-60 82,-40" stroke="#fdf6ec" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="82" cy="-36" r="9" fill="#3d3d3d"/>
      <ellipse cx="0" cy="-84" rx="78" ry="46" fill="#fdf6ec"/>
      <g clip-path="url(#cowClip)">
        <ellipse cx="-30" cy="-116" rx="27" ry="19" fill="#2f2f2f"/>
        <ellipse cx="34" cy="-68" rx="31" ry="23" fill="#2f2f2f"/>
        <ellipse cx="58" cy="-114" rx="19" ry="15" fill="#2f2f2f"/>
        <ellipse cx="-8" cy="-50" rx="21" ry="13" fill="#2f2f2f"/>
      </g>
      <g>
        <ellipse cx="-84" cy="-116" rx="32" ry="28" fill="#fdf6ec"/>
        <ellipse cx="-108" cy="-102" rx="20" ry="17" fill="#f7a8bd"/>
        <ellipse cx="-113" cy="-104" rx="3.5" ry="5" fill="#b8667d"/>
        <ellipse cx="-102" cy="-100" rx="3.5" ry="5" fill="#b8667d"/>
        <circle cx="-90" cy="-124" r="4.5" fill="#2b2b2b"/>
        <circle cx="-74" cy="-126" r="4.5" fill="#2b2b2b"/>
        <ellipse cx="-112" cy="-138" rx="13" ry="7" fill="#e6d9c4" transform="rotate(-28 -112 -138)"/>
        <ellipse cx="-58" cy="-136" rx="13" ry="7" fill="#e6d9c4" transform="rotate(22 -58 -136)"/>
        <path d="M-98,-142 q-7,-11 0,-18" stroke="#efe3c9" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M-76,-144 q7,-11 0,-18" stroke="#efe3c9" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- SHEEP (facing right) -->
  <g transform="translate(990,812) scale(-.9,.9)">
    <ellipse cx="0" cy="-4" rx="78" ry="11" fill="#1f5c22" opacity=".22"/>
    <g class="hop h3">
      <g fill="#2e2e2e">
        <rect x="-30" y="-34" width="12" height="34" rx="5"/>
        <rect x="24" y="-34" width="12" height="34" rx="5"/>
      </g>
      <g fill="#424242">
        <rect x="-46" y="-34" width="13" height="34" rx="5"/>
        <rect x="8" y="-34" width="13" height="34" rx="5"/>
      </g>
      <g fill="#fcfcfc">
        <circle cx="-38" cy="-52" r="26"/>
        <circle cx="0" cy="-62" r="32"/>
        <circle cx="36" cy="-52" r="25"/>
        <circle cx="-18" cy="-34" r="24"/>
        <circle cx="18" cy="-34" r="24"/>
        <circle cx="-52" cy="-40" r="18"/>
        <circle cx="50" cy="-40" r="18"/>
        <circle cx="0" cy="-38" r="26"/>
      </g>
      <g>
        <ellipse cx="48" cy="-58" rx="24" ry="21" fill="#5c5c5c"/>
        <ellipse cx="30" cy="-70" rx="14" ry="10" fill="#6b6b6b" transform="rotate(-20 30 -70)"/>
        <ellipse cx="64" cy="-72" rx="13" ry="9" fill="#6b6b6b" transform="rotate(24 64 -72)"/>
        <circle cx="36" cy="-64" r="5.5" fill="#ffffff"/>
        <circle cx="56" cy="-64" r="5.5" fill="#ffffff"/>
        <circle cx="37" cy="-63" r="2.8" fill="#1e1e1e"/>
        <circle cx="57" cy="-63" r="2.8" fill="#1e1e1e"/>
        <ellipse cx="68" cy="-52" rx="9" ry="7" fill="#4c4c4c"/>
        <circle cx="68" cy="-53" r="2" fill="#2a2a2a"/>
      </g>
    </g>
  </g>

  <!-- HORSE (facing right) -->
  <g transform="translate(1330,822) scale(-1.08,1.08)">
    <ellipse cx="0" cy="-4" rx="108" ry="13" fill="#1f5c22" opacity=".22"/>
    <g class="hop h4">
      <g fill="#6f4527">
        <rect x="-46" y="-78" width="16" height="78" rx="6"/>
        <rect x="42" y="-78" width="16" height="78" rx="6"/>
      </g>
      <g fill="#8b5a34">
        <rect x="-66" y="-78" width="18" height="78" rx="6"/>
        <rect x="26" y="-78" width="18" height="78" rx="6"/>
      </g>
      <g fill="#3d2415">
        <rect x="-66" y="-12" width="18" height="12" rx="4"/>
        <rect x="-46" y="-12" width="16" height="12" rx="4"/>
        <rect x="26" y="-12" width="18" height="12" rx="4"/>
        <rect x="42" y="-12" width="16" height="12" rx="4"/>
      </g>
      <path d="M80,-142 C104,-128 106,-92 92,-56" stroke="#3d2415" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M88,-136 C108,-120 108,-92 98,-64" stroke="#52301b" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-112" rx="88" ry="48" fill="#8b5a34"/>
      <g clip-path="url(#horseClip)">
        <ellipse cx="10" cy="-140" rx="52" ry="20" fill="#9a6840" opacity=".7"/>
        <ellipse cx="-10" cy="-84" rx="56" ry="16" fill="#7a4c2c" opacity=".5"/>
      </g>
      <path d="M-46,-108 C-64,-146 -84,-172 -104,-196" stroke="#8b5a34" stroke-width="42" fill="none" stroke-linecap="round"/>
      <path d="M-34,-128 C-52,-164 -72,-188 -96,-210" stroke="#3d2415" stroke-width="14" fill="none" stroke-linecap="round"/>
      <g transform="rotate(-28 -118 -206)">
        <ellipse cx="-118" cy="-206" rx="40" ry="22" fill="#8b5a34"/>
        <ellipse cx="-146" cy="-200" rx="15" ry="12" fill="#a9764e"/>
        <circle cx="-150" cy="-200" r="3" fill="#3d2415"/>
        <circle cx="-128" cy="-212" r="4.5" fill="#2b1a10"/>
        <circle cx="-112" cy="-214" r="4.5" fill="#2b1a10"/>
      </g>
      <g fill="#6f4527">
        <path d="M-108,-226 L-114,-248 L-94,-232 Z"/>
        <path d="M-90,-222 L-92,-244 L-74,-226 Z"/>
      </g>
    </g>
  </g>
</svg>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var S=document.getElementById('stage');
  var skyG=document.getElementById('skyGrad');
  var raysG=document.getElementById('rays');
  var cloudsG=document.getElementById('clouds');
  var decorG=document.getElementById('decor');
  var BASEW=1600, BASEH=900, HZ=585;
  var vb={x:0,y:0,w:BASEW,h:BASEH};

  function el(n,a,p){
    var e=document.createElementNS(NS,n),k;
    for(k in a){ e.setAttribute(k,a[k]); }
    if(p){ p.appendChild(e); }
    return e;
  }

  /* dynamic viewBox: always shows sky above and full field + animals,
     regardless of window aspect ratio. */
  function fit(){
    var w=window.innerWidth||BASEW, h=window.innerHeight||BASEH, ar=w/h;
    var vw=BASEW, vh=BASEH;
    if(ar>BASEW/BASEH){ vw=BASEH*ar; } else { vh=BASEW/ar; }
    vb={x:(BASEW-vw)/2, y:BASEH-vh, w:vw, h:vh};
    S.setAttribute('viewBox', vb.x+' '+vb.y+' '+vw+' '+vh);
    skyG.setAttribute('y1', vb.y);
    skyG.setAttribute('y2', HZ);
  }
  fit();
  window.addEventListener('resize', fit);

  /* sun rays: 12 triangles */
  for(var i=0;i<12;i++){
    el('path',{d:'M0,-66 L9,-116 L-9,-116 Z', fill:'#ffd94f',
      transform:'rotate('+(i*30)+')', opacity:'0.9'}, raysG);
  }

  /* clouds: each made of 4+ overlapping ellipses, drifting + wrapping */
  var spec=[{s:1.00,y:132,v:26},{s:0.72,y:214,v:17},{s:1.28,y:96,v:33},{s:0.62,y:268,v:13}];
  var clouds=[];
  for(var c=0;c<spec.length;c++){
    var sd=spec[c].s, g=el('g',{},cloudsG);
    el('ellipse',{cx:-70*sd,cy:0,rx:52*sd,ry:30*sd,fill:'#ffffff'},g);
    el('ellipse',{cx:0,cy:-16*sd,rx:58*sd,ry:36*sd,fill:'#ffffff'},g);
    el('ellipse',{cx:62*sd,cy:2*sd,rx:48*sd,ry:28*sd,fill:'#ffffff'},g);
    el('ellipse',{cx:-20*sd,cy:14*sd,rx:60*sd,ry:24*sd,fill:'#f6fbff'},g);
    clouds.push({g:g, x:vb.x+(c*0.26+0.12)*vb.w, y:spec[c].y, v:spec[c].v, half:120*sd});
  }

  /* field texture: soft patches, grass tufts, small flowers */
  var seed=7;
  function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  for(var p=0;p<26;p++){
    el('ellipse',{cx:(-500+rnd()*2600).toFixed(0), cy:(592+rnd()*300).toFixed(0),
      rx:(40+rnd()*60).toFixed(0), ry:(10+rnd()*8).toFixed(0),
      fill:'#6cc24e', opacity:(0.15+rnd()*0.2).toFixed(2)}, decorG);
  }
  for(var t=0;t<90;t++){
    var tx=(-500+rnd()*2600).toFixed(0), ty=(600+rnd()*290).toFixed(0);
    el('path',{d:'M0,0 q-3,-13 -9,-18 M0,0 q1,-15 3,-21 M0,0 q5,-11 12,-14',
      stroke:(rnd()<0.5?'#3f8f33':'#8ada6b'), 'stroke-width':'3', 'stroke-linecap':'round',
      fill:'none', opacity:'0.75',
      transform:'translate('+tx+','+ty+') scale('+(0.5+rnd()*0.9).toFixed(2)+')'}, decorG);
  }
  var cols=['#ffffff','#ffe36b','#ffb3c8'];
  for(var f=0;f<16;f++){
    var fg=el('g',{transform:'translate('+(-400+rnd()*2400).toFixed(0)+','+(610+rnd()*270).toFixed(0)+')'},decorG);
    var col=cols[f%3];
    el('circle',{cx:0,cy:0,r:4,fill:col},fg);
    el('circle',{cx:-7,cy:3,r:3.4,fill:col},fg);
    el('circle',{cx:7,cy:3,r:3.4,fill:col},fg);
    el('circle',{cx:0,cy:7,r:3.4,fill:col},fg);
    el('circle',{cx:0,cy:3,r:3,fill:'#f7d24a'},fg);
  }

  /* cloud drift loop with wrap-around */
  var last=0;
  function tick(now){
    var dt=Math.min(0.05,(now-last)/1000)||0;
    last=now;
    for(var k=0;k<clouds.length;k++){
      var cl=clouds[k];
      cl.x+=cl.v*dt;
      if(cl.x-cl.half>vb.x+vb.w){ cl.x=vb.x-cl.half; }      /* exited right, reappears left */
      if(cl.x+cl.half<vb.x){ cl.x=vb.x+vb.w+cl.half; }
      cl.g.setAttribute('transform','translate('+cl.x.toFixed(1)+','+cl.y+')');
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
