<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#071f33}
  #sea{display:block;width:100vw;height:100vh}
  .ray{animation:shimmer 7s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.10}50%{opacity:.24}}
</style>
</head>
<body>
<svg id="sea" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0f5"/>
      <stop offset=".4" stop-color="#2f86c4"/>
      <stop offset="1" stop-color="#071f33"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eed9a6"/>
      <stop offset=".45" stop-color="#c9a268"/>
      <stop offset="1" stop-color="#6f4e2f"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4632"/>
      <stop offset="1" stop-color="#2f2317"/>
    </linearGradient>
    <linearGradient id="rayg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bodyA" cx=".62" cy=".38" r=".85">
      <stop offset="0" stop-color="#ffc36b"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#d94b26"/>
    </radialGradient>
    <radialGradient id="bodyB" cx=".6" cy=".35" r=".9">
      <stop offset="0" stop-color="#9ff5ea"/>
      <stop offset=".5" stop-color="#2fd6c4"/>
      <stop offset="1" stop-color="#1466a8"/>
    </radialGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#cdeeff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9fdcf5" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="kelpg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c6b3a"/>
      <stop offset="1" stop-color="#5ecf6f"/>
    </linearGradient>
  </defs>
  <rect id="bg" x="0" y="0" fill="url(#water)"/>
  <g id="rays"></g>
  <g id="kelpBack"></g>
  <g id="floor"></g>
  <g id="kelp"></g>
  <g id="bubbles"></g>
  <g id="fish"></g>
</svg>
<script>
(function(){
  "use strict";
  var S=document.getElementById('sea'),NS='http://www.w3.org/2000/svg';
  var gBg=document.getElementById('bg'),gRays=document.getElementById('rays'),
      gBack=document.getElementById('kelpBack'),gFloor=document.getElementById('floor'),
      gKelp=document.getElementById('kelp'),gBub=document.getElementById('bubbles'),
      gFish=document.getElementById('fish');
  function E(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function R(a,b){return a+Math.random()*(b-a);}
  function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}

  var W=0,H=0,BASE=0,last=0;
  var KELP=[],BUBBLES=[],FISH=[],vents=[];

  /* ---------- scene construction ---------- */
  function hillPath(base,amp){
    var d='M0 '+H+' L0 '+base.toFixed(1),x=0,n=6,i;
    for(i=0;i<=n;i++){
      var x2=W*i/n, y2=base-R(0,amp);
      var xm=(x+x2)/2, ym=base-R(amp*0.4,amp*1.6);
      d+=' Q'+xm.toFixed(1)+' '+ym.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1);
      x=x2;
    }
    return d+' L'+W+' '+H+' Z';
  }
  function makeFloor(){
    gFloor.appendChild(E('path',{d:hillPath(BASE-H*0.012,H*0.05),fill:'url(#rock)'}));
    gFloor.appendChild(E('path',{d:hillPath(BASE,H*0.02),fill:'url(#sand)'}));
    var i;
    for(i=0;i<7;i++){
      var px=R(20,W-20),pr=R(6,16);
      gFloor.appendChild(E('ellipse',{cx:px.toFixed(1),cy:(BASE+R(6,H*0.08)).toFixed(1),
        rx:pr.toFixed(1),ry:(pr*0.55).toFixed(1),fill:'#8a6b45','fill-opacity':.8}));
    }
    gFloor.appendChild(E('ellipse',{cx:(W*0.35).toFixed(1),cy:(BASE+4).toFixed(1),
      rx:(W*0.05).toFixed(1),ry:(H*0.028).toFixed(1),fill:'url(#rock)'}));
  }
  function makeRays(){
    var i;
    for(i=0;i<4;i++){
      var x=R(0,W),w=R(40,110),sk=w*2.2+R(-40,40);
      gRays.appendChild(E('polygon',{'class':'ray',
        points:x.toFixed(1)+',0 '+(x+w).toFixed(1)+',0 '+(x+sk).toFixed(1)+','+H+' '+(x+sk-w).toFixed(1)+','+H,
        fill:'url(#rayg)',style:'animation-delay:'+(-R(0,7)).toFixed(1)+'s'}));
    }
  }
  function kelpD(k,i,t){
    var x0=k.x+i*4-4,y0=k.y,amp=k.amp+i*4,ph=k.ph+i*1.7,seg=4;
    var d='M'+x0.toFixed(1)+' '+y0.toFixed(1),px=x0,py=y0,j;
    for(j=1;j<=seg;j++){
      var f=j/seg;
      var nx=x0+Math.sin(t*k.sp+ph+f*1.6)*amp*f;
      var ny=y0-k.h*f;
      var cx=px+Math.sin(t*k.sp+ph+(f-0.5/seg)*1.6)*amp*(f-0.5/seg)*0.5;
      var cy=py-(k.h/seg)*0.9;
      d+=' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+nx.toFixed(1)+' '+ny.toFixed(1);
      px=nx;py=ny;
    }
    return d;
  }
  function addKelp(g,x,h,w){
    var k={x:x,y:BASE+6,h:h,w:w,ph:R(0,6.28),sp:R(.7,1.3),amp:R(8,20),paths:[]},i;
    for(i=0;i<3;i++){
      var p=E('path',{fill:'none',stroke:'url(#kelpg)','stroke-width':(w*(i?0.6:1)).toFixed(1),
        'stroke-linecap':'round','stroke-opacity':i?0.7:1});
      k.paths.push(p);g.appendChild(p);
    }
    KELP.push(k);
    return k;
  }
  function makeKelp(){
    var i;
    for(i=0;i<4;i++){
      var k=addKelp(gBack,R(0,W),R(H*0.18,H*0.32),R(7,12));
      k.paths.forEach(function(p,j){p.setAttribute('d',kelpD(k,j,0));p.setAttribute('stroke','#175c33');p.setAttribute('stroke-opacity','.5');});
    }
    for(i=0;i<5;i++)addKelp(gKelp,R(W*0.05,W*0.95),R(H*0.14,H*0.3),R(6,11));
  }

  /* ---------- bubbles ---------- */
  function respawn(b){
    var v=Math.random()<0.6?vents[(Math.random()*vents.length)|0]:null;
    b.x0=v?v.x+R(-14,14):R(20,W-20);
    b.y=BASE-R(0,10);
  }
  function makeBubbles(){
    vents=[{x:W*0.18},{x:W*0.62},{x:W*0.88}];
    var i;
    for(i=0;i<16;i++){
      var b={r:R(2.5,9)};
      b.sp=18+(10-b.r)*7;
      b.ph=R(0,6.28);
      b.g=E('g',{});
      b.g.appendChild(E('circle',{r:b.r.toFixed(1),fill:'url(#bub)'}));
      b.g.appendChild(E('circle',{r:b.r.toFixed(1),fill:'none',stroke:'#eaffff','stroke-opacity':.55,'stroke-width':1}));
      b.g.appendChild(E('circle',{cx:(-b.r*0.35).toFixed(1),cy:(-b.r*0.35).toFixed(1),r:(b.r*0.28).toFixed(1),fill:'#fff','fill-opacity':.9}));
      gBub.appendChild(b.g);
      respawn(b);
      BUBBLES.push(b);
    }
  }

  /* ---------- fish ---------- */
  function finP(d,fill,stroke){return E('path',{d:d,fill:fill,stroke:stroke,'stroke-width':2,'stroke-linejoin':'round'});}
  function makeBigFish(){
    var g=E('g',{}),inr=E('g',{}),tail,fin;
    g.appendChild(inr);
    tail=E('g',{});
    tail.appendChild(finP('M-52 0 L-118 -40 L-96 0 L-118 40 Z','#e85d2f','#b83a17'));
    tail.appendChild(E('path',{d:'M-58 0 L-100 -22 M-58 0 L-100 22',stroke:'#b83a17','stroke-width':2,fill:'none','stroke-opacity':.7}));
    inr.appendChild(tail);
    inr.appendChild(E('ellipse',{rx:62,ry:44,fill:'url(#bodyA)',stroke:'#c34a1f','stroke-width':2}));
    inr.appendChild(finP('M-14 -40 Q 4 -84 34 -40 Z','#ff9a45','#c34a1f'));
    inr.appendChild(finP('M-6 40 Q 4 66 26 42 Z','#ff9a45','#c34a1f'));
    fin=E('g',{});
    fin.appendChild(finP('M10 6 Q -6 34 22 26 Q 30 16 10 6 Z','#ffb066','#c34a1f'));
    inr.appendChild(fin);
    inr.appendChild(E('path',{d:'M-2 -40 Q 8 0 -2 40',stroke:'#d8542a','stroke-width':6,fill:'none','stroke-opacity':.55}));
    inr.appendChild(E('path',{d:'M30 -30 Q 20 0 30 30',stroke:'#c34a1f','stroke-width':3,fill:'none','stroke-opacity':.8}));
    inr.appendChild(E('circle',{cx:42,cy:-12,r:11,fill:'#fff'}));
    inr.appendChild(E('circle',{cx:44,cy:-12,r:5.5,fill:'#232335'}));
    inr.appendChild(E('circle',{cx:41,cy:-15,r:2,fill:'#fff'}));
    inr.appendChild(E('path',{d:'M54 12 Q 62 20 70 10',stroke:'#8f2d12','stroke-width':3,fill:'none','stroke-linecap':'round'}));
    gFish.appendChild(g);
    return {g:g,tail:tail,fin:fin,dir:1,v:60,frac:.42,pad:150,bs:1.2,ba:14,ts:5,ph:R(0,6.28),tp:[-52,0],fp:[10,6],s:1};
  }
  function makeSlimFish(){
    var g=E('g',{}),inr=E('g',{}),tail,fin;
    g.appendChild(inr);
    tail=E('g',{});
    tail.appendChild(finP('M-36 0 L-76 -22 L-62 0 L-76 22 Z','#159ac2','#0d5f86'));
    inr.appendChild(tail);
    inr.appendChild(E('path',{d:'M-38 0 C -22 -16 18 -18 50 0 C 18 18 -22 16 -38 0 Z',fill:'url(#bodyB)',stroke:'#0d5f86','stroke-width':2}));
    inr.appendChild(finP('M-8 -14 Q 10 -34 30 -12 Z','#2fd6c4','#0d5f86'));
    inr.appendChild(finP('M0 14 Q 10 28 22 15 Z','#2fd6c4','#0d5f86'));
    fin=E('g',{});
    fin.appendChild(finP('M6 4 Q -6 20 14 18 Q 20 10 6 4 Z','#9ff5ea','#0d5f86'));
    inr.appendChild(fin);
    inr.appendChild(E('path',{d:'M-10 -12 Q -4 0 -10 12',stroke:'#0d5f86','stroke-width':3,fill:'none','stroke-opacity':.5}));
    inr.appendChild(E('path',{d:'M22 -12 Q 16 0 22 12',stroke:'#0d5f86','stroke-width':2.5,fill:'none','stroke-opacity':.8}));
    inr.appendChild(E('circle',{cx:32,cy:-5,r:8,fill:'#fff'}));
    inr.appendChild(E('circle',{cx:34,cy:-5,r:4,fill:'#12203a'}));
    inr.appendChild(E('circle',{cx:31,cy:-7.5,r:1.6,fill:'#fff'}));
    inr.appendChild(E('path',{d:'M46 6 Q 52 12 58 4',stroke:'#0d5f86','stroke-width':2.5,fill:'none','stroke-linecap':'round'}));
    gFish.appendChild(g);
    return {g:g,tail:tail,fin:fin,dir:-1,v:-120,frac:.66,pad:120,bs:2.2,ba:10,ts:9,ph:R(0,6.28),tp:[-36,0],fp:[6,4],s:.9};
  }

  /* ---------- layout / resize ---------- */
  function build(){
    W=S.clientWidth||window.innerWidth;
    H=S.clientHeight||window.innerHeight;
    BASE=H*0.87;
    gBg.setAttribute('width',W);gBg.setAttribute('height',H);
    clear(gRays);clear(gBack);clear(gFloor);clear(gKelp);clear(gBub);
    KELP.length=0;
    makeRays();makeFloor();makeKelp();
    if(!BUBBLES.length){makeBubbles();}
    else{
      BUBBLES.forEach(function(b){
        b.x0=Math.max(10,Math.min(W-10,b.x0));
        if(b.y>BASE+10)b.y=BASE;
      });
      vents=[{x:W*0.18},{x:W*0.62},{x:W*0.88}];
    }
    FISH.forEach(function(f){
      if(f.y===undefined)f.y=BASE*f.frac;
      f.x=Math.max(-f.pad,Math.min(W+f.pad,f.x));
      f.y=Math.max(H*0.12,Math.min(BASE-30,f.y));
    });
  }

  /* ---------- animation ---------- */
  function frame(ts){
    var t=ts/1000,dt=Math.min(0.05,t-last||0.016);last=t;
    var i,j;
    for(i=0;i<KELP.length;i++){
      var k=KELP[i];
      if(k.paths[0].parentNode.parentNode!==gBack)
        for(j=0;j<k.paths.length;j++)k.paths[j].setAttribute('d',kelpD(k,j,t));
    }
    for(i=0;i<BUBBLES.length;i++){
      var b=BUBBLES[i];
      b.y-=b.sp*dt;
      if(b.y<-b.r)respawn(b);
      var bx=b.x0+Math.sin(t*1.6+b.ph)*10;
      b.g.setAttribute('transform','translate('+bx.toFixed(1)+' '+b.y.toFixed(1)+')');
    }
    for(i=0;i<FISH.length;i++){
      var f=FISH[i];
      f.x+=f.v*dt;
      if(f.v>0&&f.x>W+f.pad)f.x=-f.pad;
      if(f.v<0&&f.x<-f.pad)f.x=W+f.pad;
      var y=f.y+Math.sin(t*f.bs+f.ph)*f.ba;
      f.g.setAttribute('transform','translate('+f.x.toFixed(1)+' '+y.toFixed(1)+') scale('+(f.dir*f.s)+','+f.s+')');
      f.tail.setAttribute('transform','rotate('+(Math.sin(t*f.ts+f.ph)*12).toFixed(1)+' '+f.tp[0]+' '+f.tp[1]+')');
      f.fin.setAttribute('transform','rotate('+(Math.sin(t*f.ts*0.7+f.ph)*14).toFixed(1)+' '+f.fp[0]+' '+f.fp[1]+')');
    }
    requestAnimationFrame(frame);
  }

  FISH.push(makeBigFish());
  FISH.push(makeSlimFish());
  build();
  window.addEventListener('resize',build);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
