<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#06263f}
  svg{display:block;width:100vw;height:100vh}
  .tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .5s ease-in-out infinite}
  #fish2 .tail{animation-duration:.32s}
  @keyframes wag{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
  .pect{transform-box:fill-box;transform-origin:20% 0%;animation:fin 1.1s ease-in-out infinite}
  @keyframes fin{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  .weed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
  .ray{animation:shimmer 7s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.05}50%{opacity:.14}}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec6f0"/>
      <stop offset=".45" stop-color="#2f7fc0"/>
      <stop offset="1" stop-color="#06263f"/>
    </linearGradient>
    <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c79a"/>
      <stop offset=".5" stop-color="#c2a06b"/>
      <stop offset="1" stop-color="#8a6a44"/>
    </linearGradient>
    <linearGradient id="f1body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8620c"/>
    </linearGradient>
    <linearGradient id="f2body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd4e8"/>
      <stop offset="1" stop-color="#1e5fbf"/>
    </linearGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#d9f2ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity=".18"/>
    </radialGradient>
  </defs>

  <rect id="bg" x="0" y="0" width="100%" height="100%" fill="url(#water)"/>

  <g id="rays" fill="#eaf9ff">
    <polygon class="ray" points="0,0 90,0 300,1000 200,1000" opacity=".1"/>
    <polygon class="ray" style="animation-delay:-2.4s" points="400,0 470,0 620,1000 540,1000" opacity=".1"/>
    <polygon class="ray" style="animation-delay:-4.9s" points="800,0 880,0 1030,1000 940,1000" opacity=".1"/>
  </g>

  <g id="plants"></g>
  <path id="sand" fill="url(#sandG)"/>
  <g id="rocks"></g>
  <g id="bubbles"></g>

  <!-- Fish 1: large, round-bodied, orange -->
  <g id="fish1">
    <g class="tail">
      <path d="M-40 0 L-88 -32 L-72 0 L-88 32 Z" fill="#e8620c"/>
      <path d="M-40 0 L-84 -26 L-72 0 L-84 26 Z" fill="#ff9e4a"/>
    </g>
    <path d="M-8 -28 Q8 -64 36 -28 Z" fill="#c2410c"/>
    <path d="M4 8 Q-16 34 8 38 Q14 20 20 12 Z" fill="#c2410c" class="pect"/>
    <ellipse cx="0" cy="0" rx="48" ry="34" fill="url(#f1body)"/>
    <path d="M-14 -32 Q-2 0 -14 32 L2 32 Q14 0 2 -32 Z" fill="#ffffff" opacity=".28"/>
    <path d="M-30 -22 Q-20 0 -30 22 L-18 22 Q-8 0 -18 -22 Z" fill="#ffffff" opacity=".28"/>
    <path d="M26 -26 Q16 0 26 26" stroke="#b45309" stroke-width="3" fill="none" opacity=".7"/>
    <circle cx="32" cy="-9" r="9.5" fill="#ffffff"/>
    <circle cx="35" cy="-9" r="4.6" fill="#14213d"/>
    <circle cx="36.6" cy="-10.8" r="1.6" fill="#ffffff"/>
    <path d="M46 9 q-9 8 -18 4" stroke="#7c2d12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Fish 2: small, slender-bodied, blue -->
  <g id="fish2">
    <g class="tail">
      <path d="M-30 0 L-64 -21 L-53 0 L-64 21 Z" fill="#1e3a8a"/>
      <path d="M-30 0 L-60 -17 L-53 0 L-60 17 Z" fill="#3b82f6"/>
    </g>
    <path d="M-8 -11 Q0 -32 20 -11 Z" fill="#1e40af"/>
    <path d="M6 4 Q-6 22 8 24 Q12 12 16 6 Z" fill="#1e40af" class="pect"/>
    <ellipse cx="0" cy="0" rx="36" ry="12" fill="url(#f2body)"/>
    <path d="M-18 -10 Q-12 0 -18 10 L-8 10 Q-2 0 -8 -10 Z" fill="#ffffff" opacity=".35"/>
    <circle cx="25" cy="-3" r="5.2" fill="#ffffff"/>
    <circle cx="27" cy="-3" r="2.6" fill="#0b1b3a"/>
    <circle cx="28" cy="-4.2" r="0.9" fill="#ffffff"/>
    <path d="M34 4 q-6 4 -12 2" stroke="#12306e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var W = 0, H = 0, floorY = 0;

  function measure(){
    W = window.innerWidth;
    H = window.innerHeight;
    floorY = H * 0.88;
  }
  measure();

  /* ---------- seafloor sand ---------- */
  var sand = document.getElementById("sand");
  function drawSand(){
    var d = "M0 " + H + " L0 " + (floorY + 6).toFixed(1);
    for (var x = 0; x <= W + 40; x += 40){
      var y = floorY + 7 * Math.sin(x * 0.006 + 1.3) + 5 * Math.sin(x * 0.014 + 0.4);
      d += " L" + x + " " + y.toFixed(1);
    }
    d += " L" + W + " " + H + " Z";
    sand.setAttribute("d", d);
  }

  /* ---------- rocks ---------- */
  var rocks = document.getElementById("rocks");
  var rockDefs = [
    {rx:60, ry:26, k:.16, f:-2, c:"#7b8794"},
    {rx:38, ry:18, k:.21, f:3,  c:"#6c7683"},
    {rx:52, ry:22, k:.78, f:-1, c:"#828d9a"},
    {rx:30, ry:14, k:.90, f:2,  c:"#6f7987"}
  ];
  var rockEls = rockDefs.map(function(r){
    var e = document.createElementNS(NS, "ellipse");
    e.setAttribute("rx", r.rx); e.setAttribute("ry", r.ry);
    e.setAttribute("fill", r.c);
    rocks.appendChild(e);
    return e;
  });
  function drawRocks(){
    rockDefs.forEach(function(r, i){
      rockEls[i].setAttribute("cx", (W * r.k).toFixed(1));
      rockEls[i].setAttribute("cy", (floorY + r.f).toFixed(1));
    });
  }

  /* ---------- seaweed ---------- */
  var plants = document.getElementById("plants");
  var weedDefs = [
    {k:.10, h:150, c:"#2f9e44", w:1},
    {k:.14, h:100, c:"#37b24d", w:-1},
    {k:.46, h:170, c:"#1f7a3a", w:1},
    {k:.68, h:120, c:"#2f9e44", w:-1},
    {k:.92, h:140, c:"#37b24d", w:1}
  ];
  weedDefs.forEach(function(wd, i){
    var outer = document.createElementNS(NS, "g");
    outer.setAttribute("class", "weed-holder");
    var inner = document.createElementNS(NS, "g");
    inner.setAttribute("class", "weed");
    inner.style.animationDelay = (-i * 0.9) + "s";
    inner.style.animationDuration = (3.6 + i * 0.5) + "s";
    var h = wd.h, a = 16 * wd.w;
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d",
      "M0 0 C " + (a) + " " + (-h*0.25) + " " + (-a) + " " + (-h*0.55) + " " + (a*0.6) + " " + (-h));
    p.setAttribute("stroke", wd.c);
    p.setAttribute("stroke-width", "10");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("fill", "none");
    inner.appendChild(p);
    var p2 = document.createElementNS(NS, "path");
    p2.setAttribute("d",
      "M0 0 C " + (-a*0.8) + " " + (-h*0.2) + " " + (a*0.7) + " " + (-h*0.5) + " " + (-a*0.4) + " " + (-h*0.8));
    p2.setAttribute("stroke", wd.c);
    p2.setAttribute("stroke-width", "6");
    p2.setAttribute("stroke-linecap", "round");
    p2.setAttribute("opacity", ".75");
    p2.setAttribute("fill", "none");
    inner.appendChild(p2);
    outer.appendChild(inner);
    plants.appendChild(outer);
    wd.el = outer;
  });
  function drawWeeds(){
    weedDefs.forEach(function(wd){
      wd.el.setAttribute("transform", "translate(" + (W * wd.k).toFixed(1) + "," + (floorY + 4).toFixed(1) + ")");
    });
  }

  /* ---------- bubbles ---------- */
  var bubbleLayer = document.getElementById("bubbles");
  var vents = [0.19, 0.16, 0.47, 0.72, 0.91];
  var bubbles = [];
  function spawn(b, first){
    var v = vents[b.vent];
    b.baseX = W * v + (Math.random() * 30 - 15);
    b.y = first ? Math.random() * H : floorY + Math.random() * 10;
    b.ph = Math.random() * Math.PI * 2;
    b.g.setAttribute("transform", "translate(" + b.baseX.toFixed(1) + "," + b.y.toFixed(1) + ")");
  }
  for (var i = 0; i < 12; i++){
    var g = document.createElementNS(NS, "g");
    var c = document.createElementNS(NS, "circle");
    var r = 3 + Math.random() * 6;
    c.setAttribute("r", r.toFixed(1));
    c.setAttribute("fill", "url(#bub)");
    c.setAttribute("stroke", "#e8f8ff");
    c.setAttribute("stroke-opacity", ".55");
    c.setAttribute("stroke-width", "1");
    g.appendChild(c);
    var hl = document.createElementNS(NS, "circle");
    hl.setAttribute("r", (r * 0.28).toFixed(1));
    hl.setAttribute("cx", (-r * 0.34).toFixed(1));
    hl.setAttribute("cy", (-r * 0.36).toFixed(1));
    hl.setAttribute("fill", "#ffffff");
    hl.setAttribute("opacity", ".85");
    g.appendChild(hl);
    bubbleLayer.appendChild(g);
    var b = {g:g, r:r, vent:i % vents.length, sp:96 - r * 6.5, baseX:0, y:0, ph:0};
    spawn(b, true);
    bubbles.push(b);
  }

  /* ---------- fish ---------- */
  var fish = [
    {el:document.getElementById("fish1"), dir:1,  scale:1.00, speed:105, by:.30, amp:16, ph:0.0},
    {el:document.getElementById("fish2"), dir:-1, scale:0.80, speed:55,  by:.62, amp:10, ph:2.2}
  ];
  fish.forEach(function(f, i){
    f.half = (f.dir === 1 ? 92 : 68) * f.scale + 12;
    f.x = W * (0.25 + 0.5 * i);
  });

  function resize(){
    measure();
    drawSand();
    drawRocks();
    drawWeeds();
    bubbles.forEach(function(b){ b.baseX = W * vents[b.vent] + (Math.random()*30 - 15); });
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- animation loop ---------- */
  var last = 0;
  function frame(now){
    var t = now * 0.001;
    var dt = Math.min(0.05, (now - last) * 0.001 || 0);
    last = now;

    for (var i = 0; i < fish.length; i++){
      var f = fish[i];
      f.x += f.dir * f.speed * dt;
      if (f.dir === 1 && f.x - f.half > W) f.x = -f.half;
      if (f.dir === -1 && f.x + f.half < 0) f.x = W + f.half;
      var y = H * f.by + Math.sin(t * 0.8 + f.ph) * f.amp;
      var base = Math.atan2(Math.cos(t * 0.8 + f.ph) * f.amp * 0.8, f.speed) * 57.2958;
      f.el.setAttribute("transform",
        "translate(" + f.x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + (f.dir * base).toFixed(2) + ") scale(" + (f.dir * f.scale) + "," + f.scale + ")");
    }

    for (var j = 0; j < bubbles.length; j++){
      var b = bubbles[j];
      b.y -= b.sp * dt;
      if (b.y + b.r < -4) spawn(b, false);
      var x = b.baseX + Math.sin(t * 1.7 + b.ph) * 8;
      b.g.setAttribute("transform", "translate(" + x.toFixed(1) + "," + b.y.toFixed(1) + ")");
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
