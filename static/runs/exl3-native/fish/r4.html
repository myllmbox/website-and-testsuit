<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underwater Scene</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #062a4a;
  }
  svg#scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7fdcf7"/>
      <stop offset="45%" stop-color="#2f86c5"/>
      <stop offset="100%" stop-color="#062a4a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e8c98a"/>
      <stop offset="100%" stop-color="#8a6236"/>
    </linearGradient>
    <radialGradient id="bubbleGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#cfeeff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a8dcf5" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Water -->
  <rect id="waterRect" x="0" y="0" width="100%" height="100%" fill="url(#water)"/>

  <!-- Light rays -->
  <g id="rays" opacity="0.12">
    <polygon id="ray1" points="0,0 0,0 0,0" fill="#e8fbff"/>
    <polygon id="ray2" points="0,0 0,0 0,0" fill="#e8fbff"/>
  </g>

  <!-- Seaweed (drawn behind fish, rooted on floor) -->
  <g id="weeds"></g>

  <!-- Seafloor -->
  <path id="floor" d="" fill="url(#sand)"/>
  <g id="rocks"></g>

  <!-- Bubbles -->
  <g id="bubbles"></g>

  <!-- Fish 1: long, slender, orange, moves right -->
  <g id="fish1pos">
    <g id="fish1">
      <g id="tail1">
        <polygon points="-66,0 -106,-26 -106,26" fill="#e06a2b"/>
      </g>
      <polygon points="-16,-24 6,-50 30,-24" fill="#e06a2b"/>
      <ellipse cx="0" cy="0" rx="68" ry="26" fill="#ff8c42"/>
      <ellipse cx="-2" cy="-8" rx="42" ry="10" fill="#ffbd7a" opacity="0.55"/>
      <polygon points="6,12 -12,36 26,22" fill="#e06a2b"/>
      <circle cx="46" cy="-8" r="8" fill="#ffffff"/>
      <circle cx="48" cy="-8" r="3.5" fill="#123045"/>
      <path d="M60 8 q7 5 13 -1" stroke="#8a3b12" stroke-width="3"
            fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Fish 2: round, short, teal, faces left -->
  <g id="fish2pos">
    <g id="fish2" transform="scale(-1,1)">
      <g id="tail2">
        <polygon points="-32,0 -62,-22 -62,22" fill="#1f9c9c"/>
      </g>
      <polygon points="-8,-30 6,-52 20,-28" fill="#1f9c9c"/>
      <ellipse cx="0" cy="0" rx="36" ry="32" fill="#35c9c9"/>
      <ellipse cx="-4" cy="0" rx="5" ry="27" fill="#1f9c9c" opacity="0.5"/>
      <ellipse cx="-18" cy="0" rx="4" ry="19" fill="#1f9c9c" opacity="0.5"/>
      <ellipse cx="4" cy="-10" rx="20" ry="11" fill="#8ff0ef" opacity="0.45"/>
      <polygon points="2,8 -12,28 18,18" fill="#1f9c9c"/>
      <circle cx="20" cy="-8" r="7" fill="#ffffff"/>
      <circle cx="22" cy="-8" r="3" fill="#123045"/>
      <path d="M32 8 q5 4 9 -1" stroke="#0d5c5c" stroke-width="3"
            fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>

<script>
(function () {
  "use strict";

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("scene");
  var floorEl = document.getElementById("floor");
  var rocksEl = document.getElementById("rocks");
  var weedsEl = document.getElementById("weeds");
  var bubblesEl = document.getElementById("bubbles");
  var ray1 = document.getElementById("ray1");
  var ray2 = document.getElementById("ray2");

  var fish1pos = document.getElementById("fish1pos");
  var fish2pos = document.getElementById("fish2pos");
  var tail1 = document.getElementById("tail1");
  var tail2 = document.getElementById("tail2");

  var W = 0, H = 0;

  /* ---------- Seafloor (bumpy sand + rocks) ---------- */
  var floorBumps = [
    [0.18, -0.012], [0.35, 0.010], [0.55, -0.020],
    [0.75, 0.008], [0.90, -0.015], [1.00, 0.000]
  ];

  function floorTopY() { return H * 0.88; } // ~12% of viewport

  function drawFloor() {
    var fy = floorTopY();
    var d = "M0 " + H + " L0 " + fy;
    var px = 0, py = fy;
    for (var i = 0; i < floorBumps.length; i++) {
      var x = floorBumps[i][0] * W;
      var y = fy + floorBumps[i][1] * H;
      d += " Q " + ((px + x) / 2) + " " + ((py + y) / 2 - 14) + " " + x + " " + y;
      px = x; py = y;
    }
    d += " L " + W + " " + H + " Z";
    floorEl.setAttribute("d", d);

    rocksEl.innerHTML = "";
    var rocks = [
      [0.22, 0.90, 0.035, 0.020, "#6b4a2b"],
      [0.68, 0.92, 0.045, 0.024, "#5d4026"],
      [0.44, 0.94, 0.025, 0.014, "#77552f"]
    ];
    for (var r = 0; r < rocks.length; r++) {
      var rk = rocks[r];
      var e = document.createElementNS(svgNS, "ellipse");
      e.setAttribute("cx", rk[0] * W);
      e.setAttribute("cy", rk[1] * H);
      e.setAttribute("rx", rk[2] * W);
      e.setAttribute("ry", rk[3] * H);
      e.setAttribute("fill", rk[4]);
      rocksEl.appendChild(e);
    }
  }

  /* ---------- Seaweed ---------- */
  var weedDefs = [
    { fx: 0.12, fh: 0.17, w: 16, phase: 0.0, c: "#2e8b57" },
    { fx: 0.45, fh: 0.23, w: 20, phase: 1.7, c: "#3cb371" },
    { fx: 0.80, fh: 0.14, w: 14, phase: 3.1, c: "#2e8b57" }
  ];
  var weedStrokes = [];
  weedDefs.forEach(function (wd) {
    // each plant: two wavy strokes side by side
    for (var k = 0; k < 2; k++) {
      var p = document.createElementNS(svgNS, "path");
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", wd.c);
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("opacity", k === 0 ? "0.9" : "0.6");
      p.dataset.wi = weedStrokes.length;
      weedStrokes.push({ el: p, def: wd, side: k });
      weedsEl.appendChild(p);
    }
  });

  function drawWeeds(t) {
    var baseY = floorTopY() + 8;
    for (var i = 0; i < weedStrokes.length; i++) {
      var s = weedStrokes[i];
      var bx = s.def.fx * W + (s.side === 0 ? 0 : 12);
      var h = s.def.fh * H * (s.side === 0 ? 1 : 0.75);
      var sway = Math.sin(t * 1.2 + s.def.phase) * s.def.w + (s.side * 6);
      var sw2 = Math.sin(t * 1.2 + s.def.phase + 1.3) * s.def.w;
      var d = "M " + bx + " " + baseY +
              " C " + (bx + sway) + " " + (baseY - h * 0.35) +
              " " + (bx - sw2) + " " + (baseY - h * 0.65) +
              " " + (bx + sway * 0.7) + " " + (baseY - h);
      s.el.setAttribute("d", d);
      s.el.setAttribute("stroke-width", Math.max(6, W * 0.008));
    }
  }

  /* ---------- Light rays ---------- */
  function drawRays(t) {
    var s1 = Math.sin(t * 0.3) * W * 0.05;
    var s2 = Math.cos(t * 0.22) * W * 0.06;
    ray1.setAttribute("points",
      (0.30 * W + s1) + ",0 " + (0.42 * W + s1) + ",0 " + (0.55 * W + s1) + "," + (0.7 * H));
    ray2.setAttribute("points",
      (0.62 * W + s2) + ",0 " + (0.70 * W + s2) + ",0 " + (0.50 * W + s2) + "," + (0.6 * H));
  }

  /* ---------- Bubbles ---------- */
  var NUM_BUBBLES = 9;
  var bubbles = [];
  for (var b = 0; b < NUM_BUBBLES; b++) {
    var g = document.createElementNS(svgNS, "g");
    var c = document.createElementNS(svgNS, "circle");
    c.setAttribute("fill", "url(#bubbleGrad)");
    c.setAttribute("stroke", "#ffffff");
    c.setAttribute("stroke-opacity", "0.7");
    c.setAttribute("stroke-width", "1");
    var hl = document.createElementNS(svgNS, "circle");
    hl.setAttribute("fill", "#ffffff");
    hl.setAttribute("opacity", "0.85");
    g.appendChild(c);
    g.appendChild(hl);
    bubblesEl.appendChild(g);
    bubbles.push({ g: g, c: c, hl: hl, x: 0, y: 0, r: 0, phase: Math.random() * 6.28 });
  }

  function spawnBubble(bu, startHigh) {
    bu.r = 3 + Math.random() * 8;
    bu.x = Math.random() * W;
    if (startHigh) {
      bu.y = Math.random() * H;
    } else {
      bu.y = floorTopY() + 6 + Math.random() * 14;
    }
    bu.phase = Math.random() * 6.28;
  }
  bubbles.forEach(function (bu) { spawnBubble(bu, true); });

  function drawBubbles(t, dt) {
    for (var i = 0; i < bubbles.length; i++) {
      var bu = bubbles[i];
      // smaller bubbles rise faster
      var speed = 34 + (11 - bu.r) * 9;
      bu.y -= speed * dt;
      bu.x += Math.sin(t * 2 + bu.phase) * 14 * dt;
      if (bu.y + bu.r < -4) {
        spawnBubble(bu, false);
      }
      bu.c.setAttribute("cx", bu.x);
      bu.c.setAttribute("cy", bu.y);
      bu.c.setAttribute("r", bu.r);
      bu.hl.setAttribute("cx", bu.x - bu.r * 0.35);
      bu.hl.setAttribute("cy", bu.y - bu.r * 0.4);
      bu.hl.setAttribute("r", Math.max(1, bu.r * 0.22));
    }
  }

  /* ---------- Fish ---------- */
  var MARGIN = 150; // wrap margin wider than the largest fish
  var f1 = { pos: fish1pos, tail: tail1, x: 0, speed: 130, dir: 1,  yFrac: 0.34, wig: 0 };
  var f2 = { pos: fish2pos, tail: tail2, x: 0, speed: 55,  dir: -1, yFrac: 0.62, wig: 2 };

  f1.x = W * 0.25;
  f2.x = W * 0.75;

  function drawFish(f, t, dt) {
    f.x += f.dir * f.speed * dt;
    var span = W + 2 * MARGIN;
    if (f.dir > 0 && f.x > W + MARGIN) f.x = -MARGIN;
    if (f.dir < 0 && f.x < -MARGIN) f.x = W + MARGIN;

    var y = f.yFrac * H + Math.sin(t * 1.3 + f.wig) * 12;
    f.pos.setAttribute("transform", "translate(" + f.x + "," + y + ")");

    // gentle tail flap
    var a = Math.sin(t * 7 + f.wig) * 7;
    f.tail.setAttribute("transform", "rotate(" + a + " -64 0)");
  }

  /* ---------- Resize ---------- */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    drawFloor();
  }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- Main loop ---------- */
  var last = performance.now();
  function frame(now) {
    var t = now / 1000;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    drawWeeds(t);
    drawRays(t);
    drawBubbles(t, dt);
    drawFish(f1, t, dt);
    drawFish(f2, t, dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
