<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reef Drift — an SVG underwater scene</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#041b28}
#stage{display:block;width:100vw;height:100vh;cursor:crosshair}
.tag{position:fixed;left:36px;top:30px;z-index:3;pointer-events:none;user-select:none;
  color:#d7f2ff;text-shadow:0 2px 16px rgba(1,18,30,.85)}
.tag h1{margin:0;font-family:"Futura","Avenir Next","Century Gothic","Trebuchet MS",sans-serif;
  font-weight:700;font-size:clamp(21px,3.4vw,40px);line-height:.94;letter-spacing:.24em;text-transform:uppercase;color:#f4fdff}
.tag h1 b{display:block;font-weight:400;font-size:.32em;letter-spacing:.62em;color:#7fd8f2;margin-top:11px}
.tag p{margin:15px 0 0;padding-left:12px;border-left:1px solid rgba(160,225,250,.32);max-width:29ch;
  font:italic 400 12.5px/1.65 Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:.015em;opacity:.78}
.hint{position:fixed;right:34px;bottom:26px;z-index:3;pointer-events:none;
  font:600 10.5px/1 "Futura","Avenir Next","Trebuchet MS",sans-serif;letter-spacing:.34em;
  text-transform:uppercase;color:#a9e5fb;opacity:.55;text-shadow:0 2px 10px rgba(0,15,25,.8)}
@keyframes raydrift{from{transform:translateX(-70px) skewX(3deg)}to{transform:translateX(80px) skewX(-5deg)}}
.rays{animation:raydrift 27s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes caustic{from{transform:translateX(-80px) scaleY(1)}to{transform:translateX(95px) scaleY(.82)}}
.caustics{animation:caustic 15s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.85}}
.ventglow{animation:pulse 5.5s ease-in-out infinite}
</style>
</head>
<body>

<svg id="stage" role="img" aria-label="Animated underwater scene with two fish, rising bubbles and swaying seaweed">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5ecff"/>
      <stop offset=".16" stop-color="#5cc0e8"/>
      <stop offset=".42" stop-color="#1e79b6"/>
      <stop offset=".72" stop-color="#0c4577"/>
      <stop offset="1" stop-color="#05203c"/>
    </linearGradient>
    <radialGradient id="sunpool" cx=".5" cy="0" r=".72">
      <stop offset="0" stop-color="#f0ffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f0ffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0feff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#bdf0ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#bdf0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3b6"/>
      <stop offset=".22" stop-color="#e2bd82"/>
      <stop offset=".55" stop-color="#b3874f"/>
      <stop offset="1" stop-color="#5f4327"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6a4f"/>
      <stop offset="1" stop-color="#2c2417"/>
    </linearGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#d7f4ff" stop-opacity=".14"/>
      <stop offset=".85" stop-color="#eafaff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="bodyA" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset=".4" stop-color="#f5833a"/>
      <stop offset=".8" stop-color="#d2452a"/>
      <stop offset="1" stop-color="#93261f"/>
    </linearGradient>
    <linearGradient id="finA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdcaa"/>
      <stop offset="1" stop-color="#d5502b"/>
    </linearGradient>
    <linearGradient id="bodyB" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#bdf7ea"/>
      <stop offset=".38" stop-color="#4fc6d8"/>
      <stop offset=".75" stop-color="#2a79c4"/>
      <stop offset="1" stop-color="#1b4a8f"/>
    </linearGradient>
    <linearGradient id="finB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff0e4"/>
      <stop offset="1" stop-color="#2f5fae"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8fdff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e8fdff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".38" r=".78">
      <stop offset=".55" stop-color="#00121f" stop-opacity="0"/>
      <stop offset="1" stop-color="#00101c" stop-opacity=".8"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect id="water" x="-60" y="-60" width="1720" height="1060" fill="url(#water)"/>
  <ellipse id="pool" cx="800" cy="-40" rx="900" ry="360" fill="url(#sunpool)"/>

  <g class="rays" opacity=".85">
    <polygon points="190,-60 255,-60 540,1520 120,1520" fill="url(#rayG)" opacity=".5"/>
    <polygon points="520,-60 560,-60 790,1520 410,1520" fill="url(#rayG)" opacity=".34"/>
    <polygon points="860,-60 935,-60 1130,1520 700,1520" fill="url(#rayG)" opacity=".55"/>
    <polygon points="1150,-60 1200,-60 1450,1520 990,1520" fill="url(#rayG)" opacity=".3"/>
    <polygon points="1420,-60 1472,-60 1730,1520 1240,1520" fill="url(#rayG)" opacity=".42"/>
  </g>

  <g class="caustics" filter="url(#soft)" fill="#e9feff">
    <ellipse cx="180" cy="46" rx="150" ry="11" opacity=".16"/>
    <ellipse cx="470" cy="88" rx="210" ry="9" opacity=".12"/>
    <ellipse cx="760" cy="34" rx="120" ry="13" opacity=".2"/>
    <ellipse cx="1060" cy="76" rx="180" ry="8" opacity=".13"/>
    <ellipse cx="1330" cy="40" rx="140" ry="12" opacity=".17"/>
    <ellipse cx="1560" cy="96" rx="110" ry="7" opacity=".11"/>
  </g>

  <path id="ridgePath" fill="url(#ridge)" opacity=".55"/>
  <g id="farShrub"></g>
  <path id="sandPath" fill="url(#sand)"/>
  <g id="pebbleG" fill="#43301c" fill-opacity=".26"></g>
  <g id="rockG"></g>
  <g id="ventG"></g>
  <g id="kelpG"></g>

  <!-- deep-bodied fish, large, slow, drifting right -->
  <g id="fishA" class="fish">
    <g id="tailA" transform="translate(-78,0)">
      <path d="M 8 0 L -56 -50 L -56 50 Z" fill="url(#finA)" opacity=".97"/>
      <path d="M 4 0 L -46 -30 L -46 30 Z" fill="#8f2a1c" opacity=".22"/>
    </g>
    <path d="M 6 -46 Q 24 -96 64 -40 Q 30 -52 6 -46 Z" fill="url(#finA)"/>
    <path d="M 0 46 Q 24 86 58 40 Q 26 52 0 46 Z" fill="url(#finA)" opacity=".95"/>
    <ellipse cx="0" cy="0" rx="88" ry="66" fill="url(#bodyA)"/>
    <path d="M -6 -60 Q 12 0 -6 60" fill="none" stroke="#9c361b" stroke-opacity=".26" stroke-width="12"/>
    <path d="M -44 -46 Q -28 0 -44 46" fill="none" stroke="#9c361b" stroke-opacity=".2" stroke-width="10"/>
    <ellipse cx="4" cy="-32" rx="52" ry="18" fill="#fff" opacity=".17"/>
    <g id="finA"><ellipse cx="24" cy="28" rx="30" ry="15" fill="url(#finA)" opacity=".95"/></g>
    <circle cx="50" cy="-18" r="12" fill="#fffdf3"/>
    <circle cx="53" cy="-17" r="6" fill="#172a3d"/>
    <path d="M 84 5 q -6 16 -21 18" fill="none" stroke="#8c3a20" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- slender fish, small, quick, drifting left -->
  <g id="fishB" class="fish">
    <g id="tailB" transform="translate(-52,0)">
      <path d="M 6 0 L -42 -26 L -42 26 Z" fill="url(#finB)"/>
    </g>
    <path d="M -26 -13 Q -2 -44 32 -15 Q 2 -17 -26 -13 Z" fill="url(#finB)"/>
    <path d="M -20 13 Q 2 34 26 14 Q 2 17 -20 13 Z" fill="url(#finB)" opacity=".95"/>
    <path d="M 66 0 Q 44 -16 6 -18 Q -34 -20 -56 -3 L -56 3 Q -34 20 6 18 Q 44 16 66 0 Z" fill="url(#bodyB)"/>
    <path d="M 6 -12 Q 30 -7 52 -7" fill="none" stroke="#ecfeff" stroke-opacity=".38" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M -18 8 Q 8 12 40 7" fill="none" stroke="#0f355e" stroke-opacity=".28" stroke-width="4"/>
    <g id="finB"><ellipse cx="20" cy="11" rx="17" ry="8" fill="url(#finB)" opacity=".92"/></g>
    <circle cx="46" cy="-4" r="5.6" fill="#fffdf3"/>
    <circle cx="47.6" cy="-3.6" r="2.8" fill="#132539"/>
    <path d="M 64 3 q -5 6.5 -12 6.5" fill="none" stroke="#164468" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <g id="kelpFrontG" filter="url(#softer)" opacity=".92"></g>
  <g id="bubbleG"></g>
  <g id="dustG" fill="#e6fbff"></g>
  <g id="rippleG" fill="none" stroke="#dff8ff"></g>
  <circle id="spot" r="200" cx="-9999" cy="-9999" fill="url(#spot)" opacity=".16"/>
  <rect id="vigR" x="-60" y="-60" width="1720" height="1060" fill="url(#vig)"/>
</svg>

<div class="tag">
  <h1>Reef Drift<b>two residents of the shallows</b></h1>
  <p>Sunfish, deep-bodied and unhurried. Darter, a silver streak. Neither agrees on direction.</p>
</div>
<div class="hint">click to release air</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg", W=1600, PH=1.1, H=900, FB=796;
var svg=document.getElementById("stage");
function $(i){return document.getElementById(i);}
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
var rnd=function(a,b){return a+Math.random()*(b-a);};

var water=$("water"),vigR=$("vigR"),sand=$("sandPath"),ridge=$("ridgePath"),
    kelpG=$("kelpG"),kelpFG=$("kelpFrontG"),pebG=$("pebbleG"),rockG=$("rockG"),
    ventG=$("ventG"),bubG=$("bubbleG"),dustG=$("dustG"),ripG=$("rippleG"),
    farG=$("farShrub"),pool=$("pool"),spotEl=$("spot");

function ftop(x){return FB+30*Math.sin(x*0.0042+PH)-16*Math.sin(x*0.0019+PH*1.7);}
function floorD(dy,k,ph){
  var d="M -60 "+(ftop(0)+dy).toFixed(1),x;
  for(x=0;x<=W+60;x+=40)d+=" L "+x+" "+(ftop(x)+dy+22*k*Math.sin(x*0.0031+ph)).toFixed(1);
  return d+" L "+(W+60)+" "+(H+80)+" L -60 "+(H+80)+" Z";
}

/* ---- kelp ---- */
var KELP=[
 {x:252,hf:.20,amp:26,w:15,ph:.4,sp:1.00,c:"#1d6c4d"},
 {x:302,hf:.28,amp:34,w:18,ph:1.7,sp:1.25,c:"#2e9663"},
 {x:358,hf:.15,amp:20,w:12,ph:2.6,sp:.85,c:"#14563f"},
 {x:416,hf:.23,amp:30,w:16,ph:.9,sp:1.10,c:"#35a86f"},
 {x:822,hf:.12,amp:15,w:10,ph:2.1,sp:1.45,c:"#2b8f5f"},
 {x:1168,hf:.24,amp:28,w:16,ph:3.1,sp:1.05,c:"#1d6c4d"},
 {x:1228,hf:.17,amp:22,w:12,ph:.2,sp:1.32,c:"#35a86f"}
];
var FRONT=[
 {x:92,hf:.34,amp:46,w:26,ph:1.2,sp:.80,c:"#0c4232"},
 {x:1512,hf:.30,amp:40,w:22,ph:2.4,sp:.96,c:"#0d4736"}
];
function bladeD(x0,by,h,amp,w,ph,t){
  var N=8,L=[],R=[],i,s,y,x,hw;
  for(i=0;i<=N;i++){
    s=i/N;y=by-h*s;
    x=x0+Math.sin(ph+t+s*3.1)*amp*s*s*1.2;
    hw=w*(1-.86*s)+.7;
    L.push(x.toFixed(1)+" "+y.toFixed(1));
    R.push((x+hw*2).toFixed(1)+" "+y.toFixed(1));
  }
  return "M "+L.join(" L ")+" L "+R.reverse().join(" L ")+" Z";
}
function leavesD(x0,by,h,amp,w,ph,t){
  var d="",i,s,y,x,a;
  for(i=0;i<7;i++){
    s=.28+i*.105;y=by-h*s;
    x=x0+Math.sin(ph+t+s*3.1)*amp*s*s*1.2;
    a=Math.sin(ph+t+s*3.1)*30;
    d+="M "+x.toFixed(1)+" "+y.toFixed(1)+" q "+(i%2?16:-16)+" -3 "+(i%2?22:-22)+" 9 ";
  }
  return d;
}
KELP.forEach(function(k){k.el=mk("path",{fill:k.c},kelpG);});
FRONT.forEach(function(k){k.el=mk("path",{fill:k.c},kelpFG);});

/* ---- pebbles / rocks / vents ---- */
var PEB=[],i;
for(i=0;i<18;i++){
  PEB.push({x:rnd(10,W-10),rx:rnd(7,26),ry:rnd(2.5,6),dy:rnd(-4,10),o:rnd(.12,.34)});
}
PEB.forEach(function(p){p.el=mk("ellipse",{},pebG);});
var ROCK=[{x:214,s:1.4},{x:1244,s:2.1},{x:818,s:.9},{x:1420,s:1.2},{x:520,s:.7}];
ROCK.forEach(function(r){
  r.el=mk("path",{d:"M -70 6 Q -58 -26 -26 -34 Q 4 -44 34 -30 Q 62 -22 70 6 Z",fill:"url(#ridge)"},rockG);
  r.el.setAttribute("opacity",".9");
});
var VENTX=[.17,.34,.52,.78],vents=[];
VENTX.forEach(function(f){
  var g=mk("g",{},ventG);
  mk("ellipse",{rx:30,ry:6,fill:"#2c1d0e","fill-opacity":".35"},g);
  mk("ellipse",{rx:9,ry:2.6,fill:"#f7e7be","fill-opacity":".8"},g);
  mk("ellipse",{rx:20,ry:5,fill:"#cdefff","fill-opacity":".18","class":"ventglow"},g);
  vents.push({g:g,fx:f});
});
/* distant shrub silhouettes (rock/coral shapes only) */
for(i=0;i<6;i++){
  var sx=rnd(60,W-60);
  mk("path",{d:"M "+sx+" 0 q 6 -34 22 -52 q -4 26 -2 52 z M "+(sx+14)+" 0 q 14 -26 30 -34 q -12 20 -18 34 z",
    fill:"#0a3352",opacity:".35",id:"shrub"+i},farG);
}
/* dust motes */
var DUST=[];
for(i=0;i<24;i++){
  DUST.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.7,2.1),vy:rnd(-7,-1.5),vx:rnd(-4,7),o:rnd(.05,.26),
    el:mk("circle",{r:1,fill:"#e6fbff"},dustG)});
}
/* bubbles */
var BUB=[],NB=13;
function newBubble(b,fresh){
  var v=vents[(Math.random()*vents.length)|0];
  b.bx=W*v.fx+rnd(-9,9);
  b.vy=(Math.random()*6+.5);
  b.x=b.bx;b.y=(fresh?rnd(0,H):ftop(b.bx)+rnd(0,6));
  b.r=rnd(2.6,10.5);
  b.v=30+340/b.r+rnd(-6,6);
  b.ph=rnd(0,6.28);b.w=rnd(4,13);
}
for(i=0;i<NB;i++){var b={el:mk("g",{},bubG)};b.c=mk("circle",{r:1,fill:"url(#bub)",stroke:"#f2fdff","stroke-opacity":".55","stroke-width":.12},b.el);mk("circle",{r:.22,cx:-.34,cy:-.36,fill:"#fff","fill-opacity":".8"},b.el);newBubble(b,true);BUB.push(b);}

/* ---- layout ---- */
function layout(){
  var iw=window.innerWidth||1280, ih=window.innerHeight||720;
  H=Math.max(480,Math.min(2400,Math.round(W*ih/iw)));
  FB=H*.885;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  water.setAttribute("height",H+120);
  vigR.setAttribute("height",H+120);
  pool.setAttribute("cy",-40);
  sand.setAttribute("d",floorD(0,1,PH));
  ridge.setAttribute("d",floorD(-24,1.25,2.9));
  farG.setAttribute("transform","translate(0 "+(FB+14).toFixed(1)+")");
  PEB.forEach(function(p){p.el.setAttribute("cx",p.x.toFixed(1));p.el.setAttribute("cy",(ftop(p.x)+p.dy).toFixed(1));p.el.setAttribute("rx",p.rx.toFixed(1));p.el.setAttribute("ry",p.ry.toFixed(1));p.el.setAttribute("fill-opacity",p.o);});
  ROCK.forEach(function(r){r.el.setAttribute("transform","translate("+r.x+" "+(ftop(r.x)+8).toFixed(1)+") scale("+r.s+")");});
  vents.forEach(function(v){v.g.setAttribute("transform","translate("+(v.fx*W).toFixed(1)+" "+(ftop(v.fx*W)+2).toFixed(1)+")");});
  document.querySelectorAll(".shrub").length;
  fish[0].y=H*.42;fish[1].y=H*.655;
}

/* ---- fish ---- */
var A=$("fishA"),B=$("fishB");
var fish=[
 {g:A,tail:$("tailA"),fin:$("finA"),tx:-78,fx:40,fy:16,s:.78,dir:1,base:34,jit:.28,jf:.5,ph:0,   bf:.42,ba:12,wf:2.2,x:300,boost:1},
 {g:B,tail:$("tailB"),fin:$("finB"),tx:-52,fx:32,fy:8, s:.52,dir:-1,base:112,jit:.5,jf:1.6,ph:2.1,bf:.9,ba:9, wf:7.2,x:1200,boost:1}
];
function drawFish(f,T){
  var sp=f.base*(1+f.jit*Math.sin(T*f.jf+f.ph))*f.boost;
  f.x+=f.dir*sp*DT;
  var span=300;
  if(f.dir>0&&f.x>W+span)f.x=-span;
  if(f.dir<0&&f.x<-span)f.x=W+span;
  var bob=Math.sin(T*f.bf+f.ph)*f.ba;
  f.g.setAttribute("transform","translate("+f.x.toFixed(1)+" "+(f.y+bob).toFixed(1)+") scale("+(f.dir*f.s)+" "+f.s+") rotate("+(Math.sin(T*f.wf*.6+f.ph)*1.6).toFixed(2)+")");
  f.tail.setAttribute("transform","translate("+f.tx+" 0) rotate("+(Math.sin(T*f.wf+f.ph)*13).toFixed(2)+")");
  f.fin.setAttribute("transform","rotate("+(Math.sin(T*f.wf*.8+f.ph)*9).toFixed(2)+" "+f.fx+" "+f.fy+")");
  f.sp=sp;
}
A.addEventListener("pointerenter",function(){fish[0].boost=1.5;});
A.addEventListener("pointerleave",function(){fish[0].boost=1;});
B.addEventListener("pointerenter",function(){fish[1].boost=1.6;});
B.addEventListener("pointerleave",function(){fish[1].boost=1;});

/* ---- pointer light + click bursts ---- */
var px=-9999,py=-9999,lx=-9999,ly=-9999,scale=1;
window.addEventListener("pointermove",function(e){
  scale=W/(window.innerWidth||1280);
  px=e.clientX*scale;py=e.clientY*scale;
});
window.addEventListener("pointerdown",function(e){
  scale=W/(window.innerWidth||1280);
  var x=e.clientX*scale,y=e.clientY*scale;
  var r=mk("circle",{cx:x,cy:y,r:4,strokeWidth:2,opacity:.55},ripG);
  ripples.push({el:r,t:0,x:x,y:y});
  var n=BUB.length,j;
  for(j=0;j<BUB.length&&j<5;j++){
    var b=BUB[(burstIdx++)%n];
    b.bx=x+rnd(-16,16);b.x=b.bx;b.y=y+rnd(-6,10);b.r=rnd(2,7);
    b.v=40+320/b.r;b.ph=rnd(0,6.28);b.w=rnd(5,14);
  }
});
var ripples=[],burstIdx=0;

/* ---- loop ---- */
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var SCALE=RM?.32:1, T=0, last=performance.now(), DT=0.016;

function frame(now){
  DT=Math.min(.05,(now-last)/1000)*SCALE;last=now;T+=DT;

  fish[0].boost+=(1-fish[0].boost)*.03;
  fish[1].boost+=(1-fish[1].boost)*.03;
  drawFish(fish[0],T);drawFish(fish[1],T);

  var k,n=KELP.length;
  for(k=0;k<n;k++){var a=KELP[k];a.el.setAttribute("d",bladeD(a.x,ftop(a.x)+4,H*a.hf,a.amp,a.w,a.ph,T*a.sp));}
  for(k=0;k<FRONT.length;k++){var c=FRONT[k];
    c.el.setAttribute("d",bladeD(c.x,ftop(c.x)+6,H*c.hf,c.amp,c.w,c.ph,T*c.sp)+" "+leavesD(c.x,ftop(c.x)+6,H*c.hf,c.amp,c.w,c.ph,T*c.sp));
  }

  for(k=0;k<BUB.length;k++){
    var b=BUB[k];
    b.y-=b.v*DT;
    if(b.y<-16)newBubble(b,false);
    var xx=b.x+Math.sin(T*1.7+b.ph)*b.w;
    b.el.setAttribute("transform","translate("+xx.toFixed(1)+" "+b.y.toFixed(1)+") scale("+b.r.toFixed(2)+")");
  }

  for(k=0;k<DUST.length;k++){
    var d=DUST[k];
    d.y+=d.vy*DT;d.x+=d.vx*DT;
    if(d.y<-8)d.y=H+8;
    if(d.x<-8)d.x=W+8;if(d.x>W+8)d.x=-8;
    d.el.setAttribute("transform","translate("+d.x.toFixed(1)+" "+d.y.toFixed(1)+")");
    d.el.setAttribute("opacity",d.o*(.6+.4*Math.sin(T*1.1+k)));
  }

  for(k=ripples.length-1;k>=0;k--){
    var r=ripples[k];r.t+=DT;
    var p=r.t/1.1;
    if(p>=1){r.el.parentNode&&r.el.parentNode.removeChild(r.el);ripples.splice(k,1);continue;}
    r.el.setAttribute("r",(6+p*86).toFixed(1));
    r.el.setAttribute("opacity",(.5*(1-p)).toFixed(3));
    r.el.setAttribute("stroke-width",(2.4*(1-p)+.3).toFixed(2));
  }

  lx+=(px-lx)*.07;ly+=(py-ly)*.07;
  spotEl.setAttribute("cx",lx.toFixed(1));spotEl.setAttribute("cy",ly.toFixed(1));

  requestAnimationFrame(frame);
}

layout();
window.addEventListener("resize",layout);
requestAnimationFrame(frame);
})();
</script>
