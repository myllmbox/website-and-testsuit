<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reef Shelf 09 — live bathyscape</title>
<style>
:root{
--dsp:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
--mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#062a45;font-family:var(--mono);color:#dff2fb}
#sea{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
svg text{font-family:var(--mono)}
.tag{opacity:0;transition:opacity .5s ease}
svg.on .fish.lit .tag{opacity:1}
.tt{font-size:18px;letter-spacing:.14em;fill:#f7ecd8}
.lamp{opacity:0;transition:opacity .6s ease}
svg.on .lamp.lit{opacity:1}
.ray{animation:shim var(--d,10s) ease-in-out infinite alternate}
@keyframes shim{from{opacity:.38;transform:translateX(-16px)}to{opacity:.85;transform:translateX(20px)}}
#caustics path{animation:drift var(--d,18s) linear infinite}
@keyframes drift{to{transform:translateX(-260px)}}
#scan{position:fixed;left:0;right:0;top:-140%;height:140%;pointer-events:none;z-index:4;
background:linear-gradient(to bottom,transparent,rgba(190,240,255,.055) 45%,transparent);animation:scan 12s linear infinite}
@keyframes scan{to{top:100%}}
.hud{position:fixed;inset:0;pointer-events:none;z-index:6}
.pnl{background:linear-gradient(rgba(5,30,46,.6),rgba(4,22,36,.72));border:1px solid rgba(190,226,244,.16);
padding:15px 18px 14px;backdrop-filter:blur(4px);box-shadow:0 18px 46px -18px rgba(0,10,20,.85)}
.tl{position:absolute;top:24px;left:26px;max-width:min(420px,86vw)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.28em;color:#ffd9a6}
.live i{width:7px;height:7px;border-radius:50%;background:#ff7a5c;animation:beat 1.9s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,122,92,.55)}70%{box-shadow:0 0 0 9px rgba(255,122,92,0)}100%{box-shadow:0 0 0 0 rgba(255,122,92,0)}}
h1{font-family:var(--dsp);font-weight:400;font-style:italic;font-size:clamp(30px,4.4vw,50px);line-height:.96;
color:#f7ecd8;letter-spacing:-.01em;margin:7px 0 8px;text-shadow:0 3px 22px rgba(0,14,24,.55)}
h1 em{display:block;font-size:.44em;font-style:normal;letter-spacing:.05em;color:#bfe4f2;opacity:.85}
.sub{font-size:9.5px;letter-spacing:.15em;color:#a9d3e6;margin-bottom:12px}
.recs{display:flex;flex-direction:column;gap:6px}
.rec,.hint{pointer-events:auto}
.rec{display:flex;align-items:center;gap:11px;padding:7px 12px 8px 9px;border-left:2px solid var(--acc);
background:rgba(4,26,40,.45);cursor:help;transition:transform .35s cubic-bezier(.2,.8,.3,1),background .35s}
.rec:hover,.rec.lit{transform:translateX(5px);background:rgba(10,48,70,.78)}
.rec b{display:block;font-family:var(--dsp);font-weight:700;font-size:14.5px;color:#f2e7d3}
.rec span{display:block;font-size:9px;letter-spacing:.13em;color:#9ec8dd;margin-top:2px}
.bar{height:2px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.gauge{position:absolute;top:26px;right:26px;display:flex;gap:13px;align-items:flex-start;text-align:right}
.gt{display:block;font-size:8.5px;letter-spacing:.24em;color:#9ec8dd}
.gauge b{font-family:var(--dsp);font-size:27px;color:#f7ecd8;line-height:1.05}
.track{position:relative;width:2px;height:min(40vh,320px);background:linear-gradient(rgba(223,246,255,.42),rgba(223,246,255,.05))}
.track i{position:absolute;left:5px;width:7px;height:1px;background:rgba(223,246,255,.32)}
#marker{position:absolute;left:-6px;top:0;width:14px;height:14px;margin-top:-7px;border-radius:50%;
border:1.5px solid #ffdca8;background:radial-gradient(circle at 34% 30%,#fff,#ffcf95);
box-shadow:0 0 14px rgba(255,200,140,.55);transition:top .18s cubic-bezier(.2,.8,.3,1)}
.hint{position:absolute;right:26px;bottom:24px;font-size:9px;letter-spacing:.24em;color:#bfe4f2;opacity:.5;transition:opacity .3s}
.hint:hover{opacity:1}
@media(max-width:700px){.gauge{display:none}.pnl{padding:12px 13px}.bar{display:none}}
@media (prefers-reduced-motion:reduce){.ray,#caustics path,#scan,.live i{animation:none}}
</style>
</head>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg", svg=document.getElementById("sea");
function $(i){return document.getElementById(i);}
function rnd(a,b){return a+Math.random()*(b-a);}
function E(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
var fishL=$("fishLayer"), bubL=$("bubLayer");

/* --- two fish: bodies, tails, fins, one eye, mouths --- */
fishL.innerHTML=
'<g class="fish" id="fA">'+
 '<g class="tail"><path d="M-64 0 L-152 -46 L-126 0 L-152 46 Z" fill="#e07a35" stroke="#8f3b17" stroke-width="2.5" stroke-linejoin="round"/></g>'+
 '<path d="M-28 -44 C -12 -92 32 -88 54 -54 C 26 -62 -4 -56 -28 -44 Z" fill="#f0993f" stroke="#9a4620" stroke-width="2.2"/>'+
 '<path d="M-22 46 C -8 76 18 74 32 50 C 8 58 -6 54 -22 46 Z" fill="#ee8f38" stroke="#9a4620" stroke-width="2"/>'+
 '<ellipse rx="72" ry="57" fill="url(#gA)" stroke="#8f3b17" stroke-width="3"/>'+
 '<path d="M-38 -38 C -28 -14 -28 16 -38 40 M-10 -50 C 2 -20 2 22 -10 50 M18 -48 C 30 -18 30 20 18 48" fill="none" stroke="#fff1d6" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>'+
 '<path class="pec" d="M10 8 C -16 22 -10 48 20 32 C 26 24 24 12 10 8 Z" fill="#f7b25e" stroke="#a4521f" stroke-width="2"/>'+
 '<circle cx="42" cy="-18" r="13" fill="#fffaf0" stroke="#8f3b17" stroke-width="1.8"/>'+
 '<circle class="pupil" cx="45" cy="-17" r="6" fill="#221208"/>'+
 '<circle cx="48" cy="-22" r="2.3" fill="#fff" opacity=".9"/>'+
 '<path d="M64 -2 q 11 8 3 17" fill="none" stroke="#8f3b17" stroke-width="3.6" stroke-linecap="round"/>'+
 '<g class="tag"><rect x="-152" y="-142" width="300" height="34" rx="4" fill="#06222f" opacity=".62"/>'+
 '<text class="tt" x="-2" y="-119" text-anchor="middle">SPECIMEN A / COPPER</text></g>'+
'</g>'+
'<g class="fish" id="fB">'+
 '<g class="tail"><path d="M-46 0 L-104 -30 L-84 0 L-104 30 Z" fill="#63b9cf" stroke="#1b5e78" stroke-width="2.4" stroke-linejoin="round"/></g>'+
 '<path class="fin" d="M-14 -12 L6 -34 L28 -9 Z" fill="#7ccfe0" stroke="#1b5e78" stroke-width="1.8"/>'+
 '<path class="fin" d="M-26 11 L-12 30 L6 11 Z" fill="#6ec3da" stroke="#1b5e78" stroke-width="1.6"/>'+
 '<path class="body" d="M64 0 C 44 -20 -8 -24 -50 -12 C -58 -8 -58 8 -50 12 C -8 24 44 20 64 0 Z" fill="url(#gB)" stroke="#1b5e78" stroke-width="2.4"/>'+
 '<path d="M-42 -3 C -14 -12 16 -13 46 -4" stroke="#0f4a63" stroke-width="4.5" stroke-opacity=".45" fill="none" stroke-linecap="round"/>'+
 '<path class="pec" d="M8 5 C -8 12 -4 27 17 20 C 21 14 19 7 8 5 Z" fill="#b7eaf2" stroke="#1b5e78" stroke-width="1.6"/>'+
 '<circle cx="41" cy="-4" r="7.2" fill="#fffaf0" stroke="#1b5e78" stroke-width="1.4"/>'+
 '<circle class="pupil" cx="43" cy="-4" r="3.3" fill="#113242"/>'+
 '<path d="M56 2 q 7 5 9 -4" fill="none" stroke="#1b5e78" stroke-width="2.6" stroke-linecap="round"/>'+
 '<g class="tag" transform="scale(-1,1)"><rect x="-146" y="-104" width="292" height="32" rx="4" fill="#06222f" opacity=".62"/>'+
 '<text class="tt" x="0" y="-82" text-anchor="middle">SPECIMEN B / SILVER</text></g>'+
'</g>';

 mkFish("fB",478,.85,-1,-138,15,1.05,13,13,{x:-46,y:0},{x:8,y:5},{x:43,y:-4})
];

/* --- sand grain --- */

 E("path",{d:"M"+sx.toFixed(1)+" "+sy.toFixed(1)+" l"+sw.toFixed(1)+" 0",stroke:["#5b4028","#f2dcae","#8a6a45"][i%3],

/* --- seaweed: wavy stroked paths, re-solved every frame --- */
var kelpB=$("kelpB"), kelpF=$("kelpF"), K=[];
function addKelp(x,y,h,w,n,ph,sp,amp,fg,skew){
  var g=E("g",{filter:fg?"url(#blurFg)":null},fg?kelpF:kelpB);

addKelp(1452,804,214,13,8,1.1,.6,38,0,-26);
addKelp(1524,814,300,17,9,2.3,.48,54,0,28);
addKelp(110,930,540,32,9,.9,.42,110,1,-52);
addKelp(1520,940,600,38,10,2.6,.36,126,1,60);

/* --- bubbles: continuous rise + respawn at vents --- */
var vents=[{x:150,j:70,y:804},{x:645,j:56,y:796},{x:905,j:44,y:790},{x:1452,j:80,y:806},{x:1122,j:48,y:800}],
    bub=[], burst=0, MAX=18;
function size(b){
  b.g.setAttribute("opacity",(0.42+Math.random()*0.5).toFixed(2));
  b.c.setAttribute("r",b.r.toFixed(2));
  b.c.setAttribute("stroke-width",(.5+b.r*.05).toFixed(2));
  var h=b.g.lastChild, r=b.r*.22;
  h.setAttribute("r",r.toFixed(2));h.setAttribute("cx",(-b.r*.34).toFixed(2));h.setAttribute("cy",(-b.r*.38).toFixed(2));
  b.g.setAttribute("transform","translate("+b.x.toFixed(1)+" "+b.y.toFixed(1)+")");
}
function mkBub(x,y){
  var g=E("g",{},bubL);
  var c=E("circle",{fill:"url(#bub)",stroke:"rgba(255,255,255,.5)","stroke-width":.8},g);
  E("circle",{fill:"#fff",opacity:.75},g);
  var b={g:g,c:c,r:rnd(2.2,9.5),x:x,y:y,ph:rnd(0,6.28),wob:rnd(4,20),s:rnd(.6,1.3)};
  size(b); bub.push(b); return b;
}
function ventBub(){var v=vents[(Math.random()*vents.length)|0];return mkBub(v.x+rnd(-v.j/2,v.j/2),v.y-rnd(0,24));}
for(i=0;i<MAX;i++){var b0=ventBub();b0.y=rnd(-20,880);}

/* --- pointer: lamp, parallax, depth gauge --- */
var lamp=$("lamp"),far=$("far"),mid=$("mid"),pt=svg.createSVGPoint();
var lx=800,ly=320,lxp=800,lyp=320,tx=0,ty=0,cx=0,cy=0,depthEl=$("depth"),mark=$("marker");
function toSvg(e){pt.x=e.clientX;pt.y=e.clientY;var m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:800,y:400};}
addEventListener("pointermove",function(e){
  var p=toSvg(e);lxp=p.x;lyp=p.y;
  tx=(e.clientX/innerWidth-.5)*2; ty=(e.clientY/innerHeight-.5)*2;
  var r=e.clientY/innerHeight;
  depthEl.textContent=(8.6+r*22.4).toFixed(1);
  mark.style.top=(r*100).toFixed(2)+"%";
},{passive:true});
addEventListener("pointerdown",function(e){
  if(e.target&&e.target.closest&&e.target.closest(".rec,.hint"))return;
  var p=toSvg(e);burst+=6;
  for(var k=0;k<7;k++){var b=mkBub(p.x+rnd(-18,18),p.y+rnd(-12,12));b.y+=rnd(0,26);}
});
$("rA").addEventListener("mouseenter",function(){lamp.classList.add("lit");fishes[0].g.classList.add("lit");});
$("rA").addEventListener("mouseleave",function(){lamp.classList.remove("lit");fishes[0].g.classList.remove("lit");});
$("rB").addEventListener("mouseenter",function(){lamp.classList.add("lit");fishes[1].g.classList.add("lit");});
$("rB").addEventListener("mouseleave",function(){lamp.classList.remove("lit");fishes[1].g.classList.remove("lit");});

/* --- main loop --- */
var bars=[$("f1"),$("f2")], last=performance.now(), acc=0;
function loop(now){
  var dt=Math.min(.05,(now-last)/1000); last=now; var t=now/1000;
  cx+=(tx-cx)*Math.min(1,dt*3); cy+=(ty-cy)*Math.min(1,dt*3);
  far.setAttribute("transform","translate("+(-cx*20).toFixed(1)+" "+(-cy*8).toFixed(1)+")");
  mid.setAttribute("transform","translate("+(-cx*44).toFixed(1)+" "+(-cy*12).toFixed(1)+")");
  lamp.setAttribute("cx",lxp.toFixed(1)); lamp.setAttribute("cy",lyp.toFixed(1));

  for(var i=0;i<2;i++){var f=fishes[i];
    f.x+=f.v*dt;
    if(f.x>1900)f.x=-300; else if(f.x<-300)f.x=1900;
    var bobv=Math.sin(t*f.bob+f.ph), y=f.by+bobv*f.amp;
    f.el.setAttribute("transform","translate("+f.x.toFixed(1)+" "+y.toFixed(1)+") scale("+(f.s*f.dir)+" "+f.s+") rotate("+(bobv*2.4*f.dir).toFixed(2)+")");
    var a=Math.sin(t*f.fl+f.ph)*f.sw;
    f.tail.setAttribute("transform","rotate("+a.toFixed(2)+" "+f.tp.x+" "+f.tp.y+")");
    f.pec.setAttribute("transform","rotate("+(-a*.62).toFixed(2)+" "+f.pp.x+" "+f.pp.y+")");
    f.pupil.setAttribute("cx",(f.ep.x+Math.sin(t*.6+f.ph)*2.2).toFixed(2));
  }
  for(i=0;i<K.length;i++){var k=K[i],d,bi,j,p,px2,x;
    for(bi=0;bi<k.blades.length;bi++){var bl=k.blades[bi];d="M0 0";
      for(j=1;j<=k.n;j++){p=j/k.n;x=(Math.sin(t*k.sp+p*2.7+k.ph)*bl.a*p*p+bl.o*p);d+=" L"+x.toFixed(1)+" "+(-bl.h*p).toFixed(1);}
      bl.d.setAttribute("d",d);}
  }
  for(i=bub.length-1;i>=0;i--){var bb=bub[i];
    bb.y-=(26+92/bb.r)*bb.s*dt;
    if(bb.y<-26){ if(bub.length<=MAX){ bb.r=rnd(2.2,9.5); var v=vents[(Math.random()*vents.length)|0];
        bb.x=v.x+rnd(-v.j/2,v.j/2); bb.y=v.y-rnd(0,24); bb.wob=rnd(4,20); bb.s=rnd(.6,1.3); size(bb);}
      else { bb.g.remove(); bub.splice(i,1); }
      continue;}
    bb.g.setAttribute("transform","translate("+(bb.x+Math.sin(bb.y*.02+bb.ph)*bb.wob).toFixed(1)+" "+bb.y.toFixed(1)+")");
  }
  if(bub.length>MAX+burst){bub.shift().g.remove(); if(burst>0)burst--;}
  var md="";
  for(i=0;i<motes.length;i++){var m=motes[i];m.y-=m.v*dt; if(m.y<-24){m.y=924;m.x=Math.random()*1600;} md+="M"+m.x.toFixed(1)+" "+m.y.toFixed(1);}
  moteP.setAttribute("d",md);
  acc+=dt;
  if(acc>.16){acc=0;
    for(i=0;i<2;i++){var pc=fishes[i].x/1600*100; bars[i].style.width=Math.max(0,Math.min(100,pc)).toFixed(1)+"%";}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
requestAnimationFrame(function(){svg.classList.add("on");});
})();
</script>
</body>
