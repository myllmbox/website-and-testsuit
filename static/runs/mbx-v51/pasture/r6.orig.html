<!DOCTYPE html>
<html lang="en">
<head>

<title>Pasture</title>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#d8f0fb}
svg{display:block;width:100%;height:100%}
.shadow{transform-box:fill-box;transform-origin:50% 50%}
@keyframes shd{0%,100%{transform:scale(1);opacity:.22}50%{transform:scale(.82,.66);opacity:.11}}
@keyframes hop12{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes hop14{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes hop16{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.18)}}
.wg{transform-box:fill-box;transform-origin:0% 50%;animation:flap .16s ease-in-out infinite alternate}
.wg.a{transform-origin:100% 50%}
.wg.b{animation-delay:-.08s}
</style>
</head>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("scene");
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
var W=1200,H=800,horizon=520,gh=280,seed=20240611;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}

var hills=document.querySelectorAll(".hill");
var HILLS=[[18,300,72],[54,340,56],[88,290,82]];
var TREES=[[0.055,0.30,1.25,"7.2s","-1s"],[0.955,0.55,1.55,"8.6s","-3.4s"],[0.55,0.09,0.62,"6.1s","-2.2s"]];
var SHAPES=[
[[-50,8,32,20],[-14,-6,38,26],[26,2,30,21],[54,12,22,15],[-2,15,50,13]],
[[-42,7,29,18],[-8,-9,35,24],[26,4,27,18],[50,13,20,13],[-4,16,42,12]]
];
var CLOUDS=[{s:1.0,y:0.22,v:9,x:0.14},{s:0.72,y:0.44,v:13.5,x:0.55},{s:1.22,y:0.10,v:6.5,x:0.82},{s:0.85,y:0.56,v:11,x:0.34},{s:0.58,y:0.66,v:16,x:0.68}];
var clouds=[];
var BLADE="M0,0C-2,-8 -6,-13 -10,-16C-5,-13 -2,-7 -1,0Z M0,0C0,-9 1,-16 2,-22C4,-15 3,-7 3,0Z M2,0C6,-7 11,-11 15,-13C10,-9 6,-4 5,0Z";
var TUFTS=["#3d8531","#4a9a3c","#57ad47","#367a2c"];
var FLOWER=["#fdfef4","#ffe36b","#f79ec0","#ffffff"];

function makeClouds(){
  var g=document.getElementById("clouds");
  while(g.firstChild)g.removeChild(g.firstChild);
  clouds.length=0;
  CLOUDS.forEach(function(c,i){
    var outer=el("g",{},g);
    var inner=el("g",{},outer);
    var puffs=SHAPES[i%SHAPES.length], last=puffs.length-1;
    puffs.forEach(function(p,j){
      var a={cx:p[0],cy:p[1],rx:p[2],ry:p[3],fill:j===last?"#e2eff9":"#ffffff"};
      if(j===last)a.opacity=".6";
      el("ellipse",a,inner);
    });
    clouds.push({el:outer,inner:inner,cfg:c,x:0,y:0,hw:0,ph:i*1.7});
  });
}
makeClouds();

function makeTree(dur,phase){
  var g=el("g",{});
  el("ellipse",{cx:6,cy:4,rx:44,ry:11,fill:"#245f17",opacity:".22"},g);
  var sw=el("g",{},g);
  el("path",{d:"M-7,3 C-9,-26 -4,-48 -6,-74 L7,-74 C10,-48 8,-26 11,3 Z",fill:"url(#trunkG)"},sw);
  el("path",{d:"M-6,-46 C-16,-52 -22,-60 -26,-70",stroke:"#7b4f2a","stroke-width":4,fill:"none","stroke-linecap":"round"},sw);
  el("path",{d:"M7,-56 C16,-62 22,-68 26,-76",stroke:"#7b4f2a","stroke-width":3.5,fill:"none","stroke-linecap":"round"},sw);
  [[0,-100,40,"#4f9a45"],[-34,-80,29,"#5cab4f"],[32,-84,27,"#438a3c"],[-12,-126,25,"#66b957"],[22,-112,22,"#57a44a"],[-4,-66,26,"#3d7d35"]].forEach(function(p){el("circle",{cx:p[0],cy:p[1],r:p[2],fill:p[3]},sw);});
  el("circle",{cx:-18,cy:-116,r:11,fill:"#7ec96a",opacity:".5"},sw);
  el("circle",{cx:20,cy:-96,r:9,fill:"#7ec96a",opacity:".42},sw);
  el("animateTransform",{attributeName:"transform",type:"rotate",values:"-1.4 0 0;1.4 0 0;-1.4 0 0",keyTimes:"0;0.5;1",dur:dur,begin:phase,repeatCount:"indefinite",calcMode:"spline",keySplines:"0.45 0 0.55 1;0.45 0 0.55 1"},sw);
  return g;
}
var treeEls=TREES.map(function(t){var g=makeTree(t[3],t[4]);document.getElementById("trees").appendChild(g);return g;});

function makeStuff(){
  var ground=document.getElementById("ground"), fore=document.getElementById("fore"), fence=document.getElementById("fence");
  while(ground.firstChild)ground.removeChild(ground.firstChild);
  while(fence.firstChild)fence.removeChild(fence.firstChild);
  seed=20240611;
  var i,step=30,cnt=Math.round(W/step);
  for(i=-1;i<=cnt;i++){
    var px=i*step+rnd()*10;
    el("rect",{x:px-3,y:horizon-16,width:6,height:38,rx:2,fill:"#a5763f"},fence);
    el("rect",{x:px-4,y:horizon-17,width:8,height:4,rx:2,fill:"#c08f56"},fence);
    el("ellipse",{cx:px,cy:horizon+22,rx:9,ry:3,fill:"#3c8a2e",opacity:".55"},fence);
  }
  el("rect",{x:0,y:horizon-9,width:W,height:5,rx:2,fill:"#b78a55"},fence);
  el("rect",{x:0,y:horizon+4,width:W,height:4.5,rx:2,fill:"#a5763f"},fence);
  for(i=0;i<74;i++){
    var d=rnd(), y=horizon+8+d*gh*0.9, x=rnd()*W, k=0.5+d*1.25;
    var g=el("g",{transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+") scale("+k.toFixed(2)+")"},ground);
    el("path",{d:BLADE,fill:TUFTS[i%4],opacity:(0.6+d*0.4).toFixed(2)},g);
  }
  for(i=0;i<24;i++){
    var df=rnd(), yf=horizon+34+df*gh*0.84, xf=rnd()*W, kf=0.7+df*0.95;
    var gf=el("g",{transform:"translate("+xf.toFixed(1)+","+yf.toFixed(1)+") scale("+kf.toFixed(2)+")"},ground);
    el("path",{d:"M0,0 C1,-7 2,-12 1,-17",stroke:"#3a7f2c","stroke-width":2,fill:"none","stroke-linecap":"round"},gf);
    var col=FLOWER[i%4];
    el("circle",{cx:1,cy:-22,r:3.3,fill:col},gf);
    el("circle",{cx:-4,cy:-19,r:3,fill:col},gf);
    el("circle",{cx:6,cy:-19,r:3,fill:col},gf);
    el("circle",{cx:1,cy:-17,r:2.5,fill:"#ffcf46"},gf);
  }
}

function layout(){
  W=Math.max(320,window.innerWidth);H=Math.max(320,window.innerHeight);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  horizon=Math.round(H*0.65);gh=H-horizon;
  document.getElementById("hline").setAttribute("y",horizon-2);
  var s=Math.min(Math.max(Math.min(W/1460,H/900),0.42),1.25);
  document.getElementById("sun").setAttribute("transform","translate("+(W*0.84).toFixed(0)+","+(H*0.145).toFixed(0)+") scale("+Math.min(1.1,Math.max(0.55,s*1.05)).toFixed(2)+")");
  for(var i=0;i<hills.length;i++){
    hills[i].setAttribute("rx",(W*HILLS[i][1]/1200).toFixed(0));
    hills[i].setAttribute("ry",(HILLS[i][2]*Math.max(0.65,s)).toFixed(0));
    hills[i].setAttribute("cx",HILLS[i][0]+"%");
  }
  treeEls.forEach(function(g,i){
    var t=TREES[i];
    g.setAttribute("transform","translate("+(W*t[0]).toFixed(1)+","+(horizon+gh*t[1]).toFixed(1)+") scale("+(s*t[2]).toFixed(3)+")");
  });
  var animals=document.querySelectorAll(".animal");
  for(var j=0;j<animals.length;j++){
    var a=animals[j],fx=parseFloat(a.getAttribute("data-fx")),row=parseFloat(a.getAttribute("data-row"));
    a.setAttribute("transform","translate("+(W*fx).toFixed(1)+","+(horizon+gh*row).toFixed(1)+")");
    var scs=a.querySelectorAll(".sc");
    for(var k=0;k<scs.length;k++)scs[k].setAttribute("transform","scale("+s.toFixed(3)+")");
  }
  var cs=Math.min(1.15,Math.max(0.5,W/1350));
  clouds.forEach(function(c){
    c.inner.setAttribute("transform","scale("+(c.cfg.s*cs).toFixed(3)+")");
    c.hw=86*c.cfg.s*cs;
    var range=W+2*c.hw+140;
    c.x=c.cfg.s?(-c.hw-60+c.cfg.x*range):0;
    c.y=horizon*c.cfg.y;
  });
  document.getElementById("fly").setAttribute("transform","translate("+(W*0.1).toFixed(0)+","+(horizon+gh*0.42).toFixed(0)+") scale("+Math.max(0.7,s*1.05).toFixed(2)+")");
  makeStuff();
}
layout();

var last=0;
function frame(t){
  var dt=last?Math.min(0.06,Math.max(0,(t-last)/1000)):0;
  last=t;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    c.x+=c.cfg.v*dt;
    if(c.x-c.hw>W+70)c.x=-c.hw-70;
    var y=c.y+Math.sin(t/2600+c.ph)*5;
    var rot=Math.sin(t/3400+c.ph)*1.6;
    c.el.setAttribute("transform","translate("+c.x.toFixed(1)+","+y.toFixed(1)+") rotate("+rot.toFixed(2)+")");
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

var rt=null;
window.addEventListener("resize",function(){if(rt)clearTimeout(rt);rt=setTimeout(layout,90);});
})();
</script>
</body>
</html>
