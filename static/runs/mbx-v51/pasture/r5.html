<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouncing Pasture</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaf7}
#stage{display:block;width:100vw;height:100vh}
.bnc,.shd{animation-iteration-count:infinite;animation-direction:alternate;
  animation-timing-function:cubic-bezier(.42,0,.58,1)}
.shd{opacity:.2}
.a1 .bnc,.a1 .shd{animation-duration:.94s;animation-delay:-.62s}
.a2 .bnc,.a2 .shd{animation-duration:.80s;animation-delay:-.27s}
.a3 .bnc,.a3 .shd{animation-duration:.62s;animation-delay:-.10s}
.a4 .bnc,.a4 .shd{animation-duration:.55s;animation-delay:-.38s}
.a1 .bnc{animation-name:hopA}.a2 .bnc{animation-name:hopB}
.a3 .bnc{animation-name:hopC}.a4 .bnc{animation-name:hopD}
.bnc,.shd{animation-name:none}
.a1 .shd,.a2 .shd,.a3 .shd,.a4 .shd{animation-name:shd}
@keyframes hopA{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes hopB{from{transform:translateY(0)}to{transform:translateY(-13px)}}
@keyframes hopC{from{transform:translateY(0)}to{transform:translateY(-18px)}}
@keyframes hopD{from{transform:translateY(0)}to{transform:translateY(-15px)}}
@keyframes shd{from{opacity:.22}to{opacity:.10}}
@keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
#halo{animation:glow 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bnc{animation:none}}
</style>
</head>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var stage=document.getElementById("stage");
function el(t,a){var e=document.createElementNS(NS,t);if(a)for(var k in a)e.setAttribute(k,a[k]);return e;}
function P(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function smil(vals,dur,begin){
  var a=el("animateTransform",{attributeName:"transform",type:"rotate",
    values:vals,dur:dur,repeatCount:"indefinite",calcMode:"spline",
    keyTimes:"0;0.5;1",keySplines:".4 0 .6 1;.4 0 .6 1"});
  if(begin)a.setAttribute("begin",begin);
  return a;
}

/* ---------- sun rays ---------- */
var rays=P("rays");
for(var i=0;i<12;i++){
  rays.appendChild(el("path",{d:"M-5,-64 L5,-64 L0,-98 Z",transform:"rotate("+(i*30)+")"}));
}
rays.appendChild(smil("0;360","120s"));

/* ---------- clouds ---------- */
var SHAPE=[[0,0,36,24],[-34,8,26,18],[32,7,25,17],[-10,-16,26,21],[18,-12,21,17],[-56,13,17,12],[56,14,15,11]];
var DEFS=[[.18,.10,1.05,11],[.55,.20,.72,17],[.82,.33,1.3,8],[.04,.44,.6,21],[.40,.56,.9,13]];
var cloudLayer=P("clouds"), clouds=[];
DEFS.forEach(function(d){
  var g=el("g",{opacity:".95"});
  g.appendChild(el("ellipse",{cx:-6,cy:13,rx:58,ry:13,fill:"#dfeaf2"}));
  SHAPE.forEach(function(c){g.appendChild(el("ellipse",{cx:c[0],cy:c[1],rx:c[2],ry:c[3]}));});
  cloudLayer.appendChild(g);
  clouds.push({g:g,u:d[0],fy:d[1],s:d[2],v:d[3],x:0,y:0});
});

/* ---------- trees ---------- */
var treeLayer=P("trees"), treeDefs=[], TK=[[.07,660,.92,6.2,0],[.9,614,.7,7.1,"-2.4s"],[.63,600,.5,5.6,"-1.1s"]];
function makeTree(k,dur,begin){
  var g=el("g");
  g.appendChild(el("ellipse",{cx:0,cy:0,rx:58,ry:11,fill:"#1f5622",opacity:".25"}));
  g.appendChild(el("path",{d:"M-9,2 L-5,-74 L5,-74 L9,2 Z",fill:"url(#barkG)"}));
  g.appendChild(el("path",{d:"M-4,-56 q-18,-9 -26,-24",stroke:"#6a4326","stroke-width":6,fill:"none","stroke-linecap":"round"}));
  g.appendChild(el("path",{d:"M4,-64 q16,-7 24,-20",stroke:"#6a4326","stroke-width":5,fill:"none","stroke-linecap":"round"}));
  var sw=el("g");
  var cn=el("g",{fill:"url(#leafG)"});
  [[-30,-92,32],[26,-96,30],[0,-118,38],[-16,-78,26],[18,-74,24],[4,-102,30]].forEach(function(c){
    cn.appendChild(el("circle",{cx:c[0],cy:c[1],r:c[2]}));});
  var hi=el("g",{fill:"#95d16c",opacity:".5"});
  [[-20,-126,16],[8,-138,13],[-36,-102,11]].forEach(function(c){
    hi.appendChild(el("circle",{cx:c[0],cy:c[1],r:c[2]}));});
  cn.appendChild(hi);
  sw.appendChild(cn); sw.appendChild(smil("-1.8 0 -70;1.8 0 -70;-1.8 0 -70",dur,begin));
  g.appendChild(sw);
  return g;
}
TK.forEach(function(t){
  var g=makeTree(t[2],t[3]+"s",t[4]);
  treeLayer.appendChild(g);
  treeDefs.push({g:g,u:t[0],y:t[1],s:t[2]});
});

/* ---------- grass decor ---------- */
function makeTuft(far){
  var g=el("g",{stroke:far?"#7cc268":"#357d33","stroke-width":2.2,fill:"none","stroke-linecap":"round",opacity:far?".75":".55"});
  g.appendChild(el("path",{d:"M0,0 C1,-6 4,-9 6,-14"}));
  g.appendChild(el("path",{d:"M0,0 C-1,-6 -4,-10 -7,-13"}));
  g.appendChild(el("path",{d:"M0,0 C0,-7 1,-11 2,-17"}));
  return g;
}
function makeFlower(){
  var g=el("g");
  [[0,-6,2.6],[5.2,-1.6,2.6],[3.2,4.6,2.6],[-3.2,4.6,2.6],[-5.2,-1.6,2.6]].forEach(function(p){
    g.appendChild(el("circle",{cx:p[0],cy:p[1],r:p[2],fill:"#fffaf2"}));});
  g.appendChild(el("circle",{cx:0,cy:0,r:2.1,fill:"#ffca3a"}));
  return g;
}
var decorFar=P("decorFar"), decorNear=P("decorNear"), decor=[];
function rnd(a,b){return a+Math.random()*(b-a);}
for(var j=0;j<52;j++){
  var far=j<40;
  var y=far?rnd(596,848):rnd(862,896);
  var s=0.45+(y-585)/320*0.95;
  var node=(Math.random()<.22)?makeFlower():makeTuft(far);
  (far?decorFar:decorNear).appendChild(node);
  decor.push({g:node,u:Math.random(),y:y,s:s});
}

/* ---------- animals ---------- */
var slots=[].slice.call(document.querySelectorAll(".slot"));
var meta=slots.map(function(g){return {g:g,x0:+g.getAttribute("data-x0"),x1:+g.getAttribute("data-x1")};});
meta.forEach(function(m){m.w=m.x1-m.x0;});
var animals=P("animals");

/* ---------- layout ---------- */
var W=1600, RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function place(id,w){var e=P(id);if(e)e.setAttribute("width",w);}
function scaleX(id,w){var e=P(id);if(e)e.setAttribute("transform","scale("+(w/1600)+",1)");}

function layout(){
  var vw=window.innerWidth||1200, vh=window.innerHeight||700;
  W=900*vw/vh;
  W=clamp(W,120,20000);
  stage.setAttribute("viewBox","0 0 "+W+" 900");
  place("sky",W); place("grass",W); place("hazy",W);
  scaleX("hillFar",W); scaleX("hillNear",W); scaleX("hzline",W);

  /* sun */
  var ss=clamp(Math.min(W/1500,1),.4,1.05);
  var sx=W-30-96*ss, sy=40+118*ss;
  P("sun").setAttribute("transform","translate("+sx.toFixed(1)+","+sy.toFixed(1)+") scale("+ss.toFixed(3)+")");

  /* decor + trees */
  decor.forEach(function(d){
    d.g.setAttribute("transform","translate("+(d.u*W).toFixed(1)+","+d.y.toFixed(1)+") scale("+d.s.toFixed(2)+")");
  });
  treeDefs.forEach(function(t){
    t.g.setAttribute("transform","translate("+(t.u*W).toFixed(1)+","+t.y+") scale("+t.s.toFixed(2)+")");
  });

  /* clouds rest positions */
  clouds.forEach(function(c){
    c.y=c.fy*585;
    c.x=clamp(c.x,c.s*(-72),W+c.s*72);
  });

  /* animals */
  var single=W>=1100;
  var rows=single?[[0,1,2,3]]:[[2,3],[0,1]];
  var baseY=single?[852]:[706,852];
  var rowS=single?[1]:[.72,1];
  rows.forEach(function(row,ri){
    var sum=0; row.forEach(function(ix){sum+=meta[ix].w;});
    var n=row.length;
    var margin=Math.min(60,.06*W), minGap=55;
    var s=Math.min(1.02,(W-2*margin-(n-1)*minGap)/sum);
    s=Math.max(.14,s)*rowS[ri];
    var gap=Math.max(minGap,(W-2*margin-sum*s)/Math.max(1,n-1));
    var cursor=margin, y=baseY[ri];
    row.forEach(function(ix){
      var m=meta[ix];
      var ox=cursor-m.x0*s;
      m.g.setAttribute("transform","translate("+ox.toFixed(1)+","+y+") scale("+s.toFixed(3)+")");
      cursor+=m.w*s+gap;
      animals.appendChild(m.g);
    });
    decorNear.parentNode.insertBefore(0,0); /* no-op guard */
  });
}

/* ---------- cloud drift ---------- */
var last=0;
function tick(t){
  if(!last)last=t;
  var dt=Math.min(.05,(t-last)/1000); last=t;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i], hw=c.s*72;
    c.x+=c.v*dt*(RM?.2:1);
    if(c.x-hw>W)c.x=-hw;
    else if(c.x+hw<-4)c.x=W+hw;
    var bob=Math.sin(t*0.00018+i*1.7)*4*c.s;
    c.g.setAttribute("transform","translate("+c.x.toFixed(1)+","+(c.y+bob).toFixed(1)+") scale("+c.s+")");
  }
  requestAnimationFrame(tick);
}

layout();
window.addEventListener("resize",layout,false);
requestAnimationFrame(tick);
})();
</script>
