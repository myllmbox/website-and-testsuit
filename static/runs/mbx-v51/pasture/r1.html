<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paddock Four — a bouncing pasture</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec7e6}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#scene{display:block;width:100vw;height:100vh}

/* ---------- shared pivots ---------- */
.hop,.sh,.la,.lb,.swish,.head,.cr,.bl,.flap,.rays,.pg,.lift{transform-box:fill-box;transform-origin:50% 50%}
/* ---------- keyframes ---------- */
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes squish{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(.8,.55);opacity:.1}}
@keyframes swing{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-3.5deg)}}
@keyframes nod{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
@keyframes swish{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(11deg)}}
@keyframes sway{0%{transform:rotate(-1.8deg)}100%{transform:rotate(1.8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.07);opacity:.75}}
@keyframes flap{from{transform:scaleY(.45)}to{transform:scaleY(1.2)}}
/* ---------- applied ---------- */
.hop{animation:hop var(--d,.9s) cubic-bezier(.42,0,.58,1) infinite;animation-delay:var(--e,0s)}
.sh{animation:squish var(--d,.9s) cubic-bezier(.42,0,.58,1) infinite;animation-delay:var(--e,0s)}
.la,.lb{animation:swing var(--d,1.05s) ease-in-out infinite;transform-origin:50% 6%}
.lb{animation-delay:calc(var(--d,1.05s)/-2)}
.head{animation:nod var(--d,2.6s) ease-in-out infinite;transform-origin:50% 92%}
.swish{animation:swish var(--s,1.4s) ease-in-out infinite;transform-origin:50% 4%}
.cr,.bl{transform-origin:50% 100%;animation-name:sway;animation-direction:alternate;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.rays{animation:spin 110s linear infinite}
.pg{animation:pulse 6.5s ease-in-out infinite}
.flap{animation:flap .38s ease-in-out infinite alternate}

/* ---------- animals ---------- */
#scene .sh{fill:#17512a;opacity:.2}
.crit{cursor:pointer}
.lift{transition:transform .3s cubic-bezier(.2,.8,.25,1),filter .3s;transform-origin:50% 100%}
.crit:hover .lift,.crit.on .lift{transform:scale(1.055);filter:drop-shadow(0 0 10px rgba(255,247,192,.95))}
.crit:hover .hop,.crit.on .hop,.crit:hover .sh,.crit.on .sh{animation-duration:calc(var(--d,.9s)*.55)}
.tag{opacity:0;transition:opacity .24s ease}
.tagIn{transform:translateY(9px);transition:transform .3s cubic-bezier(.2,.8,.25,1)}
.crit:hover .tagIn,.crit.on .tagIn{transform:translateY(0)}
.tag rect{fill:#1c3f22;stroke:rgba(255,255,255,.22);stroke-width:1.5}
.tag text{fill:#f2ffe9;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:19px;font-weight:700;letter-spacing:.16em;text-anchor:middle}

/* ---------- chrome ---------- */
.hud{position:fixed;left:clamp(14px,2.4vw,36px);bottom:clamp(14px,2.4vw,34px);max-width:min(56vw,470px);
 background:#1a3d23;border-left:5px solid #ffd75e;padding:12px 22px 16px 18px;color:#eefbe9;
 box-shadow:0 16px 34px -14px rgba(8,30,13,.8);border-radius:2px 16px 16px 2px}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#ffd75e}
h1{margin:3px 0 7px;font-family:"Didot","Bodoni MT","Playfair Display",Georgia,serif;font-weight:400;
 font-size:clamp(30px,4.6vw,56px);line-height:.92;letter-spacing:-.015em}
.lead{margin:0;font-size:13.5px;line-height:1.55;color:#c4e2c0;max-width:35ch}
.roster{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.roster button{display:flex;align-items:center;gap:7px;font:inherit;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
 color:#eefbe9;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);padding:5px 12px 5px 8px;border-radius:999px;
 cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.25,1),background .2s,color .2s}
.roster i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.roster button:hover,.roster button:focus-visible,.roster button.on{background:#ffd75e;color:#1f351e;transform:translateY(-3px);outline:none}
.hush{position:fixed;right:clamp(14px,2.4vw,34px);bottom:clamp(14px,2.4vw,34px);font:inherit;font-size:11.5px;letter-spacing:.18em;
 text-transform:uppercase;color:#eefbe9;background:#1a3d23;border:1px solid rgba(255,255,255,.24);padding:9px 16px;border-radius:999px;
 cursor:pointer;transition:background .2s,transform .2s}
.hush:hover{background:#28563016;background:#2b5c34;transform:translateY(-2px)}
body.hush #scene *{animation-play-state:paused!important}
@media (max-width:640px){.lead{display:none}.hud{max-width:64vw;padding:9px 14px}}
@media (prefers-reduced-motion:reduce){#scene *{animation:none!important}}
</style>
</head>

<header class="hud">
 <p class="eyebrow">Field log &middot; spring &middot; midday</p>
 <h1>Paddock Four</h1>
 <p class="lead">Four residents, one horizon. Hover a name to single one out — they always answer with a hop.</p>
 <nav class="roster" id="roster" aria-label="residents"></nav>
</header>
<button class="hush" id="hush">hush the pasture</button>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var W=0,H=0,hz=0,grass=0,S=1,seed=1,pref=window.matchMedia?matchMedia('(prefers-reduced-motion:reduce)').matches:false;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}

/* ---------- sun: halo + 12 rays ---------- */
var rs="",i;
for(i=0;i<12;i++)rs+='<line x1="0" y1="-88" x2="0" y2="-126" transform="rotate('+(i*30)+')"/>';
$('sun').innerHTML='<circle class="pg" r="142" fill="url(#gGlow)"/>'+
 '<g class="rays" stroke="#ffe27a" stroke-width="8" stroke-linecap="round">'+rs+'</g>'+
 '<circle r="78" fill="#fff3ad" opacity=".5"/><circle r="54" fill="#ffe066"/>'+
 '<circle r="54" fill="none" stroke="#fff6c4" stroke-width="3" opacity=".85"/>';

/* ---------- clouds (each = 5 overlapping shapes) ---------- */
var SH=[[-56,8,44,22],[-12,-12,44,30],[30,-2,38,26],[62,10,32,20]];
function shape(){var s='<ellipse cx="4" cy="15" rx="88" ry="16" fill="#dfeef5" opacity=".85"/>';
 for(var j=0;j<SH.length;j++)s+='<ellipse cx="'+SH[j][0]+'" cy="'+SH[j][1]+'" rx="'+SH[j][2]+'" ry="'+SH[j][3]+'"/>';return s}
var CD=[{s:1.2,y:.12,v:9,x:.1},{s:.68,y:.23,v:15,x:.45},{s:.92,y:.31,v:6,x:.74},{s:.52,y:.07,v:19,x:.28},{s:1.05,y:.4,v:11,x:.6}];
$('clouds').innerHTML=CD.map(function(){return '<g>'+shape()+'</g>'}).join('');
var clEl=$('clouds').children,cl=[];
for(i=0;i<CD.length;i++)cl.push({el:clEl[i],s:CD[i].s,y:.12,v:CD[i].v,x:CD[i].x,yv:CD[i].y});

/* ---------- birds ---------- */
var BD=[{yv:.19,v:26,x:.2,s:1},{yv:.25,v:33,x:.6,s:.75},{yv:.15,v:21,x:.85,s:.6}];
$('birds').innerHTML=BD.map(function(b){return '<g><g class="flap" style="animation-duration:'+(0.3+b.s*.2).toFixed(2)+'s"><path d="M-11 0q6-7 11 0q5-7 11 0" fill="none" stroke="#446a78" stroke-width="2.6" stroke-linecap="round"/></g></g>'}).join('');
var brEl=$('birds').children,br=[];
for(i=0;i<BD.length;i++)br.push({el:brEl[i],v:BD[i].v,x:BD[i].x,y:BD[i].yv,s:BD[i].s});

/* ---------- trees ---------- */
var TREES=[{fx:.06,gy:.36,s:1.15,d:'7.4s',e:'-1.2s'},{fx:.27,gy:.1,s:.62,d:'5.9s',e:'-2.7s'},
           {fx:.66,gy:.21,s:.9,d:'6.6s',e:'-.5s'},{fx:.95,gy:.07,s:.55,d:'8.2s',e:'-3.3s'}];
function tree(t){
 var x=W*t.fx,y=hz+t.gy*grass,s=t.s*S;
 return '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+s.toFixed(3)+')">'+
 '<ellipse cx="0" cy="3" rx="54" ry="10" fill="#1d4322" opacity=".26"/>'+
 '<path d="M-10 0q4-38-3-62l20 0q-8 26-3 62z" fill="#7d5436"/>'+
 '<path d="M-5 0q4-38-1-62" fill="none" stroke="#5d3d27" stroke-width="2"/>'+
 '<g class="cr" style="animation-duration:'+t.d+';animation-delay:'+t.e+'">'+
 '<circle cx="-34" cy="-84" r="30" fill="#3f8a3e"/><circle cx="30" cy="-88" r="31" fill="#54a24c"/>'+
 '<circle cx="-6" cy="-112" r="34" fill="#61b557"/><circle cx="-30" cy="-58" r="22" fill="#47913f"/>'+
 '<circle cx="28" cy="-54" r="24" fill="#4e9b46"/><circle cx="10" cy="-92" r="25" fill="#6fc760" opacity=".8"/>'+
 '<circle cx="-14" cy="-126" r="13" fill="#84d471" opacity=".7"/></g></g>';
}
/* ---------- distant fence ---------- */
function fence(){var s="",n=Math.max(3,Math.round(W/170)),y=hz-2;
 for(var k=0;k<=n;k++){var x=((k+.5)*W/(n+1)).toFixed(1);s+='<path d="M'+x+' '+(y-31)+'v33" stroke="#7a5a3c" stroke-width="5" stroke-linecap="round"/>'}
 return '<g opacity=".8"><path d="M0 '+(y-25)+'H'+W+'" stroke="#8d6b47" stroke-width="4"/><path d="M0 '+(y-12)+'H'+W+'" stroke="#7a5a3c" stroke-width="3.5"/></g>'+s;
}
/* ---------- grass tufts + flowers ---------- */
function flora(){var s="",g=['#3d8140','#4a9449','#57a553','#38763b'];
 seed=13;for(var k=0;k<44;k++){var gy=Math.pow(rnd(),1.25),sc=.45+gy*1.1,x=(rnd()*W).toFixed(1),y=(hz+6+gy*(grass-12)).toFixed(1);
  s+='<path transform="translate('+x+','+y+') scale('+sc.toFixed(2)+')" d="M0 0q-2-9-5-13M0 0q2-9 1-15M0 0q4-7 8-10" fill="none" stroke="'+g[k%4]+'" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>'}
 for(k=0;k<13;k++){gy=Math.pow(rnd(),1.4);sc=.7+gy*.9;x=(rnd()*W).toFixed(1);y=(hz+12+gy*(grass-20)).toFixed(1);
  s+='<g transform="translate('+x+','+y+') scale('+sc.toFixed(2)+')"><circle cy="-12" r="2.4" fill="#fffdf2"/><circle cx="-3.4" cy="-9" r="2.4" fill="#fffdf2"/><circle cx="3.4" cy="-9" r="2.4" fill="#fffdf2"/><circle cy="-10.5" r="1.7" fill="#f2c33c"/></g>'}
 return s;
}
/* ---------- foreground blades (overlap the feet) ---------- */
function fore(){var s="";seed=29;
 for(var k=0;k<26;k++){var x=rnd()*W,y=H+2,lean=(rnd()*2-1)*30,h=50+rnd()*90,c=rnd()<.5?'#2c6332':'#357339';
  s+='<path class="bl" style="animation-duration:'+(2.8+rnd()*3).toFixed(2)+'s;animation-delay:-'+(rnd()*3).toFixed(2)+'s" d="M'+x.toFixed(1)+' '+y.toFixed(1)+'q'+(lean/2).toFixed(1)+' '+(-h/2).toFixed(1)+' '+lean.toFixed(1)+' '+(-h).toFixed(1)+'" fill="none" stroke="'+c+'" stroke-width="'+(3+rnd()*2).toFixed(1)+'" stroke-linecap="round"/>'}
 return s;
}
/* ---------- placement ---------- */
var CR=[{id:'sheep',fx:.15,gy:.48,s:.82},{id:'cow',fx:.40,gy:.66,s:.95},{id:'pig',fx:.62,gy:.80,s:.88},{id:'horse',fx:.83,gy:.93,s:1.05}];
for(i=0;i<CR.length;i++)CR[i].el=$(CR[i].id);
function layout(){
 W=innerWidth;H=innerHeight;hz=Math.round(H*.65);grass=H-hz;
 S=Math.max(.42,Math.min(1.15,W/1500,H/860));
 $('sun').setAttribute('transform','translate('+(W*.82).toFixed(1)+','+(H*.14).toFixed(1)+') scale('+Math.max(.62,Math.min(1.15,S)).toFixed(2)+')');
 $('fence').innerHTML=fence();
 $('trees').innerHTML=TREES.map(tree).join('');
 $('flora').innerHTML=flora();
 $('fore').innerHTML=fore();
 CR.forEach(function(c){
  var x=Math.max(84,Math.min(W-84,W*c.fx));
  c.el.setAttribute('transform','translate('+x.toFixed(1)+','+(hz+c.gy*grass).toFixed(1)+') scale('+(c.s*S).toFixed(3)+')');
 });
 cl.forEach(function(c,k){c.x*=1;c.s=CD[k].s;c.v=CD[k].v;c.yv=CD[k].y});
}
layout();
var rt=null;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120)});

/* ---------- ambient drift ---------- */
var last=0,paused=pref;
function tick(t){
 var dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(!paused){
  for(var k=0;k<cl.length;k++){var c=cl[k],hw=104*c.s;c.x+=c.v*dt/W;
   if((c.x-.5)*W-hw>W)c.x=(-hw-50)/W;
   c.el.setAttribute('transform','translate('+(c.x*W).toFixed(1)+','+(H*c.yv).toFixed(1)+') scale('+c.s.toFixed(2)+')')}
  for(k=0;k<br.length;k++){var b=br[k];b.x+=b.v*dt/W;
   if(b.x*W-20>W)b.x=-60/W;
   b.el.setAttribute('transform','translate('+(b.x*W).toFixed(1)+','+(H*b.y+Math.sin(t/700+k*2)*13).toFixed(1)+') scale('+b.s+')')}
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- roster chips ---------- */
var COL={sheep:'#f8f7f1',cow:'#f6f0e2',pig:'#f7aeb6',horse:'#9a6742'},ro=$('roster');
CR.slice().reverse().forEach(function(c){
 var b=document.createElement('button');b.dataset.t=c.id;
 b.innerHTML='<i style="background:'+COL[c.id]+'"></i>'+c.id;
 b.onmouseenter=b.onfocus=function(){c.el.classList.add('on')};
 b.onmouseleave=b.onblur=function(){c.el.classList.remove('on')};
 b.onclick=function(){var on=c.el.classList.toggle('on');b.classList.toggle('on',on)};
 ro.appendChild(b);
});
$('hush').onclick=function(){paused=!paused;document.body.classList.toggle('hush',paused);
 this.textContent=paused?'wake the pasture':'hush the pasture'};
})();
</script>
</body>
</html>
