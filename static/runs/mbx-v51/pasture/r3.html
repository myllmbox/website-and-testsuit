<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasture</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#bfe6f7}
  #scene{display:block;width:100vw;height:100vh}

  /* ---- clouds ---- */
  .drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(2160px)}}
  .d1{animation-duration:58s;animation-delay:-42s}
  .d2{animation-duration:74s;animation-delay:-60s}
  .d3{animation-duration:96s;animation-delay:-34s}
  .d4{animation-duration:66s;animation-delay:-52s}

  /* ---- sun rays ---- */
  .rays{animation:spin 110s linear infinite}
  @keyframes spin{from{transform:rotate(0deg) translate(1330px,262px)}to{transform:rotate(360deg) translate(1330px,262px)}}

  /* ---- trees ---- */
  .sway{animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translate(150px,652px) rotate(calc(var(--a,1) * -1.1deg))}50%{transform:translate(150px,652px) rotate(calc(var(--a,1) * 1.1deg))}}
  .s2{animation:sway2 8.6s ease-in-out infinite}
  @keyframes sway2{0%,100%{transform:translate(1462px,624px) rotate(calc(var(--a,1) * -1.3deg))}50%{transform:translate(1462px,624px) rotate(calc(var(--a,1) * 1.3deg))}}
  .s3{animation:sway3 6.2s ease-in-out infinite}
  @keyframes sway3{0%,100%{transform:translate(268px,616px) rotate(calc(var(--a,1) * -1.5deg))}50%{transform:translate(268px,616px) rotate(calc(var(--a,1) * 1.5deg))}}

  /* ---- animals ---- */
  .bounce{animation-name:bounce;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .b1{animation-duration:.88s;animation-delay:-.05s}
  .b2{animation-duration:.74s;animation-delay:-.34s}
  .b3{animation-duration:.97s;animation-delay:-.62s}
  .b4{animation-duration:.66s;animation-delay:-.19s}

  .shadow{transform-box:fill-box;transform-origin:center;animation-name:squash;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes squash{0%,100%{transform:scale(1,1);opacity:.22}50%{transform:scale(.86,.72);opacity:.13}}
  .h1{animation-duration:.88s;animation-delay:-.05s}
  .h2{animation-duration:.74s;animation-delay:-.34s}
  .h3{animation-duration:.97s;animation-delay:-.62s}
  .h4{animation-duration:.66s;animation-delay:-.19s}

  /* ---- birds ---- */
  .bird{animation-name:fly;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes fly{from{transform:translateX(0)}to{transform:translateX(1960px)}}
  .wing{animation:flap .55s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}

  @media (prefers-reduced-motion:reduce){
    .drift,.rays,.sway,.s2,.s3,.bounce,.shadow,.bird,.wing{animation:none}
  }
</style>
</head>
