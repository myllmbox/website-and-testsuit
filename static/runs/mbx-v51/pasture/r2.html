<title>Pasture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#d3eefa;-webkit-tap-highlight-color:transparent}
svg#stage{display:block;width:100%;height:100%}
line{stroke-linecap:round}
#cow .ln path,#sheep .ln path,#pig .ln path,#horse .ln path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#cow .ln path{stroke:#35343f;stroke-width:2.2}
#sheep .ln path{stroke:#2f2c38;stroke-width:2.2}
#pig .ln path{stroke:#d0768b;stroke-width:2.4}
#horse .ln path{stroke:#4d2f1d;stroke-width:2.2}
.ho{fill:#4b4038}
.wn{fill:#fff}
.bounce{animation-name:bounce;animation-duration:.94s;animation-timing-function:cubic-bezier(.42,0,.58,1);animation-iteration-count:infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}88%{transform:translateY(0)}}
.drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--lane,1800px)))}}
.bob{animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(9px)}}
#sky,#ground,#clouds{transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.hit{cursor:pointer}
.beast:hover .hit{filter:drop-shadow(0 0 9px rgba(255,252,232,.92))}
.beast:hover .bounce{animation-duration:.44s}
.tag{opacity:0;transition:opacity .22s ease}
.tag rect{fill:#fffdf2;fill-opacity:.93}
.tag text{fill:#3b4b2d;font:700 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.04em;text-anchor:middle}
.tag line{stroke:#3b4b2d;stroke-width:1.6}
.ripple{opacity:0}
.hud{position:fixed;left:18px;bottom:16px;z-index:5;pointer-events:none;user-select:none;animation:fade .9s .25s both}
.hud h1{font:600 12px/1.2 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#2b4f21;opacity:.8}
.hud p{margin-top:4px;font:500 11.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.05em;color:#3d5b32;opacity:.62}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bounce,.drift,.bob,.hud{animation:none}}
</style>
</head>

<div class="hud"><h1>Morning Pasture</h1><p>four neighbours, permanently delighted &mdash; hover or tap one</p></div>

<script>
(function(){
 var S=document.getElementById('stage'),H=900,GT=558,GH=342,W=1600,CL=0,LANES=[];
 var $(id){}
 function el(id){return document.getElementById(id)}
 function A(n,k,v){n.setAttribute(k,v)}
 function mk(t,k){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var p in k)A(e,p,k[p]);return e}
 function place(id,x,y,s){var n=el(id);if(!n)return;if(s===undefined)s=1;A(n,'transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')scale('+s+')')}

 /* sun rays */
 var rays=el('rays'),d='',i,a;
 for(i=0;i<8;i++){a=i*Math.PI/4;
  var x1=Math.cos(a-.05)*62,y1=Math.sin(a-.05)*62,x2=Math.cos(a+.05)*62,y2=Math.sin(a+.05)*62,tx=Math.cos(a)*106,ty=Math.sin(a)*106;
  d+='M'+x1.toFixed(1)+' '+y1.toFixed(1)+'L'+tx.toFixed(1)+' '+ty.toFixed(1)+'L'+x2.toFixed(1)+' '+y2.toFixed(1)+'Z';}
 A(rays,'d',d);
 A(rays,'opacity','.9');

 /* clouds */
 var cw=el('clouds'),cfg=[[.1,74,1,104],[.55,52,1.28,136],[.84,108,.82,88],[.32,144,.6,168]];
 cfg.forEach(function(c,k){
  var lane=mk('g',{'class':'drift'});
  lane.style.animationDuration=c[3]+'s';
  lane.style.animationDelay=(-c[3]*c[0])+'s';
  for(var j=0;j<2;j++){
   var g=mk('g',{transform:'translate('+(j*CL).toFixed(1)+','+c[1]+')'});
   g.setAttribute('transform','translate(0,'+c[1]+')');
   var inner=mk('g',{'class':'bob',transform:'translate('+(j*CL+ (k*40))+',0)'});
   inner.appendChild(mk('use',{href:'#cl',transform:'scale('+c[2]+')'}));
   g.appendChild(inner);lane.appendChild(g);
  }
  cw.appendChild(lane);LANES.push([lane,c]);
 });
 function sizeClouds(){
  CL=W+560;
  LANES.forEach(function(L,i){
   var c=L[0],k=c.style,cfgv=L[1],off=i*40;
   k.setProperty('--lane',CL+'px');
   var kids=c.children;
   kids[0].setAttribute('transform','translate(0,'+cfgv[1]+')');
   kids[0].firstChild.setAttribute('transform','translate('+off+',0)');
   kids[1].setAttribute('transform','translate(0,'+cfgv[1]+')');
   kids[1].firstChild.setAttribute('transform','translate('+(CL+off)+',0)');
  });
 }

 var HT={cow:262,sheep:166,pig:154,horse:302};
 function rows(list,feet,frac,cap,center){
  var tw=0;list.forEach(function(o){tw+=o.w});
  var s=Math.min(cap,(W*0.9-tw*0)/tw);
  s=Math.min(s,cap);
  var gap=W*frac,tot=s*tw+gap*(list.length-1),x=center!==undefined?center*s:s*0;
  var avail=W-16;
  s=Math.min(s,(avail-gap*(list.length-1))/tw);
  tot=s*tw+gap*(list.length-1);
  var cx=(W-tot)/2;
  list.forEach(function(o){
   var bx=cx+o.bx*s,by=feet+o.by*s,bs=s*o.s;
   A(el(o.id),'transform','translate('+bx.toFixed(1)+','+by.toFixed(1)+')scale('+bs.toFixed(3)+')');
   var t=el('tag-'+o.id),ty=by-HT[o.id]*bs-16/bs;
   A(t,'transform','translate('+bx.toFixed(1)+','+ty.toFixed(1)+')scale('+(1/bs).toFixed(3)+')');
   cx+=o.w*s+gap;
  });
 }
 function rows2(list,feet,cap){
  var tw=0;list.forEach(function(o){tw+=o.w});
  var s=Math.min(cap,(W*0.88-30)/tw);
  var tot=s*tw+30*(list.length-1),cx=(W-tot)/2;
  list.forEach(function(o){
   var bx=cx+s*o.w/2,by=feet,bs=s*o.s;
   A(el(o.id),'transform','translate('+bx.toFixed(1)+','+by.toFixed(1)+')scale('+bs.toFixed(3)+')');
   var t=el('tag-'+o.id),ty=by-HT[o.id]*bs-16/bs;
   A(t,'transform','translate('+bx.toFixed(1)+','+ty.toFixed(1)+')scale('+(1/bs).toFixed(3)+')');
   cx+=s*o.w+30;
  });
 }
 var FRONT=[{id:'cow',w:280,bx:0,by:0,s:1},{id:'horse',w:270,bx:0,by:-8,s:1}],
     BACK=[{id:'sheep',w:200,bx:0,by:0,s:.85},{id:'pig',w:185,bx:0,by:-4,s:.9}];

 function layout(){
  var w=innerWidth||1,h=innerHeight||1;
  W=Math.max(460,H*w/h);
  A(S,'viewBox','0 0 '+W.toFixed(1)+' '+H);
  A(S,'width',w);A(S,'height',h);
  A(el('skyR'),'x',-320);A(el('skyR'),'y',-320);A(el('skyR'),'width',(W+640).toFixed(1));A(el('skyR'),'height',(GT+340).toFixed(1));
  A(el('grassR'),'d','M-320 '+GT+'H'+(W+320).toFixed(0)+'V1240H-320Z');
  A(el('ridge'),'d','M-320 618q230-26 450-8t440 14 450-10 '+(W>1200?'q250-14 500 6':'')+'v240h'+(W+960).toFixed(0)+'z');
  var sx=W*.8,sy=H*.16;
  place('corona',sx,sy);place('rays',sx,sy);place('sun',sx,sy);
  A(el('sh1'),'d','M'+(sx-42)+' '+(sy+40)+'L'+(sx-250)+' '+(GT+60)+'L'+(sx-90)+' '+(GT+60)+'L'+(sx-14)+' '+(sy+40)+'Z');
  A(el('sh2'),'d','M'+(sx+26)+' '+(sy+46)+'L'+(sx+150)+' '+(GT+70)+'L'+(sx+330)+' '+(GT+70)+'L'+(sx+52)+' '+(sy+46)+'Z');
  place('birds',0,H*.06);
  A(el('birds').firstElementChild,'values','-160 0;'+(W+160).toFixed(0)+' 26');
  sizeClouds();
  place('tree',W*.05,GT+GH*.28,Math.max(.62,Math.min(1,W/1500+.06)));
  place('tree',W*.95,GT+GH*.34,Math.max(.56,Math.min(.95,W/1900+.1)));
  place('bush',0,GT+8,.9);
  A(el('bush'),'transform','translate(-10,'+(GT+10)+')');
  var b=el('bush'),g='';
  for(var i=0;i<7;i++){g+='<use href="#bsh" transform="translate('+(W*(i+.5)/7).toFixed(0)+','+(GT+6)+') scale('+(0.7+(i%3)*0.25)+')"/>';}
  b.innerHTML=g;
  var f=el('fences');f.innerHTML='';
  for(var j=0;j<Math.max(2,Math.round(W/380));j++){
   f.appendChild(mk('use',{href:'#fence',transform:'translate('+(W*(j+.12)/Math.max(2,Math.round(W/380))).toFixed(0)+','+(GT+34)+') scale('+(.8+j%2*.2)+')'}));
  }
  var hols=el('holes'),hs='';
  for(var k=0;k<8;k++)hs+='<ellipse cx="'+(W*(k+.5)/8).toFixed(0)+'" cy="'+(GT+GH*(.18+(k%4)*.19)).toFixed(0)+'" rx="'+(28+k%3*14)+'" ry="6"/>';
  hols.innerHTML=hs;
  var tf=el('tuft'),tfs='';
  for(var l=0;l<Math.max(14,Math.round(W/52));l++){
   var lx=(W*(l+Math.random()*.7)/Math.max(14,W/52)).toFixed(0),ly=(GT+26+Math.pow(Math.random(),.85)*(GH-58)).toFixed(0),ls=(.55+Math.random()*.85).toFixed(2);
   tfs+='<use href="#tf" transform="translate('+lx+','+ly+') scale('+ls+')"/>';
  }
  tf.innerHTML=tfs;
  var fl=el('flw'),fs='';
  for(var m=0;m<Math.max(9,Math.round(W/95));m++){
   var fx=(W*(m+.5)/Math.max(9,W/95)).toFixed(0),fy=(GT+40+Math.random()*(GH-70)).toFixed(0),fs2=(.62+Math.random()*.6).toFixed(2);
   fs+='<use href="#tft" transform="translate('+fx+','+fy+') scale('+fs2+')"/>';
  }
  fl.innerHTML=fs;
  var mo=el('mote');A(mo,'transform','translate('+(W*.3)+','+(GT+GH*.86)+')');
  place('bfly',W*.62,GT+GH*.5,Math.max(.7,Math.min(1.2,W/1500)));
  A(el('mp1'),'path','M0 0q60-40 120-6t'+(W*.3).toFixed(0)+' 4 '+(W*.25).toFixed(0)+' -26');
  A(el('mp2'),'path','M0 0q-70-50-140-10t-'+(W*.32).toFixed(0)+' 12 -'+(W*.22).toFixed(0)+' -34');
  if(W>1150){rows(FRONT,GT+GH*.85,W*.075,Math.min(1,(W*.9-40)/550));rows(BACK,GT+GH*.42,W*.09,.84);}
  else{rows2(FRONT,GT+GH*.95,.46);rows2(BACK,GT+GH*.22,.6);}
 }
 addEventListener('resize',layout);
 addEventListener('pointermove',function(e){
  var x=e.clientX/(innerWidth||1)-.5,y=e.clientY/(innerHeight||1)-.5;
  el('clouds').style.transform='translate('+(x*26).toFixed(1)+'px,'+(y*10).toFixed(1)+'px)';
  el('sky').style.transform='translate('+(x*10).toFixed(1)+'px,'+(y*5).toFixed(1)+'px)';
  el('ground').style.transform='translate('+(-x*16).toFixed(1)+'px,'+(-y*5).toFixed(1)+'px)';
 },{passive:true});

 document.querySelectorAll('.beast').forEach(function(b){
  var rp=b.querySelector('.ripple'),tg=b.querySelector('.tag');
  try{var w=tg.querySelector('text').getComputedTextLength()+26,r=tg.querySelector('rect');
   A(r,'x',(-w/2).toFixed(1));A(r,'width',w.toFixed(1));}catch(e){}
  b.addEventListener('pointerenter',function(){tg.style.opacity=1});
  b.addEventListener('pointerleave',function(){tg.style.opacity=0});
  b.addEventListener('click',function(){
   try{rp.getAnimations().forEach(function(a){a.currentTime=0;a.play()});}catch(e){}
   tg.style.opacity=1;clearTimeout(b._t);b._t=setTimeout(function(){tg.style.opacity=0},900);
  });
 });
 layout();
})();
