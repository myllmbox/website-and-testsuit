

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Hours — Pasture №4</title>
<style>
:root{
  --ink:#20301c;--paper:#fdf6e3;--leaf:#2f6b1f;--gold:#c8890f;
  --display:"Bookman Old Style","Rockwell","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#9fd2ea;font-family:var(--body);color:var(--ink)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- motion ---------- */
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}9%{transform:translateY(1px) scaleY(.94)}
  42%{transform:translateY(-17px) scaleY(1.05)}74%{transform:translateY(0) scaleY(.97)}}
@keyframes hopBig{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-34px) rotate(-3deg)}
  50%{transform:translateY(0)}75%{transform:translateY(-24px) rotate(3deg)}}
@keyframes shade{0%,100%{transform:scale(1);opacity:.27}42%{transform:scale(.78);opacity:.13}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-1.25deg)}50%{transform:rotate(1.25deg)}}
@keyframes swish{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}
@keyframes float{0%{transform:translate(0,0)}100%{transform:translate(10px,-18px)}}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

.bounce{transform-box:fill-box;transform-origin:50% 100%;animation-name:hop;
  animation-timing-function:cubic-bezier(.32,.06,.42,1);animation-iteration-count:infinite;animation-duration:.8s}
.animal{cursor:pointer}
.animal.spook .bounce{animation-name:hopBig;animation-duration:.62s;animation-iteration-count:2}
.shadow{fill:#1c3f10;transform-box:fill-box;transform-origin:50% 50%;
  animation:shade .8s cubic-bezier(.32,.06,.42,1) infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 6.2s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7.5s ease-in-out infinite}
.tail{transform-box:fill-box;transform-origin:88% 5%;animation:swish 3.4s ease-in-out infinite}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 140s linear infinite}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 8s ease-in-out infinite}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .42s ease-in-out infinite}
.mote{animation:float ease-in-out infinite alternate}
.tag{opacity:0;transition:opacity .3s ease;pointer-events:none}
.animal.show .tag,.animal.spook .tag{opacity:1}
.tag text{font-family:var(--body);font-size:21px;font-weight:700;letter-spacing:.2em;
  text-anchor:middle;fill:#fffbe8;stroke:#1d3a16;stroke-width:5;paint-order:stroke fill}

/* ---------- interface ---------- */
.hud{position:fixed;left:clamp(14px,3vw,46px);top:clamp(14px,3.4vh,44px);
  max-width:min(37ch,44vw);pointer-events:none;z-index:5}
.plate{background:var(--paper);border:2px solid var(--ink);padding:16px 20px 15px;
  box-shadow:9px 9px 0 rgba(29,58,22,.24);transform:rotate(-.6deg);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.plate:hover{transform:rotate(0deg) translateY(-2px);box-shadow:12px 14px 0 rgba(29,58,22,.26)}
.kicker{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:#6a8a4d}
.kicker b{color:var(--gold)}
h1{font-family:var(--display);font-size:clamp(33px,4.5vw,60px);line-height:.9;margin:.14em 0 .3em;
  letter-spacing:-.015em}
h1 em{display:block;font-style:normal;color:var(--leaf)}
.lead{font-size:13.5px;line-height:1.55;margin:0;color:#3f5237;max-width:33ch}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 0;padding:0;list-style:none;pointer-events:auto}
.legend li{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border:2px solid var(--ink);
  background:#fff;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
  box-shadow:3px 3px 0 rgba(29,58,22,.2);transition:transform .22s,background .22s,box-shadow .22s}
.legend li:hover,.legend li.on{transform:translateY(-3px);background:#ffe9a6;box-shadow:4px 7px 0 rgba(29,58,22,.26)}
.legend svg{width:17px;height:17px;display:block}
.legend i{font-style:normal;color:#7d8f6f;letter-spacing:.05em}
.hint{position:fixed;right:clamp(12px,2.6vw,38px);bottom:clamp(12px,3vh,34px);z-index:5;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#22301f;
  background:rgba(253,246,227,.9);padding:8px 13px;border-bottom:3px solid var(--ink)}
.hint span{color:var(--gold)}
.fade{animation:rise .8s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:640px){.lead{display:none}.hud{max-width:70vw}}
</style>
</head>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("scene"),
    sky=document.getElementById("sky"),sun=document.getElementById("sun"),
    hills=document.getElementById("hills"),turf=document.getElementById("turf"),
    tex=document.getElementById("tex"),hline=document.getElementById("hline"),
    hline2=document.getElementById("hline2"),vig=document.getElementById("vig"),
    field=document.getElementById("field"),fence=document.getElementById("fence"),
    props=document.getElementById("props"),flora=document.getElementById("flora"),
    blades=document.getElementById("blades"),motes=document.getElementById("motes"),
    rays=document.getElementById("rays");

function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
var seed=20240513;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}

/* sun rays */
for(var i=0;i<12;i++){var L=(i%2===0);
  el("path",{d:"M-6.5 -74 L6.5 -74 L0 "+(-74-(L?50:28))+" Z",
    fill:L?"#ffdc63":"#ffefa0",opacity:L?.95:.8,transform:"rotate("+(i*30)+")"},rays);}

/* sheep wool under-shadow (built from the same primitives) */
var wool=document.getElementById("wool");
if(wool){var u=wool.cloneNode(true);u.removeAttribute("id");
  u.setAttribute("fill","#d6cfc0");u.setAttribute("transform","translate(0,7)");
  wool.parentNode.insertBefore(u,wool);}

/* fence */
el("rect",{x:-90,y:-47,width:2500,height:9,rx:4,fill:"#9a6c3d",stroke:"#5b3d1e","stroke-width":2},fence);
el("rect",{x:-90,y:-23,width:2500,height:9,rx:4,fill:"#8d6238",stroke:"#5b3d1e","stroke-width":2},fence);
for(var fx=-50;fx<2400;fx+=120){
  el("rect",{x:fx,y:-57,width:14,height:68,rx:3,fill:"#a87a45",stroke:"#5b3d1e","stroke-width":2},fence);
  el("path",{d:"M"+fx+" -57 l7 -8 l7 8z",fill:"#bb8c54",stroke:"#5b3d1e","stroke-width":2},fence);
}

/* barn + distant bushes */
el("use",{href:"#barn",transform:"translate(-360,2) scale(.82)",opacity:".92"},props);
for(var b=0;b<26;b++){
  var bx=-120+b*100+rnd()*60, bs=.5+rnd()*.7;
  var g=el("g",{transform:"translate("+bx.toFixed(1)+",4) scale("+bs.toFixed(2)+")",opacity:".95"},props);
  el("ellipse",{cx:-13,cy:-7,rx:19,ry:13,fill:"#3d7829"},g);
  el("ellipse",{cx:11,cy:-11,rx:22,ry:16,fill:"#4a8a32"},g);
  el("ellipse",{cx:0,cy:-1,rx:26,ry:11,fill:"#316320"},g);
}

/* scattered flowers + grass tufts, positioned by layout() */
var scatter=[],pal=["#fff6ef","#ffd3e0","#ffe98a","#ffffff","#f7b9d0","#ffb36b"];
for(var k=0;k<40;k++){
  var fg=el("g",{},flora),ffx=(k+.15+rnd()*.7)/40,ffy=.05+rnd()*.94,fsc=(.65+rnd()*.6);
  el("path",{d:"M0 0 q-4 -8 -1 -15",stroke:"#356f21","stroke-width":2,fill:"none","stroke-linecap":"round"},fg);
  var col=pal[k%pal.length];
  for(var p=0;p<5;p++){var an=p/5*6.283;
    el("circle",{cx:(Math.cos(an)*4.4).toFixed(1),cy:(-16+Math.sin(an)*4.4).toFixed(1),r:3.2,fill:col},fg);}
  el("circle",{cx:0,cy:-16,r:2.3,fill:"#f0a51e"},fg);
  scatter.push({e:fg,fx:ffx,fy:ffy,sc:fsc,base:1});
}
for(var t=0;t<34;t++){
  var tg=el("g",{},flora),tfx=(t+.2+rnd()*.6)/34,tfy=.08+rnd()*.92,tsc=.7+rnd()*.9;
  el("path",{d:"M0 0 q2 -14 9 -21 q-3 14 -4 21z",fill:"#3f7f26"},tg);
  el("path",{d:"M2 0 q-4 -12 -11 -16 q5 12 7 16z",fill:"#54993a"},tg);
  scatter.push({e:tg,fx:tfx,fy:tfy,sc:tsc,base:1});
}
for(var l=0;l<64;l++){
  var bg=el("g",{},blades),bfx=l/64+rnd()*.008;
  var hgt=26+rnd()*30,dark=(l%3===0);
  el("path",{d:"M0 0 q4 -"+(hgt*.6|0)+" 12 -"+(hgt|0)+" q-2 "+(hgt*.62|0)+" -4 "+(hgt|0)+"z",
    fill:dark?"#255415":"#347021"},bg);
  el("path",{d:"M-6 0 q-5 -"+(hgt*.5|0)+" -12 -"+(hgt*.72|0)+" q4 "+(hgt*.5|0)+" 7 "+(hgt*.72|0)+"z",
    fill:dark?"#2e641b":"#3f7f28"},bg);
  scatter.push({e:bg,fx:bfx,fy:1.02,sc:.9+rnd()*.5,base:1});
}
var moteList=[];
for(var m=0;m<22;m++){
  var mc=el("circle",{r:(1.2+rnd()*2.2).toFixed(1),fill:"#fff8c9",opacity:(.25+rnd()*.4).toFixed(2),"class":"mote"},motes);
  mc.style.animationDuration=(5+rnd()*7).toFixed(1)+"s";
  mc.style.animationDelay=(-rnd()*8).toFixed(1)+"s";
  moteList.push({e:mc,fx:rnd(),fy:.55+rnd()*.4});
}

/* layout */
var W=1600,H=900,HZ=585;
function layout(){
  var vw=window.innerWidth||1600,vh=window.innerHeight||900,ar=vw/vh;
  W=Math.round(920*ar);H=920;
  if(W>2100){W=2100;H=Math.round(W/ar);}
  if(W<1000){W=1000;H=Math.round(W/ar);}
  if(H<560){H=560;W=Math.round(H*ar);}
  if(H>1380){H=1380;W=Math.round(H*ar);}
  HZ=Math.round(H*.65);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  document.getElementById("gSky").setAttribute("y2",HZ);
  var gt=document.getElementById("gTurf");gt.setAttribute("y1",HZ);gt.setAttribute("y2",H);
  sky.setAttribute("width",W+160);sky.setAttribute("height",H+80);
  turf.setAttribute("width",W+160);turf.setAttribute("height",H-HZ+8);
  tex.setAttribute("width",W+160);tex.setAttribute("height",H-HZ+8);
  hline.setAttribute("width",W+160);hline2.setAttribute("width",W+160);
  vig.setAttribute("width",W);vig.setAttribute("height",H);
  field.setAttribute("transform","translate(0,"+HZ+")");
  hills.setAttribute("transform","scale("+(W/1600).toFixed(3)+",1)");
  sun.setAttribute("transform","translate("+(W*.8).toFixed(0)+","+Math.max(112,HZ*.18).toFixed(0)+")");

  var s=Math.min(1,W/1560),cx=W/2;
  var an=document.querySelectorAll(".animal");
  for(var i=0;i<an.length;i++){
    an[i].setAttribute("transform","translate("+(cx+(+an[i].getAttribute("data-dx"))*s).toFixed(1)+","+(+an[i].getAttribute("data-dy"))+")");
  }
  var tr=document.querySelectorAll("[data-tdx]");
  for(var j=0;j<tr.length;j++){
    var ts=tr[j].getAttribute("data-ts")||1;
    tr[j].setAttribute("transform","translate("+(cx+(+tr[j].getAttribute("data-tdx"))*s).toFixed(1)+","+(+tr[j].getAttribute("data-ty"))+") scale("+ts+")");
  }
  var depth=H-HZ;
  for(var q=0;q<scatter.length;q++){
    var o=scatter[q],yy=o.fy*depth;
    o.e.setAttribute("transform","translate("+(o.fx*W).toFixed(1)+","+yy.toFixed(1)+") scale("+(o.sc*(0.75+o.fy*.45)).toFixed(2)+")");
  }
  for(var n=0;n<moteList.length;n++){
    var mm=moteList[n];
    mm.e.setAttribute("cx",(mm.fx*W).toFixed(1));
    mm.e.setAttribute("cy",(HZ+mm.fy*depth*.85).toFixed(1));
  }
  var dr=document.querySelectorAll(".drift");
  for(var d=0;d<dr.length;d++){
    var g0=dr[d],at=dr[d].querySelector("animateTransform");
    var span=(+g0.getAttribute("data-spd"));
    at.setAttribute("to",(W+460)+" 0");
    at.setAttribute("dur",span+"s");
    at.setAttribute("begin",(-parseFloat(g0.getAttribute("data-off")))+"s");
    g0.querySelector(".lane").setAttribute("transform",
      "translate(0,"+(HZ*parseFloat(g0.getAttribute("data-yf"))).toFixed(0)+") scale("+g0.getAttribute("data-sc")+")");
  }
}
layout();
var rid;window.addEventListener("resize",function(){clearTimeout(rid);rid=setTimeout(layout,90);});

/* interactions */
function spook(a){a.classList.add("spook","show");
  clearTimeout(a._t);a._t=setTimeout(function(){a.classList.remove("spook");
    if(!a._hover)a.classList.remove("show");},1350);}
var animals=document.querySelectorAll(".animal");
for(var a2=0;a2<animals.length;a2++){(function(an2){
  an2.addEventListener("click",function(){spook(an2);});
  an2.addEventListener("mouseenter",function(){an2._hover=1;an2.classList.add("show");});
  an2.addEventListener("mouseleave",function(){an2._hover=0;if(!an2.classList.contains("spook"))an2.classList.remove("show");});
})(animals[a2]);}
var chips=document.querySelectorAll(".legend li");
for(var c=0;c<chips.length;c++){(function(li){
  var an3=document.getElementById("a-"+li.getAttribute("data-sp"));if(!an3)return;
  li.addEventListener("mouseenter",function(){li.classList.add("on");an3.classList.add("show");});
  li.addEventListener("mouseleave",function(){li.classList.remove("on");an3.classList.remove("show");});
  li.addEventListener("click",function(){spook(an3);});
})(chips[c]);}

if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  try{svg.pauseAnimations();}catch(err){}
}
})();
</script>
