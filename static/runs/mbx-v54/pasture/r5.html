

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadowbrook Pasture</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12291a}
#scene{display:block;width:100vw;height:100vh}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.hop{animation-name:hop;animation-timing-function:cubic-bezier(.35,.02,.5,.98);animation-iteration-count:infinite}
@keyframes shad{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(.8,.72);opacity:.15}}
.shadow{fill:#173d12;transform-box:fill-box;transform-origin:center;animation-name:shad;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.cloud{animation:drift linear infinite}
@keyframes sway{0%,100%{transform:rotate(-1.15deg)}50%{transform:rotate(1.15deg)}}
.sway{animation:sway ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 120s linear infinite;transform-origin:0 0}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.wing{transform-box:fill-box;transform-origin:center bottom;animation:flap .4s ease-in-out infinite}
@keyframes blade{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.blade{transform-box:fill-box;transform-origin:bottom center;animation:blade 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.85}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(34px,-22px)}50%{transform:translate(72px,6px)}75%{transform:translate(30px,-14px)}}
.fly{animation:fly 13s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.22)}}
.wf{transform-box:fill-box;transform-origin:right center;animation:wob .17s linear infinite}
.wb{transform-box:fill-box;transform-origin:left center;animation:wob .17s linear infinite}

.animal{cursor:pointer}
.animal .rig{transition:transform .38s cubic-bezier(.2,.85,.2,1)}
.animal:hover .rig,.animal.talk .rig{transform:scale(1.055)}
.tag{opacity:0;transform:translateY(6px);transition:opacity .32s ease,transform .32s ease}
.animal:hover .tag,.animal.talk .tag,svg.show .tag{opacity:1;transform:translateY(0)}
.bubble{opacity:0;transition:opacity .22s ease}
.animal.talk .bubble{opacity:1}
svg.paused *{animation-play-state:paused}

.plate{position:fixed;left:30px;top:24px;max-width:min(46ch,55vw);pointer-events:none;color:#12331c;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.kick{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.26em;text-transform:uppercase;color:#2f5f36;opacity:.9}
.plate h1{margin:.2em 0 .14em;font:400 clamp(34px,6vw,70px)/.92 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.02em;color:#0d2c17}
.plate p{margin:0;font:400 13.5px/1.55 ui-sans-serif,system-ui;color:#25492b;max-width:33ch}
.plate em{font-style:normal;border-bottom:1.5px dotted #4f7f42;padding-bottom:1px}
.bar{position:fixed;left:30px;bottom:22px;display:flex;gap:8px;flex-wrap:wrap}
.bar button{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.14em;text-transform:uppercase;padding:11px 15px;border-radius:999px;border:1.5px solid #2c4a22;background:rgba(255,252,240,.86);color:#1d3c1e;cursor:pointer;box-shadow:0 3px 0 rgba(23,58,18,.25);transition:transform .18s ease,background .18s ease,box-shadow .18s}
.bar button:hover{transform:translateY(-2px);background:#fff;box-shadow:0 5px 0 rgba(23,58,18,.28)}
.bar button[aria-pressed="true"]{background:#2b5d33;color:#f2ffe8;border-color:#1c3f22}
.legend{position:fixed;right:26px;bottom:22px;display:flex;gap:14px;font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.1em;text-transform:uppercase;color:#12331c;background:rgba(255,252,240,.78);border:1px solid rgba(30,70,26,.3);padding:10px 14px;border-radius:999px;box-shadow:0 3px 12px rgba(10,40,10,.18)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
@media (prefers-reduced-motion:reduce){.rays,.blade,.fly,.wing,.wf,.wb,.cloud,.sway{animation:none}}
</style>
</head>

<div class="plate">

 <h1>Meadowbrook</h1>
 <p>Four species, one field. <em>Hover</em> to name a beast, <em>click</em> to hear it.</p>
</div>

 <button id="bWarm" aria-pressed="false">Golden hour</button>

 <span><i style="background:#2c2a29"></i>Cow</span><span><i style="background:#f2f4f6"></i>Sheep</span><span><i style="background:#ef9fae"></i>Pig</span><span><i style="background:#8a5628"></i>Horse</span>
</div>

<script>
(function(){
 var NS='http://www.w3.org/2000/svg', svg=document.getElementById('scene');
 function mk(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
 function R(a,b){return a+Math.random()*(b-a);}

 /* sun rays */
 var rays=document.getElementById('rays'),i;
 for(i=0;i<12;i++){mk('rect',{x:-4,y:-128,width:8,height:32,rx:4,fill:'#ffdf6b',transform:'rotate('+(i*30)+')'},rays);}
 for(i=0;i<12;i++){mk('rect',{x:-2.4,y:-112,width:5,height:16,rx:2.5,fill:'#fff2ad',transform:'rotate('+(i*30+15)+')'},rays);}

 /* distant treeline on the horizon */
 var tf=document.getElementById('treesFar');
 for(i=0;i<30;i++){var x=R(-30,1630),h=R(15,46),w=R(13,28);
  mk('path',{d:'M'+x+',590 L'+(x+w/2)+','+(590-h)+' L'+(x+w)+',590 Z',fill:Math.random()<.5?'#4f8b48':'#3f7a3c',opacity:R(.5,.85)},tf);
  if(Math.random()<.35)mk('circle',{cx:x+w*1.6,cy:590-R(6,14),r:R(7,13),fill:'#5b9a4e',opacity:.7},tf);
 }

 /* fence posts */
 var ps=document.getElementById('posts');
 for(i=0;i<15;i++)mk('rect',{x:-30+i*112,y:606,width:11,height:42,rx:3,fill:'#8e6636'},ps);

 /* sunlit patches in the sward */
 var pt=document.getElementById('pats');
 for(i=0;i<7;i++)mk('ellipse',{cx:R(0,1600),cy:R(620,880),rx:R(70,180),ry:R(9,22),fill:'#dff2a6',opacity:R(.05,.11)},pt);

 /* grass blades, back row then front row */
 function blade(g,ylo,yhi,smin,smax){
  var y=R(ylo,yhi),d=(y-ylo)/(yhi-ylo),x=R(-10,1610),h=R(10,20)+d*R(8,26),lean=R(-6,6);
  mk('path',{d:'M'+x+','+y+' q'+(lean*.5)+','+(-h*.6)+','+lean+','+(-h),
   stroke:'hsl('+(86+Math.random()*26)+' '+(46+Math.random()*20)+'% '+(20+d*27)+'%)',
   'stroke-width':(1+d*2.2).toFixed(2),fill:'none','stroke-linecap':'round','class':'blade',
   style:'animation-delay:'+(-Math.random()*4).toFixed(2)+'s;animation-duration:'+(2.6+Math.random()*2.6).toFixed(2)+'s'},g);
 }
 var bb=document.getElementById('bladesB'),bf=document.getElementById('bladesF');
 for(i=0;i<80;i++)blade(bb,594,764);
 for(i=0;i<58;i++)blade(bf,756,898);

 /* wildflowers */
 var fl=document.getElementById('flowers'),cols=['#fdfdfd','#ffe066','#ff8fa3','#cfa9ff','#fff6e0'];
 for(i=0;i<34;i++){
  var y=R(600,892),x=R(-10,1610),s=.55+(y-600)/520,c=cols[i%cols.length];
  var g=mk('g',{transform:'translate('+x+' '+y+') scale('+s.toFixed(2)+')'},fl);
  for(var k=0;k<5;k++){var a=k/5*6.283;mk('circle',{cx:(Math.cos(a)*3.4).toFixed(1),cy:(Math.sin(a)*3.4).toFixed(1),r:2.5,fill:c},g);}
  mk('circle',{r:1.7,fill:'#f2b100'},g);
 }

 /* animals: click to vocalise */
 var an=[].slice.call(document.querySelectorAll('.animal'));
 an.forEach(function(a){
  a.addEventListener('click',function(){
   a.classList.add('talk');clearTimeout(a._t);
   a._t=setTimeout(function(){a.classList.remove('talk');},1500);
  });
 });

 /* controls */
 var bM=document.getElementById('bMotion'),bL=document.getElementById('bLabels'),bW=document.getElementById('bWarm'),wm=document.getElementById('warm');
 bM.addEventListener('click',function(){var p=svg.classList.toggle('paused');bM.setAttribute('aria-pressed',p);bM.textContent=p?'Resume motion':'Pause motion';});
 bL.addEventListener('click',function(){var p=svg.classList.toggle('show');bL.setAttribute('aria-pressed',p);});
 bW.addEventListener('click',function(){var on=wm.style.opacity!=='1';wm.style.opacity=on?'1':'0';bW.setAttribute('aria-pressed',on);});

 /* pointer parallax on sky + far layers */
 var pS=document.getElementById('pSky'),pM=document.getElementById('pMid');
 window.addEventListener('pointermove',function(e){
  var x=e.clientX/window.innerWidth-.5,y=e.clientY/window.innerHeight-.5;
  pS.setAttribute('transform','translate('+(x*-26).toFixed(1)+' '+(y*-13).toFixed(1)+')');
  pM.setAttribute('transform','translate('+(x*15).toFixed(1)+' '+(y*7).toFixed(1)+')');
 });
})();
</script>
