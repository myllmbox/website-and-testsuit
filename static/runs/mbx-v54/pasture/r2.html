

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pasture</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#bfe3f5}
  #scene{display:block;width:100vw;height:100vh}

  /* ---- animal hop ---- */
  .hop{animation:hop var(--dur,.9s) ease-in-out infinite;animation-delay:var(--delay,0s);will-change:transform}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--amp,-16px))}}
  .shadow{fill:#12401a;animation:shd var(--dur,.9s) ease-in-out infinite;animation-delay:var(--delay,0s)}
  @keyframes shd{0%,100%{opacity:.22}50%{opacity:.11}}
  .animal{cursor:pointer}
  .animal .fig{transition:filter .35s ease}
  .animal:hover .fig{filter:drop-shadow(0 8px 9px rgba(16,58,22,.3))}
  .animal.pop{--amp:-40px;--dur:.42s}

  /* ---- clouds ---- */
  .cloud{animation:drift linear infinite;will-change:transform}
  @keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(1860px)}}

  /* ---- birds / butterflies ---- */
  .flock{animation:drift 58s linear infinite;animation-delay:-16s}
  .bird{transform-box:fill-box;transform-origin:center;animation:flap .62s ease-in-out infinite}
  .bird.b2{animation-duration:.5s;animation-delay:-.2s}
  .bird.b3{animation-duration:.72s;animation-delay:-.35s}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
  .wL,.wR{transform-box:fill-box;animation:flapw .28s ease-in-out infinite}
  .wL{transform-origin:right center}
  .wR{transform-origin:left center;animation-delay:-.14s}
  @keyframes flapw{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.34)}}

  /* ---- eyes ---- */
  .blink{animation:bl 5.3s infinite}
  @keyframes bl{0%,90%{opacity:0}92.5%,96%{opacity:1}98%,100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .hop,.cloud,.shadow,.bird,.wL,.wR,.blink,.flock{animation:none}
  }

  .plate{position:fixed;left:26px;bottom:22px;color:#f4fbf3;text-shadow:0 1px 3px rgba(12,44,20,.6);pointer-events:none}
  .plate h1{margin:0;font:400 26px/1.05 Georgia,"Times New Roman",serif;letter-spacing:.035em}
  .plate p{margin:5px 0 0;font:400 11px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
</style>
</head>

<div class="plate">
  <h1>The Pasture</h1>
  <p>Four friends &middot; one long afternoon</p>
</div>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function seedRand(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t^t>>>7;t^=t+0x618C8825;return((t^t>>>14)>>>0)/4294967296;};}
  var R=seedRand(8711);
  function el(tag,a){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);return e;}

  /* grass tufts */
  var bg=document.getElementById("tufts"), fg=document.getElementById("tuftsFg"), i,b,g,x,y,h,lean,depth;
  for(i=0;i<165;i++){
    depth=R(); y=596+depth*252; x=R()*1630-15; h=7+depth*12; lean=R()*7-3.5;
    g=el("g",{transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+") scale("+(0.75+depth*0.55).toFixed(2)+")"});
    for(b=0;b<3;b++){
      g.appendChild(el("path",{d:"M"+(b*4-4)+",0 q"+(b*1.6-0.8+lean/3).toFixed(1)+","+(-h*0.6).toFixed(1)+" "+(lean/2).toFixed(1)+","+(-h).toFixed(1),
        fill:"none",stroke:["#3d8b3d","#4da046","#2f7a34"][b%3],"stroke-width":2.2,"stroke-linecap":"round",opacity:(0.4+R()*0.4).toFixed(2)}));
    }
    bg.appendChild(g);
  }
  var petals=["#fdfdfd","#f7d94a","#f4a0c4","#c9a8ef","#fff6e0"];
  for(i=0;i<44;i++){
    depth=R(); x=R()*1620-10; y=612+depth*248;
    g=el("g",{transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+") scale("+(0.7+depth*0.6).toFixed(2)+")"});
    var c=petals[(R()*petals.length)|0];
    for(b=0;b<5;b++){
      var a=b/5*6.283;
      g.appendChild(el("circle",{cx:(Math.cos(a)*4.2).toFixed(1),cy:(Math.sin(a)*4.2).toFixed(1),r:3.1,fill:c}));
    }
    g.appendChild(el("circle",{cx:0,cy:0,r:2.4,fill:"#f4c430"}));
    bg.appendChild(g);
  }
  for(i=0;i<48;i++){
    x=R()*1640-20; y=858+R()*46; h=16+R()*20; lean=R()*10-5;
    g=el("g",{transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+")"});
    for(b=0;b<3;b++){
      g.appendChild(el("path",{d:"M"+(b*6-6)+",0 q"+(b*2-1+lean/3).toFixed(1)+","+(-h*0.55).toFixed(1)+" "+(lean/2).toFixed(1)+","+(-h).toFixed(1),
        fill:"none",stroke:["#2f7a34","#3d8b3d","#256b2b"][b%3],"stroke-width":3.4,"stroke-linecap":"round",opacity:(0.6+R()*0.35).toFixed(2)}));
    }
    fg.appendChild(g);
  }

  /* click a critter -> bigger hop */
  var animals=[].slice.call(document.querySelectorAll(".animal"));
  animals.forEach(function(a){
    a.addEventListener("pointerdown",function(){
      a.classList.remove("pop"); void a.getBoundingClientRect(); a.classList.add("pop");
      clearTimeout(a._t); a._t=setTimeout(function(){a.classList.remove("pop");},780);
    });
  });

  /* gentle pointer parallax */
  var hills=document.getElementById("hills"), sky=document.getElementById("skyLayer"), bugs=document.getElementById("bugs");
  var tx=0,ty=0,cx=0,cy=0;
  window.addEventListener("pointermove",function(e){
    tx=(e.clientX/window.innerWidth-0.5); ty=(e.clientY/window.innerHeight-0.5);
  },{passive:true});
  (function loop(){
    cx+=(tx-cx)*0.05; cy+=(ty-cy)*0.05;
    if(hills) hills.setAttribute("transform","translate("+(-cx*16).toFixed(2)+","+(-cy*5).toFixed(2)+")");
    if(sky)   sky.setAttribute("transform","translate("+(-cx*9).toFixed(2)+","+(-cy*4).toFixed(2)+")");
    if(bugs)  bugs.setAttribute("transform","translate("+(-cx*7).toFixed(2)+","+(-cy*5).toFixed(2)+")");
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
