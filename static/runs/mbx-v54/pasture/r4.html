

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pasture — four species, observed</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3f5;
  font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;color:#16240f}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;transform-origin:50% 50%;will-change:transform}

/* ---------- ambient motion ---------- */
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1980px)}}
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.bob{animation:bob 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 95s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pulse{animation:pulse 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
.sway{animation:sway 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes swish{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.swish{animation:swish 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(6deg)}}
.twitch{animation:twitch 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
.flap{animation:flap .45s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- animals ---------- */
.animal{cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.3,1),filter .3s;
  transform-box:fill-box;transform-origin:50% 100%}
.animal:hover{transform:translate(var(--tx),var(--ty)) scale(1.035)}
@keyframes hop{0%,100%{transform:translateY(0)}16%{transform:translateY(-4px)}46%{transform:translateY(-15px)}72%{transform:translateY(-3px)}}
.hop{animation-name:hop;animation-timing-function:cubic-bezier(.33,0,.4,1);animation-iteration-count:infinite}
@keyframes bigHop{0%{transform:translateY(0)}28%{transform:translateY(-52px) scaleY(1.05)}52%{transform:translateY(2px) scaleY(.93)}70%{transform:translateY(-12px)}100%{transform:translateY(0) scaleY(1)}}
.boom .hop{animation:bigHop .68s cubic-bezier(.3,.7,.4,1) 1}
@keyframes shpulse{0%,100%{transform:scale(1);opacity:.26}46%{transform:scale(.8,.72);opacity:.14}}
.shadow{fill:#1b3a12;transform-box:fill-box;transform-origin:center;animation:shpulse .82s cubic-bezier(.33,0,.4,1) infinite}
.spot{opacity:0;transition:opacity .35s ease}
.ring{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
#scene[data-focus] .animal{opacity:.15;filter:saturate(.35)}
#scene[data-focus="cow"]   .animal[data-a="cow"],
#scene[data-focus="sheep"] .animal[data-a="sheep"],
#scene[data-focus="pig"]   .animal[data-a="pig"],
#scene[data-focus="horse"] .animal[data-a="horse"]{opacity:1;filter:none}
#scene[data-focus="cow"]   .animal[data-a="cow"]   .spot,
#scene[data-focus="sheep"] .animal[data-a="sheep"] .spot,
#scene[data-focus="pig"]   .animal[data-a="pig"]   .spot,
#scene[data-focus="horse"] .animal[data-a="horse"] .spot{opacity:1}
@keyframes puff{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}
.seed{transform-box:fill-box;transform-origin:center;animation:puff .95s ease-out forwards}

/* ---------- HUD ---------- */
.panel{position:fixed;z-index:5}
.card{top:28px;left:30px;padding:16px 24px 18px;border-radius:3px 3px 16px 3px;
  background:#fffcf2;border:1px solid #d9d2ba;border-left:6px solid #e0a11c;
  box-shadow:0 18px 34px -22px rgba(9,40,4,.8)}
.kicker{font-size:10px;letter-spacing:.3em;font-weight:700;text-transform:uppercase;color:#2f7d32}
.card h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:clamp(38px,4.6vw,62px);line-height:.86;margin:6px 0 8px;font-weight:700;letter-spacing:-.025em}
.card h1 em{font-style:italic;color:#2f7d32}
.rule{width:52px;height:3px;background:#e0a11c;border-radius:2px}
.card p{margin:9px 0 0;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:rgba(22,36,15,.62);max-width:38ch;line-height:1.7}
.strip{top:32px;right:30px;display:flex;gap:14px;align-items:center;font-size:11px;letter-spacing:.19em;
  text-transform:uppercase;background:#fffcf2;border:1px solid #d9d2ba;border-radius:999px;padding:8px 16px;
  box-shadow:0 14px 26px -20px rgba(9,40,4,.9)}
.strip b{font-weight:700}
.strip .dot{width:8px;height:8px;border-radius:50%;background:#2f7d32;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(47,125,50,.5)}50%{opacity:.45;box-shadow:0 0 0 6px rgba(47,125,50,0)}}
.legend{bottom:26px;left:30px;display:flex;gap:9px;flex-wrap:wrap}
.chip{font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;cursor:pointer;
  background:rgba(255,252,242,.94);color:#16240f;border:1px solid #d9d2ba;
  transition:transform .22s cubic-bezier(.2,.8,.3,1),background .22s,color .22s,box-shadow .22s}
.chip:hover,.chip:focus-visible{transform:translateY(-4px);outline:none;background:#16240f;color:#fffcf2;box-shadow:0 12px 22px -14px rgba(0,0,0,.9)}
.chip i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.55) inset}
.hint{bottom:30px;right:32px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:#123f18;opacity:.6;text-shadow:0 1px 0 rgba(255,255,255,.45)}
@media (max-width:780px){.strip,.hint{display:none}.card{left:16px;top:16px;padding:12px 16px}.legend{left:16px}}
@media (prefers-reduced-motion:reduce){.cloud,.bob,.spin,.pulse,.sway,.swish,.twitch,.flap,.hop,.shadow,.ring,.seed{animation:none!important}}
</style>
</head>

<div class="panel hint">click an animal to startle it · click the grass</div>

<script>
(function(){
  var svg=document.getElementById('scene'),
      far=document.getElementById('far'),
      mid=document.getElementById('mid'),
      seeds=document.getElementById('seeds'),
      chips=[].slice.call(document.querySelectorAll('.chip')),
      animals=[].slice.call(document.querySelectorAll('.animal')),
      reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* live clock + slow temperature drift */
  var clock=document.getElementById('clock'),temp=document.getElementById('temp');
  function tick(){
    var d=new Date();
    clock.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
    temp.textContent=(18.6+1.4*Math.sin(d.getTime()/90000)).toFixed(1)+'°C';
  }
  tick(); setInterval(tick,1000);

  /* legend -> spotlight */
  var pinned=null;
  function setFocus(k){ if(k) svg.setAttribute('data-focus',k); else svg.removeAttribute('data-focus'); }
  chips.forEach(function(c){
    var k=c.getAttribute('data-k');
    c.addEventListener('mouseenter',function(){ if(!pinned) setFocus(k); });
    c.addEventListener('focus',function(){ if(!pinned) setFocus(k); });
    c.addEventListener('mouseleave',function(){ if(!pinned) setFocus(null); });
    c.addEventListener('blur',function(){ if(!pinned) setFocus(null); });
    c.addEventListener('click',function(){
      if(pinned===k){ pinned=null; setFocus(null); c.classList.remove('on'); }
      else{
        pinned=k; setFocus(k);
        chips.forEach(function(x){ x.classList.toggle('on',x===c); });
      }
    });
  });

  /* startle hop */
  animals.forEach(function(a){
    a.addEventListener('click',function(e){
      e.stopPropagation();
      a.classList.remove('boom');
      void a.getBoundingClientRect();
      a.classList.add('boom');
      setTimeout(function(){ a.classList.remove('boom'); },700);
    });
  });

  /* grass seed puff */
  var NS='http://www.w3.org/2000/svg';
  svg.addEventListener('click',function(e){
    if(reduce||!svg.getScreenCTM()) return;
    var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    var p=pt.matrixTransform(svg.getScreenCTM().inverse());
    if(p.y<600||p.y>880) return;
    for(var i=0;i<9;i++){
      var c=document.createElementNS(NS,'circle'),
          a=(Math.random()-.5)*Math.PI, d=24+Math.random()*46;
      c.setAttribute('cx',p.x.toFixed(1)); c.setAttribute('cy',p.y.toFixed(1));
      c.setAttribute('r',(1.8+Math.random()*3).toFixed(1));
      c.setAttribute('fill',Math.random()<.35?'#fffbe8':(Math.random()<.5?'#7ec955':'#4d9530'));
      c.setAttribute('class','seed');
      c.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');
      c.style.setProperty('--dy',(-34-Math.random()*44).toFixed(1)+'px');
      seeds.appendChild(c);
      c.addEventListener('animationend',function(){ this.remove(); });
    }
  });

  /* gentle pointer parallax */
  if(!reduce){
    var mx=0,my=0,tx=0,ty=0;
    window.addEventListener('pointermove',function(e){
      mx=e.clientX/window.innerWidth-.5; my=e.clientY/window.innerHeight-.5;
    },{passive:true});
    (function loop(){
      tx+=(mx-tx)*.055; ty+=(my-ty)*.055;
      far.style.transform='translate('+(-tx*28).toFixed(2)+'px,'+(-ty*12).toFixed(2)+'px)';
      mid.style.transform='translate('+(-tx*13).toFixed(2)+'px,'+(-ty*6).toFixed(2)+'px)';
      svg.style.transform='scale(1.025) translate('+(tx*5).toFixed(2)+'px,'+(ty*4).toFixed(2)+'px)';
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
