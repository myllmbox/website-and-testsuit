<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b3157}
  #scene{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cd9df"/>
      <stop offset=".45" stop-color="#2f8dad"/>
      <stop offset="1" stop-color="#0b3157"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c48f"/>
      <stop offset="1" stop-color="#a87c4c"/>
    </linearGradient>
    <linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8761c"/>
      <stop offset=".45" stop-color="#f6952f"/>
      <stop offset="1" stop-color="#ffc584"/>
    </linearGradient>
    <linearGradient id="bodyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3961b"/>
      <stop offset=".5" stop-color="#f2c231"/>
      <stop offset="1" stop-color="#ffe38a"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#water)"/>

  <polygon id="ray1" fill="url(#ray)"><animate attributeName="opacity" values=".35;.75;.35" dur="9s" repeatCount="indefinite"/></polygon>
  <polygon id="ray2" fill="url(#ray)"><animate attributeName="opacity" values=".7;.3;.7" dur="11s" begin="-4s" repeatCount="indefinite"/></polygon>
  <polygon id="ray3" fill="url(#ray)"><animate attributeName="opacity" values=".3;.65;.3" dur="13s" begin="-8s" repeatCount="indefinite"/></polygon>

  <g id="rocks"></g>
  <path id="floor" fill="url(#sand)"/>
  <path id="lip" fill="none" stroke="#f4e0b0" stroke-width="3" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="pebbles"></g>

  <g id="starfish">
    <polygon points="0,-24 5.9,-8.1 22.8,-7.4 9.5,3.1 14.1,19.4 0,10 -14.1,19.4 -9.5,3.1 -22.8,-7.4 -5.9,-8.1" fill="#e2725b" stroke="#c4573f" stroke-width="2" stroke-linejoin="round"/>
    <circle cy="-7" r="1.6" fill="#b9563f"/><circle cy="1" r="1.6" fill="#b9563f"/><circle cy="9" r="1.6" fill="#b9563f"/>
  </g>

  <g id="kelp1">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3.5 0 0;3.5 0 0;-3.5 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="5.6s" begin="-2.1s" repeatCount="indefinite"/>
      <path d="M0 0 C-18 -46 16 -92 -8 -148" stroke="#2f9e5f" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 0 0;-4 0 0;4 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4.3s" begin="-.9s" repeatCount="indefinite"/>
      <path d="M8 0 C30 -36 -4 -74 16 -108" stroke="#257e49" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="6.4s" begin="-3.3s" repeatCount="indefinite"/>
      <path d="M-8 0 C-30 -28 2 -58 -16 -80" stroke="#3cb06d" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <g id="kelp2">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="3 0 0;-3 0 0;3 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="5.1s" begin="-1.2s" repeatCount="indefinite"/>
      <path d="M0 0 C20 -50 -10 -104 12 -156" stroke="#2f9e5f" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4.2s" begin="-2.6s" repeatCount="indefinite"/>
      <g>
        <ellipse cy="-13" rx="9" ry="13" fill="#257e49"/>
        <ellipse cx="3" cy="-29" rx="12" ry="15" fill="#2f9e5f"/>
        <ellipse cx="-3" cy="-47" rx="13" ry="16" fill="#37ad6a"/>
        <ellipse cx="2" cy="-65" rx="11" ry="14" fill="#2f9e5f"/>
        <ellipse cy="-81" rx="8" ry="11" fill="#3cb06d"/>
      </g>
    </g>
  </g>

  <!-- Large round coral fish, swims left to right -->
  <g id="fishA">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-13 56 0;13 56 0;-13 56 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="1.15s" repeatCount="indefinite"/>
      <polygon points="56,0 106,-32 106,32" fill="#ee8a2c" stroke="#d97416" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path d="M-36 -40 Q-4 -106 36 -38 Z" fill="#d56b10"/>
    <ellipse rx="72" ry="54" fill="url(#bodyA)" stroke="#b85f10" stroke-width="1.5" stroke-opacity=".45"/>
    <path d="M0 10 Q32 26 10 44 Q-8 30 0 10 Z" fill="#dd7418" opacity=".92">
      <animateTransform attributeName="transform" type="rotate" values="9 0 10;-7 0 10;9 0 10" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M26 -26 Q12 0 28 24" fill="none" stroke="#c05f12" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <path d="M64 8 Q73 14 63 21" fill="none" stroke="#8a4712" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="-16" r="11" fill="#fff"/>
    <circle cx="43" cy="-16" r="5.5" fill="#1e2b38"/>
    <circle cx="41" cy="-18.5" r="2" fill="#fff" opacity=".9"/>
  </g>

  <!-- Small slender yellow fish, swims right to left -->
  <g id="fishB">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-17 40 0;17 40 0;-17 40 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur=".5s" repeatCount="indefinite"/>
      <polygon points="40,0 80,-24 80,24" fill="#eeb32a" stroke="#d3971a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <path d="M-16 -12 Q0 -44 22 -10 Z" fill="#d3971a"/>
    <ellipse rx="46" ry="17" fill="url(#bodyB)" stroke="#a87610" stroke-width="1.2" stroke-opacity=".45"/>
    <path d="M-40 -1 L36 -1" stroke="#b97f14" stroke-width="3.5" stroke-linecap="round" opacity=".5"/>
    <path d="M-2 5 Q14 14 2 21 Q-8 14 -2 5 Z" fill="#d3971a" opacity=".92">
      <animateTransform attributeName="transform" type="rotate" values="10 -2 5;-8 -2 5;10 -2 5" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur=".65s" repeatCount="indefinite"/>
    </path>
    <path d="M-18 -9 Q-24 0 -18 9" fill="none" stroke="#b97f14" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
    <path d="M-45 2 Q-51 5 -44 8" fill="none" stroke="#8a5a12" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-31" cy="-5" r="7.5" fill="#fff"/>
    <circle cx="-33.5" cy="-5" r="3.6" fill="#1e2b38"/>
    <circle cx="-32" cy="-7.5" r="1.4" fill="#fff" opacity=".9"/>
  </g>

  <g id="bubbles"></g>
  <g id="snow"></g>
</svg>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
function $(id){return document.getElementById(id);}
var svg=$('scene');
var floorEl=$('floor'),lipEl=$('lip'),rocksG=$('rocks'),pebblesG=$('pebbles'),
    star=$('starfish'),rays=[$('ray1'),$('ray2'),$('ray3')],
    bubblesG=$('bubbles'),snowG=$('snow');
var W=0,H=0,fScale=1,inited=false;

/* deterministic floor line + seeded rng so the layout is stable */
var seed=987654321;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function fY(x){return H*0.885+H*0.012*Math.sin(x*0.006+1.3)+H*0.008*Math.sin(x*0.0145+0.4);}
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}

var fish=[
  {el:$('fishA'),dir: 1,spd: 58,fy:.46,amp:15,w:.5,ph:0,  x:0,s:1,m:118,init:false},
  {el:$('fishB'),dir:-1,spd:165,fy:.63,amp:10,w:.9,ph:2.1,x:0,s:1,m:118,init:false}
];

/* bubbles rise from two vents on the seafloor */
var ventFs=[.30,.72];
var bubbles=[];
for(var i=0;i<7;i++){
  var g=el('g',{},bubblesG);
  var c=el('circle',{cx:0,cy:0,fill:'rgba(215,240,255,.13)',stroke:'rgba(255,255,255,.65)','stroke-width':1.4},g);
  var hl=el('circle',{fill:'rgba(255,255,255,.85)'},g);
  bubbles.push({g:g,c:c,hl:hl,r:0,xf:0,y:0,amp:0,w:0,ph:0,spd:0});
}
function spawn(b,first){
  b.r=3.5+rnd()*10;
  b.xf=ventFs[(rnd()*2)|0]+(rnd()*.06-.03);
  b.y=first?H*(.14+.7*rnd()):fY(b.xf*W)-b.r-4;
  b.spd=26+300/(b.r+5); /* smaller bubbles rise faster */
  b.amp=5+rnd()*12;b.w=.6+rnd()*.9;b.ph=rnd()*6.283;
  b.c.setAttribute('r',b.r.toFixed(1));
  b.hl.setAttribute('cx',(-b.r*.38).toFixed(1));
  b.hl.setAttribute('cy',(-b.r*.38).toFixed(1));
  b.hl.setAttribute('r',(b.r*.28).toFixed(1));
}

/* pebbles, rocks, drifting specks */
var pebDefs=[];for(i=0;i<12;i++)pebDefs.push({xf:rnd(),d:rnd(),rx:3+rnd()*6,c:['#8a6a42','#9c7a4e','#7c5f3a'][i%3]});
var pebEls=pebDefs.map(function(d){return el('ellipse',{fill:d.c,opacity:.85},pebblesG);});
var rockDefs=[{xf:.40,rx:34,ry:21,c:'#6e675a',h:'#847d6d'},{xf:.87,rx:27,ry:16,c:'#776f60',h:'#8d8574'}];
var rockEls=rockDefs.map(function(d){
  var rg=el('g',{},rocksG);
  el('ellipse',{rx:d.rx,ry:d.ry,fill:d.c},rg);
  el('ellipse',{cx:(-d.rx*.15).toFixed(1),cy:(-d.ry*.45).toFixed(1),rx:(d.rx*.55).toFixed(1),ry:(d.ry*.5).toFixed(1),fill:d.h,opacity:.7},rg);
  return rg;
});
var snow=[];
for(i=0;i<14;i++){
  snow.push({el:el('circle',{r:(0.8+rnd()*1.5).toFixed(1),fill:'#dfeef5',opacity:(0.1+rnd()*.2).toFixed(2)},snowG),
             xf:rnd(),y:0,spd:0,w:0,ph:0});
}

function layout(){
  W=window.innerWidth;H=window.innerHeight;
  fScale=Math.max(.55,Math.min(1.35,W/1300));
  svg.setAttribute('width',W);svg.setAttribute('height',H);

  var n=26,pts=[],j,x;
  for(j=0;j<=n;j++){x=W*j/n-2;pts.push(x.toFixed(1)+','+fY(x).toFixed(1));}
  var line='M'+pts.join(' L ');
  floorEl.setAttribute('d',line+' L '+(W+4)+','+(H+4)+' L -6,'+(H+4)+' Z');
  lipEl.setAttribute('d',line);

  var bY=H*.82;
  [[.14,W*.06],[.40,-W*.07],[.66,W*.05]].forEach(function(r,idx){
    var bx=W*r[0],tw=W*.03+18,mx=bx+r[1],bw=W*.10+40;
    rays[idx].setAttribute('points',bx+',0 '+(bx+tw)+',0 '+(mx+bw)+','+bY+' '+mx+','+bY);
  });

  rockDefs.forEach(function(d,idx){x=d.xf*W;rockEls[idx].setAttribute('transform','translate('+x+' '+(fY(x)-3).toFixed(1)+')');});
  pebDefs.forEach(function(d,idx){
    x=d.xf*W;var e=pebEls[idx];
    e.setAttribute('cx',x.toFixed(1));
    e.setAttribute('cy',(fY(x)+4+d.d*H*.07).toFixed(1));
    e.setAttribute('rx',d.rx.toFixed(1));
    e.setAttribute('ry',(d.rx*.45).toFixed(1));
  });
  x=W*.58;
  star.setAttribute('transform','translate('+x+' '+(fY(x)+9).toFixed(1)+') rotate(-14) scale('+fScale.toFixed(2)+')');
  [[$('kelp1'),.14],[$('kelp2'),.80]].forEach(function(p){
    x=p[1]*W;var s=Math.max(.55,Math.min(1.25,H/900));
    p[0].setAttribute('transform','translate('+x+' '+(fY(x)+4).toFixed(1)+') scale('+s.toFixed(2)+')');
  });
  fish.forEach(function(f){f.s=fScale;f.m=118*fScale;});

  if(!inited){
    inited=true;
    fish[0].x=W*.18;fish[1].x=W*.74;
    bubbles.forEach(function(b){spawn(b,true);});
    snow.forEach(function(p){p.y=rnd()*H;p.spd=4+rnd()*8;p.w=.15+rnd()*.25;p.ph=rnd()*6.283;});
  }
}

var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var t=now/1000,i,f,b,p,x,y,vy,rot;
  for(i=0;i<fish.length;i++){
    f=fish[i];
    f.x+=f.dir*f.spd*dt;
    if(f.dir>0&&f.x-f.m>W)f.x=-f.m;
    else if(f.dir<0&&f.x+f.m<0)f.x=W+f.m;
    y=f.fy*H+f.amp*Math.sin(t*f.w+f.ph);
    vy=f.amp*f.w*Math.cos(t*f.w+f.ph);
    rot=f.dir*Math.atan2(vy,f.spd)*57.29578;
    rot=Math.max(-14,Math.min(14,rot));
    f.el.setAttribute('transform','translate('+f.x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(2)+') scale('+f.s.toFixed(3)+')');
  }
  for(i=0;i<bubbles.length;i++){
    b=bubbles[i];
    b.y-=b.spd*dt;
    if(b.y<-b.r-12)spawn(b,false);
    x=b.xf*W+b.amp*Math.sin(t*b.w+b.ph);
    b.g.setAttribute('transform','translate('+x.toFixed(1)+' '+b.y.toFixed(1)+')');
  }
  for(i=0;i<snow.length;i++){
    p=snow[i];
    p.y+=p.spd*dt;
    if(p.y>H+6){p.y=-6;p.xf=rnd();}
    p.el.setAttribute('cx',(p.xf*W+14*Math.sin(t*p.w+p.ph)).toFixed(1));
    p.el.setAttribute('cy',p.y.toFixed(1));
  }
  requestAnimationFrame(frame);
}

layout();
window.addEventListener('resize',layout);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
