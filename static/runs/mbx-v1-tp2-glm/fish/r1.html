<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b3050}
  svg{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82cfe6"/>
      <stop offset=".45" stop-color="#2e7ba8"/>
      <stop offset="1" stop-color="#0b3050"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddb47d"/>
      <stop offset="1" stop-color="#8f6537"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="f1c"><ellipse cx="0" cy="0" rx="92" ry="52"/></clipPath>
  </defs>

  <rect width="100%" height="100%" fill="url(#wg)"/>
  <path id="floor" fill="url(#sg)"/>
  <g id="pebbles"/>
  <g id="weeds"/>
  <g id="bubbles"/>

  <!-- Fish 1: big round coral fish, faces right -->
  <g id="f1">
    <g id="f1t"><path d="M-80,0L-140,-38Q-126,0-140,38Z" fill="#e07a26" stroke="#b95f16" stroke-width="3" stroke-linejoin="round"/></g>
    <path d="M-38,-44C-26,-84 16,-86 40,-46C12,-62 -8,-62 -38,-44Z" fill="#e07a26" stroke="#b95f16" stroke-width="3" stroke-linejoin="round"/>
    <ellipse rx="92" ry="52" fill="#f59a3e"/>
    <g clip-path="url(#f1c)" fill="#fdf4e0" stroke="#c8681c" stroke-width="2.5" stroke-linejoin="round">
      <path d="M18,-58Q34,0 18,58L40,58Q54,0 40,-58Z"/>
      <path d="M-26,-60Q-10,0 -26,60L-4,60Q12,0 -4,-60Z"/>
      <path d="M-66,-54Q-52,0 -66,54L-48,54Q-36,0 -48,-54Z"/>
    </g>
    <g id="f1p"><path d="M-4,8Q26,22 6,44Q-14,30 -4,8Z" fill="#e07a26" opacity=".92"/></g>
    <circle cx="58" cy="-16" r="11.5" fill="#fff" stroke="#8a4413" stroke-width="2"/>
    <circle cx="61" cy="-15" r="5.4" fill="#241a10"/>
    <circle cx="59" cy="-17.5" r="1.8" fill="#fff"/>
    <path d="M76,12Q88,19 77,27" fill="none" stroke="#8a4413" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Fish 2: small slender teal fish, faces left -->
  <g id="f2">
    <g transform="scale(-0.62 0.62)">
      <g id="f2t"><path d="M-70,0L-122,-28L-108,0L-122,28Z" fill="#2f8f86" stroke="#1e6b64" stroke-width="3" stroke-linejoin="round"/></g>
      <path d="M-20,-23C-8,-44 14,-44 24,-22C6,-30 -4,-30 -20,-23Z" fill="#2f8f86" stroke="#1e6b64" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-14,22Q-2,38 12,21Q0,26 -14,22Z" fill="#2f8f86"/>
      <ellipse rx="78" ry="26" fill="#54c1b4"/>
      <path d="M-62,-3Q0,-13 66,-2" fill="none" stroke="#d9f5ef" stroke-width="5" stroke-linecap="round" opacity=".5"/>
      <g id="f2p"><path d="M14,4Q36,16 20,32Q6,20 14,4Z" fill="#2f8f86" opacity=".92"/></g>
      <circle cx="52" cy="-7" r="7.5" fill="#fff" stroke="#14514b" stroke-width="1.5"/>
      <circle cx="54" cy="-6.5" r="3.4" fill="#0d2b28"/>
      <circle cx="52.6" cy="-8.2" r="1.2" fill="#fff"/>
      <path d="M70,4Q76,8 71,12" fill="none" stroke="#14514b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <g id="rays"/>
</svg>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var floorEl=$('floor'),pebG=$('pebbles'),weedG=$('weeds'),bubG=$('bubbles'),rayG=$('rays');
var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}
var W=0,H=0,ft=0;

/* ---------- seafloor ---------- */
function floorD(){
  var n=8,pts=[],i,d='M0,'+H;
  for(i=0;i<=n;i++)pts.push([W*i/n,ft+Math.sin(i*1.9)*9]);
  d+=' L'+pts[0][0]+','+pts[0][1].toFixed(1);
  for(i=1;i<n;i++){
    var mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;
    d+=' Q'+pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1)+' '+mx.toFixed(1)+','+my.toFixed(1);
  }
  d+=' L'+pts[n][0]+','+pts[n][1].toFixed(1)+' L'+W+','+H+' Z';
  return d;
}
var rayEls=[];
function layout(){
  W=window.innerWidth;H=window.innerHeight;
  ft=H-Math.max(70,H*0.13);
  floorEl.setAttribute('d',floorD());
  clear(pebG);
  var rocks=[[.10,46,30,'#6e5a44'],[.855,38,24,'#77634c']],i;
  for(i=0;i<rocks.length;i++){var r=rocks[i];
    el('ellipse',{cx:(W*r[0]).toFixed(0),cy:ft+6,rx:r[1],ry:r[2],fill:r[3]},pebG);}
  var ps=[[.045,13,'#8a6844'],[.155,9,'#a08058'],[.235,16,'#7c5c3a'],[.335,8,'#93724c'],[.46,11,'#8a6844'],[.56,7,'#a08058'],[.665,14,'#7c5c3a'],[.75,9,'#93724c'],[.955,12,'#8a6844']];
  for(i=0;i<ps.length;i++){var p=ps[i],px=W*p[0],pr=p[1];
    el('ellipse',{cx:px.toFixed(0),cy:(ft+5+pr*0.45).toFixed(0),rx:(pr*1.5).toFixed(0),ry:pr,fill:p[2]},pebG);}
  clear(rayG);rayEls=[];
  for(i=0;i<3;i++){
    var tx=W*(0.14+0.29*i),by=(H*0.78).toFixed(0);
    rayEls.push(el('polygon',{points:tx+',-40 '+(tx+85+i*25)+',-40 '+(tx+280+i*45)+','+by+' '+(tx+130)+','+by,fill:'url(#rg)'},rayG));
  }
}

/* ---------- seaweed (regenerated each frame so it sways) ---------- */
function bladePath(x0,fy,h,w,s){
  var c1x=x0+s*0.35,c1y=fy-h*0.45,c2x=x0+s*0.85,c2y=fy-h*0.80,tx=x0+s*1.25,ty=fy-h*0.98;
  function f(v){return v.toFixed(1);}
  return 'M'+f(x0-w)+','+f(fy)+
    ' C'+f(c1x-w*0.75)+','+f(c1y)+' '+f(c2x-w*0.4)+','+f(c2y)+' '+f(tx)+','+f(ty)+
    ' C'+f(c2x+w*0.4)+','+f(c2y)+' '+f(c1x+w*0.75)+','+f(c1y)+' '+f(x0+w)+','+f(fy)+' Z';
}
var weeds=[],wd=[[.07,.24,11,15,.9,0,'#2c8a55'],[.115,.16,8,11,1.2,1.8,'#1f6b40'],[.52,.13,7,9,1.4,2.5,'#2e8a52'],[.82,.27,13,17,.8,3.1,'#33995e'],[.875,.19,9,12,1.1,4.4,'#27794a']],i;
for(i=0;i<wd.length;i++){
  weeds.push({fx:wd[i][0],hf:wd[i][1],w:wd[i][2],A:wd[i][3],w2:wd[i][4],ph:wd[i][5],
    el:el('path',{fill:wd[i][6]},weedG)});
}

/* ---------- bubbles ---------- */
var bubbles=[];
function spawnB(b,scatter){
  b.r=3.5+Math.random()*7.5;
  b.spd=34+(11-b.r)*7;               /* smaller bubbles rise faster */
  b.x=W*b.fx+(Math.random()*60-30);
  b.y=scatter?Math.random()*H*0.9:ft-4-Math.random()*26;
}
for(i=0;i<9;i++){
  var g=el('g',{},bubG);
  el('circle',{r:10,fill:'rgba(235,248,255,0.10)',stroke:'rgba(240,251,255,0.65)','stroke-width':1.6},g);
  el('circle',{cx:-3.4,cy:-3.8,r:2.4,fill:'rgba(255,255,255,0.85)'},g);
  var b={g:g,fx:Math.random(),x:0,y:0,r:0,spd:0,ph:Math.random()*6.28};
  bubbles.push(b);spawnB(b,true);
}

/* ---------- fish ---------- */
function fish(id,tail,fin,dir,speed,baseY,bobA,bw,ph,wagA,wagW,len,tilt,tp,fp){
  return {g:$(id),tail:$(tail),fin:$(fin),dir:dir,speed:speed,baseY:baseY,bobA:bobA,
    bw:bw,ph:ph,wagA:wagA,wagW:wagW,len:len,tilt:tilt,tp:tp,fp:fp,x:0};
}
var F1=fish('f1','f1t','f1p', 1, 62,0.40,15,1.5,0, 8,5.2,145,0.38,[-82,0],[-4,8]);
var F2=fish('f2','f2t','f2p',-1,138,0.66,10,2.6,2,12,9.5, 80,0.42,[-72,0],[14,4]);

function moveFish(f,dt,t){
  f.x+=f.dir*f.speed*dt;
  if(f.dir>0&&f.x>W+f.len)f.x=-f.len;      /* wrap right -> left */
  if(f.dir<0&&f.x<-f.len)f.x=W+f.len;      /* wrap left -> right */
  var vy=f.bobA*f.bw*Math.cos(t*f.bw+f.ph);
  var y=H*f.baseY+f.bobA*Math.sin(t*f.bw+f.ph);
  var a=f.dir*vy*f.tilt;if(a>11)a=11;if(a<-11)a=-11;
  f.g.setAttribute('transform','translate('+f.x.toFixed(1)+','+y.toFixed(1)+') rotate('+a.toFixed(2)+')');
  f.tail.setAttribute('transform','rotate('+(Math.sin(t*f.wagW+f.ph)*f.wagA).toFixed(2)+' '+f.tp[0]+' '+f.tp[1]+')');
  f.fin.setAttribute('transform','rotate('+(Math.sin(t*f.wagW*1.3+f.ph+1.2)*7).toFixed(2)+' '+f.fp[0]+' '+f.fp[1]+')');
}

/* ---------- main loop ---------- */
var last=performance.now();
function tick(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var t=now/1000,j;
  moveFish(F1,dt,t);moveFish(F2,dt,t);
  for(j=0;j<bubbles.length;j++){var bb=bubbles[j];
    bb.y-=bb.spd*dt;
    if(bb.y<-30)spawnB(bb,false);          /* respawn near seafloor */
    var swx=bb.x+Math.sin(t*1.3+bb.ph)*(5+bb.r*0.9);
    var prog=1-bb.y/H;if(prog<0)prog=0;if(prog>1)prog=1;
    var s=(bb.r/10)*(1+prog*0.3);
    bb.g.setAttribute('transform','translate('+swx.toFixed(1)+','+bb.y.toFixed(1)+') scale('+s.toFixed(3)+')');
  }
  for(j=0;j<weeds.length;j++){var wd2=weeds[j];
    var s2=wd2.A*(Math.sin(t*wd2.w2+wd2.ph)*0.7+Math.sin(t*wd2.w2*1.9+wd2.ph*1.3)*0.3);
    wd2.el.setAttribute('d',bladePath(W*wd2.fx,ft+8,H*wd2.hf,wd2.w,s2));
  }
  for(j=0;j<3;j++){
    rayEls[j].setAttribute('transform','translate('+(Math.sin(t*0.08+j*2.1)*36).toFixed(1)+',0)');
    rayEls[j].setAttribute('opacity',(0.10+0.05*Math.sin(t*0.13+j*1.7)).toFixed(3));
  }
  requestAnimationFrame(tick);
}

layout();
window.addEventListener('resize',layout);
F1.x=W*0.22;F2.x=W*0.72;
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
