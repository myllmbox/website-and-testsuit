<!DOCTYPE html>

<title>Pasture — a bouncing morning</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#71B04C}
svg{display:block;width:100vw;height:100vh}
.hint{position:fixed;left:16px;bottom:12px;margin:0;font:600 12px/1 system-ui,'Segoe UI',sans-serif;letter-spacing:.4px;color:#27531E;opacity:.5;pointer-events:none;user-select:none}
.drift{animation:drift var(--cd,90s) linear var(--cdel,0s) infinite}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(1620px)}}
.bob{animation:bob 6.5s ease-in-out var(--bd,0s) infinite alternate}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.flap{animation:flap .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flap{50%{transform:scaleY(.45)}}
.rays{animation:spin 90s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway var(--sw,7.5s) ease-in-out var(--swd,0s) infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.5deg)}}
.critter{cursor:pointer}
.bounce{animation:hop var(--t,1s) ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hop{
0%,100%{transform:translateY(0) scale(1,1)}
12%,86%{transform:translateY(2px) scale(1.04,.93)}
50%{transform:translateY(var(--a,-16px)) scale(.985,1.05)}
}
.bounce.excited{animation:hopBig .36s ease-in-out 4}
@keyframes hopBig{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}62%{transform:translateY(-21px)}}
.shadow{animation:shade var(--t,1s) ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shade{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.5}}
</style>
</head>

<script>
(function(){
var s=document.querySelector('svg');
function fit(){
var a=innerWidth/Math.max(innerHeight,1);
a=Math.max(1.0625,Math.min(2.125,a));
var w=800*a;
s.setAttribute('viewBox',(600-w/2)+' 0 '+w+' 800');
}
addEventListener('resize',fit);fit();
document.querySelectorAll('.critter').forEach(function(c){
c.addEventListener('pointerdown',function(){
var b=c.querySelector('.bounce');
if(!b||b.classList.contains('excited'))return;
b.classList.add('excited');
setTimeout(function(){b.classList.remove('excited')},1500);
});
});
})();
</script>
