<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasture</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dff0fb}
  svg{display:block;width:100vw;height:100vh}
  .bouncer{transform-box:fill-box;transform-origin:50% 100%;animation:hop var(--d,.8s) var(--dl,0s) infinite}
  @keyframes hop{
    0%{transform:translateY(0) scale(1.06,.92);animation-timing-function:cubic-bezier(.3,.6,.6,1)}
    42%{transform:translateY(var(--h,-16px)) scale(.985,1.02);animation-timing-function:cubic-bezier(.5,0,.7,.45)}
    86%{transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.3,0,.7,1)}
    100%{transform:translateY(0) scale(1.06,.92)}
  }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated pasture with a cow, a sheep, a pig and a horse">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

      <ellipse cx="0" cy="14" rx="62" ry="18"/>
      <ellipse cx="-2" cy="25" rx="48" ry="11" fill="#e2edf4"/>
    </g>
    <g id="tree">

      <circle cx="-54" cy="-176" r="46" fill="#4e8f3e"/>
      <circle cx="54" cy="-176" r="46" fill="#4e8f3e"/>

      <circle cx="32" cy="-192" r="50" fill="#5da34a"/>

      <circle cx="-14" cy="-226" r="38" fill="#6fb757"/>
      <circle cx="26" cy="-220" r="34" fill="#6fb757"/>
    </g>
    <g id="tuft" stroke="#4c8a37" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 0C-2 -7 -5 -10 -8 -12"/>
      <path d="M0 0C0 -8 0 -12 1 -16"/>
      <path d="M0 0C2 -7 5 -9 8 -11"/>
    </g>
    <g id="flower">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#4c8a37" stroke-width="2"/>
      <circle cx="0" cy="-13" r="4.5" fill="#ffffff"/>
      <circle cx="0" cy="-13" r="2" fill="#ffd34d"/>
    </g>
  </defs>

  <!-- sky and grass -->

  <!-- sun with halo and rotating rays -->

        <ellipse cx="14" cy="6" rx="4" ry="3" fill="#2e2823"/>

  <!-- COW (faces right) -->

        <circle cx="-9" cy="-5" r="3.4" fill="#2f2b28"/>
        <circle cx="12" cy="-7" r="3.4" fill="#2f2b28"/>
        <ellipse cx="5" cy="12" rx="19" ry="13" fill="#efb3c0"/>

        <ellipse cx="12" cy="11" rx="2.6" ry="3.6" fill="#b26b7e"/>
      </g>

  </g>

  <!-- HORSE (faces left) -->
  <g transform="translate(1280,762) scale(-.95,.95)">
    <ellipse cx="0" cy="8" rx="125" ry="14" fill="#3c6b28" opacity=".32"/>

    <ellipse cx="0" cy="7" rx="72" ry="10" fill="#3c6b28" opacity=".32"/>

</svg>

<script>
  // Sprinkle grass tufts and flowers over the pasture (they render behind the animals)
  (function () {
    var NS = 'http://www.w3.org/2000/svg';
    var XL = 'http://www.w3.org/1999/xlink';
    var layer = document.getElementById('groundDetail');
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function sprinkle(id, count, yMin, yMax) {
      for (var i = 0; i < count; i++) {
        var g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', 'translate(' + rnd(30, 1570).toFixed(0) + ',' + rnd(yMin, yMax).toFixed(0) + ') scale(' + rnd(.7, 1.5).toFixed(2) + ')');
        var u = document.createElementNS(NS, 'use');
        u.setAttribute('href', '#' + id);
        u.setAttributeNS(XL, 'xlink:href', '#' + id);
        g.appendChild(u);
        layer.appendChild(g);
      }
    }
    sprinkle('tuft', 26, 612, 878);
    sprinkle('flower', 9, 625, 870);
  })();
</script>
</body>
</html>
