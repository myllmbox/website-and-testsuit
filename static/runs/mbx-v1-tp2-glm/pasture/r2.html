<script>
(function(){
  var starts=[0.12,0.45,0.74];
  var clouds=Array.prototype.map.call(document.querySelectorAll('.cloud'),function(g,i){
    return {g:g,v:+g.dataset.v,yf:+g.dataset.yf,s:+g.dataset.s,x:innerWidth*starts[i],y:0};
  });
  var tufts=document.getElementById('tufts');

  function ground(){
    var w=innerWidth,h=innerHeight,i,c;
    for(i=0;i<clouds.length;i++){c=clouds[i];c.y=h*c.yf;}
    var d='',s='',n=Math.round(w/34);
    for(i=0;i<n;i++){
      var f=.67+Math.random()*.3,x=Math.random()*w,y=h*f,sz=3.5+f*9;
      d+='M'+x.toFixed(1)+' '+y.toFixed(1)+'l-3 '+(-sz).toFixed(1)+
         'M'+x.toFixed(1)+' '+y.toFixed(1)+'l0 '+(-sz-2.5).toFixed(1)+
         'M'+x.toFixed(1)+' '+y.toFixed(1)+'l3 '+(-sz+1).toFixed(1);
    }
    s='<path d="'+d+'" stroke="#357a29" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".5"/>';
    var fn=6+Math.round(w/240);
    for(i=0;i<fn;i++){
      var ff=.68+Math.random()*.28,fx=Math.random()*w,fy=h*ff,r=2+ff*2.4,k;
      s+='<g transform="translate('+fx.toFixed(1)+' '+fy.toFixed(1)+')">';
      for(k=0;k<5;k++){
        var a=k*1.2566;
        s+='<circle cx="'+(Math.cos(a)*r*1.7).toFixed(1)+'" cy="'+(Math.sin(a)*r*1.7).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#ffffff"/>';
      }
      s+='<circle r="'+(r*.85).toFixed(1)+'" fill="#ffcf3d"/></g>';
    }
    tufts.innerHTML=s;
  }

  var last=performance.now();
  function frame(t){
    var dt=Math.min((t-last)/1000,.05);last=t;
    var w=innerWidth,i,c;
    for(i=0;i<clouds.length;i++){
      c=clouds[i];
      c.x+=c.v*dt;
      var m=140*c.s;
      if(c.x-m>w+10)c.x=-m-10;
      c.g.setAttribute('transform','translate('+c.x.toFixed(1)+' '+c.y.toFixed(1)+') scale('+c.s+')');
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize',ground);
  ground();
  requestAnimationFrame(frame);
})();
</script>
