<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasture</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#5C9C46}
  svg{display:block;width:100%;height:100%}
  .bouncer{will-change:transform}
  .hop1{animation:hop .85s ease-in-out infinite}
  .hop2{animation:hop 1.05s -.4s ease-in-out infinite}
  .hop3{animation:hop .75s -.55s ease-in-out infinite}
  .hop4{animation:hop .95s -.25s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}42%{transform:translateY(-16px)}58%{transform:translateY(-13px)}}
  .shadow{transform-box:fill-box;transform-origin:50% 50%;fill:#2E5B28;opacity:.26}
  .sh1{animation:shade .85s ease-in-out infinite}
  .sh2{animation:shade 1.05s -.4s ease-in-out infinite}
  .sh3{animation:shade .75s -.55s ease-in-out infinite}
  .sh4{animation:shade .95s -.25s ease-in-out infinite}
  @keyframes shade{0%,100%{transform:scaleX(1);opacity:.26}42%{transform:scaleX(.7);opacity:.12}58%{transform:scaleX(.76);opacity:.15}}
</style>
</head>

<script>
(function(){
  var clouds=[].slice.call(document.querySelectorAll('.cloud')).map(function(el,i){
    return {el:el,x:[200,760,1240][i],y:[115,235,168][i],v:[14,22,9][i]};
  });
  var birds=[].slice.call(document.querySelectorAll('.bird')).map(function(el,i){
    return {el:el,x:[420,1150][i],y:[205,158][i],v:[26,20][i],s:[1,.8][i],ph:i*2.1};
  });
  function cloudT(c){c.el.setAttribute('transform','translate('+c.x+' '+c.y+')');}
  function birdT(b,t){b.el.setAttribute('transform','translate('+b.x+' '+(b.y+Math.sin(t*1.6+b.ph)*7)+') scale('+b.s+')');}
  clouds.forEach(cloudT);
  birds.forEach(function(b){birdT(b,0);});
  var last=null;
  function frame(ts){
    if(last===null)last=ts;
    var dt=Math.min((ts-last)/1000,.05);
    last=ts;
    for(var i=0;i<clouds.length;i++){
      var c=clouds[i];
      c.x+=c.v*dt;
      if(c.x>1830)c.x=-270;
      cloudT(c);
    }
    for(var j=0;j<birds.length;j++){
      var b=birds[j];
      b.x-=b.v*dt;
      if(b.x<-50)b.x=1650;
      birdT(b,ts/1000);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
