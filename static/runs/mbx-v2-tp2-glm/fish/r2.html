<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0c3450}
  svg{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<svg id="sea" width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="none">
<defs>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fd0dc"/>
    <stop offset="0.45" stop-color="#3984a8"/>
    <stop offset="1" stop-color="#0c3450"/>
  </linearGradient>
  <linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dcb98c"/>
    <stop offset="1" stop-color="#b0805a"/>
  </linearGradient>
  <linearGradient id="gSand2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a5795a"/>
    <stop offset="1" stop-color="#7c5a42"/>
  </linearGradient>
  <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8f7fb" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#e8f7fb" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f78a52"/>
    <stop offset="1" stop-color="#d44a1c"/>
  </linearGradient>
  <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe36b"/>
    <stop offset="1" stop-color="#f2ae2b"/>
  </linearGradient>
  <clipPath id="clipA"><ellipse rx="58" ry="42"/></clipPath>
  <clipPath id="clipB"><ellipse rx="55" ry="17"/></clipPath>
</defs>

<rect width="100%" height="100%" fill="url(#water)"/>
<g id="rays"></g>

<!-- slender golden fish, drawn facing right -->
<g id="fishB">
  <g transform="translate(-48,0)">
    <path d="M2 0 L-34 -20 Q-23 0 -34 20 Z" fill="#dda41f"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="-10;10;-10" dur="0.7s" repeatCount="indefinite"/>
  </g>
  <path d="M-40 -11 Q-8 -27 34 -11 Q-6 -19 -40 -11 Z" fill="#dda41f"/>
  <ellipse rx="55" ry="17" fill="url(#gB)"/>
  <g clip-path="url(#clipB)">
    <path d="M-56 3 L52 3" stroke="#2e86a8" stroke-width="5" opacity="0.6" fill="none"/>
  </g>
  <g transform="translate(-2,9)">
    <path d="M0 0 Q-10 15 -19 6 Q-5 3 0 0 Z" fill="#dda41f"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="12;-12;12" dur="0.62s" repeatCount="indefinite"/>
  </g>
  <circle cx="36" cy="-4" r="6" fill="#ffffff"/>
  <circle cx="38" cy="-4" r="3.1" fill="#22262d"/>
  <circle cx="39.6" cy="-5.8" r="1.2" fill="#ffffff"/>
  <path d="M52 3 Q47 7.5 41.5 6.5" stroke="#9a6b12" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</g>

<g id="floorG"></g>
<g id="weedG"></g>

<!-- plump vermilion fish, drawn facing right -->
<g id="fishA">
  <g transform="translate(-50,0)">
    <path d="M2 0 L-38 -30 L-38 30 Z" fill="#b93a15"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="-8;8;-8" dur="0.9s" repeatCount="indefinite"/>
  </g>
  <path d="M-32 -32 Q-2 -78 32 -30 Q0 -42 -32 -32 Z" fill="#b93a15"/>
  <ellipse rx="58" ry="42" fill="url(#gA)"/>
  <g clip-path="url(#clipA)" fill="none" stroke="#fdf1de" stroke-linecap="round">
    <path d="M-2 -46 Q-11 0 1 44" stroke-width="13"/>
    <path d="M25 -41 Q17 -3 27 37" stroke-width="8"/>
  </g>
  <g transform="translate(7,13)">
    <path d="M0 0 Q-17 25 -29 10 Q-6 6 0 0 Z" fill="#a83318"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="13;-13;13" dur="0.8s" repeatCount="indefinite"/>
  </g>
  <circle cx="33" cy="-12" r="9" fill="#ffffff"/>
  <circle cx="35.5" cy="-12" r="4.6" fill="#22262d"/>
  <circle cx="37.5" cy="-14.5" r="1.6" fill="#ffffff"/>
  <path d="M52 8 Q46 15 37 13" stroke="#7c2a10" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<g id="bubG"></g>
</svg>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("sea");
var raysG=document.getElementById("rays"),floorG=document.getElementById("floorG"),
    weedG=document.getElementById("weedG"),bubG=document.getElementById("bubG");
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}

var W=0,H=0,floorY=0,floorH=0,fScale=1;

/* fish state: big round vermilion fish (slow, front) vs small slender golden fish (fast, behind weeds) */
var fish=[
 {el:document.getElementById("fishA"),dir:1, frac:0.42,speed:70, half:96,amp:8,bf:0.9,ph:0},
 {el:document.getElementById("fishB"),dir:-1,frac:0.63,speed:135,half:90,amp:5,bf:1.5,ph:2.1}
];
fish.forEach(function(f){f.x=Math.random()*800;});

/* bubbles */
var NB=9,bubbles=[];
function respawn(b,init){
  b.r=3+Math.random()*6.5;
  b.v=22+(11-b.r)*10.5;                 /* smaller bubbles rise faster */
  b.x0=24+Math.random()*Math.max(50,W-48);
  b.wa=6+Math.random()*10;
  b.wf=0.9+Math.random()*1.5;
  b.y=init?Math.random()*floorY*0.95:floorY-6-Math.random()*floorH*0.35;
  b.c.setAttribute("r",b.r);
  b.h.setAttribute("cx",-b.r*0.35);
  b.h.setAttribute("cy",-b.r*0.35);
  b.h.setAttribute("r",Math.max(1,b.r*0.3));
}
for(var i=0;i<NB;i++){
  var g=el("g",{},bubG);
  var c=el("circle",{fill:"rgba(213,240,250,0.2)",stroke:"rgba(238,250,255,0.8)","stroke-width":1.4},g);
  var h=el("circle",{fill:"rgba(255,255,255,0.85)"},g);
  bubbles.push({el:g,c:c,h:h,x0:0,y:0,r:5,v:60,wa:8,wf:1.2,ph:Math.random()*6.28});
}

/* scenery */
function dune(top,amp,ph,grad){
  var d="M0 "+H+" L0 "+top.toFixed(1),n=36;
  for(var i=1;i<=n;i++){
    var t=i/n,x=W*t;
    var y=top+Math.sin(t*10+ph)*amp+Math.sin(t*23+ph*2.3)*amp*0.35;
    d+=" L"+x.toFixed(1)+" "+y.toFixed(1);
  }
  el("path",{d:d+" L"+W+" "+H+" Z",fill:grad},floorG);
}
function rock(x,ry,f,hl){
  var rx=ry*1.75,cy=floorY+floorH*0.3;
  el("ellipse",{cx:x,cy:cy,rx:rx,ry:ry,fill:f},floorG);
  el("ellipse",{cx:x-rx*0.28,cy:cy-ry*0.38,rx:rx*0.5,ry:ry*0.42,fill:hl,opacity:0.5},floorG);
}
function plant(x,h){
  var g=el("g",{transform:"translate("+x+" "+(floorY+floorH*0.18)+")"},weedG);
  var fr=[
    {m:1.0, w:9, c:"#2e7d4f",d:5.6,b:0,   s:1},
    {m:0.68,w:7, c:"#3f9c66",d:4.6,b:-1.2,s:-1},
    {m:1.22,w:11,c:"#256b44",d:6.6,b:-2.3,s:1},
    {m:0.45,w:6, c:"#54b47b",d:3.9,b:-0.7,s:-1}
  ];
  fr.forEach(function(f){
    var hh=h*f.m,sw=hh*0.17*f.s;
    var p=el("path",{d:"M0 0 C "+sw.toFixed(1)+" "+(-hh*0.3).toFixed(1)+" "+(-sw*1.25).toFixed(1)+" "+(-hh*0.62).toFixed(1)+" "+(sw*0.45).toFixed(1)+" "+(-hh).toFixed(1),stroke:f.c,"stroke-width":f.w,fill:"none","stroke-linecap":"round"},g);
    el("animateTransform",{attributeName:"transform",type:"rotate",values:"-5;5;-5",dur:f.d+"s",begin:f.b+"s",repeatCount:"indefinite"},p);
  });
}
function buildScene(){
  raysG.replaceChildren();floorG.replaceChildren();weedG.replaceChildren();
  /* light shafts */
  for(var i=0;i<3;i++){
    var x0=W*(0.14+i*0.28)+Math.sin(i*7)*W*0.02,w=W*0.045*(1+i*0.3);
    var p=el("polygon",{points:x0+",-20 "+(x0+w)+",-20 "+(x0+w*2.5)+","+H+" "+(x0+w*1.15)+","+H,fill:"url(#rayG)",opacity:0.07},raysG);
    el("animate",{attributeName:"opacity",values:"0.04;0.11;0.04",dur:(6.5+i*2.1)+"s",begin:(-i*2.4)+"s",repeatCount:"indefinite"},p);
  }
  /* sand dunes */
  dune(floorY-floorH*0.34,floorH*0.26,1.4,"url(#gSand2)");
  dune(floorY+floorH*0.04,floorH*0.18,4.2,"url(#gSand)");
  /* rocks */
  rock(W*0.28,floorH*0.46,"#6e5a48","#8d7663");
  rock(W*0.32,floorH*0.30,"#54463a","#6e5d4e");
  rock(W*0.63,floorH*0.40,"#75604c","#93795f");
  rock(W*0.67,floorH*0.26,"#4e4034","#655545");
  rock(W*0.90,floorH*0.34,"#6a564a","#866e5e");
  /* starfish */
  var st=Math.min(1.5,Math.max(0.7,floorH/95));
  el("path",{d:"M0 -13 L3.8 -4 14 -3.6 6.2 3 8.8 12.6 0 7 -8.8 12.6 -6.2 3 -14 -3.6 -3.8 -4 Z",fill:"#cf6b4e",stroke:"#a34e35","stroke-width":1.4,"stroke-linejoin":"round",transform:"translate("+(W*0.46)+" "+(floorY+floorH*0.5)+") rotate(-18) scale("+st+")"},floorG);
  /* grass tufts */
  [[0.2,1],[0.52,0.8],[0.84,1.15]].forEach(function(a){
    var s=Math.max(0.6,floorH/110)*a[1],x=W*a[0],y=floorY+floorH*0.32;
    el("path",{d:"M0 0 Q-5 "+(-14*s)+" -9 "+(-20*s)+" M0 0 Q1 "+(-16*s)+" 5 "+(-24*s)+" M0 0 Q6 "+(-10*s)+" 12 "+(-15*s),stroke:"#3f8f5c","stroke-width":3*s,fill:"none","stroke-linecap":"round",transform:"translate("+x+" "+y+")"},floorG);
  });
  /* two seaweed plants */
  plant(W*0.115,H*0.24);
  plant(W*0.795,H*0.185);
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  floorH=H*0.12;floorY=H-floorH;
  fScale=Math.min(1.15,Math.max(0.55,Math.min(W,H)/820));
  buildScene();
  fish.forEach(function(f,i){
    f.baseY=H*f.frac;
    f.s=fScale*(i===0?1:0.95);
    f.sp=f.speed*Math.max(0.65,fScale);
    f.m=f.half*f.s+50;
    f.x=Math.min(Math.max(f.x,-f.m-10),W+f.m+10);
  });
  bubbles.forEach(function(b){
    b.x0=Math.min(b.x0,Math.max(24,W-24));
    if(b.y>floorY-4)b.y=floorY-6-Math.random()*floorH*0.3;
    respawnInit(b);
  });
}
function respawnInit(b){respawn(b,true);}
bubbles.forEach(respawnInit);
window.addEventListener("resize",resize);
resize();

/* animation loop */
var last=performance.now();
function tick(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var t=now/1000;
  for(var i=0;i<fish.length;i++){
    var f=fish[i];
    f.x+=f.dir*f.sp*dt;
    if(f.dir>0&&f.x>W+f.m)f.x=-f.m;
    else if(f.dir<0&&f.x<-f.m)f.x=W+f.m;
    var y=f.baseY+Math.sin(t*f.bf+f.ph)*f.amp;
    var tilt=Math.sin(t*f.bf+f.ph+1.3)*4;
    f.el.setAttribute("transform","translate("+f.x.toFixed(1)+" "+y.toFixed(1)+") rotate("+tilt.toFixed(2)+") scale("+(f.dir*f.s).toFixed(3)+" "+f.s.toFixed(3)+")");
  }
  for(var j=0;j<bubbles.length;j++){
    var b=bubbles[j];
    b.y-=b.v*dt;
    if(b.y<-b.r*2-4)respawn(b,false);
    var x=b.x0+Math.sin(t*b.wf+b.ph)*b.wa;
    b.el.setAttribute("transform","translate("+x.toFixed(1)+" "+b.y.toFixed(1)+")");
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
