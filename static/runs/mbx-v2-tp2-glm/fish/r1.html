<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beneath the Surface</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e4a68}
  svg{display:block;width:100vw;height:100vh}
  .ray{animation:shimmer 8s ease-in-out infinite alternate}
  .r2{animation-duration:12.5s;animation-delay:-4s}
  .r3{animation-duration:6.5s;animation-delay:-2.5s}
  @keyframes shimmer{from{opacity:.05}to{opacity:.15}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e4ee"/>
      <stop offset=".38" stop-color="#5cb9d2"/>
      <stop offset=".72" stop-color="#267ba1"/>
      <stop offset="1" stop-color="#0e4a68"/>
    </linearGradient>
    <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eed5a0"/>
      <stop offset=".55" stop-color="#d9b478"/>
      <stop offset="1" stop-color="#b3854e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f2fbff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f2fbff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc978"/>
      <stop offset=".55" stop-color="#f58a1f"/>
      <stop offset="1" stop-color="#e06f12"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df0e2"/>
      <stop offset=".55" stop-color="#3db8a8"/>
      <stop offset="1" stop-color="#23958a"/>
    </linearGradient>
    <clipPath id="clipA"><ellipse rx="74" ry="44"/></clipPath>
    <clipPath id="clipB"><ellipse rx="62" ry="18"/></clipPath>
  </defs>

  <rect id="water" fill="url(#sea)"/>
  <ellipse id="glowEl" fill="url(#glow)"/>

  <g id="floorwrap">
    <path id="sand" fill="url(#sandG)"/>
    <path id="rim" fill="none" stroke="#f2dcae" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
    <path id="weed1" fill="#2e8b57" stroke="#20653d" stroke-width="1.5"
      d="M-9,2 C-17,-45 15,-86 -7,-130 C-15,-157 -5,-176 -2,-199 L4,-198 C7,-173 -1,-152 7,-121 C19,-79 -9,-42 -3,2 Z"/>
    <path id="weed2" fill="#4aa562" stroke="#2f7f47" stroke-width="1.5"
      d="M-12,2 C-21,-34 14,-60 -8,-94 C-15,-112 -7,-122 -4,-133 L6,-132 C8,-114 1,-101 9,-77 C19,-44 -7,-21 -4,2 Z"/>
    <path id="weed3" fill="#5f8f3e" stroke="#476f2c" stroke-width="1.5"
      d="M-8,2 C5,-38 -18,-78 4,-118 C13,-141 7,-157 3,-170 L10,-168 C14,-149 17,-135 7,-111 C-9,-71 13,-37 5,2 Z"/>
    <g id="rockL">
      <path d="M-50,0 Q-58,-24 -36,-38 Q-14,-52 12,-40 Q40,-28 46,0 Z" fill="#8b7d6b"/>
      <path d="M-36,-38 Q-14,-52 12,-40 Q2,-26 -14,-25 Q-30,-30 -36,-38 Z" fill="#a2917c" opacity=".85"/>
    </g>
    <g id="rockR">
      <path d="M-62,0 Q-70,-28 -44,-44 Q-14,-58 16,-46 Q48,-34 56,0 Z" fill="#7e7264"/>
      <path d="M4,-45 Q0,-24 8,0 L26,0 Q19,-26 23,-43 Z" fill="#5e5449" opacity=".9"/>
      <path d="M-44,-44 Q-14,-58 16,-46 Q4,-34 -14,-33 Q-32,-38 -44,-44 Z" fill="#948675" opacity=".8"/>
    </g>
    <g id="star">
      <path d="M0,-16 L4.1,-5.7 L15.2,-4.9 L6.7,2.2 L9.4,12.9 L0,7 L-9.4,12.9 L-6.7,2.2 L-15.2,-4.9 L-4.1,-5.7 Z"
        fill="#e08a5a" stroke="#c26a3c" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="2" cy="-5" r="1.3" fill="#b96a3e"/><circle cx="-4.5" cy="3" r="1.3" fill="#b96a3e"/><circle cx="4" cy="5.5" r="1.3" fill="#b96a3e"/>
    </g>
    <g id="tuft1" fill="#3f9b5c" stroke="#2f7f47" stroke-width="1">
      <ellipse cx="-11" cy="-12" rx="5.5" ry="15" transform="rotate(-20 -11 -12)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="19" fill="#4aa562"/>
      <ellipse cx="11" cy="-11" rx="5.5" ry="14" transform="rotate(20 11 -11)"/>
      <ellipse cx="-5" cy="-9" rx="4.5" ry="12" transform="rotate(-8 -5 -9)" fill="#4aa562"/>
      <ellipse cx="6" cy="-10" rx="4.5" ry="13" transform="rotate(8 6 -10)"/>
    </g>
    <g id="tuft2" fill="#2f7f4a" stroke="#246139" stroke-width="1">
      <ellipse cx="-10" cy="-11" rx="5" ry="14" transform="rotate(-22 -10 -11)"/>
      <ellipse cx="0" cy="-15" rx="5.5" ry="18" fill="#3a9458"/>
      <ellipse cx="10" cy="-10" rx="5" ry="13" transform="rotate(22 10 -10)"/>
    </g>
    <g id="pebbles"></g>
  </g>

  <g id="specks"></g>
  <g id="bubbles"></g>

  <g id="fishA">
    <g id="tailA"><path d="M-52,0 L-102,-38 Q-88,0 -102,36 Z" fill="#d96a14" stroke="#b3540e" stroke-width="1.5" stroke-linejoin="round"/></g>
    <ellipse rx="74" ry="44" fill="url(#gA)" stroke="#c05d12" stroke-width="2"/>
    <g clip-path="url(#clipA)" fill="#fff" opacity=".92">
      <path d="M18,-48 C30,-16 30,16 18,48 L36,48 C46,16 46,-16 36,-48 Z"/>
      <path d="M-16,-48 C-6,-16 -6,16 -16,48 L0,48 C8,16 8,-16 0,-48 Z"/>
      <path d="M-50,-48 C-44,-16 -44,16 -50,48 L-38,48 C-33,16 -33,-16 -38,-48 Z"/>
    </g>
    <path d="M-34,-40 Q-2,-70 30,-36 Q0,-52 -34,-40 Z" fill="#d96a14" stroke="#b3540e" stroke-width="1.5"/>
    <path d="M14,10 Q34,36 8,50 Q0,30 14,10 Z" fill="#e8842a" stroke="#b3540e" stroke-width="1.5"/>
    <path d="M50,-10 Q40,0 50,12" fill="none" stroke="#c05d12" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
    <path d="M60,10 Q66,16 72,8" fill="none" stroke="#8a3d08" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="-15" r="8" fill="#fff" stroke="#a8510f" stroke-width="1.2"/>
    <circle cx="29" cy="-15" r="4.2" fill="#1c2733"/>
    <circle cx="30.6" cy="-17" r="1.4" fill="#fff"/>
  </g>

  <g id="fishB">
    <g id="tailB"><path d="M-48,0 L-88,-25 Q-77,0 -88,25 Z" fill="#1e8f84" stroke="#12625b" stroke-width="1.5" stroke-linejoin="round"/></g>
    <ellipse rx="62" ry="18" fill="url(#gB)" stroke="#12625b" stroke-width="2"/>
    <g clip-path="url(#clipB)"><path d="M-58,2 Q0,-7 58,-2 L58,3 Q0,1 -58,8 Z" fill="#0f6a61" opacity=".4"/></g>
    <path d="M-38,-14 Q0,-31 32,-13 Q-2,-21 -38,-14 Z" fill="#1e8f84" stroke="#12625b" stroke-width="1.5"/>
    <path d="M8,7 Q20,22 2,24 Q-1,14 8,7 Z" fill="#1e8f84" stroke="#12625b" stroke-width="1.2"/>
    <path d="M54,4 Q60,8 64,3" fill="none" stroke="#0d4f49" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="44" cy="-5" r="5.5" fill="#fff" stroke="#0d4f49" stroke-width="1"/>
    <circle cx="45.8" cy="-5" r="2.8" fill="#14232b"/>
    <circle cx="46.9" cy="-6.3" r="1" fill="#fff"/>
  </g>

  <g id="rays" fill="#e6f7fd">
    <polygon id="ray1" class="ray" points="0,0 0,0 0,0 0,0"/>
    <polygon id="ray2" class="ray r2" points="0,0 0,0 0,0 0,0"/>
    <polygon id="ray3" class="ray r3" points="0,0 0,0 0,0 0,0"/>
  </g>
</svg>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
function $(id){return document.getElementById(id)}
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var svg=$("scene"),water=$("water"),glowEl=$("glowEl"),sand=$("sand"),rim=$("rim");
var rockL=$("rockL"),rockR=$("rockR"),star=$("star"),tuft1=$("tuft1"),tuft2=$("tuft2");
var fishA=$("fishA"),fishB=$("fishB"),tailA=$("tailA"),tailB=$("tailB");
var rays=[$("ray1"),$("ray2"),$("ray3")];
var W=0,H=0,floorY=0,ventX=0,scale=1,t=0,ax=0,bx=0;

var weeds=[
 {e:$("weed1"),f:.185,off:6,amp:3.2,sp:.7,ph:0,x:0,y:0},
 {e:$("weed2"),f:.238,off:4,amp:2.6,sp:.9,ph:2.1,x:0,y:0},
 {e:$("weed3"),f:.765,off:6,amp:3.6,sp:.6,ph:4.2,x:0,y:0}];

var pebbles=[];
[[.05,12,5,"#a5865a",6,-10],[.115,8,4,"#93764e",10,14],[.305,15,6,"#b59a6d",7,-6],
 [.52,9,4,"#93764e",9,0],[.585,13,5,"#a5865a",12,8],[.945,11,5,"#9c7f55",8,-12]]
.forEach(function(p){
 pebbles.push({e:el("ellipse",{rx:p[1],ry:p[2],fill:p[3]},$("pebbles")),f:p[0],off:p[4],rot:p[5]});
});

var bubbles=[];
[13,8,11,6,9,14,7].forEach(function(r,i){
 var g=el("g",{},$("bubbles"));
 el("circle",{r:r,fill:"rgba(214,240,250,0.12)",stroke:"rgba(235,250,255,0.6)","stroke-width":Math.max(1,r*.13)},g);
 el("circle",{r:(r*.3).toFixed(1),cx:(-r*.34).toFixed(1),cy:(-r*.36).toFixed(1),fill:"rgba(255,255,255,0.7)"},g);
 bubbles.push({g:g,r:r,x:0,y:0,v:0,i:0,vent:i<3,wa:6+Math.random()*9,wf:.8+Math.random()*1.1,ph:Math.random()*6.28});
});

var specks=[];
for(var i=0;i<12;i++){
 var c=el("circle",{r:(0.9+Math.random()*1.1).toFixed(1),fill:"rgba(210,235,245,0.28)"},$("specks"));
 specks.push({c:c,x:0,y:0,i:0,v:5+Math.random()*9,ph:Math.random()*6.28});
}

function spawn(b){
 b.y=floorY-b.r-4-Math.random()*26;
 b.x=b.vent?ventX+(Math.random()*64-32):Math.random()*W;
 b.v=40+900/b.r;
}

function layout(){
 W=window.innerWidth;H=window.innerHeight;
 svg.setAttribute("viewBox","0 0 "+W+" "+H);
 water.setAttribute("width",W);water.setAttribute("height",H);
 floorY=H*.875;scale=Math.max(.55,Math.min(1.15,W/1200));
 ventX=W*.8+14;
 var fy=floorY;
 glowEl.setAttribute("cx",W*.5);glowEl.setAttribute("cy",-H*.05);
 glowEl.setAttribute("rx",W*.46);glowEl.setAttribute("ry",H*.32);
 var wave="M0,"+(fy+10)+" C"+(W*.13)+","+(fy-2)+" "+(W*.22)+","+(fy+16)+" "+(W*.36)+","+(fy+6)+
  " C"+(W*.5)+","+(fy-6)+" "+(W*.6)+","+(fy+14)+" "+(W*.74)+","+(fy+7)+
  " C"+(W*.86)+","+(fy+2)+" "+(W*.93)+","+(fy+12)+" "+W+","+(fy+4);
 sand.setAttribute("d",wave+" L"+W+","+H+" L0,"+H+" Z");
 rim.setAttribute("d",wave);
 rockL.setAttribute("transform","translate("+(W*.135)+" "+(fy+6)+")");
 rockR.setAttribute("transform","translate("+(W*.8)+" "+(fy+6)+")");
 star.setAttribute("transform","translate("+(W*.42)+" "+(fy+14)+") rotate(-18)");
 tuft1.setAttribute("transform","translate("+(W*.47)+" "+(fy+8)+")");
 tuft2.setAttribute("transform","translate("+(W*.915)+" "+(fy+8)+") scale(.8)");
 pebbles.forEach(function(p){p.e.setAttribute("transform","translate("+(p.f*W)+" "+(fy+p.off)+") rotate("+p.rot+")")});
 weeds.forEach(function(w){w.x=W*w.f;w.y=fy+w.off});
 [[W*.20,W*.07,40,H*.16,H*.5],[W*.40,W*.11,60,H*.22,H*.64],[W*.60,W*.055,30,H*.13,H*.44]]
 .forEach(function(p,k){
  rays[k].setAttribute("points",p[0]+",-2 "+(p[0]+p[1])+",-2 "+(p[0]+p[1]+p[2]-p[3])+","+p[4]+" "+(p[0]+p[2]*.6-p[3])+","+p[4]);
 });
 if(!ax)ax=W*.62;
 if(!bx)bx=W*.25;
 bubbles.forEach(function(b){
  if(!b.i){b.i=1;spawn(b);}
  else{
   if(b.x>W+30||b.x<-30)b.x=Math.random()*W;
   if(b.y>floorY-b.r)b.y=floorY-b.r-Math.random()*24;
  }
 });
 specks.forEach(function(s){
  if(!s.i){s.i=1;s.x=Math.random()*W;s.y=Math.random()*H;}
  else{if(s.x>W)s.x=W-4;if(s.y>H)s.y=H-4;}
 });
}

function step(dt){
 t+=dt;
 ax-=70*dt;if(ax<-170)ax=W+170;
 fishA.setAttribute("transform","translate("+ax.toFixed(1)+" "+(H*.52+Math.sin(t*1.5+.4)*10).toFixed(1)+
  ") rotate("+(Math.cos(t*1.5+.4)*3).toFixed(2)+") scale("+(-scale).toFixed(3)+" "+scale.toFixed(3)+")");
 tailA.setAttribute("transform","rotate("+(Math.sin(t*7)*11).toFixed(2)+" -50 0)");
 bx+=138*dt;if(bx>W+170)bx=-170;
 fishB.setAttribute("transform","translate("+bx.toFixed(1)+" "+(H*.3+Math.sin(t*2.2+1.8)*7).toFixed(1)+
  ") rotate("+(Math.cos(t*2.2+1.8)*3.5).toFixed(2)+") scale("+scale.toFixed(3)+" "+scale.toFixed(3)+")");
 tailB.setAttribute("transform","rotate("+(Math.sin(t*9.5)*13).toFixed(2)+" -46 0)");
 weeds.forEach(function(w){
  w.e.setAttribute("transform","translate("+w.x.toFixed(1)+" "+w.y.toFixed(1)+") rotate("+(Math.sin(t*w.sp+w.ph)*w.amp).toFixed(2)+")");
 });
 bubbles.forEach(function(b){
  b.y-=b.v*dt;
  if(b.y<-b.r-10)spawn(b);
  b.g.setAttribute("transform","translate("+(b.x+Math.sin(t*b.wf+b.ph)*b.wa).toFixed(1)+" "+b.y.toFixed(1)+")");
 });
 specks.forEach(function(s){
  s.y+=s.v*dt;s.x+=Math.sin(t*.6+s.ph)*9*dt;
  if(s.y>H+4){s.y=-4;s.x=Math.random()*W;}
  if(s.x>W+4)s.x=-4;else if(s.x<-4)s.x=W+4;
  s.c.setAttribute("cx",s.x.toFixed(1));s.c.setAttribute("cy",s.y.toFixed(1));
 });
}

window.addEventListener("resize",layout);
layout();
var last=performance.now();
var reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){
 var dt=Math.min((now-last)/1000,.05);last=now;
 step(dt);
 requestAnimationFrame(frame);
}
if(reduced){t=6.4;step(.016);}
else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
