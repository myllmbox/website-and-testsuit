<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadow Bounce</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#4f9440}
  svg{display:block;width:100vw;height:100vh}
  @keyframes drift{from{transform:translateX(1720px)}to{transform:translateX(-300px)}}
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:95s;animation-delay:-8s}
  .c2{animation-duration:140s;animation-delay:-80s}
  .c3{animation-duration:78s;animation-delay:-30s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .bounce{animation-name:hop;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  .a-horse{animation-duration:.9s;animation-delay:-.15s}
  .a-cow{animation-duration:.7s;animation-delay:-.4s}
  .a-sheep{animation-duration:.6s;animation-delay:-.55s}
  .a-pig{animation-duration:.8s;animation-delay:-.25s}
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated pasture with a bouncing horse, cow, sheep and pig under a sun and drifting clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4ee"/>
      <stop offset=".55" stop-color="#bfe6f9"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d977"/>
      <stop offset=".45" stop-color="#7cc358"/>
      <stop offset="1" stop-color="#4f9440"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffee9d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffee9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset=".65" stop-color="#ffd94d"/>
      <stop offset="1" stop-color="#ffc23a"/>
    </radialGradient>
    <clipPath id="cowClip"><ellipse cx="0" cy="-88" rx="90" ry="48"/></clipPath>
    <g id="tuft" fill="none" stroke="#3f8a34" stroke-width="2.5" stroke-linecap="round">
      <path d="M-7 0 Q-9 -9 -13 -13"/><path d="M0 0 Q0 -11 1 -15"/><path d="M7 0 Q10 -8 13 -12"/>
    </g>
    <g id="flower">
      <g fill="#ffffff">
        <circle cx="0" cy="-4" r="2.7"/><circle cx="3.8" cy="-1.2" r="2.7"/><circle cx="2.4" cy="3.2" r="2.7"/><circle cx="-2.4" cy="3.2" r="2.7"/><circle cx="-3.8" cy="-1.2" r="2.7"/>
      </g>
      <circle r="2.3" fill="#ffcf4d"/>
    </g>
    <g id="tree">
      <ellipse cx="3" cy="3" rx="50" ry="8" fill="#255a20" opacity=".3"/>
      <path d="M-11 0 C-9 -22 -8 -42 -6 -58 Q0 -66 6 -58 C8 -42 9 -22 11 0 Z" fill="#7c4a2a"/>
      <path d="M-2 -44 Q-20 -56 -30 -55" stroke="#7c4a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M2 -50 Q18 -62 27 -61" stroke="#7c4a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#2e7d44">
        <circle cx="0" cy="-96" r="40"/><circle cx="-36" cy="-76" r="28"/><circle cx="36" cy="-76" r="28"/>
        <circle cx="-20" cy="-112" r="26"/><circle cx="22" cy="-110" r="25"/><circle cx="0" cy="-70" r="30"/>
      </g>
      <g fill="#43a05c">
        <circle cx="-14" cy="-108" r="16"/><circle cx="16" cy="-98" r="13"/><circle cx="-32" cy="-84" r="11"/><circle cx="4" cy="-126" r="11"/>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1160" cy="185" r="100" fill="url(#halo)">
    <animate attributeName="r" values="96;106;96" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#ffcf4d" stroke-width="7" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 1160 185" to="360 1160 185" dur="80s" repeatCount="indefinite"/>
    <line x1="1228" y1="185" x2="1256" y2="185"/>
    <line x1="1208" y1="233" x2="1228" y2="253"/>
    <line x1="1160" y1="253" x2="1160" y2="281"/>
    <line x1="1112" y1="233" x2="1092" y2="253"/>
    <line x1="1092" y1="185" x2="1064" y2="185"/>
    <line x1="1112" y1="137" x2="1092" y2="117"/>
    <line x1="1160" y1="117" x2="1160" y2="89"/>
    <line x1="1208" y1="137" x2="1228" y2="117"/>
  </g>
  <circle cx="1160" cy="185" r="55" fill="url(#sunG)"/>

  <!-- clouds -->
  <g transform="translate(0,150)"><g class="cloud c1"><g fill="#ffffff" opacity=".95">
    <ellipse cx="0" cy="0" rx="46" ry="22"/><ellipse cx="-32" cy="-6" rx="30" ry="17"/>
    <ellipse cx="30" cy="-9" rx="32" ry="18"/><ellipse cx="2" cy="-20" rx="27" ry="16"/><ellipse cx="-8" cy="7" rx="40" ry="13"/>
  </g></g></g>
  <g transform="translate(0,248)"><g class="cloud c2"><g fill="#f6fbff" opacity=".95" transform="scale(.78)">
    <ellipse cx="0" cy="0" rx="46" ry="22"/><ellipse cx="-32" cy="-6" rx="30" ry="17"/>
    <ellipse cx="30" cy="-9" rx="32" ry="18"/><ellipse cx="2" cy="-20" rx="27" ry="16"/><ellipse cx="-8" cy="7" rx="40" ry="13"/>
  </g></g></g>
  <g transform="translate(0,92)"><g class="cloud c3"><g fill="#ffffff" opacity=".95" transform="scale(1.18)">
    <ellipse cx="0" cy="0" rx="46" ry="22"/><ellipse cx="-32" cy="-6" rx="30" ry="17"/>
    <ellipse cx="30" cy="-9" rx="32" ry="18"/><ellipse cx="2" cy="-20" rx="27" ry="16"/><ellipse cx="-8" cy="7" rx="40" ry="13"/>
  </g></g></g>

  <!-- grass -->
  <rect x="0" y="585" width="1600" height="315" fill="url(#grass)"/>
  <rect x="0" y="585" width="1600" height="10" fill="#dff2c8" opacity=".5"/>
  <ellipse cx="460" cy="588" rx="22" ry="8" fill="#63ab52"/>

  <use href="#tuft" transform="translate(150,742)"/>

  <use href="#tuft" transform="translate(865,660)"/>
  <use href="#tuft" transform="translate(1005,795)"/>
  <use href="#tuft" transform="translate(1230,872)"/>
  <use href="#tuft" transform="translate(1420,745) scale(1.2)"/>
  <use href="#tuft" transform="translate(1560,830)"/>
  <use href="#flower" transform="translate(283,788)"/>
  <use href="#flower" transform="translate(452,872) scale(1.1)"/>
  <use href="#flower" transform="translate(772,884)"/>
  <use href="#flower" transform="translate(1122,662)"/>
  <use href="#flower" transform="translate(1338,802) scale(1.15)"/>
  <use href="#flower" transform="translate(1508,700)"/>

  <!-- trees -->
  <g transform="translate(240,655) scale(1.22)">
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1.5;1.6;-1.5" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="5.2s" begin="-1s" repeatCount="indefinite"/>
    <use href="#tree"/>
  </g>
  <g transform="translate(1352,658) scale(1.32)">
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1.3;1.5;-1.3" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="6.4s" begin="-3s" repeatCount="indefinite"/>
    <use href="#tree"/>
  </g>
  <g transform="translate(755,622) scale(.72)">
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1.8;1.8;-1.8" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4.6s" begin="-2s" repeatCount="indefinite"/>
    <use href="#tree"/>
  </g>

  <!-- sheep -->
  <g transform="translate(1190,772) scale(.8)">
    <ellipse cx="-6" cy="5" rx="82" ry="9" fill="#255a20" opacity=".28"/>
    <g class="bounce a-sheep">
      <g fill="#6b645c"><rect x="-56" y="-46" width="9" height="46" rx="4"/><rect x="32" y="-46" width="9" height="46" rx="4"/></g>
      <g fill="#332e29"><rect x="-56" y="-9" width="9" height="9" rx="2"/><rect x="32" y="-9" width="9" height="9" rx="2"/></g>
      <g fill="#4e4741"><rect x="-42" y="-48" width="10" height="48" rx="4"/><rect x="46" y="-48" width="10" height="48" rx="4"/></g>
      <g fill="#332e29"><rect x="-42" y="-9" width="10" height="9" rx="2"/><rect x="46" y="-9" width="10" height="9" rx="2"/></g>
      <g fill="#fbf9f2" stroke="#e3ddcb" stroke-width="1.5">
        <circle cx="-62" cy="-56" r="16"/><circle cx="58" cy="-62" r="15"/><circle cx="-46" cy="-76" r="22"/>
        <circle cx="40" cy="-80" r="22"/><circle cx="-20" cy="-88" r="24"/><circle cx="10" cy="-90" r="24"/>
        <circle cx="-30" cy="-66" r="21"/><circle cx="2" cy="-68" r="21"/><circle cx="34" cy="-62" r="19"/>
        <circle cx="-40" cy="-52" r="14"/><circle cx="40" cy="-52" r="15"/>

      <circle cx="-74" cy="-93" r="11" fill="#fbf9f2" stroke="#e3ddcb" stroke-width="1.5"/>
      <ellipse cx="-96" cy="-88" rx="10" ry="5.5" fill="#4e4741" transform="rotate(-30 -96 -88)"/>
      <ellipse cx="-64" cy="-90" rx="10" ry="5.5" fill="#4e4741" transform="rotate(28 -64 -90)"/>
      <ellipse cx="-80" cy="-80" rx="18" ry="16" fill="#4e4741"/>
      <circle cx="-86" cy="-82" r="3" fill="#fff"/><circle cx="-74" cy="-83" r="3" fill="#fff"/>
      <circle cx="-87" cy="-82" r="1.5" fill="#2b2620"/><circle cx="-75" cy="-83" r="1.5" fill="#2b2620"/>
    </g>
  </g>

  <!-- cow (faces right) -->
  <g transform="translate(920,800) scale(-0.92,0.92)">
    <ellipse cx="6" cy="5" rx="96" ry="10" fill="#255a20" opacity=".28"/>
    <g class="bounce a-cow">
      <g fill="#e3ded2"><rect x="-68" y="-50" width="12" height="50" rx="4"/><rect x="46" y="-50" width="12" height="50" rx="4"/></g>
      <g fill="#4a4038"><rect x="-68" y="-11" width="12" height="11" rx="3"/><rect x="46" y="-11" width="12" height="11" rx="3"/></g>
      <g fill="#fbf7ee"><rect x="-50" y="-52" width="13" height="52" rx="5"/><rect x="64" y="-52" width="13" height="52" rx="5"/></g>
      <g fill="#4a4038"><rect x="-50" y="-11" width="13" height="11" rx="3"/><rect x="64" y="-11" width="13" height="11" rx="3"/></g>
      <ellipse cx="0" cy="-88" rx="90" ry="48" fill="#fbf7ee"/>
      <g clip-path="url(#cowClip)" fill="#35302b">
        <ellipse cx="-38" cy="-104" rx="27" ry="21"/><ellipse cx="34" cy="-66" rx="30" ry="22"/>
        <ellipse cx="62" cy="-116" rx="21" ry="17"/><ellipse cx="-6" cy="-52" rx="17" ry="11"/>
      </g>
      <path d="M-114 -138 L-121 -157 L-106 -145 Z" fill="#d8c49a"/>
      <path d="M-88 -140 L-82 -159 L-95 -147 Z" fill="#d8c49a"/>
      <ellipse cx="-120" cy="-140" rx="11" ry="6" fill="#fbf7ee" transform="rotate(-28 -120 -140)"/>
      <ellipse cx="-84" cy="-142" rx="11" ry="6" fill="#fbf7ee" transform="rotate(24 -84 -142)"/>
      <ellipse cx="-120" cy="-140" rx="6" ry="3" fill="#f2a3b5" transform="rotate(-28 -120 -140)"/>
      <ellipse cx="-84" cy="-142" rx="6" ry="3" fill="#f2a3b5" transform="rotate(24 -84 -142)"/>
      <ellipse cx="-102" cy="-126" rx="25" ry="21" fill="#fbf7ee"/>
      <ellipse cx="-121" cy="-116" rx="16" ry="12" fill="#f2a3b5"/>
      <circle cx="-126" cy="-116" r="2.2" fill="#d67d94"/><circle cx="-116" cy="-117" r="2.2" fill="#d67d94"/>
      <circle cx="-104" cy="-128" r="3.2" fill="#2b2620"/><circle cx="-90" cy="-130" r="3.2" fill="#2b2620"/>
      <circle cx="-105" cy="-129" r="1.1" fill="#fff"/><circle cx="-91" cy="-131" r="1.1" fill="#fff"/>
      <ellipse cx="52" cy="-42" rx="17" ry="12" fill="#f2a3b5"/>
      <circle cx="45" cy="-33" r="3" fill="#f2a3b5"/><circle cx="59" cy="-33" r="3" fill="#f2a3b5"/>
    </g>
  </g>

  <!-- pig (faces right) -->
  <g transform="translate(395,800) scale(-0.85,0.85)">
    <ellipse cx="4" cy="5" rx="72" ry="8" fill="#255a20" opacity=".28"/>
    <g class="bounce a-pig">
      <g fill="#e88ba6"><rect x="-46" y="-30" width="11" height="30" rx="4"/><rect x="26" y="-30" width="11" height="30" rx="4"/></g>
      <g fill="#d97a97"><rect x="-46" y="-10" width="11" height="10" rx="3"/><rect x="26" y="-10" width="11" height="10" rx="3"/></g>
      <path d="M56 -78 Q76 -84 73 -69 Q70 -57 60 -61 Q53 -64 58 -70" fill="none" stroke="#ef8fab" stroke-width="5" stroke-linecap="round"/>
      <g fill="#f7a8bc"><rect x="-32" y="-32" width="12" height="32" rx="5"/><rect x="40" y="-32" width="12" height="32" rx="5"/></g>
      <g fill="#d97a97"><rect x="-32" y="-10" width="12" height="10" rx="3"/><rect x="40" y="-10" width="12" height="10" rx="3"/></g>
      <ellipse cx="0" cy="-64" rx="62" ry="40" fill="#f7a8bc"/>
      <path d="M-68 -92 L-62 -111 L-52 -94 Z" fill="#ef8fab"/>
      <path d="M-50 -96 L-42 -113 L-33 -95 Z" fill="#ef8fab"/>
      <ellipse cx="-52" cy="-76" rx="27" ry="23" fill="#f7a8bc"/>
      <path d="M-65 -95 L-61.5 -105 L-56.5 -96 Z" fill="#f7c1d1"/>
      <path d="M-47 -98 L-42.5 -107 L-38 -98 Z" fill="#f7c1d1"/>
      <ellipse cx="-74" cy="-74" rx="12" ry="9" fill="#ef8fab"/>
      <circle cx="-78" cy="-74" r="2.1" fill="#c25f7e"/><circle cx="-70" cy="-75" r="2.1" fill="#c25f7e"/>
      <circle cx="-62" cy="-84" r="3" fill="#4a2331"/><circle cx="-46" cy="-86" r="3" fill="#4a2331"/>
      <circle cx="-63" cy="-85" r="1.1" fill="#fff"/><circle cx="-47" cy="-87" r="1.1" fill="#fff"/>
    </g>
  </g>

  <!-- horse -->
  <g transform="translate(590,858) scale(1.05)">
    <ellipse cx="0" cy="5" rx="108" ry="11" fill="#255a20" opacity=".28"/>
    <g class="bounce a-horse">
      <g fill="#7a4e28"><rect x="-70" y="-78" width="13" height="78" rx="5"/><rect x="42" y="-78" width="13" height="78" rx="5"/></g>
      <g fill="#4a2f18"><rect x="-70" y="-12" width="13" height="12" rx="3"/><rect x="42" y="-12" width="13" height="12" rx="3"/></g>
      <path d="M88 -122 C118 -104 124 -60 112 -28 C108 -17 100 -13 94 -14" fill="none" stroke="#5b3a1e" stroke-width="12" stroke-linecap="round"/>

      <path d="M-96 -222 L-88 -243 L-81 -219 Z" fill="#8f5f34"/>
      <path d="M-110 -223 L-107 -235 L-103 -223 Z" fill="#5b3a1e"/>

      <circle cx="-109" cy="-209" r="1.1" fill="#fff"/><circle cx="-93" cy="-211" r="1.1" fill="#fff"/>
