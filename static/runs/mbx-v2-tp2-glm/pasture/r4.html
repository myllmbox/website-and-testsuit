<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow Bounce</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#6fc0ee}
svg#scene{display:block;width:100vw;height:100vh}
.bounce{animation:hop var(--d,.8s) var(--dl,0s) ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--amp,-16px))}}
.shadow{animation:shd var(--d,.8s) var(--dl,0s) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shd{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(.78);opacity:.08}}
.canopy{animation:sway var(--sd,6s) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg)}}
.rays{animation:spin 70s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bounce,.shadow,.canopy,.rays{animation:none}}
</style>
</head>
<body>

</g>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
function $(id){return document.getElementById(id);}
function mk(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
var scene=$("scene"),sky=$("sky"),grass=$("grass"),band=$("band"),sun=$("sun"),
fence=$("fence"),decor=$("decor"),bushes=$("bushes");
var animals=[["sheep",.34,700],["horse",.58,752],["cow",.155,772],["pig",.82,814]]
 .map(function(a){return {g:$(a[0]),fx:a[1],fy:a[2]};});
var clouds=[
 {el:$("c0"),fx:-.06,y:120,v:22,s:1},
 {el:$("c1"),fx:.22,y:215,v:32,s:1.4},
 {el:$("c2"),fx:.5,y:84,v:15,s:.75},
 {el:$("c3"),fx:.78,y:278,v:26,s:1.05}
];
clouds.forEach(function(c){c.x=0;c.w=60*c.s+50;});
var TUFTS=[[.05,642],[.16,724],[.27,664],[.33,852],[.46,786],[.53,646],[.64,862],[.71,736],[.79,654],[.9,792],[.97,692]];
var FLOWERS=[[.11,704],[.24,802],[.42,662],[.57,834],[.75,762],[.88,684]];
var BUSH=[[.14,46,0],[.42,58,1],[.67,38,0],[.87,52,1]];
var W=1600;
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

function buildDecor(){
 bushes.replaceChildren();
 BUSH.forEach(function(b){
  mk("ellipse",{cx:(b[0]*W).toFixed(0),cy:576,rx:b[1],ry:(b[1]*.34).toFixed(1),fill:b[2]?"#4b9350":"#57a55a"},bushes);
 });
 fence.replaceChildren();
 var x0=W*.04,x1=W*.96,y=632,n=Math.max(4,Math.min(14,Math.round(W/170)));
 mk("rect",{x:(x0-4).toFixed(0),y:y-30,width:(x1-x0+8).toFixed(0),height:7,fill:"#9c7a55"},fence);
 mk("rect",{x:(x0-4).toFixed(0),y:y-16,width:(x1-x0+8).toFixed(0),height:7,fill:"#9c7a55"},fence);
 for(var i=0;i<n;i++){
  var x=x0+i*(x1-x0)/(n-1);
  mk("rect",{x:x.toFixed(0),y:y-36,width:9,height:37,rx:2,fill:"#8f6d4b"},fence);
 }
 decor.replaceChildren();
 TUFTS.forEach(function(t,i){
  mk("path",{d:"M-7 0Q-9 -9 -12 -12M0 0Q0 -10 1 -15M7 0Q9 -8 12 -11",
   transform:"translate("+(t[0]*W).toFixed(0)+" "+t[1]+")",fill:"none",
   stroke:i%2?"#4f9f45":"#3e8a37","stroke-width":2.5,"stroke-linecap":"round"},decor);
 });
 FLOWERS.forEach(function(f,i){
  var g=mk("g",{transform:"translate("+(f[0]*W).toFixed(0)+" "+f[1]+")"},decor);
  mk("path",{d:"M0 0L0 -9",stroke:"#3e8a37","stroke-width":2,"stroke-linecap":"round",fill:"none"},g);
  mk("circle",{cx:0,cy:-12,r:4,fill:i%2?"#f7b8ca":"#ffffff"},g);
  mk("circle",{cx:0,cy:-12,r:1.8,fill:"#ffc93e"},g);
 });
}

function layout(){
 W=Math.max(320,Math.round(900*window.innerWidth/Math.max(1,window.innerHeight)));
 scene.setAttribute("viewBox","0 0 "+W+" 900");
 sky.setAttribute("width",W);
 grass.setAttribute("width",W);
 band.setAttribute("width",W);
 sun.setAttribute("transform","translate("+(W*.84).toFixed(0)+" 132)");
 var s=Math.min(1.05,Math.max(.4,W*.21/250));
 var ts=Math.min(1.05,Math.max(.55,s*.95));
 $("treeL").setAttribute("transform","translate("+(W*.065).toFixed(0)+" 668) scale("+ts.toFixed(3)+")");
 $("treeR").setAttribute("transform","translate("+(W*.945).toFixed(0)+" 708) scale("+ts.toFixed(3)+")");
 animals.forEach(function(a){
  a.g.setAttribute("transform","translate("+(W*a.fx).toFixed(0)+" "+a.fy+") scale("+s.toFixed(3)+")");
 });
 clouds.forEach(function(c){
  c.x=c.fx*(W+2*c.w)-c.w;
  c.el.setAttribute("transform","translate("+c.x.toFixed(1)+" "+c.y+") scale("+c.s+")");
 });
 buildDecor();
}

var last=0;
function tick(t){
 var dt=Math.min(.05,(t-last)/1000);last=t;
 if(!RM){
  clouds.forEach(function(c){
   c.x+=c.v*dt;
   if(c.x>W+c.w)c.x=-c.w;
   c.el.setAttribute("transform","translate("+c.x.toFixed(1)+" "+c.y+") scale("+c.s+")");
  });
 }
 requestAnimationFrame(tick);
}

layout();
window.addEventListener("resize",layout);
requestAnimationFrame(function(t){last=t;requestAnimationFrame(tick);});
})();
</script>
</body>
</html>
