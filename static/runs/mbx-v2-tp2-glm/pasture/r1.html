<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pasture</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#79c1ee}
  svg{display:block;width:100vw;height:100vh}
  @keyframes drift{from{transform:translateX(-1200px)}to{transform:translateX(3800px)}}
  .d1{animation:drift 150s linear -45s infinite}
  .d2{animation:drift 190s linear -120s infinite}
  .d3{animation:drift 120s linear -60s infinite}
  .d4{animation:drift 165s linear -150s infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-17px)}}
  @keyframes hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
  .h1{animation:hop .8s ease-in-out -.2s infinite}
  .h2{animation:hop .95s ease-in-out -.55s infinite}
  .h3{animation:hop2 .7s ease-in-out -.35s infinite}
  .h4{animation:hop2 .85s ease-in-out -.7s infinite}
  @keyframes sh1{0%,100%{opacity:.3}50%{opacity:.12}}
  @keyframes sh2{0%,100%{opacity:.26}50%{opacity:.14}}
  .s1{animation:sh1 .8s ease-in-out -.2s infinite}
  .s2{animation:sh1 .95s ease-in-out -.55s infinite}
  .s3{animation:sh2 .7s ease-in-out -.35s infinite}
  .s4{animation:sh2 .85s ease-in-out -.7s infinite}
</style>
</head>
