<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunny Pasture</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#9cd1f6}
svg{display:block;width:100%;height:100%}
.hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop var(--d,.9s) ease-in-out var(--dl,0s) infinite}
.sh{transform-box:fill-box;transform-origin:50% 50%;animation:shf var(--d,.9s) ease-in-out var(--dl,0s) infinite}
.drift{animation:drift linear infinite}
.c1{animation-duration:78s;animation-delay:-16s}
.c2{animation-duration:104s;animation-delay:-58s}
.c3{animation-duration:62s;animation-delay:-36s}
.c4{animation-duration:88s;animation-delay:-9s}
@keyframes hop{
0%,100%{transform:translateY(0) scale(1.05,.92)}
20%{transform:translateY(-11px) scale(.98,1.04)}
45%{transform:translateY(-17px) scale(.99,1.01)}
70%{transform:translateY(-10px) scale(1,1.03)}
88%{transform:translateY(0) scale(1.06,.9)}
}
@keyframes shf{
0%,100%{transform:scale(1);opacity:.16}
45%{transform:scale(.8);opacity:.08}
88%{transform:scale(1.08);opacity:.18}
}
@keyframes drift{
from{transform:translateX(-360px)}
to{transform:translateX(calc(var(--vw,100vw) + 360px))}
}
@media (prefers-reduced-motion:reduce){.hop,.sh,.drift{animation:none}}
</style>
</head>
<body>
<svg id="sc" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#58adec"/><stop offset=".5" stop-color="#9cd1f6"/><stop offset="1" stop-color="#eef7fc"/>
</linearGradient>
<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#93c96a"/><stop offset="1" stop-color="#4a8636"/>
</linearGradient>
<radialGradient id="glow">
<stop offset="0" stop-color="#ffe27a" stop-opacity=".9"/><stop offset=".55" stop-color="#ffe27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
</radialGradient>
<g id="tree">
<ellipse cy="1" rx="19" ry="5" fill="#528f3b"/>
<path d="M-7 0C-6 -32 -5 -60 -3 -82L3 -82C5 -60 6 -32 7 0Z" fill="#7c4a24"/>
<g fill="#35682d"><circle cx="-20" cy="-96" r="26"/><circle cx="20" cy="-98" r="24"/></g>
<g fill="#3f7d36"><circle cx="-30" cy="-112" r="25"/><circle cx="28" cy="-112" r="23"/><circle cx="0" cy="-128" r="30"/><circle cx="-2" cy="-94" r="23"/></g>
<g fill="#549748"><circle cx="-14" cy="-126" r="15"/><circle cx="12" cy="-120" r="14"/><circle cx="2" cy="-141" r="13"/></g>
</g>
<g id="tuft" fill="none" stroke="#3e7c2f" stroke-width="2" stroke-linecap="round">
<path d="M0 0Q-3 -5 -5 -9"/><path d="M0 0Q0 -8 1 -12"/><path d="M0 0Q3 -5 5 -8"/>
</g>
<g id="flw">
<circle cx="-3" r="2.4" fill="#fff"/><circle cx="3" r="2.4" fill="#fff"/><circle cy="-3" r="2.4" fill="#fff"/><circle cy="3" r="2.4" fill="#fff"/><circle r="1.8" fill="#f6b73c"/>
</g>
</defs>

<rect id="sky" width="100%" height="65%" fill="url(#sg)"/>

<g id="sun">
<circle r="92" fill="url(#glow)"><animate attributeName="r" values="88;100;88" dur="7s" repeatCount="indefinite"/></circle>
<g stroke="#ffc93c" stroke-width="5" stroke-linecap="round">
<line id="ry" x1="50" x2="70"/>
<use href="#ry" transform="rotate(45)"/><use href="#ry" transform="rotate(90)"/><use href="#ry" transform="rotate(135)"/><use href="#ry" transform="rotate(180)"/><use href="#ry" transform="rotate(225)"/><use href="#ry" transform="rotate(270)"/><use href="#ry" transform="rotate(315)"/>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
</g>
<circle r="40" fill="#ffd94d"/>
</g>

<g class="drift c1" fill="#fff" opacity=".95"><g transform="translate(0 84)"><ellipse rx="46" ry="19"/><ellipse cx="-38" cy="6" rx="26" ry="14"/><ellipse cx="37" cy="5" rx="28" ry="15"/><ellipse cx="2" cy="-14" rx="26" ry="15"/></g></g>
<g class="drift c2" fill="#fdfdfa" opacity=".92"><g transform="translate(0 250) scale(.72)"><ellipse rx="40" ry="17"/><ellipse cx="-32" cy="6" rx="24" ry="13"/><ellipse cx="31" cy="5" rx="25" ry="14"/><ellipse cx="0" cy="-12" rx="23" ry="13"/></g></g>
<g class="drift c3" fill="#fbfdff" opacity=".93"><g transform="translate(0 54) scale(.85)"><ellipse rx="34" ry="15"/><ellipse cx="-27" cy="5" rx="20" ry="11"/><ellipse cx="26" cy="4" rx="21" ry="12"/><ellipse cx="0" cy="-11" rx="20" ry="12"/></g></g>
<g class="drift c4" fill="#fff" opacity=".88"><g transform="translate(0 265) scale(.58)"><ellipse rx="28" ry="12"/><ellipse cx="-22" cy="4" rx="16" ry="9"/><ellipse cx="21" cy="4" rx="17" ry="10"/><ellipse cx="0" cy="-9" rx="16" ry="10"/></g></g>

<rect id="gr" y="64.9%" width="100%" height="35.1%" fill="url(#gg)"/>
<line id="hz" x1="0" y1="65%" x2="100%" y2="65%" stroke="#6fa24b" stroke-width="2" opacity=".85"/>

<use href="#tuft" data-fx=".06" data-fy=".55"/><use href="#tuft" data-fx=".22" data-fy=".85"/><use href="#tuft" data-fx=".33" data-fy=".3"/>
<use href="#flw" data-fx=".11" data-fy=".72"/><use href="#flw" data-fx=".3" data-fy=".52"/><use href="#flw" data-fx=".47" data-fy=".22"/>
<use href="#tuft" data-fx=".5" data-fy=".6"/><use href="#tuft" data-fx=".58" data-fy=".18"/><use href="#flw" data-fx=".66" data-fy=".68"/>
<use href="#tuft" data-fx=".75" data-fy=".42"/><use href="#flw" data-fx=".87" data-fy=".3"/><use href="#tuft" data-fx=".93" data-fy=".62"/>

<use href="#tree" data-fx=".28" data-fy=".26">
<animateTransform attributeName="transform" type="rotate" additive="sum" values="-1.3 0 0;1.3 0 0;-1.3 0 0" dur="7.2s" repeatCount="indefinite"/>
</use>
<use href="#tree" data-fx=".7" data-fy=".36">
<animateTransform attributeName="transform" type="rotate" additive="sum" values="-1.6 0 0;1.6 0 0;-1.6 0 0" dur="8.6s" begin="-3.1s" repeatCount="indefinite"/>
</use>

<!-- PIG -->
<g data-fx=".62" data-fy=".22" data-s=".8" style="--d:.72s;--dl:-.38s">
<ellipse class="sh" cy="3" rx="42" ry="6" fill="#1e3a12" opacity=".16"/>
<g class="hop">
<path d="M-38 -36q-11 -5 -12 3q-1 8 7 7q6 -1 4 -7" fill="none" stroke="#e2799a" stroke-width="3" stroke-linecap="round"/>
<g fill="#dd859e"><rect x="-28" y="-20" width="8" height="20"/><rect x="10" y="-20" width="8" height="20"/></g>
<g fill="#b56482"><rect x="-28" y="-5" width="8" height="5"/><rect x="10" y="-5" width="8" height="5"/></g>
<g fill="#ef9db2"><rect x="-14" y="-20" width="8" height="20"/><rect x="24" y="-20" width="8" height="20"/></g>
<g fill="#b56482"><rect x="-14" y="-5" width="8" height="5"/><rect x="24" y="-5" width="8" height="5"/></g>
<path d="M24 -56l-2 -12l11 4Z" fill="#e88ba4"/>
<path d="M42 -55l5 -11l6 10Z" fill="#e88ba4"/>
<ellipse cx="0" cy="-34" rx="40" ry="25" fill="#f2a5b9"/>
<circle cx="32" cy="-44" r="16" fill="#f2a5b9"/>
<ellipse cx="34" cy="-38" rx="8.5" ry="6.5" fill="#e2799a"/>
<circle cx="31" cy="-38" r="1.4" fill="#97405e"/><circle cx="37" cy="-38" r="1.4" fill="#97405e"/>
<circle cx="27" cy="-48" r="2.2" fill="#4a2432"/><circle cx="38" cy="-48" r="2.2" fill="#4a2432"/>
</g>
</g>

<!-- COW -->
<g data-fx=".15" data-fy=".42" data-s="1.05" style="--d:.85s;--dl:-.2s">
<ellipse class="sh" cy="3" rx="64" ry="7" fill="#1e3a12" opacity=".16"/>
<g class="hop">
<g fill="#e7dcbd"><rect x="-46" y="-44" width="10" height="44"/><rect x="30" y="-44" width="10" height="44"/></g>
<g fill="#4a3b2c"><rect x="-46" y="-7" width="10" height="7"/><rect x="30" y="-7" width="10" height="7"/></g>
<g fill="#f6eedb"><rect x="-28" y="-44" width="11" height="44"/><rect x="46" y="-44" width="11" height="44"/></g>
<g fill="#4a3b2c"><rect x="-28" y="-7" width="11" height="7"/><rect x="46" y="-7" width="11" height="7"/></g>
<ellipse cx="22" cy="-24" rx="13" ry="9" fill="#f2a9c4"/>
<rect x="16" y="-17" width="3" height="6" rx="1.5" fill="#e58fb2"/>
<rect x="25" y="-17" width="3" height="6" rx="1.5" fill="#e58fb2"/>
<ellipse cx="0" cy="-58" rx="60" ry="37" fill="#fbf6ea"/>
<g fill="#2f2f2f">
<ellipse cx="-26" cy="-66" rx="16" ry="12" transform="rotate(-14 -26 -66)"/>
<ellipse cx="20" cy="-46" rx="19" ry="14" transform="rotate(10 20 -46)"/>
<ellipse cx="44" cy="-72" rx="11" ry="9"/>
<ellipse cx="-44" cy="-42" rx="9" ry="8"/>
</g>
<circle cx="52" cy="-96" r="25" fill="#fbf6ea"/>
<ellipse cx="60" cy="-99" rx="9.5" ry="8.5" fill="#2f2f2f"/>
<circle cx="60" cy="-99" r="3.4" fill="#fff"/><circle cx="60.7" cy="-99" r="1.7" fill="#1a1a1a"/>
<circle cx="44" cy="-101" r="2.7" fill="#1a1a1a"/>
<ellipse cx="55" cy="-83" rx="14" ry="9" fill="#f0b6c8"/>
<circle cx="50" cy="-83" r="1.7" fill="#b25f7d"/><circle cx="60" cy="-83" r="1.7" fill="#b25f7d"/>
<ellipse cx="30" cy="-113" rx="9" ry="5" fill="#f6eedb" transform="rotate(-28 30 -113)"/>
<ellipse cx="74" cy="-113" rx="9" ry="5" fill="#f6eedb" transform="rotate(28 74 -113)"/>
<path d="M40 -118q-4 -10 2 -16q6 7 4 16Z" fill="#e2d3ae"/>
<path d="M64 -118q4 -10 -2 -16q-6 7 -4 16Z" fill="#e2d3ae"/>
</g>
</g>

<!-- HORSE -->
<g data-fx=".86" data-fy=".55" data-s="1.18" style="--d:.93s;--dl:-.75s">
<ellipse class="sh" cy="3" rx="84" ry="7" fill="#1e3a12" opacity=".16"/>
<g class="hop">
<path d="M72 -86Q92 -68 90 -34Q89 -18 80 -8" fill="none" stroke="#4a2f1b" stroke-width="11" stroke-linecap="round"/>
<g fill="#6f4527"><rect x="-64" y="-62" width="11" height="62"/><rect x="36" y="-62" width="11" height="62"/></g>
<g fill="#3a2415"><rect x="-64" y="-8" width="11" height="8"/><rect x="36" y="-8" width="11" height="8"/></g>
<g fill="#845633"><rect x="-44" y="-62" width="11" height="62"/><rect x="56" y="-62" width="11" height="62"/></g>
<g fill="#3a2415"><rect x="-44" y="-8" width="11" height="8"/><rect x="56" y="-8" width="11" height="8"/></g>
<g fill="#8b5e3c"><ellipse cx="0" cy="-80" rx="75" ry="33"/><circle cx="58" cy="-82" r="28"/><circle cx="-54" cy="-84" r="26"/></g>
<path d="M-56 -92L-84 -152" stroke="#8b5e3c" stroke-width="26" stroke-linecap="round" fill="none"/>
<path d="M-78 -168Q-62 -140 -64 -104Q-65 -92 -72 -84" fill="none" stroke="#4a2f1b" stroke-width="9" stroke-linecap="round"/>
<path d="M-96 -172l-3 -13l11 5Z" fill="#7a4e30"/>
<path d="M-80 -173l4 -12l7 11Z" fill="#7a4e30"/>
<ellipse cx="-88" cy="-158" rx="15" ry="19" fill="#8b5e3c"/>
<ellipse cx="-90" cy="-146" rx="10" ry="8" fill="#a97c50"/>
<circle cx="-94" cy="-145" r="1.5" fill="#4a2f1b"/><circle cx="-86" cy="-145" r="1.5" fill="#4a2f1b"/>
<circle cx="-93" cy="-162" r="2.5" fill="#2e1d10"/><circle cx="-82" cy="-162" r="2.5" fill="#2e1d10"/>
</g>
</g>

<!-- SHEEP -->
<g data-fx=".4" data-fy=".78" data-s=".95" style="--d:1s;--dl:-.55s">
<ellipse class="sh" cy="3" rx="52" ry="6.5" fill="#1e3a12" opacity=".16"/>
<g class="hop">
<g fill="#3f3f3f"><rect x="-36" y="-36" width="8" height="36"/><rect x="24" y="-36" width="8" height="36"/></g>
<g fill="#2e2e2e"><rect x="-36" y="-6" width="8" height="6"/><rect x="24" y="-6" width="8" height="6"/></g>
<g fill="#525252"><rect x="-22" y="-36" width="8" height="36"/><rect x="10" y="-36" width="8" height="36"/></g>
<g fill="#2e2e2e"><rect x="-22" y="-6" width="8" height="6"/><rect x="10" y="-6" width="8" height="6"/></g>
<g fill="#e9e0cf"><circle cx="-20" cy="-35" r="14"/><circle cx="8" cy="-37" r="13"/></g>
<g fill="#fbf8f1">
<circle cx="-32" cy="-52" r="19"/><circle cx="-10" cy="-61" r="21"/><circle cx="13" cy="-56" r="20"/>
<circle cx="31" cy="-46" r="16"/><circle cx="-27" cy="-37" r="15"/><circle cx="-3" cy="-40" r="16"/>
<circle cx="19" cy="-39" r="14"/>
</g>
<ellipse cx="-60" cy="-80" rx="8.5" ry="4.5" fill="#3a3a3a" transform="rotate(-30 -60 -80)"/>
<ellipse cx="-33" cy="-83" rx="8.5" ry="4.5" fill="#3a3a3a" transform="rotate(25 -33 -83)"/>
<circle cx="-46" cy="-74" r="16" fill="#4a4a4a"/>
<circle cx="-44" cy="-88" r="9" fill="#fbf8f1"/>
<circle cx="-51" cy="-76" r="2.9" fill="#fff"/><circle cx="-51.5" cy="-76" r="1.5" fill="#111"/>
<circle cx="-40" cy="-76" r="2.9" fill="#fff"/><circle cx="-40.5" cy="-76" r="1.5" fill="#111"/>
</g>
</g>

<use href="#tuft" data-fx=".26" data-fy=".96" data-s="1.4"/>
<use href="#flw" data-fx=".72" data-fy=".94" data-s="1.4"/>
<use href="#tuft" data-fx=".55" data-fy=".9" data-s="1.3"/>
</svg>

<script>
(function(){
var svg=document.getElementById('sc'),sun=document.getElementById('sun');
var els=Array.prototype.slice.call(document.querySelectorAll('[data-fx]'));
function fit(){
var w=window.innerWidth,h=window.innerHeight;
svg.setAttribute('viewBox','0 0 '+w+' '+h);
svg.setAttribute('width',w);svg.setAttribute('height',h);
document.documentElement.style.setProperty('--vw',w+'px');
var gy=h*.65,k=Math.max(.45,Math.min(1,w/1250,h/760));
var sx=Math.max(95,w*.13),sy=Math.max(78,h*.17);
sun.setAttribute('transform','translate('+sx.toFixed(0)+' '+sy.toFixed(0)+')');
for(var i=0;i<els.length;i++){
var e=els[i];
var x=w*parseFloat(e.dataset.fx),y=gy+(h-gy)*parseFloat(e.dataset.fy);
var s=(e.dataset.s?parseFloat(e.dataset.s):1)*k;
e.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(3)+')');
}
}
window.addEventListener('resize',fit);
fit();
})();
</script>
</body>
</html>
