<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Animated Pasture</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#cdeeff}
  svg{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
  @keyframes drift{from{transform:translateX(-360px)}to{transform:translateX(2200px)}}
  .bounce{animation-name:hop;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-duration:.70s}
  .b1{animation-duration:.62s;animation-delay:.12s}
  .b2{animation-duration:.76s;animation-delay:.36s}
  .b3{animation-duration:.56s;animation-delay:.03s}
  .b4{animation-duration:.70s;animation-delay:.49s}
  .cloud{animation-name:drift;animation-iteration-count:infinite;animation-timing-function:linear;animation-duration:70s}
  .cloud1{animation-duration:68s;animation-delay:-10s}
  .cloud2{animation-duration:54s;animation-delay:-37s}
  .cloud3{animation-duration:88s;animation-delay:-63s}
</style>
</head>
