<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Scene</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#01111f}
#scene{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
polygon,path{stroke-linejoin:round;stroke-linecap:round}
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#78dbff"/>
<stop offset=".42" stop-color="#177bc5"/>
<stop offset="1" stop-color="#021225"/>
</linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f0dda9"/>
<stop offset=".3" stop-color="#cbb17a"/>
<stop offset="1" stop-color="#69512e"/>
</linearGradient>
<radialGradient id="bubbleGrad" cx=".35" cy=".3" r=".75">
<stop offset="0" stop-color="#fff" stop-opacity=".85"/>
<stop offset=".55" stop-color="#c8f3ff" stop-opacity=".22"/>
<stop offset="1" stop-color="#fff" stop-opacity=".07"/>
</radialGradient>
</defs>
<rect width="100%" height="100%" fill="url(#water)"/>
<path id="floorPath" fill="url(#sand)" stroke="#6d5230" stroke-width="2" d="M0,-10 L1,-10 L1,-10 L0,-10 Z"/>
<g id="plants">
<g id="weed1">
<path d="M0 0 C-18 -60,20 -95,-8 -145 C-20 -175,12 -200,2 -235" fill="none" stroke="#2aa059" stroke-width="12"/>
</g>
<g id="weed2">
<path d="M0 0 C16 -50,-16 -85,12 -125 C26 -155,-6 -180,6 -215" fill="none" stroke="#1f9450" stroke-width="10"/>
</g>
</g>
<g id="fish1" transform="translate(-300,-300) scale(1)">
<polygon points="-58 0 -120 -44 -120 44" fill="#e2611c" stroke="#983f0d" stroke-width="3"/>
<ellipse cx="0" cy="0" rx="62" ry="42" fill="#ff9c3c" stroke="#b65111" stroke-width="3"/>
<polygon points="-16 -38 8 -68 35 -36" fill="#ff8a1c" stroke="#b65111" stroke-width="2.5"/>
<polygon points="5 12 38 35 8 22" fill="#ff8a1c" stroke="#b65111" stroke-width="2.5"/>
<path d="M60 8 Q69 12 73 5" fill="none" stroke="#702d05" stroke-width="3"/>
<circle cx="38" cy="-11" r="10" fill="#fffaf2" stroke="#333333" stroke-width="1.5"/>
<circle cx="40" cy="-11" r="3.8" fill="#171717"/>
</g>
<g id="fish2" transform="translate(300,-300) scale(-1,1)">
<polygon points="-82 0 -142 -31 -142 31" fill="#1278b8" stroke="#0a4d75" stroke-width="2.5"/>
<ellipse cx="0" cy="0" rx="95" ry="19" fill="#3ed7ff" stroke="#1283b8" stroke-width="2.5"/>
<polygon points="-16 -14 18 -37 45 -12" fill="#1cb2e8" stroke="#1283b8" stroke-width="2"/>
<polygon points="12 6 36 19 12 15" fill="#1cb2e8" stroke="#1283b8" stroke-width="2"/>
<path d="M90 3 Q99 5 102 -1" fill="none" stroke="#063a55" stroke-width="2.5"/>
<circle cx="64" cy="-4" r="7" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="66" cy="-4" r="3.2" fill="#101010"/>
</g>
<g id="bubbles"></g>
</svg>
<script>
(function(){
const svg=document.getElementById('scene');
const floorPath=document.getElementById('floorPath');
const weed1=document.getElementById('weed1');
const weed2=document.getElementById('weed2');
const fish1=document.getElementById('fish1');
const fish2=document.getElementById('fish2');
const bubbleLayer=document.getElementById('bubbles');
const NS='http://www.w3.org/2000/svg';
let W=1,H=1,floorY=1,range1=1,range2=1,m1=150,m2=110,s1=1,s2=1;
let pos1=0,pos2=0,speed1=35,speed2=115,initialized=false;
const bubbles=[];
const BUBBLE_COUNT=12;
function resize(){
 W=Math.max(1,window.innerWidth);
 H=Math.max(1,window.innerHeight);
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 floorY=Math.round(H*0.885);
 floorPath.setAttribute('d','M0,'+(floorY+18)+' Q'+(W*0.22).toFixed(1)+','+(floorY-18)+' '+(W*0.5).toFixed(1)+','+(floorY+4)+' T'+W+','+(floorY+14)+' L'+W+','+H+' L0,'+H+' Z');
 s1=Math.max(0.8,Math.min(1.3,Math.min(W,H)/680));
 s2=Math.max(0.45,Math.min(0.58,Math.min(W,H)/1100));
 m1=150*s1;
 m2=160*s2;
 range1=W+2*m1;
 range2=W+2*m2;
 speed1=Math.max(10,12+W*0.014);
 speed2=Math.max(30,34+W*0.055);
 if(!initialized){
  pos1=(m1+W*0.35)%range1;
  pos2=(m2+W*0.3)%range2;
  initialized=true;
 }else{
  pos1%=range1;
  pos2%=range2;
 }
 if(!bubbles.length) createBubbles();
 for(let i=0;i<bubbles.length;i++){
  const b=bubbles[i];
  if(b.y>floorY+60||b.y<-30){
   b.x=Math.random()*W;
   b.y=Math.min(floorY+Math.random()*24,H+5);
  }
 }
}
function createBubbles(){
 for(let i=0;i<BUBBLE_COUNT;i++){
  const el=document.createElementNS(NS,'circle');
  const r=2.4+Math.random()*6.5;
  el.setAttribute('r',r.toFixed(1));
  el.setAttribute('fill','url(#bubbleGrad)');
  el.setAttribute('stroke','#ffffff');
  el.setAttribute('stroke-opacity','0.38');
  el.setAttribute('stroke-width','1');
  bubbleLayer.appendChild(el);
  const b={el:el,x:Math.random()*W,y:Math.random()*floorY,r:r,v:45+(9-r)*11,ph:Math.random()*6.283,sw:7+Math.random()*7};
  bubbles.push(b);
  el.setAttribute('cx',b.x.toFixed(1));
  el.setAttribute('cy',b.y.toFixed(1));
 }
}
function fishTransform(el,x,y,dir,sc){
 el.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+(dir*sc).toFixed(3)+','+sc.toFixed(3)+')');
}
let last=performance.now(),start=last;
function frame(now){
 let dt=(now-last)/1000;
 last=now;
 if(dt<0) dt=0;
 if(dt>0.1) dt=0.1;
 const t=(now-start)/1000;
 pos1=(pos1+speed1*dt)%range1;
 pos2=(pos2+speed2*dt)%range2;
 const x1=-m1+pos1;
 const x2=W+m2-pos2;
 const y1=H*0.43;
 const y2=H*0.66;
 fishTransform(fish1,x1,y1,1,s1);
 fishTransform(fish2,x2,y2,-1,s2);
 const sw1=Math.sin(t*1.2)*5;
 const sw2=Math.sin(t*0.9+1.7)*-4;
 weed1.setAttribute('transform','translate('+(W*0.18).toFixed(1)+','+(floorY-3).toFixed(1)+') rotate('+sw1.toFixed(2)+')');
 weed2.setAttribute('transform','translate('+(W*0.8).toFixed(1)+','+(floorY-2).toFixed(1)+') rotate('+sw2.toFixed(2)+')');
 for(let i=0;i<bubbles.length;i++){
  const b=bubbles[i];
  b.y-=b.v*dt;
  b.x+=Math.sin(t*1.6+b.ph)*b.sw*dt;
  b.x%=W;
  if(b.x<0) b.x+=W;
  if(b.y+b.r<0||b.y>floorY+70){
   b.y=Math.min(floorY+Math.random()*24,H+5);
   b.x=Math.random()*W;
  }
  b.el.setAttribute('cx',b.x.toFixed(1));
  b.el.setAttribute('cy',b.y.toFixed(1));
 }
 requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
