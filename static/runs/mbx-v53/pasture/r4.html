<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasture — Field Notes 04</title>
<style>
:root{--ink:#16351f;--ink2:#4b6b56;--paper:#fffdf4;--line:rgba(22,53,31,.14);--hop:.8s;--wind:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#123020}
body{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.dsp{font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;padding:clamp(14px,2.3vw,34px);display:flex;flex-direction:column;justify-content:space-between;gap:14px;pointer-events:none}
.card{background:linear-gradient(160deg,#fffdf5,#f6efdd);border:1px solid var(--line);border-radius:3px 14px 3px 14px;
  box-shadow:0 14px 34px rgba(9,32,18,.22),inset 0 1px 0 #fff;opacity:0;animation:rise .8s cubic-bezier(.2,.85,.3,1) forwards}
.intro{max-width:min(430px,74vw);padding:16px 20px 14px;position:relative;overflow:hidden}
.intro:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(#e8b93f,#57a05c 60%,#2f7a4f)}
.intro:after{content:"";position:absolute;inset:-40% -20% auto auto;width:180px;height:180px;background:radial-gradient(circle,rgba(255,214,92,.55),transparent 65%);animation:ping 6s ease-in-out infinite}
@keyframes ping{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-14px,10px) scale(1.15);opacity:1}}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#8a6a24;font-weight:700}
h1{margin:2px 0 4px;font-size:clamp(38px,6.4vw,68px);line-height:.9;font-weight:400;letter-spacing:-.025em}
h1 em{font-style:italic;color:#2f7a4f}
.lede{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2);max-width:34ch}
.lede b{color:var(--ink);font-weight:600}
.meta{display:flex;gap:12px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#6d8b77;font-variant-numeric:tabular-nums}
.meta span{white-space:nowrap}
#hops{color:#a3711b;font-weight:700}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:flex;gap:9px;flex-wrap:wrap;pointer-events:auto}
.legend li{display:flex;align-items:center;gap:10px;padding:9px 13px 9px 11px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(160deg,#fffdf5,#f4edda);box-shadow:0 8px 20px rgba(9,32,18,.16);cursor:pointer;opacity:0;
  animation:rise .7s cubic-bezier(.2,.85,.3,1) forwards;transition:transform .2s ease,box-shadow .2s ease,background .2s}
.legend li:hover,.legend li:focus-visible{transform:translateY(-4px);background:linear-gradient(160deg,#fff,#fdf3d6);outline:none;
  box-shadow:0 14px 26px rgba(9,32,18,.24)}
.legend li.on{background:linear-gradient(160deg,#20452c,#356b45);border-color:#20452c;color:#fdf6e3}
.legend li.on .cnt{color:#e8c76a}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(22,53,31,.35);box-shadow:inset 0 -3px 6px rgba(0,0,0,.14);flex:none}
.nm{font-size:13px;letter-spacing:.02em}
.cnt{font-size:11px;font-weight:700;color:#8a6a24;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.controls{display:flex;gap:8px;pointer-events:auto;opacity:0;animation:rise .8s .35s cubic-bezier(.2,.85,.3,1) forwards}
.btn{font:inherit;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink);cursor:pointer;
  padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(160deg,#fffdf5,#f3ecd8);
  box-shadow:0 8px 18px rgba(9,32,18,.16);transition:transform .18s ease,background .18s,box-shadow .18s}
.btn b{color:#2f7a4f}
.btn:hover{transform:translateY(-3px) rotate(-.6deg);background:linear-gradient(160deg,#fff,#fdeec2);box-shadow:0 13px 24px rgba(9,32,18,.22)}
.btn:active{transform:translateY(0) scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- scene motion ---------- */
@keyframes drift{from{transform:translateX(-380px)}to{transform:translateX(2000px)}}
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}
.cloudBob{animation:bob 9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes fly{from{transform:translateX(-160px)}to{transform:translateX(1780px)}}
.flock{animation:fly 52s linear infinite}
@keyframes hop{
 0%{transform:translateY(0);animation-timing-function:cubic-bezier(.15,.7,.35,1)}
 42%{transform:translateY(-17px);animation-timing-function:cubic-bezier(.55,0,.85,.4)}
 72%{transform:translateY(0)}
 84%{transform:translateY(-5px);animation-timing-function:ease-out}
 100%{transform:translateY(0)}}
.bounce{animation:hop var(--d) linear infinite;will-change:transform}
@keyframes shd{0%,100%{transform:scale(1,1);opacity:.3}42%{transform:scale(.8,.72);opacity:.17}72%{transform:scale(1.05,1);opacity:.33}}
.shd{fill:#123a20;transform-box:fill-box;transform-origin:50% 50%;animation:shd var(--d) linear infinite}
.animal{cursor:pointer;opacity:0;animation:fadeIn .9s var(--in) ease-out forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.body{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.2,1.4,.4,1),filter .3s}
.animal.spot .body{transform:scale(1.045);filter:drop-shadow(0 8px 10px rgba(12,40,22,.28)) saturate(1.08)}
@keyframes poke{0%{transform:rotate(0) scale(1)}22%{transform:rotate(-3.5deg) scale(1.05,.94)}55%{transform:rotate(2.6deg) scale(.98,1.06)}100%{transform:rotate(0) scale(1)}}
.animal.poke .body{animation:poke .6s ease-out}
@keyframes puff{from{transform:translate(0,0) scale(1);opacity:.8}to{transform:translate(var(--dx),-30px) scale(.25);opacity:0}}
.dust circle{transform-box:fill-box;transform-origin:50% 50%;animation:puff .85s ease-out forwards}
@keyframes ex{0%{opacity:0;transform:translateY(6px) scale(.7)}30%{opacity:1;transform:translateY(-4px) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1)}}
.ex{transform-box:fill-box;transform-origin:50% 100%;animation:ex .95s ease-out forwards;font-size:30px;font-weight:700;fill:#e08b1f;paint-order:stroke;stroke:#fffdf4;stroke-width:5px;stroke-linejoin:round}
.tag{font-size:14px;letter-spacing:.16em;text-transform:uppercase;fill:#12351f;text-anchor:middle;opacity:0;transition:opacity .28s ease,transform .28s ease;
  paint-order:stroke;stroke:rgba(255,253,244,.9);stroke-width:5px;stroke-linejoin:round;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700}
.animal.spot .tag{opacity:1}
@keyframes sway{from{transform:skewX(-.7deg)}to{transform:skewX(1deg)}}
.tufts{transform-box:fill-box;transform-origin:50% 100%;animation:sway calc(3.6s / var(--wind)) ease-in-out infinite alternate;animation-play-state:paused}
.tufts.b{animation-duration:calc(4.7s / var(--wind));animation-delay:-1.3s}
.tufts.c{animation-duration:calc(5.9s / var(--wind));animation-delay:-2.6s}
#field.windy .tufts{animation-play-state:running}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.28)}}
.wl{transform-box:fill-box;transform-origin:100% 50%;animation:flap .17s ease-in-out infinite alternate}
.wr{transform-box:fill-box;transform-origin:0% 50%;animation:flap .17s ease-in-out infinite alternate;animation-delay:.02s}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.bounce,.shd,.cloud,.flock,.tufts,.wl,.wr,.cloudBob,.fl{animation:none}.animal{opacity:1}}
</style>
</head>

<div class="hud">
 <div><div class="card intro">
   <p class="eyebrow dsp">Field notes · plot 04 · morning</p>
   <h1 class="dsp">The <em>Living</em> Pasture</h1>
   <p class="lede">Four animals, one horizon, <b>no stillness</b>. Hover a name to find them in the field — click one and it will notice you.</p>
   <div class="meta"><span id="watch">--:--</span><span id="hops">0 hops</span><span>est. 4 heads</span></div>
 </div></div>
 <div class="bottom">
   <ul class="legend" id="legend"></ul>
   <div class="controls" id="controls">
     <button class="btn" data-act="tempo">hop <b>brisk</b></button>
     <button class="btn" data-act="wind">breeze <b>soft</b></button>
   </div>
 </div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg", svg=document.getElementById("scene");
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.random()*a.length|0]}
function put(id,html){document.getElementById(id).innerHTML+=html}

/* sun rays */
var rays=document.getElementById("rays");
for(var i=0;i<12;i++){
 rays.appendChild(el("path",{d:"M-5,-84 L5,-84 L0,-118 Z",fill:"#ffe27a",opacity:(i%2?.4:.75),transform:"rotate("+i*30+")"}));
}

/* hedge silhouette on the horizon */
var h="";
for(var x=0;x<1620;x+=rnd(26,54)){
 var y=rnd(548,562),r=rnd(9,20);
 h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="#3f7d43" opacity=".55"/>';
}
put("hedge",'<g>'+h+'</g>');

/* far trees + props */
var ft="";
[[858,620,.95],[936,616,.72],[1188,608,.6],[320,604,.55],[1418,598,.5]].forEach(function(t){
 var X=t[0],Y=t[1],s=t[2];
 ft+='<g transform="translate('+X+','+Y+') scale('+s+')">'+
  '<rect x="-6" y="-46" width="12" height="46" fill="#5f3a22"/>'+
  '<circle cx="-20" cy="-62" r="22" fill="#3a7a41"/><circle cx="20" cy="-64" r="21" fill="#3a7a41"/>'+
  '<circle cx="0" cy="-72" r="27" fill="#468a48"/><circle cx="-9" cy="-92" r="19" fill="#52994f"/>'+
  '<circle cx="14" cy="-88" r="17" fill="#52994f"/></g>';
});
put("farTrees",ft);

var p="";
/* pond */
p+='<ellipse cx="706" cy="610" rx="92" ry="20" fill="url(#gPond)"/>'+
   '<ellipse cx="706" cy="610" rx="92" ry="20" fill="none" stroke="#8dc98a" stroke-width="4" opacity=".7"/>'+
   '<path d="M660,608 q22,-5 44,0 M690,616 q26,-4 50,1" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5" fill="none"/>';
/* fence */
for(var fx=1024;fx<1300;fx+=54){
 p+='<rect x="'+fx+'" y="630" width="9" height="44" rx="2" fill="#9c7248"/>'+
    '<rect x="'+(fx-3)+'" y="626" width="15" height="6" rx="3" fill="#b58a5c"/>';
}
p+='<path d="M1020,644 h276 M1020,660 h276" stroke="#a87f52" stroke-width="7" stroke-linecap="round"/>';
/* bushes */
[[486,678,.9],[1188,700,1.05],[64,646,.7],[1044,622,.5],[540,640,.6]].forEach(function(b){
 p+='<g transform="translate('+b[0]+','+b[1]+') scale('+b[2]+')"><use href="#bush"/></g>';
});
/* haystack */
p+='<g transform="translate(540,706)"><path d="M-52,0 C-42,-52 -18,-66 0,-66 C18,-66 42,-52 52,0 Z" fill="#dcb75f"/>'+
   '<path d="M-40,-6 C-30,-40 -14,-54 0,-56" stroke="#c19a45" stroke-width="3" fill="none"/>'+
   '<path d="M-16,-4 C-10,-34 -4,-48 4,-56 M18,-4 C16,-30 22,-44 30,-52" stroke="#c19a45" stroke-width="3" fill="none"/>'+
   '<ellipse cx="0" cy="0" rx="52" ry="8" fill="#3f7d43" opacity=".4"/></g>';
put("props",p);

/* grass tufts, flowers, pebbles */
var GC=[["#7fbb6d","#6cab5c"],["#69ab5d","#568f4b"],["#528d47","#426f3a"],["#40702f","#32601f"]];
var FL=["#ffe3ea","#fff6cf","#ffdfb4","#f1e6ff","#ffffff"];
function tuft(x,y,s,c){
 return '<path transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')" fill="none" stroke="'+c+
  '" stroke-width="3.4" stroke-linecap="round" d="M0,0 c-4,-9 -7,-14 -11,-19 M0,0 c0,-11 1,-17 2,-25 M0,0 c5,-9 9,-13 14,-17"/>';
}
function flower(x,y,s,c){
 var g='<g class="fl" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+s.toFixed(2)+')">'+
  '<path d="M0,0 C-1,-8 1,-13 0,-19" stroke="#3f7a3a" stroke-width="2.2" fill="none"/>';
 for(var i=0;i<5;i++){var a=i/5*Math.PI*2;
  g+='<circle cx="'+(Math.cos(a)*5.2).toFixed(1)+'" cy="'+(-19+Math.sin(a)*5.2).toFixed(1)+'" r="3.7" fill="'+c+'"/>';}
 return g+'<circle cx="0" cy="-19" r="2.5" fill="#f2bf45"/></g>';
}
var L=[[],[],[],[]], bands=[[586,640],[640,706],[706,790],[790,892]];
bands.forEach(function(b,lv){
 var n=[26,22,20,16][lv],s=[.4,.62,.9,1.35][lv];
 for(var i=0;i<n;i++){
  var X=rnd(-10,1610),Y=rnd(b[0],b[1]),sc=s*rnd(.75,1.3);
  L[lv].push(tuft(X,Y,sc,pick(GC[lv])));
 }
 if(lv>0){
  var fn=[0,4,6,5][lv];
  for(var j=0;j<fn;j++) L[lv].push(flower(rnd(0,1600),rnd(b[0],b[1]),s*rnd(.8,1.4),pick(FL)));
 }
 for(var k=0;k<3;k++){
  L[lv].push('<ellipse cx="'+rnd(0,1600).toFixed(1)+'" cy="'+rnd(b[0],b[1]).toFixed(1)+'" rx="'+rnd(3,7).toFixed(1)+
   '" ry="'+rnd(2,4).toFixed(1)+'" fill="#8b8f86" opacity=".5"/>');
 }
});
put("grassBits",'<g class="tufts">'+L[0].join("")+'</g><g class="tufts b">'+L[1].join("")+'</g>'+
   '<g class="tufts c">'+L[2].join("")+'</g><g class="tufts b" style="animation-duration:calc(6.6s / var(--wind))">'+L[3].join("")+'</g>');

/* butterflies */
var flies=[{x:260,y:712,p:0,c:"#f4bf4c"},{x:1120,y:664,p:2.3,c:"#ef8fa8"}].map(function(o,i){
 var g=el("g",{class:"fly"}),
  wl=el("path",{d:"M0,0 C-15,-17 -24,-4 -6,4 Z",fill:o.c,class:"wl",opacity:".92"}),
  wr=el("path",{d:"M0,0 C15,-17 24,-4 6,4 Z",fill:o.c,class:"wr",opacity:".92"}),
  bd=el("path",{d:"M0,-4 q2.5,7 0,12",stroke:"#5a4632","stroke-width":"2.6",fill:"none","stroke-linecap":"round"});
 g.appendChild(wl);g.appendChild(wr);g.appendChild(bd);
 document.getElementById("butterflies").appendChild(g);
 return {g:g,o:o,s:.6+i*.22};
});
var t0=performance.now();
(function loop(t){
 var s=(t-t0)/1000;
 flies.forEach(function(f,i){
  var x=f.o.x+Math.sin(s*.17+i*1.7)*230,
      y=f.o.y+Math.sin(s*.61+i)*40-Math.cos(s*.33)*18,
      tilt=Math.cos(s*.17+i*1.7)*14;
  f.g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+") scale("+f.s+") rotate("+tilt.toFixed(1)+")");
 });
 requestAnimationFrame(loop);
})(t0);

/* legend + counters */
var SPEC=[["horse","Horse","#a9714a"],["cow","Cow","#fbf3e4"],["sheep","Sheep","#fffefb"],["pig","Pig","#f7b4be"]];
var leg=document.getElementById("legend"),animals={},count={},total=0,hopsEl=document.getElementById("hops");
SPEC.forEach(function(s,i){
 var li=document.createElement("li");
 li.dataset.s=s[0]; li.tabIndex=0; li.style.animationDelay=(.45+i*.11)+"s";
 li.innerHTML='<span class="dot" style="background:'+s[2]+'"></span><span class="nm dsp">'+s[1]+'</span><span class="cnt">0 hops</span>';
 leg.appendChild(li); count[s[0]]={li:li,cnt:li.querySelector(".cnt"),n:0};
 li.addEventListener("pointerenter",function(){focus(s[0])});
 li.addEventListener("pointerleave",function(){focus(null)});
 li.addEventListener("focus",function(){focus(s[0])});
 li.addEventListener("blur",function(){focus(null)});
});
function focus(sp){
 document.querySelectorAll(".animal").forEach(function(a){a.classList.toggle("spot",a.dataset.species===sp)});
 document.querySelectorAll(".legend li").forEach(function(l){l.classList.toggle("on",l.dataset.s===sp)});
}
document.querySelectorAll(".animal").forEach(function(a){
 animals[a.dataset.species]=a;
 var b=a.querySelector(".bounce");
 b.addEventListener("animationiteration",function(){
  total++; count[a.dataset.species].n++;
  count[a.dataset.species].cnt.textContent=count[a.dataset.species].n+" hops";
  hopsEl.textContent=total+" hops";
 });
 a.addEventListener("pointerenter",function(){a.classList.add("spot")});
 a.addEventListener("pointerleave",function(){a.classList.remove("spot")});
 a.addEventListener("click",function(){poke(a)});
});
var MARK={cow:"Moo!",pig:"Oink!",sheep:"Baa!",horse:"Neigh!"};
function poke(a){
 var sp=a.dataset.species;
 a.classList.remove("poke"); a.getBoundingClientRect(); a.classList.add("poke");
 setTimeout(function(){a.classList.remove("poke")},700);
 var g=el("g",{class:"dust"});
 for(var i=0;i<9;i++){
  var d=el("circle",{cx:rnd(-70,70).toFixed(1),cy:-rnd(2,12).toFixed(1),r:rnd(3,7.5).toFixed(1),fill:"#efe3c4"});
  d.style.setProperty("--dx",rnd(-26,26).toFixed(1)+"px");
  d.style.animationDuration=rnd(.55,1).toFixed(2)+"s";
  d.style.animationDelay=rnd(0,.14).toFixed(2)+"s";
  g.appendChild(d);
 }
 a.appendChild(g); setTimeout(function(){g.remove()},1600);
 var t=el("text",{class:"ex",x:a.querySelector(".tag").getAttribute("x"),y:-14,fill:"#e08b1f"});
 t.textContent=MARK[sp]; a.appendChild(t); setTimeout(function(){t.remove()},1000);
}
/* buttons */
var TEMPO=[["brisk",".8s"],["easy","1s"],["slow","1.25s"]], tp=0;
var WIND=[["still","0"],["soft","1"],["gusty","2.2"]], wd=1;
document.getElementById("controls").addEventListener("click",function(e){
 var b=e.target.closest(".btn"); if(!b)return;
 if(b.dataset.act==="tempo"){
  tp=(tp+1)%TEMPO.length;
  document.documentElement.style.setProperty("--hop",TEMPO[tp][1]);
  b.innerHTML='hop <b>'+TEMPO[tp][0]+'</b>';
 }else{
  wd=(wd+1)%WIND.length;
  document.documentElement.style.setProperty("--wind",WIND[wd][1]);
  document.getElementById("field").classList.toggle("windy",wd>0);
  document.querySelectorAll(".cloud").forEach(function(c){
   var base=+c.style.animationDuration.replace("s","");
   c.style.animationDuration=(base/(wd===0?2.4:wd===1?1:2))+"s";
  });
  b.innerHTML='breeze <b>'+WIND[wd][0]+'</b>';
 }
});
/* watch */
function watch(){
 var d=new Date(), t=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
 document.getElementById("watch").textContent=t+" · "+WIND[wd][0]+" breeze";
}
setInterval(watch,20000); watch();
})();
</script>
