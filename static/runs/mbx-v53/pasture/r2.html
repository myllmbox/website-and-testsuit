<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pasture</title>
<style>
:root{
  --ink:#1e2a1a;--paper:#fffdf3;--moss:#3f7a2e;--wheat:#d99a2b;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#cfeaf7}
#scene{display:block;width:100vw;height:100vh}
text{font-family:var(--sans)}
.hit{fill:none;stroke:none;pointer-events:all}

/* ---------- living things ---------- */
@keyframes hop{
  0%,100%{transform:translateY(0) scale(1,1)}
  10%{transform:translateY(0) scale(1.045,.94)}
  32%{transform:translateY(-16px) scale(.965,1.05)}
  56%{transform:translateY(-8px) scale(1.01,.99)}
  80%{transform:translateY(0) scale(1.02,.98)}
}
.hopper{transform-box:fill-box;transform-origin:50% 100%;
  animation:hop var(--d,.8s) cubic-bezier(.3,.05,.4,1) infinite;animation-delay:var(--t,0s)}
@keyframes greet{
  0%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-38px) rotate(-5deg)}
  42%{transform:translateY(0) rotate(0)}
  60%{transform:translateY(-20px) rotate(4deg)}
  78%{transform:translateY(0) rotate(0)}
  90%{transform:translateY(-7px)}
  100%{transform:translateY(0)}
}
.hopper.greet{animation:greet 1s cubic-bezier(.3,.1,.3,1) 1}
@keyframes shade{0%,100%{transform:scale(1);opacity:.26}32%{transform:scale(.82);opacity:.13}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;
  animation:shade var(--d,.8s) cubic-bezier(.3,.05,.4,1) infinite;animation-delay:var(--t,0s)}
.animal{transition:opacity .4s ease,filter .4s ease;cursor:pointer}
.pop{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.animal:hover .pop,.animal.focus .pop{transform:scale(1.06)}
.animal:hover .pop{filter:drop-shadow(0 0 9px rgba(255,246,205,.95))}
#scene.focusing .animal{opacity:.3;filter:saturate(.45) blur(.6px)}
#scene.focusing .animal.focus{opacity:1;filter:none}
.tag{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.animal:hover .tag,.animal.focus .tag{opacity:1;transform:translateY(0)}
.tagtxt{font-size:12px;font-weight:700;letter-spacing:.16em;fill:#23301d}
@keyframes ring{from{transform:scale(.22);opacity:.9}to{transform:scale(1.55);opacity:0}}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring .8s ease-out forwards;pointer-events:none}
@keyframes sprout{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sprout .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sway{0%,100%{transform:rotate(-1.15deg)}50%{transform:rotate(1.35deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;
  animation:sway var(--d,7s) ease-in-out infinite;animation-delay:var(--t,0s)}
.tree{cursor:pointer}
.tree.gust .sway{animation-duration:1.15s;--d:1.15s}
@keyframes bend{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(4.5deg)}}
.blade{transform-box:fill-box;transform-origin:50% 100%;
  animation:bend var(--d,4s) ease-in-out infinite;animation-delay:var(--t,0s)}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{transform-origin:0 0;animation:spin 150s linear infinite}
.sun{cursor:pointer}
.sun .halo{transform-origin:0 0;transition:transform .7s cubic-bezier(.2,.9,.3,1)}
.sun:hover .rays{animation-duration:16s}
.sun:hover .halo{transform:scale(1.16)}
.mote{pointer-events:none}

/* ---------- interface ---------- */
.ui{position:fixed;inset:0;pointer-events:none;font-family:var(--sans);color:var(--ink)}
.card{position:absolute;background:rgba(255,253,243,.94);border:1px solid rgba(30,42,26,.15);
  box-shadow:0 18px 38px -22px rgba(20,45,14,.75);border-radius:3px;pointer-events:auto}
.tl{left:26px;top:24px;max-width:min(360px,74vw);padding:16px 20px 18px;
  animation:rise 1s .1s both cubic-bezier(.18,.85,.28,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{display:block;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#7e8b73;margin-bottom:7px}
h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,46px);line-height:.94;margin:0;font-weight:600;letter-spacing:-.015em}
h1 em{font-style:italic;color:var(--moss)}
.swash{display:block;width:min(190px,50%);height:9px;margin:4px 0 10px}
.swash path{fill:none;stroke:var(--wheat);stroke-width:2.6;stroke-linecap:round;
  stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1.3s .5s forwards cubic-bezier(.4,.9,.3,1)}
@keyframes draw{to{stroke-dashoffset:0}}
.lede{margin:0;font-size:12.5px;line-height:1.6;color:#4c5945;max-width:31ch}
.lede b{color:#23301d;font-weight:700}
.bl{left:26px;bottom:24px;padding:11px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  max-width:min(520px,92vw);animation:rise 1s .35s both cubic-bezier(.18,.85,.28,1)}
.chip{display:flex;align-items:center;gap:7px;border:1px solid rgba(30,42,26,.17);background:#fff;
  padding:7px 12px 7px 9px;border-radius:999px;font:600 11.5px/1 var(--sans);letter-spacing:.05em;
  color:#26331f;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s}
.chip i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9) inset}
.chip:hover,.chip.on{transform:translateY(-2px);border-color:#2f6f24;box-shadow:0 9px 16px -11px rgba(20,60,10,.9)}
.btn{border:0;border-radius:999px;background:var(--ink);color:#fffaf0;padding:9px 15px;
  font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  transition:transform .2s,background .3s}
.btn:hover{background:var(--moss);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.96)}
.br{right:26px;bottom:24px;padding:9px 13px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:#33452c;background:rgba(255,253,243,.84);border:1px solid rgba(30,42,26,.13);
  animation:rise 1s .55s both cubic-bezier(.18,.85,.28,1)}
.br span{color:#6d7c63}
@media(max-width:720px){.lede{display:none}.tl{left:14px;top:14px;padding:12px 14px}.bl{left:14px;bottom:14px}
  .br{display:none}}
</style>
</head>

<div class="ui">
  <header class="card tl">
    <span class="kicker">Field notes &middot; plate IV</span>
    <h1>The <em>Pasture</em></h1>
    <svg class="swash" viewBox="0 0 160 8" aria-hidden="true"><path d="M2 5C38 1 76 7 158 2"/></svg>
    <p class="lede"><b>Four species</b>, one long afternoon. Hover a beast to greet it, click the sward to plant something, and let the herd wander.</p>
  </header>
  <nav class="card bl" id="dock"><div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button class="btn" id="scatter">Scatter the herd</button></nav>
  <div class="card br"><span>wind</span> <b id="statWind">0</b> &middot; <span>hops</span> <b id="statHops">0</b></div>
</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
function el(t,a,p){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;}
function $(s){return document.querySelector(s);}
var scene=$("#scene"),W=0,H=0,HY=0,SC=1;

var SPECIES=[
 {id:"sheep",name:"Sheep",dot:"#5a5566",w:150,top:140,sw:52,dur:.74,off:-.11},
 {id:"pig",  name:"Pig",  dot:"#e8798f",w:132,top:104,sw:48,dur:.63,off:-.44},
 {id:"cow",  name:"Cow",  dot:"#33323c",w:210,top:162,sw:66,dur:.88,off:-.27},
 {id:"horse",name:"Horse",dot:"#a4703f",w:238,top:240,sw:60,dur:.97,off:-.66}
];
var nodes={},hops=0;

/* ---------- animals ---------- */
var animalsG=$("#animals");
SPECIES.forEach(function(sp){
  var g=el("g",{"class":"animal","data-sp":sp.id},animalsG);
  el("ellipse",{"class":"shadow",cx:0,cy:2,rx:sp.sw,ry:Math.max(5,sp.sw*.16),fill:"#1f4a16",
     style:"--d:"+sp.dur+"s;--t:"+sp.off+"s"},g);
  var hop=el("g",{"class":"hopper",style:"--d:"+sp.dur+"s;--t:"+sp.off+"s"},g);
  var pop=el("g",{"class":"pop"},hop);
  pop.appendChild(document.getElementById("tpl-"+sp.id).cloneNode(true));
  var tag=el("g",{"class":"tag"},g);
  var inner=el("g",{transform:"translate(0,"+(-(sp.top+20))+")"},tag);
  var label=sp.name.toUpperCase(),w=label.length*9.6+24;
  el("rect",{x:-w/2,y:-19,width:w,height:26,rx:13,fill:"#fffdf3",stroke:"#2c3b25","stroke-width":1.4},inner);
  el("path",{d:"M-6 6L0 13L6 6Z",fill:"#fffdf3"},inner);
  var t=el("text",{"class":"tagtxt",x:0,y:0,"text-anchor":"middle"},inner);t.textContent=label;
  hop.addEventListener("animationiteration",function(){hops++;});
  g.addEventListener("click",function(e){e.stopPropagation();greet(sp.id);});
  nodes[sp.id]=g;
});

function apply(sp,x,y,s){
  var g=nodes[sp.id];
  g.style.transform="translate("+x+"px,"+y+"px) scale("+s+")";
  g._x=x;g._y=y;g._w=sp.w*s;
}
function zsort(){
  SPECIES.slice().sort(function(a,b){return nodes[a.id]._y-nodes[b.id]._y;})
    .forEach(function(s){animalsG.appendChild(nodes[s.id]);});
}
function placeDefault(){
  var gh=H-HY,narrow=W<880;
  var lay=narrow
    ?{sheep:[.27,.14,.72],cow:[.74,.3,.8],pig:[.23,.66,.9],horse:[.73,.8,.95]}
    :{sheep:[.15,.16,.84],pig:[.385,.46,.95],cow:[.62,.26,.92],horse:[.855,.66,1.05]};
  SPECIES.forEach(function(sp){var L=lay[sp.id];apply(sp,L[0]*W,HY+L[1]*gh,SC*L[2]);});
  zsort();
}
function scatter(){
  var gh=H-HY,placed=[];
  SPECIES.slice().sort(function(){return Math.random()-.5;}).forEach(function(sp){
    var ms=.78+Math.random()*.3,w=sp.w*SC*ms,x=0,y=0,ok=false,t=0;
    while(!ok&&t++<200){
      x=w*.55+Math.random()*Math.max(1,W-w*1.1);
      y=HY+(.1+Math.random()*.74)*gh;
      ok=placed.every(function(p){
        return Math.abs(p.x-x)>(p.w+w)*.55+24*SC||Math.abs(p.y-y)>70*SC;});
    }
    placed.push({x:x,y:y,w:w});apply(sp,x,y,SC*ms);
  });
  zsort();
}

/* ---------- sky furniture ---------- */
function placeSun(){
  var g=$("#sunG");
  g.style.transform="translate("+(W*.82)+"px,"+(H*.13)+"px)";
  var R=Math.max(30,Math.min(62,Math.min(W,H)*.056));
  g.querySelector(".core").setAttribute("r",R);
  g.querySelector(".halo").setAttribute("r",R*3.3);
  var rg=g.querySelector(".rays");rg.textContent="";
  for(var i=0;i<12;i++){
    var a=i*30,len=R*(i%2?.55:.85),wid=R*.14;
    el("path",{d:"M"+(-wid)+" "+(-R*1.18)+"L"+wid+" "+(-R*1.18)+"L0 "+(-(R*1.18+len))+"Z",
      fill:"#ffdf7a",opacity:.85,transform:"rotate("+a+")"},rg);
  }
}
var clouds=[];
function buildClouds(){
  var g=$("#clouds");g.textContent="";clouds=[];
  var n=W<720?4:6;
  for(var i=0;i<n;i++){
    var grp=el("g",{"class":"cloud"},g);
    var s=.55+Math.random()*.8,y=(.06+Math.random()*.42)*HY,v=7+Math.random()*16;
    el("ellipse",{cx:0,cy:4,rx:52,ry:15,fill:"#eef7fd",opacity:.9},grp);
    var puffs=3+Math.floor(Math.random()*3);
    for(var j=0;j<puffs;j++){
      var px=(-38+j*(76/Math.max(1,puffs-1)))+(Math.random()*10-5);
      var py=-Math.random()*16-2, pr=15+Math.random()*13;
      el("circle",{cx:px.toFixed(1),cy:py.toFixed(1),r:pr.toFixed(1),fill:"#ffffff"},grp);
    }
    el("circle",{cx:-14,cy:-22,r:16,fill:"#fbfeff"},grp);
    clouds.push({g:grp,x:Math.random()*W,y:y,v:v,w:120*s});
  }
}
function buildHills(){
  var g=$("#hills");g.textContent="";
  [[HY-HY*.055,HY*.085,"#a4cd93",.8,1.2],[HY-HY*.026,HY*.05,"#83b96c",.92,3.4]].forEach(function(L){
    var d="M0 "+(HY+2)+"L0 "+L[0];
    for(var x=0;x<=W;x+=Math.max(30,W/26)){
      var y=L[0]-Math.sin(x*.0042+L[4])*L[1]-Math.cos(x*.0019+L[4]*2)*L[1]*.55;
      d+="L"+x.toFixed(0)+" "+y.toFixed(0);
    }
    el("path",{d:d+"L"+W+" "+(HY+2)+"Z",fill:L[2],opacity:L[3]},g);
  });
}

/* ---------- ground detail ---------- */
function blade(parent,x,y,h,col,cls,dl){
  var a={d:"M"+x.toFixed(1)+" "+y.toFixed(1)+"q"+(h*.2).toFixed(1)+" "+(-h*.55).toFixed(1)+" "+(h*.5).toFixed(1)+" "+(-h).toFixed(1),
    stroke:col,"stroke-width":(1.8*SC).toFixed(1),"stroke-linecap":"round",fill:"none"};
  if(cls){a["class"]=cls;a.style="--d:"+(3.4+Math.random()*3.2)+"s;--t:"+(-Math.random()*4)+"s";}
  el("path",a,parent);
}
function flower(parent,x,y,s,anim){
  var g=el("g",{transform:"translate("+x.toFixed(0)+","+y.toFixed(0)+") scale("+s.toFixed(2)+")"},parent);
  var inner=el("g",{class:anim?"sprout":null},g);
  el("path",{d:"M0 0c0-5 1-8 0-11",stroke:"#3f7f31","stroke-width":1.6,fill:"none"},inner);
  var c=["#fff6f8","#ffe6a6","#ffd8e3","#fdfdff"][Math.floor(Math.random()*4)];
  for(var i=0;i<5;i++){var a=i/5*6.283;
    el("circle",{cx:(Math.cos(a)*4).toFixed(1),cy:(-11+Math.sin(a)*4).toFixed(1),r:3,fill:c},inner);}
  el("circle",{cx:0,cy:-11,r:2.1,fill:"#f0b429"},inner);
}
function buildGround(){
  var g=$("#groundfx");g.textContent="";
  var gh=H-HY,i;
  for(i=0;i<20;i++){
    var y=HY+Math.pow(Math.random(),.85)*gh,s=SC*(.6+Math.random()*1.6);
    el("ellipse",{cx:(Math.random()*W).toFixed(0),cy:y.toFixed(0),rx:((46+Math.random()*90)*s).toFixed(0),
      ry:((5+Math.random()*7)*s).toFixed(0),fill:Math.random()<.5?"#93ce68":"#4d8b3b",opacity:.1},g);
  }
  var n=Math.round(W/15);
  for(i=0;i<n;i++){
    var bx=Math.random()*W,by=HY+6+Math.pow(Math.random(),.75)*gh;
    var hh=(7+Math.random()*11)*(.55+(by-HY)/gh*.9)*SC;
    blade(g,bx,by,hh,"hsl("+(92+Math.random()*22)+" "+(45+Math.random()*18)+"% "+(25+Math.random()*16)+"%)");
  }
}
function buildFore(){
  var g=$("#fore");g.textContent="";
  var n=Math.round(W/34);
  for(var i=0;i<n;i++){
    var x=Math.random()*W,y=H-Math.random()*.14*H,hh=(18+Math.random()*24)*SC;
    blade(g,x,y,hh,"hsl("+(96+Math.random()*16)+" 48% "+(20+Math.random()*10)+"%)",true);
  }
}
function buildFlowers(){
  var g=$("#flowers");g.textContent="";
  var gh=H-HY;
  for(var i=0;i<16;i++)flower(g,Math.random()*W,HY+(.12+Math.random()*.8)*gh,SC*(.5+Math.random()*.6));
}
function buildFence(){
  var g=$("#fence");g.textContent="";
  var gh=H-HY,base=HY+gh*.055,ph=24*SC,pw=Math.max(3,5*SC),step=Math.max(44,66*SC);
  for(var x=8;x<W;x+=step){
    el("rect",{x:x.toFixed(0),y:(base-ph).toFixed(0),width:pw.toFixed(1),height:ph.toFixed(0),rx:1.5,fill:"#9c7448"},g);
    el("rect",{x:x.toFixed(0),y:(base-ph).toFixed(0),width:pw.toFixed(1),height:2.4,fill:"#bd9467"},g);
  }
  el("rect",{x:0,y:(base-ph*.72).toFixed(0),width:W,height:(3*SC).toFixed(1),fill:"#8f6a3f",opacity:.95},g);
  el("rect",{x:0,y:(base-ph*.3).toFixed(0),width:W,height:(3*SC).toFixed(1),fill:"#a2794c",opacity:.95},g);
}
var TREES=[{t:"tpl-tree-a",fx:.055,fy:.17,ms:1.02,d:7.4,p:-.3},
           {t:"tpl-tree-b",fx:.945,fy:.1,ms:.92,d:8.8,p:-2.1},
           {t:"tpl-tree-a",fx:.50,fy:.04,ms:.6,d:9.6,p:-4.4}];
function buildTrees(){
  var g=$("#trees");g.textContent="";
  TREES.forEach(function(T){
    var gh=H-HY,wrap=el("g",{"class":"tree"},g);
    wrap.style.transform="translate("+(T.fx*W)+"px,"+(HY+T.fy*gh)+"px) scale("+(SC*T.ms)+")";
    var sw=el("g",{"class":"sway",style:"--d:"+T.d+"s;--t:"+T.p+"s"},wrap);
    sw.appendChild(document.getElementById(T.t).cloneNode(true));
    wrap.addEventListener("click",function(e){e.stopPropagation();
      wrap.classList.add("gust");setTimeout(function(){wrap.classList.remove("gust");},2200);});
  });
}
var motes=[];
function buildMotes(){
  var g=$("#motes");g.textContent="";motes=[];
  for(var i=0;i<20;i++){
    var c=el("circle",{r:(1+Math.random()*2).toFixed(1),fill:Math.random()<.4?"#fff8cf":"#ffffff",
      opacity:(.35+Math.random()*.5).toFixed(2)},g);
    var m={n:c,x:Math.random()*W,y:HY+Math.random()*(H-HY),vy:5+Math.random()*12,
      f:.4+Math.random()*1.2,p:Math.random()*6.28};
    motes.push(m);
  }
}

/* ---------- interaction ---------- */
function ring(parent,color,r){
  var c=el("circle",{"class":"ring",cx:0,cy:-2,r:r,fill:"none",stroke:color,"stroke-width":3.2},parent);
  c.addEventListener("animationend",function(){c.remove();});
}
function greet(id){
  var g=nodes[id],h=g.querySelector(".hopper");
  h.classList.remove("greet");void h.getBoundingClientRect();h.classList.add("greet");
  ring(g,"#fff2b8",46);
  h.addEventListener("animationend",function once(){h.classList.remove("greet");
    h.removeEventListener("animationend",once);});
  focusOn(id,true);
}
var chips=$("#chips");
chips.innerHTML=SPECIES.map(function(s){
  return '<button class="chip" data-sp="'+s.id+'"><i style="background:'+s.dot+'"></i>'+s.name+'</button>';}).join("");
function focusOn(id,lock){
  scene.classList.add("focusing");
  SPECIES.forEach(function(s){nodes[s.id].classList.toggle("focus",s.id===id);});
  Array.prototype.forEach.call(chips.children,function(c){c.classList.toggle("on",c.dataset.sp===id);});
}
function focusOff(){
  scene.classList.remove("focusing");
  SPECIES.forEach(function(s){nodes[s.id].classList.remove("focus");});
  Array.prototype.forEach.call(chips.children,function(c){c.classList.remove("on");});
}
Array.prototype.forEach.call(chips.children,function(c){
  var id=c.dataset.sp;
  c.addEventListener("mouseenter",function(){focusOn(id);});
  c.addEventListener("mouseleave",focusOff);
  c.addEventListener("focus",function(){focusOn(id);});
  c.addEventListener("blur",focusOff);
  c.addEventListener("click",function(){greet(id);setTimeout(focusOff,1200);});
});
$("#scatter").addEventListener("click",scatter);
scene.addEventListener("click",function(e){
  var x=e.clientX,y=e.clientY;
  if(y<HY+8)return;
  var g=el("g",{transform:"translate("+x+","+y+")",style:"pointer-events:none"},$("#flowers"));
  el("circle",{"class":"ring",cx:0,cy:0,r:26,fill:"none",stroke:"#eaffd8","stroke-width":2.6},g);
  flower(g,0,0,SC*(.7+Math.random()*.5),true);
  setTimeout(function(){g.remove();},9000);
});

/* ---------- layout + loop ---------- */
function relayout(){
  W=window.innerWidth;H=window.innerHeight;HY=Math.round(H*.65);
  SC=Math.max(.52,Math.min(1.18,Math.min(W/1480,H/820)));
  buildHills();placeSun();buildClouds();buildGround();buildFence();buildTrees();buildFlowers();buildFore();buildMotes();
  placeDefault();
}
var last=0,sw=$("#statWind"),sh=$("#statHops");
function tick(ts){
  var dt=Math.min(.05,(ts-last)/1000);if(!isFinite(dt))dt=0;last=ts;
  var v=0;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];c.x+=c.v*dt;v+=c.v;
    if(c.x-c.w>W)c.x=-c.w-20;
    c.g.setAttribute("transform","translate("+c.x.toFixed(1)+","+c.y.toFixed(1)+")");
  }
  for(var j=0;j<motes.length;j++){
    var m=motes[j];
    m.y-=m.vy*dt;m.x+=(Math.sin(ts/1000*m.f+m.p)*11+6)*dt;
    if(m.y<HY-140){m.y=H-8;m.x=Math.random()*W;}
    if(m.x>W+20)m.x=-20;
    m.n.setAttribute("transform","translate("+m.x.toFixed(1)+","+m.y.toFixed(1)+")");
  }
  window._wind=clouds.length?Math.round(v/clouds.length):0;
  requestAnimationFrame(tick);
}
relayout();
requestAnimationFrame(tick);
setInterval(function(){sw.textContent=window._wind||0;sh.textContent=hops;},400);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(relayout,140);});
})();
</script>
</body>
</html>
