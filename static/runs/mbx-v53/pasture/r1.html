  .bounce{animation-name:bounce;animation-timing-function:cubic-bezier(.36,.05,.55,.95);animation-iteration-count:infinite}
  @keyframes bounce{0%{transform:translateY(0)}28%{transform:translateY(-17px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}

  .shadow{animation-name:pulse;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes pulse{0%,100%{opacity:.24}50%{opacity:.1}}
  .bird{animation:fly 52s linear infinite}
  @keyframes fly{from{transform:translate(-300px,0)}50%{transform:translate(600px,-20px)}to{transform:translate(1540px,10px)}}
  @media (prefers-reduced-motion:reduce){.bounce,.cloud,.shadow,.bird{animation:none}}
