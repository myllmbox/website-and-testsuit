<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Field — an animated pasture</title>
<style>
:root{
  --display:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI Variable Text","Segoe UI","Helvetica Neue",sans-serif;
  --ink:#1d3a24;--ink2:#4a5d4c;--cream:#fbf6ea;--barn:#b0432c;--gold:#c98f2a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#12241a;font-family:var(--sans);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;animation:curtain 1.1s ease both}
@keyframes curtain{from{opacity:0}to{opacity:1}}

/* ---- scene motion ---- */
.bounce{animation:hop 1.1s ease-in-out infinite}
.leg,.tree,.blade,.wing,.ring,.rays,.leaf{transform-box:fill-box}
.leg{transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite}
.tree{transform-origin:50% 100%;animation:sway 7.5s ease-in-out infinite;cursor:pointer}
.blade{transform-origin:50% 100%;animation:blade 5s ease-in-out infinite}
.wing{transform-origin:50% 100%;animation:flap .55s ease-in-out infinite}
.rays{transform-origin:50% 50%;animation:spin 120s linear infinite}
.shadow{animation:shade 1.1s ease-in-out infinite}
.mote{animation:mote 12s linear infinite}
.ring{opacity:0;transform-origin:50% 50%;transition:opacity .35s}
.an:hover .ring,.an:focus .ring,.an.lit .ring{opacity:.95}
.an.lit .ring{animation:pulse 1.5s ease-in-out infinite}
.an{cursor:pointer}
.an:focus{outline:none}
.an:hover .pop{transform:scale(1.035)}
.pop{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.34,1.5,.64,1)}
.sun{cursor:pointer}
.sun .halo{transition:opacity .6s,transform .6s cubic-bezier(.34,1.4,.64,1);transform-box:fill-box;transform-origin:50% 50%}
.sun:hover .halo{opacity:1;transform:scale(1.14)}
.sun:hover .rays{animation-duration:14s}
.wind .tree{animation-name:sway2;animation-duration:3.6s}
.wind .blade{animation-name:bladeWind;animation-duration:2.8s}
.an.spook .bounce{animation:bigHop .8s cubic-bezier(.2,.8,.3,1)}
.an.spook .shadow{animation:bigShade .8s ease-out}
.leaf{transform-origin:50% 50%;animation:fall 3s linear forwards}

@keyframes hop{0%,100%{transform:translateY(0)}9%{transform:translateY(-18px)}21%{transform:translateY(0)}30%{transform:translateY(-6px)}38%{transform:translateY(0)}}
@keyframes bigHop{0%{transform:translateY(0)}26%{transform:translateY(-48px)}52%{transform:translateY(0)}68%{transform:translateY(-15px)}84%{transform:translateY(0)}92%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes shade{0%,100%{opacity:.26}9%{opacity:.13}30%{opacity:.26}}
@keyframes bigShade{0%,100%{opacity:.26}26%{opacity:.08}60%{opacity:.26}}
@keyframes swing{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
@keyframes sway2{0%,100%{transform:rotate(-3.1deg)}50%{transform:rotate(3.1deg)}}
@keyframes blade{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes bladeWind{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}14%{opacity:.85}100%{transform:translate(20px,-62px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.08);opacity:.45}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate(38px,196px) rotate(260deg);opacity:0}}

/* ---- overlay ---- */
.hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.card,.watch,.chips,.tools,.hint{pointer-events:none}
.card{position:absolute;left:clamp(14px,3vw,34px);top:clamp(14px,3vh,30px);max-width:min(330px,66vw);
  background:linear-gradient(180deg,#fdf9ef,#f3ecdd);border:1px solid rgba(29,58,36,.17);border-left:6px solid var(--barn);
  border-radius:3px 3px 20px 3px;padding:15px 20px 13px;box-shadow:0 22px 46px -24px rgba(8,30,12,.75),inset 0 2px 0 rgba(255,255,255,.7);
  animation:rise .8s .15s cubic-bezier(.2,.8,.3,1) both}
.eyebrow{margin:0 0 8px;font:600 9.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#7d8b73}
h1{margin:0 0 9px;font:400 clamp(27px,4.3vw,44px)/.9 var(--display);letter-spacing:-.012em;color:var(--ink)}
h1 em{font-style:italic;color:#3f6d33}
.lede{margin:0 0 11px;font:400 12.5px/1.55 var(--sans);color:var(--ink2);max-width:33ch}
.meta{margin:0;padding-top:9px;border-top:1px dashed rgba(29,58,36,.22);font:600 9.5px/1.4 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:#8d8d7c}
.meta b{color:var(--gold);font-variant-numeric:tabular-nums}
.watch{position:absolute;right:clamp(14px,3vw,34px);top:clamp(14px,3vh,30px);text-align:right;max-width:min(270px,54vw);animation:rise .8s .35s cubic-bezier(.2,.8,.3,1) both}
.watch .eyebrow{margin:0;color:#eef6e8;opacity:.85;text-shadow:0 1px 8px rgba(14,42,20,.65)}
.wname{margin:3px 0 5px;font:italic 400 clamp(18px,2.4vw,25px)/1.05 var(--display);color:#fffaf0;text-shadow:0 3px 14px rgba(12,38,18,.55)}
.wfact{margin:0;font:400 11.5px/1.5 var(--sans);color:rgba(255,255,255,.9);text-shadow:0 1px 8px rgba(12,38,18,.6)}
.chips{position:absolute;left:clamp(14px,3vw,34px);bottom:clamp(12px,3vh,28px);display:flex;gap:8px;flex-wrap:wrap;max-width:70vw;animation:rise .8s .5s cubic-bezier(.2,.8,.3,1) both}
.chip{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;border:1px solid rgba(29,58,36,.18);
  background:var(--cream);color:#22402a;cursor:pointer;box-shadow:0 10px 22px -14px rgba(8,30,12,.7);
  transition:transform .3s cubic-bezier(.34,1.5,.64,1),box-shadow .3s,background .3s}
.chip:hover,.chip.on{transform:translateY(-4px);background:#fffdf6;box-shadow:0 16px 26px -12px rgba(8,30,12,.65)}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.chip b{font:400 13.5px/1 var(--display);letter-spacing:0}
.chip i{font:600 10.5px/1 var(--sans);font-style:normal;color:#a2793a;font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.tools{position:absolute;right:clamp(14px,3vw,34px);bottom:clamp(12px,3vh,28px);display:flex;gap:8px;animation:rise .8s .62s cubic-bezier(.2,.8,.3,1) both}
.tools button{pointer-events:auto;font:600 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;padding:12px 17px;border-radius:999px;
  border:1px solid rgba(29,58,36,.28);background:var(--ink);color:#f2efe2;cursor:pointer;transition:transform .28s,background .28s,box-shadow .28s}
.tools button:hover{transform:translateY(-3px);background:#2b5834;box-shadow:0 16px 26px -14px rgba(8,30,12,.8)}
.tools button:active{transform:translateY(0)}
.tools button.on{background:var(--barn);border-color:#7e2d1c}
.hint{position:absolute;right:clamp(14px,3vw,34px);bottom:calc(clamp(12px,3vh,28px) + 50px);margin:0;
  font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.86);text-shadow:0 1px 8px rgba(12,38,18,.65)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:780px){.lede,.hint{display:none}.card{padding:12px 14px 10px}.watch{max-width:44vw}}
@media (prefers-reduced-motion:reduce){.bounce,.leg,.tree,.blade,.wing,.rays,.mote,.shadow,.leaf,.ring{animation:none!important}}
</style>
</head>
<body>
<svg id="scene" preserveAspectRatio="xMidYMid slice"></svg>

<div class="hud">
  <header class="card">
    <p class="eyebrow">Field record · sheet no. 04</p>
    <h1>Hollow <em>Field</em></h1>
    <p class="lede">Four animals, four bouncing heartbeats, one very patient sun.</p>
    <p class="meta"><span id="air">still air</span> · <b id="total">0</b> hops today</p>
  </header>
  <div class="watch">
    <p class="eyebrow">Now watching</p>
    <p class="wname" id="wn">Nobody in particular</p>
    <p class="wfact" id="wf">Hover a creature, or a chip below.</p>
  </div>
  <nav class="chips" id="chips" aria-label="Animals in the field"></nav>
  <div class="tools">
    <button id="gust" type="button">Send a gust</button>
    <button id="hopall" type="button">Make them hop</button>
  </div>
  <p class="hint">keys 1&ndash;4 · click a tree</p>
</div>

<script>
(function(){
"use strict";
var svg=document.getElementById('scene'),chipsEl=document.getElementById('chips'),
    wnEl=document.getElementById('wn'),wfEl=document.getElementById('wf'),
    totEl=document.getElementById('total'),airEl=document.getElementById('air'),
    gustBtn=document.getElementById('gust'),hopBtn=document.getElementById('hopall');

var W=0,H=0,HZ=0,S=1,seed=1,drifters=[],lSun,lCloud,lTree,lFore,fxEl,
    wind=1,mx=0,my=0,tx=0,ty=0,last=0,counts=[0,0,0,0],total=0,hopEls=[];

function R(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function n(v){return Math.round(v*10)/10;}
function pick(a){return a[Math.floor(R()*a.length)];}

/* ---------- defs ---------- */
var DEFS='<defs>'+
'<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63aede"/><stop offset=".38" stop-color="#9fd6ef"/><stop offset=".72" stop-color="#d3ecf6"/><stop offset="1" stop-color="#f2f7e9"/></linearGradient>'+
'<linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa93f"/><stop offset=".26" stop-color="#59963a"/><stop offset=".62" stop-color="#4d8632"/><stop offset="1" stop-color="#356624"/></linearGradient>'+
'<linearGradient id="bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d4028"/><stop offset=".42" stop-color="#7d5630"/><stop offset="1" stop-color="#4a3121"/></linearGradient>'+
'<radialGradient id="glow"><stop offset="0" stop-color="#fff8cc" stop-opacity=".9"/><stop offset=".3" stop-color="#ffe885" stop-opacity=".5"/><stop offset="1" stop-color="#ffe885" stop-opacity="0"/></radialGradient>'+
'<radialGradient id="vig" cx=".5" cy=".44" r=".8"><stop offset=".52" stop-color="#0b2411" stop-opacity="0"/><stop offset="1" stop-color="#0b2411" stop-opacity=".4"/></radialGradient>'+
'<clipPath id="cowClip"><ellipse cx="-4" cy="-86" rx="90" ry="49"/></clipPath>'+
'</defs>';

/* ---------- sky furniture ---------- */
function sunLayer(){
  var r=Math.max(26,Math.min(58,H*.052)),x=W*.62,y=H*.145,i,a,r1,r2,ray='';
  for(i=0;i<12;i++){a=i*Math.PI/6;r1=r+11;r2=r+(i%2?26:44);
    ray+='<line x1="'+n(Math.cos(a)*r1)+'" y1="'+n(Math.sin(a)*r1)+'" x2="'+n(Math.cos(a)*r2)+'" y2="'+n(Math.sin(a)*r2)+
         '" stroke="#ffdf5e" stroke-width="6" stroke-linecap="round" opacity=".9"/>';}
  return '<g class="sun"><circle class="halo" r="'+n(r*4.4)+'" fill="url(#glow)"/>'+
   '<g transform="translate('+n(x)+','+n(y)+')"><g class="rays">'+ray+'</g></g>'+
   '<circle cx="'+n(x)+'" cy="'+n(y)+'" r="'+n(r)+'" fill="#ffd633"/>'+
   '<circle cx="'+n(x)+'" cy="'+n(y)+'" r="'+n(r*.76)+'" fill="#ffee76"/>'+
   '<circle cx="'+n(x-r*.24)+'" cy="'+n(y-r*.26)+'" r="'+n(r*.3)+'" fill="#fff6b4" opacity=".8"/></g>';
}
function clouds(){
  var sh=[[0,0,44,29],[38,5,30,22],[-38,7,28,21],[15,-17,31,24],[-17,-13,26,20],[60,2,20,16],[-58,4,18,15],[22,10,26,17]],
      out='',i,q,cnt=W<780?3:4,sc,y,v,x,p;
  for(i=0;i<cnt;i++){
    sc=(H/900)*(.72+(i%3)*.24)+.22;y=H*(.07+.135*(i%3))+(i*17)%(H*.06);v=9+(i*7)%12;x=W*((i+.28)/cnt);
    p='';for(var k=0;k<sh.length;k++){var q2=sh[k];p+='<ellipse cx="'+q2[0]+'" cy="'+q2[1]+'" rx="'+q2[2]+'" ry="'+q2[3]+'" fill="#fffdf7"/>';}
    p+='<ellipse cx="0" cy="17" rx="72" ry="11" fill="#dfeaf3"/>';
    out+='<g class="cl" data-drift="'+n(v)+' '+n(x)+' '+n(y)+' '+n(160*sc)+'" transform="translate('+n(x)+','+n(y)+')"><g transform="scale('+n(sc)+')">'+p+'</g></g>';
  }
  return out;
}
function birds(){
  var b='',i;
  for(i=0;i<3;i++){b+='<g transform="translate('+n(120+i*52*(i%2?-1:1))+','+n((i-1)*17)+')"><path class="wing" style="animation-delay:-'+(i*.21).toFixed(2)+'s" d="M -11 0 q 11 -10 11 -1 q 0 -9 11 -1" fill="none" stroke="#3f525c" stroke-width="2.6" stroke-linecap="round"/></g>';}
  return '<g data-drift="17 '+n(W*.6)+' '+n(H*.21)+' 320" transform="translate('+n(W*.6)+','+n(H*.21)+')">'+b+'</g>';
}
function hills(){
  var a='<path d="M 0 '+(HZ+3)+' L 0 '+n(HZ-H*.055)+' Q '+n(W*.17)+' '+n(HZ-H*.11)+' '+n(W*.35)+' '+n(HZ-H*.045)+
        ' Q '+n(W*.5)+' '+n(HZ-H*.01)+' '+n(W*.66)+' '+n(HZ-H*.066)+' Q '+n(W*.85)+' '+n(HZ-H*.125)+' '+W+' '+n(HZ-H*.035)+
        ' L '+W+' '+(HZ+3)+' Z" fill="#8dbb7f" opacity=".75"/>',
      b='<path d="M 0 '+(HZ+3)+' L 0 '+n(HZ-H*.028)+' Q '+n(W*.24)+' '+n(HZ-H*.072)+' '+n(W*.52)+' '+n(HZ-H*.015)+
        ' Q '+n(W*.78)+' '+(HZ+H*.015)+' '+W+' '+n(HZ-H*.045)+' L '+W+' '+(HZ+3)+' Z" fill="#6ea465" opacity=".9"/>',
      far='',i;
  for(i=0;i<9;i++){var x=R()*W,y=HZ-H*.005-R()*H*.012,k=.2+R()*.16;
    far+='<g transform="translate('+n(x)+','+n(y)+') scale('+n(k)+')"><ellipse cx="0" cy="-46" rx="42" ry="34" fill="#557f52"/><rect x="-6" y="-30" width="12" height="30" fill="#4c6242"/></g>';}
  return a+far+b;
}

/* ---------- ground ---------- */
function grassBase(){
  var pts='M 0 '+n(HZ+2),st=18,i,top='';
  for(i=1;i<=st;i++)top+=' L '+n(W*i/st)+' '+n(HZ+2+Math.sin(i/st*6.283+.8)*3.6);
  pts+=top;
  var o='<path d="'+pts+' L '+W+' '+H+' L 0 '+H+' Z" fill="url(#grassG)"/>'+
        '<path d="'+top+'" fill="none" stroke="#3d6f2d" stroke-width="3" opacity=".7"/>'+
        '<path d="'+top+' L '+W+' '+n(HZ+H*.055)+' L 0 '+n(HZ+H*.055)+' Z" fill="#7cba49" opacity=".33"/>'+
        '<ellipse cx="'+n(W*.3)+'" cy="'+n(HZ+H*.14)+'" rx="'+n(W*.24)+'" ry="'+n(H*.035)+'" fill="#86c158" opacity=".22"/>'+
        '<ellipse cx="'+n(W*.78)+'" cy="'+n(HZ+H*.2)+'" rx="'+n(W*.26)+'" ry="'+n(H*.04)+'" fill="#3f7028" opacity=".22"/>';
  for(i=0;i<74;i++){
    var x=R()*W,y=HZ+5+R()*(H-HZ-4),k=(.45+(y-HZ)/(H-HZ)*1.25)*S*1.15,col=pick(['#4d8c33','#5c9c39','#6fae45','#457e2e']);
    o+='<g transform="translate('+n(x)+','+n(y)+') scale('+n(k)+')"><path d="M -7 0 q 3 -9 5 -15 M 0 0 q 0 -12 1 -19 M 7 0 q -1 -9 -4 -14" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" opacity=".85"/></g>';
  }
  return o;
}
function flowers(){
  var o='',i;
  for(i=0;i<30;i++){
    var x=R()*W,y=HZ+H*.035+R()*(H-HZ)*.92,k=(.45+(y-HZ)/(H-HZ))*S*1.1,p=pick(['#f7f2e3','#f2c0cf','#f6dd86','#ffffff']);
    o+='<g transform="translate('+n(x)+','+n(y)+') scale('+n(k)+')"><path d="M0 0 v 8" stroke="#3f7a2c" stroke-width="1.7" stroke-linecap="round"/><circle r="3.7" fill="'+p+'"/><circle r="1.5" fill="#e0a53a"/></g>';
  }
  for(i=0;i<7;i++){var sx=R()*W,sy=HZ+H*.06+R()*(H-HZ)*.8,sk=(.6+R()*.7)*S;
    o+='<g transform="translate('+n(sx)+','+n(sy)+') scale('+n(sk)+')"><ellipse rx="11" ry="6" fill="#9aa2a0"/><ellipse cx="-2" cy="-1.6" rx="6" ry="3" fill="#c3cac7"/></g>';}
  return o;
}
function fence(){
  var fy=HZ+22,fs=Math.max(48,Math.min(74,W/21)),fh=34*S,o='',x;
  for(x=-16;x<W+16;x+=fs){
    o+='<g transform="translate('+n(x)+','+n(fy)+')"><rect x="-4" y="'+n(-fh)+'" width="8" height="'+n(fh)+'" rx="3" fill="#8b6a44"/>'+
       '<rect x="-4" y="'+n(-fh)+'" width="3" height="'+n(fh)+'" fill="#a9855c" opacity=".85"/>'+
       '<path d="M -4 '+n(-fh)+' L 0 '+n(-fh-5)+' L 4 '+n(-fh)+' z" fill="#6e5335"/></g>';
  }
  o+='<rect x="0" y="'+n(fy-fh*.74)+'" width="'+W+'" height="6" rx="3" fill="#8b6a44"/>'+
     '<rect x="0" y="'+n(fy-fh*.4)+'" width="'+W+'" height="6" rx="3" fill="#7a5c3a"/>';
  return o;
}
function props(){
  var o='',hx=W*.445,hy=HZ+H*.045;
  o+='<g transform="translate('+n(hx)+','+n(hy)+') scale('+n(S)+')"><ellipse cx="0" cy="2" rx="40" ry="8" fill="#2c5420" opacity=".3"/>'+
     '<path d="M -34 0 C -34 -32 34 -32 34 0 Z" fill="#d3ab5c"/>'+
     '<path d="M -26 -6 q 12 -18 26 -14 M -12 -2 q 10 -20 24 -12 M -30 -14 q 14 -12 26 -12" fill="none" stroke="#b8914a" stroke-width="2.4" stroke-linecap="round" opacity=".8"/></g>';
  o+='<g transform="translate('+n(W*.60)+','+n(HZ+H*.17)+')"><ellipse rx="'+n(60*S)+'" ry="'+n(15*S)+'" fill="#8a6b4a" opacity=".38"/>'+
     '<ellipse cx="'+n(-8*S)+'" cy="'+n(3*S)+'" rx="'+n(34*S)+'" ry="'+n(8*S)+'" fill="#6f5439" opacity=".3"/></g>';
  return o;
}
function trees(){
  var o='',i,
  list=[[.055,.018,1.05],[.925,.012,1.12],[.315,.024,.5],[.68,.02,.42]];
  for(i=0;i<list.length;i++){
    var L=list[i],x=W*L[0],gy=HZ+H*L[1],s=S*L[2];
    o+='<g data-leaf="'+n(x)+','+n(gy-170*s)+'"><g transform="translate('+n(x)+','+n(gy)+') scale('+n(s)+')"><g class="tree" style="animation-duration:'+n(6.4+i*1.3)+'s;animation-delay:-'+n(i*1.7)+'s">'+
       '<ellipse cx="0" cy="3" rx="72" ry="12" fill="#254a1b" opacity=".34"/>'+
       '<path d="M -26 -4 q 10 -8 26 -6 q 16 -2 26 6 q -12 6 -26 5 q -14 1 -26 -5 z" fill="#4b331f" opacity=".55"/>'+
       '<path d="M -22 -6 C -16 -50 -14 -86 -13 -124 L 13 -124 C 14 -86 16 -50 22 -6 Z" fill="url(#bark)"/>'+
       '<path d="M -12 -92 q -20 -6 -32 -20" stroke="#6b4a2c" stroke-width="7" fill="none" stroke-linecap="round"/>'+
       '<path d="M 12 -104 q 20 -4 30 -18" stroke="#6b4a2c" stroke-width="6" fill="none" stroke-linecap="round"/>'+
       canopy()+'</g></g></g>';
  }
  return o;
}
function canopy(){
  var CL=[[0,-188,42],[40,-164,36],[-42,-162,35],[64,-134,27],[-64,-132,26],[0,-138,44],[22,-158,38],[-24,-156,36]],
      i,s1='',s2='',s3='',q;
  for(i=0;i<CL.length;i++){q=CL[i];s1+='<circle cx="'+n(q[0]+5)+'" cy="'+n(q[1]+8)+'" r="'+n(q[2]-1)+'" fill="#356027"/>';}

  drifters=[];

/* ---------- interaction ---------- */
function spook(a,i){
  a.classList.remove('spook');
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    a.classList.add('spook');setTimeout(function(){a.classList.remove('spook');},840);});});
}
function watch(i){wnEl.textContent=specs[i].n;wfEl.textContent=specs[i].w;
  Array.prototype.forEach.call(chipsEl.children,function(c,j){c.classList.toggle('on',i===j);});}

  Array.prototype.forEach.call(chipsEl.children,function(c){c.classList.remove('on');});}
function leaves(x,y,c){
  var i,h='';
  for(i=0;i<c;i++){
    h+='<g transform="translate('+n(x+(R()*140-70))+','+n(y+(R()*70-35))+')"><path class="leaf" style="animation-duration:'+
       (2.4+R()*1.9).toFixed(2)+'s;animation-delay:'+(R()*.5).toFixed(2)+'s" d="M0 0 q7 -8 14 0 q-7 8 -14 0 z" fill="'+
       pick(['#69ac42','#4e8c36','#8fc45c'])+'"/></g>';
  }
  fxEl.insertAdjacentHTML('beforeend',h);
  setTimeout(function(){fxEl.innerHTML='';},5200);

/* ---------- loop ---------- */
function frame(t){
  var dt=Math.min(60,t-last)/1000,i,d;last=t;
  wind+=(1-wind)*.022;
  mx+=(tx-mx)*.06;my+=(ty-my)*.06;
  for(i=0;i<drifters.length;i++){
    d=drifters[i];d.x+=d.v*dt*wind;
    if(d.x>W+d.w)d.x=-d.w*1.15;
    if(d.x<-d.w*1.3)d.x=W+d.w;
    d.el.setAttribute('transform','translate('+d.x.toFixed(1)+','+d.y.toFixed(1)+')');
  }
  if(lSun)lSun.setAttribute('transform','translate('+(mx*7).toFixed(1)+','+(my*4).toFixed(1)+')');
  if(lCloud)lCloud.setAttribute('transform','translate('+(mx*13).toFixed(1)+','+(my*7).toFixed(1)+')');
  if(lTree)lTree.setAttribute('transform','translate('+(mx*5).toFixed(1)+',0)');
  if(lFore)lFore.setAttribute('transform','translate('+(-mx*17).toFixed(1)+','+(-my*7).toFixed(1)+')');
  requestAnimationFrame(frame);
}
