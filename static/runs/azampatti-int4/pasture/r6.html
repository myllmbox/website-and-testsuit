svg{display:block;width:100vw;height:100vh}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hop{animation:hop .8s ease-in-out infinite}
.h1{animation-duration:.72s;animation-delay:-.17s}
.h2{animation-duration:.86s;animation-delay:-.31s}
.h3{animation-duration:.78s;animation-delay:-.47s}
.h4{animation-duration:.92s;animation-delay:-.23s}
@keyframes drift{from{transform:translateX(1200px)}to{transform:translateX(-300px)}}
.cloud{animation:drift 60s linear infinite}
.c1{animation-delay:-3s}
.c2{animation-delay:-25s}
.c3{animation-delay:-45s}
</style>
