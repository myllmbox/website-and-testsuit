<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasture — Four Species</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#a8d9f4}
  #scene{position:fixed;inset:0;display:block;width:100vw;height:100vh;-webkit-user-select:none;user-select:none}

  /* ---------- overlay typography (system faces only) ---------- */
  .stamp{position:fixed;left:28px;bottom:26px;z-index:5;pointer-events:none}
  .stamp .bar{width:54px;height:3px;background:rgba(23,49,15,.6);margin-bottom:12px}
  .stamp h1{margin:0;font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:700;
    font-size:clamp(26px,3.6vw,44px);letter-spacing:.18em;text-transform:uppercase;color:#17330f;
    text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .stamp .meta{margin:8px 0 0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;color:rgba(23,49,15,.78)}
  .legend{position:fixed;right:24px;bottom:30px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .legend button{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#17330f;background:rgba(255,255,255,.46);border:1px solid rgba(23,49,15,.3);
    border-radius:999px;padding:8px 13px;cursor:pointer;transition:transform .25s ease,background .25s ease,box-shadow .25s ease}
  .legend button:hover,.legend button:focus-visible{transform:translateY(-3px);background:#fff;box-shadow:0 8px 18px rgba(18,50,8,.25);outline:none}
  .legend button:active{transform:translateY(0)}
  @media (max-width:760px){.legend{left:24px;right:24px;justify-content:flex-start;bottom:24px}.stamp{bottom:70px}}

  /* ---------- keyframes ---------- */
  @keyframes hop{
    0%,100%{transform:translateY(0)}
    12%{transform:translateY(-8px)}
    28%{transform:translateY(-17px)}
    44%{transform:translateY(-6px)}
    58%{transform:translateY(3px) scaleY(.975)}
    70%{transform:translateY(0)}
  }
  @keyframes drift{from{transform:translateX(-440px)}to{transform:translateX(1660px)}}
  @keyframes bobc{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
  @keyframes sway{0%{transform:rotate(-1.4deg)}100%{transform:rotate(1.6deg)}}
  @keyframes blade{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
  @keyframes flick{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-9deg)}92%{transform:rotate(6deg)}}
  @keyframes fly{from{transform:translate(-210px,0)}to{transform:translate(1410px,0)}}
  @keyframes flybob{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
  @keyframes mote{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-24px)}}

  .hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop .9s cubic-bezier(.35,.05,.6,.95) infinite}
  #pig .hop{animation-duration:.74s;animation-delay:-.05s}
  #sheep .hop{animation-duration:.86s;animation-delay:-.33s}
  #cow .hop{animation-duration:.97s;animation-delay:-.61s}
  #horse .hop{animation-duration:1.08s;animation-delay:-.44s}
  #animals .pos{transition:filter .35s ease;cursor:pointer}
  #animals .pos.here{filter:drop-shadow(0 0 9px rgba(255,247,170,.95)) drop-shadow(0 4px 6px rgba(255,236,120,.6))}
  #animals .pos.here .hop{animation-duration:.36s}

  .cld{animation:drift 118s linear infinite}
  .bob{animation:bobc 9s ease-in-out infinite}
  .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 130s linear infinite}
  .glow{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 7s ease-in-out infinite}
  .canopy{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.4s ease-in-out infinite alternate}
  .blade{transform-box:fill-box;transform-origin:50% 100%;animation:blade 4.6s ease-in-out infinite}
  .head{transform-box:fill-box;transform-origin:50% 90%;animation:nod 6.4s ease-in-out infinite}
  .tail{transform-box:fill-box;transform-origin:100% 0%;animation:flick 5.2s ease-in-out infinite}
  .fly{animation:fly 66s linear infinite}
  .flybob{animation:flybob 7.5s ease-in-out infinite}
  .bird{transform-box:fill-box;transform-origin:50% 70%;animation:flap .62s ease-in-out infinite}
  .mote{animation:mote 11s ease-in-out infinite}
  .band{fill:none;stroke:#52a34a;stroke-opacity:.16;stroke-width:9}

  @media (prefers-reduced-motion:reduce){
    .hop,.cld,.bob,.spin,.glow,.canopy,.blade,.head,.tail,.fly,.flybob,.bird,.mote{animation:none!important}
  }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A spring pasture with a bouncing cow, sheep, pig and horse under a bright sun and drifting clouds">
<defs>
  <linearGradient id="skyG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#59BDEF"/><stop offset=".45" stop-color="#98D6F5"/>
    <stop offset=".78" stop-color="#CBEDFB"/><stop offset="1" stop-color="#EDF8FD"/>
  </linearGradient>
  <linearGradient id="grassG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#9BD361"/><stop offset=".18" stop-color="#78BE4C"/>
    <stop offset=".55" stop-color="#4E9C35"/><stop offset="1" stop-color="#2A6C25"/>
  </linearGradient>
  <linearGradient id="cloudG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#E7F1F8"/>
  </linearGradient>
  <pattern id="tex" width="26" height="18" patternUnits="userSpaceOnUse">
    <path d="M3,18 q5,-9 10,-14" stroke="#ffffff" stroke-opacity=".16" fill="none" stroke-width="1.5"/>
    <path d="M15,18 q5,-8 9,-13" stroke="#0d3f13" stroke-opacity=".10" fill="none" stroke-width="1.5"/>
  </pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#FFF9C9" stop-opacity=".9"/>
    <stop offset=".42" stop-color="#FFEE8C" stop-opacity=".45"/><stop offset="1" stop-color="#FFE97A" stop-opacity="0"/></radialGradient>
  <radialGradient id="shadowG"><stop offset="0" stop-color="#133f12" stop-opacity=".42"/>
    <stop offset=".6" stop-color="#133f12" stop-opacity=".2"/><stop offset="1" stop-color="#133f12" stop-opacity="0"/></radialGradient>
  <clipPath id="cowClip"><ellipse cx="0" cy="-70" rx="60" ry="36"/></clipPath>
</defs>

  <!-- SKY -->
  <rect id="sky" x="-20" y="-24" width="1240" height="460" fill="url(#skyG)"/>

  <!-- SUN -->
  <g id="sun" transform="translate(966,110) scale(1)">
    <circle class="glow" r="150" fill="url(#glow)"/>
    <g id="rays" class="spin"></g>
    <circle r="50" fill="#FFEF9E"/>
    <circle r="41" fill="#FFF8D6"/>
  </g>

  <!-- CLOUDS -->
  <g id="cloudBand">
    <g class="cld" style="animation-duration:118s;animation-delay:-14s"><g class="cs"><g class="bob" style="animation-delay:-1.4s">
      <ellipse cx="-58" cy="10" rx="42" ry="25" fill="url(#cloudG)"/>
      <ellipse cx="-14" cy="-10" rx="46" ry="31" fill="url(#cloudG)"/>
      <ellipse cx="34" cy="4" rx="38" ry="24" fill="url(#cloudG)"/>
      <ellipse cx="72" cy="14" rx="26" ry="17" fill="#F6FAFD"/>
      <ellipse cx="-86" cy="18" rx="26" ry="16" fill="#F1F7FB"/>
      <ellipse cx="-30" cy="16" rx="40" ry="18" fill="#F3F8FC"/>
    </g></g></g>

    <g class="cld" style="animation-duration:86s;animation-delay:-52s"><g class="cs"><g class="bob" style="animation-delay:-4s">
      <ellipse cx="-40" cy="6" rx="30" ry="18" fill="url(#cloudG)"/>
      <ellipse cx="-6" cy="-8" rx="34" ry="22" fill="url(#cloudG)"/>
      <ellipse cx="28" cy="2" rx="27" ry="17" fill="url(#cloudG)"/>
      <ellipse cx="56" cy="10" rx="19" ry="12" fill="#F4F9FC"/>
      <ellipse cx="-60" cy="12" rx="18" ry="11" fill="#F1F7FB"/>
    </g></g></g>

    <g class="cld" style="animation-duration:152s;animation-delay:-98s"><g class="cs"><g class="bob" style="animation-delay:-6.4s">
      <ellipse cx="-70" cy="14" rx="50" ry="29" fill="url(#cloudG)"/>
      <ellipse cx="-20" cy="-10" rx="52" ry="34" fill="url(#cloudG)"/>
      <ellipse cx="40" cy="4" rx="44" ry="27" fill="url(#cloudG)"/>
      <ellipse cx="86" cy="18" rx="30" ry="18" fill="#F6FAFD"/>
      <ellipse cx="-100" cy="24" rx="28" ry="16" fill="#F1F7FB"/>
      <ellipse cx="6" cy="18" rx="48" ry="19" fill="#F3F8FC"/>
    </g></g></g>

    <g class="cld" style="animation-duration:70s;animation-delay:-27s"><g class="cs"><g class="bob" style="animation-delay:-2.2s">
      <ellipse cx="-26" cy="4" rx="22" ry="13" fill="url(#cloudG)"/>
      <ellipse cx="0" cy="-6" rx="26" ry="17" fill="url(#cloudG)"/>
      <ellipse cx="24" cy="4" rx="20" ry="13" fill="url(#cloudG)"/>
      <ellipse cx="-42" cy="10" rx="15" ry="9" fill="#F4F9FC"/>
    </g></g></g>
  </g>

  <!-- BIRDS -->
  <g id="birds" transform="translate(0,150)">
    <g class="fly"><g class="flybob">
      <g transform="translate(0,0)"><g class="bird" style="animation-delay:-.1s">
        <path d="M0,0 q7,-6 13,0 q6,-6 13,0" fill="none" stroke="#4f7286" stroke-width="2.6" stroke-linecap="round"/></g></g>
      <g transform="translate(52,-28)"><g class="bird" style="animation-delay:-.35s">

      <g transform="translate(118,-8)"><g class="bird" style="animation-delay:-.5s">

    </g></g>
  </g>

  <!-- GRASS -->
  <rect id="grass" x="-20" y="440" width="1240" height="250" fill="url(#grassG)"/>
  <rect id="grassTex" x="-20" y="440" width="1240" height="250" fill="url(#tex)" opacity=".45"/>
  <line id="hline" x1="-20" x2="1220" y1="440" y2="440" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
  <g id="hills" transform="translate(0,440)">
    <path d="M-20,2 C120,-24 210,-11 320,-25 C440,-39 520,-18 640,-31 C760,-43 860,-16 990,-29 C1090,-39 1170,-19 1220,-25 L1220,6 L-20,6 Z"
          fill="#2f6f2c" opacity=".4"/>
    <circle cx="180" cy="-8" r="17" fill="#2b6a29" opacity=".45"/>
    <circle cx="205" cy="-3" r="12" fill="#31732d" opacity=".45"/>
    <circle cx="720" cy="-10" r="16" fill="#2b6a29" opacity=".4"/>
    <circle cx="744" cy="-3" r="11" fill="#31732d" opacity=".4"/>
    <circle cx="990" cy="-6" r="15" fill="#2b6a29" opacity=".42"/>
  </g>
  <g id="bands">
    <path class="band"/><path class="band"/><path class="band"/>
  </g>
  <g id="foreA"></g>

  <!-- TREES -->
  <g id="trees">
    <g class="tree" transform="translate(60,515) scale(.5)">
      <ellipse cx="2" cy="6" rx="58" ry="13" fill="url(#shadowG)"/>
      <path d="M-7,4 C-9,-26 -9,-42 -6,-58 L6,-58 C9,-42 9,-26 7,4 Z" fill="#77502E"/>
      <path d="M-6,-58 L-16,-70 M6,-58 L17,-70" stroke="#77502E" stroke-width="6" stroke-linecap="round"/>
      <g class="canopy" style="animation-delay:-1.7s">
        <circle cx="0" cy="-102" r="34" fill="#2E7A2B"/><circle cx="-28" cy="-86" r="24" fill="#2E7A2B"/>
        <circle cx="27" cy="-88" r="25" fill="#2E7A2B"/><circle cx="-11" cy="-120" r="23" fill="#38893A"/>
        <circle cx="16" cy="-116" r="21" fill="#38893A"/><circle cx="-5" cy="-95" r="28" fill="#358235"/>
        <circle cx="14" cy="-104" r="15" fill="#61AE49" opacity=".7"/>
      </g>
    </g>

    <g class="tree" transform="translate(1068,595) scale(1.05)">
      <ellipse cx="2" cy="8" rx="70" ry="15" fill="url(#shadowG)"/>
      <path d="M-8,6 C-11,-24 -11,-46 -7,-64 L7,-64 C11,-46 11,-24 8,6 Z" fill="#6E4A2A"/>
      <path d="M-7,-64 L-19,-78 M7,-64 L19,-78 M-4,4 L-13,-2 M5,4 L14,-2" stroke="#6E4A2A" stroke-width="6" stroke-linecap="round"/>
      <g class="canopy">
        <circle cx="0" cy="-108" r="38" fill="#2C7A2E"/><circle cx="-32" cy="-88" r="27" fill="#2C7A2E"/>
        <circle cx="31" cy="-92" r="28" fill="#2C7A2E"/><circle cx="-14" cy="-130" r="26" fill="#35893A"/>
        <circle cx="18" cy="-124" r="24" fill="#35893A"/><circle cx="-6" cy="-100" r="31" fill="#327F33"/>
        <circle cx="-26" cy="-118" r="17" fill="#68B54D" opacity=".6"/><circle cx="21" cy="-107" r="14" fill="#68B54D" opacity=".55"/>
      </g>
    </g>

    <g class="tree" transform="translate(1158,498) scale(.62)">
      <ellipse cx="2" cy="5" rx="52" ry="11" fill="url(#shadowG)"/>
      <path d="M-6,4 C-8,-20 -8,-38 -5,-54 L5,-54 C8,-38 8,-20 6,4 Z" fill="#6E4A2A"/>
      <g class="canopy" style="animation-delay:-3.1s">

        <circle cx="15" cy="-106" r="18" fill="#38893A"/><circle cx="12" cy="-96" r="13" fill="#63B24A" opacity=".6"/>
      </g>
    </g>
  </g>

  <!-- ANIMALS -->
  <g id="animals">

    <!-- PIG -->
    <g id="pig" class="pos" transform="translate(132,551) scale(1)">
      <ellipse cx="10" cy="5" rx="58" ry="13" fill="url(#shadowG)"/>
      <g class="hop">
        <g fill="#D2718D">
          <rect x="-27" y="-24" width="9" height="24" rx="4.4"/><rect x="13" y="-24" width="9" height="24" rx="4.4"/>

        </g>

        <ellipse cx="-3" cy="-31" rx="27" ry="13" fill="#FAC6D3" opacity=".65"/>

          <circle cx="39" cy="-56" r="22" fill="#F5A9BE"/>
          <ellipse cx="59" cy="-51" rx="12.5" ry="9.5" fill="#E481A1"/>
          <ellipse cx="55" cy="-51" rx="2.7" ry="3.5" fill="#9C4F6A"/>
          <ellipse cx="63" cy="-51" rx="2.7" ry="3.5" fill="#9C4F6A"/>
          <circle cx="35" cy="-63" r="4" fill="#43232F"/><circle cx="36.4" cy="-64.4" r="1.4" fill="#fff" opacity=".9"/>
          <circle cx="50" cy="-64" r="3.4" fill="#43232F"/><circle cx="51.2" cy="-65.2" r="1.2" fill="#fff" opacity=".9"/>

        <g fill="#F5A9BE">

    </g>

    <!-- SHEEP -->

          <rect x="-19" y="-4" width="12" height="5" rx="2"/><rect x="15" y="-4" width="12" height="5" rx="2"/>
        </g>
        <ellipse cx="-2" cy="-58" rx="44" ry="29" fill="#F7F7F1"/>
        <g fill="#FDFDF9">
          <circle cx="-30" cy="-56" r="17"/><circle cx="-9" cy="-72" r="19"/><circle cx="15" cy="-64" r="17"/>
          <circle cx="31" cy="-52" r="14"/><circle cx="-21" cy="-42" r="14"/><circle cx="5" cy="-41" r="13"/>
        </g>
        <g fill="none" stroke="#E2E2D6" stroke-width="2" stroke-linecap="round" opacity=".9">

        </g>
        <g class="head" style="animation-delay:-3.4s">
          <ellipse cx="31" cy="-76" rx="11" ry="6" transform="rotate(-24 31 -76)" fill="#4A4753"/>
          <ellipse cx="63" cy="-78" rx="11" ry="6.5" transform="rotate(20 63 -78)" fill="#3E3C46"/>
          <ellipse cx="47" cy="-64" rx="15.5" ry="19" transform="rotate(12 47 -64)" fill="#454250"/>
          <ellipse cx="51" cy="-55" rx="10" ry="8" fill="#524F5D"/>
          <ellipse cx="51" cy="-54" rx="6" ry="4" fill="#2A2831"/>

    <!-- COW -->
    <g id="cow" class="pos" transform="translate(630,516) scale(1)">
      <ellipse cx="16" cy="6" rx="66" ry="15" fill="url(#shadowG)"/>
      <g class="hop">

        <g fill="#DDD6C7">

        </g>
        <g fill="#FBF8F1">
          <rect x="-27" y="-34" width="14" height="36" rx="6"/><rect x="37" y="-34" width="14" height="36" rx="6"/>
          <rect x="-28" y="-4" width="16" height="6" rx="2.8" fill="#3B3932"/><rect x="36" y="-4" width="16" height="6" rx="2.8" fill="#3B3932"/>
        </g>

          <ellipse cx="-26" cy="-62" rx="21" ry="17" fill="#33322D"/>

          <ellipse cx="44" cy="-80" rx="13" ry="18" fill="#33322D"/>
          <circle cx="-54" cy="-84" r="10" fill="#33322D"/>
        </g>
        <ellipse cx="-6" cy="-40" rx="12" ry="8" fill="#F2AEC1"/>
        <path d="M-11,-34 v3 M-1,-34 v3" stroke="#E18FA5" stroke-width="3" stroke-linecap="round"/>
        <path d="M36,-100 C52,-104 64,-100 70,-90 L58,-70 C46,-68 38,-70 32,-74 Z" fill="#FBF8F1"/>
        <g class="head" style="animation-delay:-2.3s">
          <path d="M59,-117 q-4,-13 -13,-16 q7,9 8,17 z" fill="#EDE2C9"/>
          <path d="M89,-122 q3,-11 12,-11 q-7,6 -7,13 z" fill="#EDE2C9"/>
          <ellipse cx="51" cy="-114" rx="12" ry="6.5" transform="rotate(-25 51 -114)" fill="#EBE2D5"/>
          <ellipse cx="97" cy="-117" rx="11" ry="6" transform="rotate(24 97 -117)" fill="#E2D7CB"/>
          <ellipse cx="74" cy="-100" rx="27" ry="23" transform="rotate(-8 74 -100)" fill="#FBF8F1"/>
          <ellipse cx="76" cy="-119" rx="12" ry="6" fill="#33322D" opacity=".92"/>
          <ellipse cx="86" cy="-95" rx="16" ry="12" fill="#F7F2EA"/>
          <ellipse cx="90" cy="-89" rx="14.5" ry="10" fill="#F0A9BA"/>
          <ellipse cx="85.5" cy="-90" rx="3" ry="4" fill="#8D5566"/>

<div class="stamp">
  <div class="bar"></div>
  <h1>Pasture</h1>
  <p class="meta">four species · bouncy hooves · 08:40 in may</p>
</div>
<div class="legend">
  <button data-for="pig" type="button">Pig</button>
  <button data-for="sheep" type="button">Sheep</button>
  <button data-for="cow" type="button">Cow</button>
  <button data-for="horse" type="button">Horse</button>
</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg", W=1200, i, j;
function byId(n){return document.getElementById(n)}
function mk(t,a,p){var e=document.createElementNS(NS,t),k;for(k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

var svg=byId('scene'), sky=byId('sky'), grass=byId('grass'), gtx=byId('grassTex'),
    hline=byId('hline'), hills=byId('hills'), sun=byId('sun'), birds=byId('birds'),
    foreA=byId('foreA'), foreB=byId('foreB'), bands=byId('bands'), motes=byId('motes'),
    rays=byId('rays');
var clds=[].slice.call(svg.querySelectorAll('.cs')),
    treeEls=[].slice.call(svg.querySelectorAll('.tree')),
    animalEls=[byId('pig'),byId('sheep'),byId('cow'),byId('horse')];

var cloudY=[.20,.46,.12,.66], cloudS=[1.12,.8,1.55,.66],
    treeDef=[[.05,.10,.5],[.89,.24,1.05],[.965,.06,.62]],
    aDef=[[132,.30,1],[388,.24,1],[630,.19,1],[880,.33,.92]];

/* sun rays */
for(i=0;i<12;i++) mk('polygon',{points:'-9,-58 9,-58 0,-118',transform:'rotate('+(i*30)+')',fill:'#FFF4B0',opacity:'.9'},rays);

/* ambient motes */
var mts=[];
for(i=0;i<12;i++){
  var g=mk('g',{},motes);
  mk('circle',{r:(1.5+(i%4)*.9).toFixed(1),fill:'#FFF8D2',opacity:'.45','class':'mote',
    style:'animation-delay:'+(-i*1.1).toFixed(2)+'s'},g);
  mts.push({el:g,xf:((i*97+70)%W),yf:.55+((i*13)%9)/20});
}

/* foreground meadow detail (deterministic) */
var seed=20240607; function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}
var BLADE="M0,0 C-2,-9 -7,-16 -11,-20 C-5,-17 -1,-9 0,-4 C0,-10 3,-16 9,-20 C6,-13 3,-6 3,0 Z", tufts=[];
for(i=0;i<26;i++){
  var x=rnd()*W, yf=.18+rnd()*.76, s=.8+rnd()*1.5;
  var host=(yf>.6)?foreB:foreA, g2=mk('g',{},host),
      b=mk('g',{'class':'blade','style':'animation-delay:'+(-rnd()*4).toFixed(2)+'s'},g2);
  mk('path',{d:BLADE,fill:(rnd()>.65?'#2C611F':'#3A7A2C')},b);
  tufts.push({el:g2,x:x,yf:yf,s:s});
}
for(i=0;i<9;i++){
  var fx=rnd()*W, fy=.62+rnd()*.34, g3=mk('g',{},foreB);
  mk('circle',{cx:-4,cy:0,r:3.4,fill:'#FFFDF2'},g3); mk('circle',{cx:4,cy:0,r:3.4,fill:'#FFFDF2'},g3);
  mk('circle',{cx:0,cy:4,r:3.4,fill:'#FFFDF2'},g3);  mk('circle',{cx:0,cy:-3,r:3.4,fill:'#FDF6F8'},g3);
  mk('circle',{cx:0,cy:0,r:2.1,fill:'#FFD34E'},g3);
  tufts.push({el:g3,x:fx,yf:fy,s:.85+rnd()*.6});
}

/* layout: full-viewport, horizon locked at 65% of height */
function layout(){
  var vw=window.innerWidth||1, vh=window.innerHeight||1,
      VH=Math.max(300,W*vh/vw), hor=VH*0.65, gH=VH-hor, k=Math.max(.6,Math.min(1.5,VH/650));
  svg.setAttribute('viewBox','0 0 '+W+' '+VH.toFixed(1));
  sky.setAttribute('y',-24); sky.setAttribute('height',(hor+24).toFixed(1));
  grass.setAttribute('y',hor.toFixed(1)); grass.setAttribute('height',(gH+40).toFixed(1));
  gtx.setAttribute('y',hor.toFixed(1));   gtx.setAttribute('height',(gH+40).toFixed(1));
  hline.setAttribute('y1',hor.toFixed(1));hline.setAttribute('y2',hor.toFixed(1));
  sun.setAttribute('transform','translate('+(W*0.805).toFixed(1)+','+(hor*0.30).toFixed(1)+') scale('+k.toFixed(3)+')');
  birds.setAttribute('transform','translate(0,'+(hor*0.42).toFixed(1)+')');
  hills.setAttribute('transform','translate(0,'+hor.toFixed(1)+')');
  for(i=0;i<clds.length;i++)
    clds[i].setAttribute('transform','translate(0,'+(hor*cloudY[i]).toFixed(1)+') scale('+cloudS[i].toFixed(2)+')');
  for(i=0;i<treeEls.length;i++){var td=treeDef[i];
    treeEls[i].setAttribute('transform','translate('+(td[0]*W).toFixed(1)+','+(hor+td[1]*gH).toFixed(1)+') scale('+(td[2]*k).toFixed(3)+')');}
  for(i=0;i<animalEls.length;i++){var ad=aDef[i];
    animalEls[i].setAttribute('transform','translate('+ad[0]+','+(hor+ad[1]*gH).toFixed(1)+') scale('+(ad[2]*k).toFixed(3)+')');}
  for(j=0;j<bands.children.length;j++){var yb=hor+gH*(.3+j*.25);
    bands.children[j].setAttribute('d','M-20,'+yb.toFixed(1)+' Q600,'+(yb-15).toFixed(1)+',1220,'+yb.toFixed(1));}
  for(j=0;j<tufts.length;j++){var t=tufts[j];
    t.el.setAttribute('transform','translate('+t.x.toFixed(1)+','+(hor+t.yf*gH).toFixed(1)+') scale('+t.s.toFixed(2)+')');}
  for(j=0;j<mts.length;j++){var m=mts[j];
    m.el.setAttribute('transform','translate('+m.xf.toFixed(1)+','+(VH*m.yf).toFixed(1)+')');}
}
layout();
var raf=0; window.addEventListener('resize',function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;layout()})});

/* micro-interactions: legend chips + tap/hover on the animals themselves */
function cheer(el,on){if(!el)return; if(on){el.classList.add('here'); el._t=setTimeout(function(){el.classList.remove('here')},1500);}
  else{clearTimeout(el._t);el.classList.remove('here');}}
var chips=document.querySelectorAll('.legend button'),ci;
for(ci=0;ci<chips.length;ci++)(function(btn){
  var target=byId(btn.getAttribute('data-for'));
  btn.addEventListener('mouseenter',function(){cheer(target,1)});
  btn.addEventListener('mouseleave',function(){cheer(target,0)});
  btn.addEventListener('focus',function(){cheer(target,1)});
  btn.addEventListener('blur',function(){cheer(target,0)});
  btn.addEventListener('click',function(){cheer(target,1)});
})(chips[ci]);
for(ci=0;ci<animalEls.length;ci++)(function(el){
  el.addEventListener('mouseenter',function(){cheer(el,1)});
  el.addEventListener('mouseleave',function(){cheer(el,0)});
  el.addEventListener('pointerdown',function(){cheer(el,1)});
})(animalEls[ci]);
})();
</script>
