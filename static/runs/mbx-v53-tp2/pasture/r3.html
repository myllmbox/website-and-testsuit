<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasture</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaf8}
body{font:400 15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0b2c3a;-webkit-font-smoothing:antialiased}
#scene{display:block;width:100vw;height:100vh}
.deco{pointer-events:none}

/* sky traffic */
.cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(-420px)}to{transform:translateX(2020px)}}
.flock{animation:driftB 74s linear infinite}
@keyframes driftB{from{transform:translateX(-520px)}to{transform:translateX(2120px)}}
.bfly{animation-name:wander;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes wander{0%{transform:translate(0,0)}20%{transform:translate(92px,-64px)}45%{transform:translate(214px,12px)}70%{transform:translate(108px,-48px)}100%{transform:translate(0,0)}}

/* animals */
.animal{cursor:pointer}
.hop{animation-name:hop;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,.65,.4,1)}
@keyframes hop{0%,100%{transform:translateY(0)}16%{transform:translateY(3px)}46%{transform:translateY(-20px)}74%{transform:translateY(2px)}}
.shade{animation-name:shade;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes shade{0%,100%{opacity:.26}46%{opacity:.12}}
#sheep .hop,#sheep .shade{animation-duration:.70s;animation-delay:-.05s}
#pig .hop,#pig .shade{animation-duration:.62s;animation-delay:-.31s}
#cow .hop,#cow .shade{animation-duration:.86s;animation-delay:-.52s}
#horse .hop,#horse .shade{animation-duration:.94s;animation-delay:-.19s}
.spook .hop{animation:spook .66s cubic-bezier(.2,.75,.3,1) 1 !important}
@keyframes spook{0%{transform:translateY(0)}30%{transform:translateY(-52px)}58%{transform:translateY(3px)}80%{transform:translateY(-9px)}100%{transform:translateY(0)}}
.ring{opacity:0;transition:opacity .3s}
.peek .ring{opacity:1}
.peek{filter:drop-shadow(0 7px 9px rgba(16,58,24,.32))}
.tag{opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f7fff3;stroke-width:6px;stroke-linejoin:round;fill:#0d3a24;font:800 25px ui-sans-serif,system-ui,sans-serif;letter-spacing:2.5px;text-anchor:middle}
.peek .tag{opacity:1}
.puff{animation:puff .72s ease-out forwards}
@keyframes puff{from{opacity:.5}to{opacity:0;transform:translateY(-18px)}}

/* hud */
.hud{position:fixed;left:clamp(16px,3vw,40px);top:clamp(14px,3vh,34px);z-index:4;pointer-events:none;max-width:min(48vw,430px)}
.badge{display:inline-flex;gap:8px;align-items:center;font:700 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.19em;text-transform:uppercase;color:#0b3a4a;background:rgba(255,255,255,.74);border:1px solid rgba(11,58,74,.16);padding:7px 12px;border-radius:999px;box-shadow:0 8px 20px rgba(8,40,60,.14)}
.badge i{width:7px;height:7px;border-radius:50%;background:#3f9b3f;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,155,63,.55)}70%{box-shadow:0 0 0 11px rgba(63,155,63,0)}100%{box-shadow:0 0 0 0 rgba(63,155,63,0)}}
h1{margin:16px 0 0;font:800 clamp(40px,6.4vw,76px)/.86 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.035em;color:#082936;text-shadow:0 2px 0 rgba(255,255,255,.5)}
h1 b{display:block;font:600 .3em/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#2b6f4e;margin-top:12px}
.sub{margin:14px 0 0;max-width:33ch;font-size:14px;color:#124152;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.chips{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.chips button{font:600 13px/1 ui-sans-serif,system-ui,sans-serif;display:flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;border:1px solid rgba(11,44,58,.18);background:rgba(255,255,255,.84);color:#082936;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.chips button:hover,.chips button:focus-visible{transform:translateY(-3px);box-shadow:0 12px 22px rgba(8,40,60,.2);background:#fff;outline:none}
.chips button i{width:13px;height:13px;border-radius:4px;background:var(--c,#888);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65)}
.chips em{font:700 9.5px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5a8794;font-style:normal}
.foot{position:fixed;right:20px;bottom:16px;z-index:4;font:700 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#0d3a24;opacity:.62;text-shadow:0 1px 0 rgba(255,255,255,.55);pointer-events:none}
.vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(122% 92% at 50% 42%,rgba(0,0,0,0) 55%,rgba(6,40,26,.26))}
@media (prefers-reduced-motion:reduce){.hop,.shade,.cloud,.flock,.bfly,.badge i,.puff{animation:none!important}.peek{filter:none}}
</style>
</head>

<script>
(function(){
  "use strict";
  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("scene");

  /* keep the whole field framed on any viewport */
  function fit(){
    var a=(window.innerWidth||1600)/(window.innerHeight||900);
    var w=900*a,h=900;
    if(w<1250){w=1250;h=w/a;}
    if(w>2200){w=2200;h=w/a;}
    svg.setAttribute("viewBox",((1600-w)/2).toFixed(1)+" "+(900-h).toFixed(1)+" "+w.toFixed(1)+" "+h.toFixed(1));
  }
  window.addEventListener("resize",fit); fit();

  /* ambient wildflowers + foreground grass tufts */
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var cols=["#fffdf0","#ffe36b","#ffb3c8","#ffffff"], f=document.getElementById("flowers"), i,k,g,p,c,m,a;
  for(i=0;i<46;i++){
    g=el("g",{transform:"translate("+(-250+Math.random()*2100).toFixed(1)+" "+(606+Math.pow(Math.random(),.7)*272).toFixed(1)+") scale("+(.6+Math.random()*.9).toFixed(2)+")"});
    g.appendChild(el("path",{d:"M0 0 V-9",stroke:"#2b6b22","stroke-opacity":".5","stroke-width":"1.6"}));
    for(k=0;k<4;k++){a=k/4*6.283;g.appendChild(el("circle",{cx:(Math.cos(a)*4).toFixed(1),cy:(-9+Math.sin(a)*4).toFixed(1),r:"3.1",fill:cols[i%4]}));}
    g.appendChild(el("circle",{cx:"0",cy:"-9",r:"1.9",fill:"#e9a83c"}));
    f.appendChild(g);
  }
  var fr=document.getElementById("front");
  for(i=0;i<16;i++){
    g=el("g",{transform:"translate("+(-200+Math.random()*2000).toFixed(1)+" "+(858+Math.random()*44).toFixed(1)+") scale("+(1.3+Math.random()*1.1).toFixed(2)+")",opacity:".85"});
    g.appendChild(el("path",{d:"M0 0c-2-16-8-22-14-28",stroke:"#245d1d","stroke-width":"3.4",fill:"none","stroke-linecap":"round"}));
    g.appendChild(el("path",{d:"M0 0c1-18 6-24 13-30",stroke:"#2f7425","stroke-width":"3.4",fill:"none","stroke-linecap":"round"}));
    g.appendChild(el("path",{d:"M0 0c0-14 2-22 1-32",stroke:"#3d8b2c","stroke-width":"3",fill:"none","stroke-linecap":"round"}));
    fr.appendChild(g);
  }

  /* spotlight + startle interactions */
  function find(id){return document.getElementById(id);}
  function dust(an){
    var x=+an.dataset.x,y=+an.dataset.y,s=+an.dataset.dust,n=document.getElementById("dust");
    for(var j=0;j<6;j++){
      var c=el("circle",{cx:(x+(Math.random()-.5)*100*s).toFixed(1),cy:(y-3-Math.random()*6).toFixed(1),r:((4+Math.random()*6)*s).toFixed(1),fill:"#cdbb92",opacity:".5"});
      c.setAttribute("class","puff"); n.appendChild(c);
      setTimeout((function(e){return function(){e.remove();};})(c),760);
    }
  }
  function spook(an){
    if(!an||an.dataset.busy)return;
    an.dataset.busy="1"; an.classList.add("spook"); dust(an);
    setTimeout(function(){an.classList.remove("spook");delete an.dataset.busy;},700);
  }
  [].forEach.call(document.querySelectorAll(".chips button"),function(b){
    var t=find(b.getAttribute("data-t"));
    function on(){if(t)t.classList.add("peek");}
    function off(){if(t)t.classList.remove("peek");}
    b.addEventListener("mouseenter",on); b.addEventListener("mouseleave",off);
    b.addEventListener("focus",on); b.addEventListener("blur",off);
    b.addEventListener("click",function(){spook(t);});
  });
  [].forEach.call(document.querySelectorAll(".animal"),function(an){
    an.dataset.dust=(Math.abs(parseFloat((an.getAttribute("transform").match(/scale\(([\d.]+)\)/)||[0,1])[1]))||1);
    an.addEventListener("mouseenter",function(){an.classList.add("peek");});
    an.addEventListener("mouseleave",function(){an.classList.remove("peek");});
    an.addEventListener("click",function(){spook(an);});
  });

  /* gentle depth on pointer move */
  var far=document.getElementById("farLayer");
  window.addEventListener("mousemove",function(e){
    var nx=(e.clientX/window.innerWidth-.5),ny=(e.clientY/window.innerHeight-.5);
    far.setAttribute("transform","translate("+(nx*20).toFixed(1)+" "+(ny*9).toFixed(1)+")");
  });

  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches&&svg.pauseAnimations){svg.pauseAnimations();}
})();
</script>
