<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pasture — a moving field study</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#8fcdec}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#22301d;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#skyG,#cloudsG,#tuftsB,#tuftsF,#trees,#fg,#hzline,#woods,#haze{pointer-events:none}
.animal{cursor:pointer}
.plaque{position:fixed;left:24px;top:22px;z-index:6;padding:10px 20px 13px 15px;background:rgba(248,243,231,.95);border-left:6px solid #c8622f;box-shadow:0 12px 30px rgba(18,44,16,.25);max-width:min(58vw,340px)}
.plaque h1{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,4.6vw,46px);line-height:.9;letter-spacing:-.6px}
.plaque h1 em{display:block;font-style:italic;font-weight:400;font-size:.35em;letter-spacing:.22em;text-transform:uppercase;color:#6c7c5d;margin-top:9px}
.plaque p{margin:10px 0 0;font-size:11px;line-height:1.55;color:#4c5c44;max-width:29ch}
.plaque p b{color:#1f2c1a;font-weight:600}
.legend{position:fixed;left:24px;bottom:22px;z-index:6;display:flex;gap:7px;flex-wrap:wrap}
.legend button{font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#2a3724;background:rgba(248,243,231,.92);border:0;border-bottom:3px solid #9bb587;padding:8px 13px 7px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .18s,background .18s,box-shadow .18s}
.legend button:hover,.legend button.on{transform:translateY(-4px);border-bottom-color:#c8622f;background:#fffdf6;box-shadow:0 8px 16px rgba(18,44,16,.22)}
.hud{position:fixed;right:24px;bottom:22px;z-index:6;display:flex;align-items:center;gap:14px;padding:9px 14px;background:rgba(28,42,24,.86);color:#f2ecdd;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 12px 26px rgba(10,26,8,.3)}
.hud button{font:inherit;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#1d2a19;background:#e9dfc6;border:0;padding:7px 12px;cursor:pointer;transition:background .18s,transform .18s}
.hud button:hover{background:#fff;transform:translateY(-2px)}
.hud label{display:flex;align-items:center;gap:9px}
.hud input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:3px;background:#6f8162;outline:0}
.hud input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ffd451;border:2px solid #1d2a19;cursor:pointer}
.hud input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#ffd451;border:2px solid #1d2a19;cursor:pointer}
.hud span{min-width:2.4em;color:#ffd451;font-variant-numeric:tabular-nums}
.hopper,.jumper,.rays,.halo,.shadow,.eyes,.ear,.tail,.sway,.bird{transform-box:fill-box}
.hopper{transform-origin:50% 100%;animation-name:hop;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.35,0,.5,1)}
.rays{transform-origin:50% 50%;animation:spin 96s linear infinite}
.halo{transform-origin:50% 50%;animation:pulse 6.5s ease-in-out infinite}
.shadow{transform-origin:50% 50%;animation-name:sh;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.eyes{transform-origin:50% 50%;animation:blink 6.2s infinite}
.tail{animation:swish 2.9s ease-in-out infinite}
.ear{transform-origin:50% 92%;animation:twitch 5.3s ease-in-out infinite}
.sway{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.bird{transform-origin:50% 100%;animation:flap .5s ease-in-out infinite}
.jumper.go{animation:spook .78s cubic-bezier(.2,.7,.3,1)}
.tag{opacity:0;transition:opacity .25s ease}
.animal:hover .tag,.animal.hot .tag{opacity:1}
.animal.hot .hopper{animation-duration:.42s!important}
.paused #scene *{animation-play-state:paused!important}
@keyframes hop{0%,100%{transform:translateY(0)}11%{transform:translateY(2px)}41%{transform:translateY(-17px)}68%{transform:translateY(0)}79%{transform:translateY(-5px)}91%{transform:translateY(0)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:.34}11%{transform:scale(1.07);opacity:.4}41%{transform:scale(.79);opacity:.17}68%{transform:scale(1);opacity:.34}79%{transform:scale(.93);opacity:.26}}
@keyframes spook{0%{transform:translateY(0) rotate(0)}16%{transform:translateY(-54px) rotate(-3deg)}44%{transform:translateY(0) rotate(0)}60%{transform:translateY(-21px)}80%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.07);opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes swish{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
@keyframes twitch{0%,87%,100%{transform:rotate(0)}91%{transform:rotate(-13deg)}95%{transform:rotate(6deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.15deg)}50%{transform:rotate(1.35deg)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
@media (prefers-reduced-motion:reduce){#scene *{animation:none!important}}
</style>
</head>

<clipPath id="cc"><rect x="-62" y="-118" width="124" height="72" rx="30"/><ellipse cx="0" cy="-58" rx="56" ry="20"/></clipPath>

<div class="plaque">
<h1>The Pasture<em>Morning · four beasts</em></h1>
<p>A field study in <b>circles, ellipses, rects and paths</b>. Nothing but geometry grazes here. Click a creature to startle it.</p>
</div>
<nav class="legend" id="legend" aria-label="Species">
<button data-t="a-pig">Pig</button><button data-t="a-cow">Cow</button><button data-t="a-sheep">Sheep</button><button data-t="a-horse">Horse</button>
</nav>
<div class="hud">
<button id="play">Pause</button>
<label>Wind<input id="wind" type="range" min="0" max="30" value="10"><span id="wv">1.0</span></label>
</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("scene");
var HOR=.66, W=0, H=0, playing=true, wind=1, last=0;
var $$=function(s){return document.querySelector(s)};
var el={sky:$$("#sky"),grass:$$("#grass"),haze:$$("#haze"),hz:$$("#hzline"),
 woods:$$("#woods"),sun:$$("#sun"),rays:$$("#rays"),clouds:$$("#cloudsG"),
 birds:$$("#birds"),tb:$$("#tuftsB"),tf:$$("#tuftsF"),trees:$$("#trees"),
 patches:$$("#patches"),vig:$$("#vig")};
var defs=document.createElementNS(NS,"defs");
var vg=document.createElementNS(NS,"radialGradient");
vg.id="gVig";vg.setAttribute("cx",".5");vg.setAttribute("cy",".44");vg.setAttribute("r",".78");
[[0,"#000",0],[.65,"#123a12",0],[1,"#0d2b0d",.26]].forEach(function(s){
 var st=document.createElementNS(NS,"stop");st.setAttribute("offset",s[0]);
 st.setAttribute("stop-color",s[1]);st.setAttribute("stop-opacity",s[2]);vg.appendChild(st);});
defs.appendChild(vg);svg.insertBefore(defs,svg.firstChild);

function rnd(seed){return function(){seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* --- sun rays --- */
for(var i=0;i<12;i++){
 var p=document.createElementNS(NS,"path");
 p.setAttribute("d","M-6 -52 L0 -106 L6 -52 Z");
 p.setAttribute("transform","rotate("+(i*30)+")");
 p.setAttribute("fill",i%2?"#ffe27a":"#ffd451");
 p.setAttribute("opacity",i%2?".8":"1");
 el.rays.appendChild(p);
}

/* --- clouds --- */
var tpl=document.getElementById("cloudTpl"), clouds=[];
for(i=0;i<6;i++){
 var c=tpl.cloneNode(true);c.removeAttribute("id");el.clouds.appendChild(c);
 clouds.push({el:c,x:Math.random(),fy:.05+Math.random()*.33,s:.5+Math.random()*.8,v:5+Math.random()*11});
}
/* --- birds --- */
var birds=[];
for(i=0;i<3;i++){
 var b=document.createElementNS(NS,"path");
 b.setAttribute("class","bird");b.setAttribute("d","M-11 0 q 6 -9 11 -2 q 5 -7 11 2");
 b.setAttribute("fill","none");b.setAttribute("stroke","#3f5560");b.setAttribute("stroke-width","2.2");
 b.setAttribute("stroke-linecap","round");b.style.animationDelay=(-i*.17)+"s";
 el.birds.appendChild(b);
 birds.push({el:b,x:Math.random(),fy:.16+Math.random()*.16,s:.55+Math.random()*.4,v:22+Math.random()*16});
}

/* --- trees --- */
function tree(x,y,s,flip,delay){
 var g=document.createElementNS(NS,"g");
 g.setAttribute("transform","translate("+x+","+y+") scale("+(flip?-s:s)+","+s+")");
 var sh=document.createElementNS(NS,"ellipse");
 sh.setAttribute("cx","14");sh.setAttribute("cy","4");sh.setAttribute("rx","58");sh.setAttribute("ry","11");
 sh.setAttribute("fill","url(#gShadow)");sh.setAttribute("opacity",".75");g.appendChild(sh);
 var sw=document.createElementNS(NS,"g");sw.setAttribute("class","sway");
 sw.style.animationDuration=(6+Math.random()*3).toFixed(2)+"s";sw.style.animationDelay=delay+"s";
 sw.innerHTML='<path d="M-11 2 L-7 -74 L7 -74 L11 2 Z" fill="url(#gTrunk)"/>'+
 '<path d="M-9 -46 q-16 -6 -22 -20 q14 -2 24 10z" fill="#5b3a22"/>'+
 '<path d="M9 -58 q16 -6 21 -20 q-14 -2 -23 10z" fill="#4d3320"/>'+
 '<path d="M-6 -20 q3 -22 0 -50" stroke="#3c2717" stroke-width="2.4" fill="none" opacity=".5"/>'+
 '<circle cx="-34" cy="-88" r="30" fill="url(#gLeaf)"/><circle cx="34" cy="-90" r="29" fill="url(#gLeaf)"/>'+
 '<circle cx="-14" cy="-128" r="27" fill="url(#gLeaf)"/><circle cx="20" cy="-126" r="26" fill="url(#gLeaf)"/>'+
 '<circle cx="0" cy="-106" r="42" fill="url(#gLeaf)"/>'+
 '<circle cx="-22" cy="-118" r="13" fill="#a7d97e" opacity=".45"/><circle cx="-6" cy="-132" r="10" fill="#b6e08c" opacity=".4"/>'+
 '<circle cx="18" cy="-98" r="14" fill="#2c6a2f" opacity=".3"/><circle cx="-26" cy="-80" r="12" fill="#2c6a2f" opacity=".28"/>'+
 '<circle cx="30" cy="-118" r="7" fill="#c9e79b" opacity=".55"/>';
 g.appendChild(sw);el.trees.appendChild(g);
}

/* --- ground scatter --- */
function scatter(){
 var r=rnd(2024);
 el.tb.textContent="";el.tf.textContent="";el.patches.textContent="";
 var n=Math.max(40,Math.round(W/11)),k;
 for(k=0;k<7;k++){
  var pe=document.createElementNS(NS,"ellipse");
  var py=H*(HOR+.03+r()*.3);
  pe.setAttribute("cx",(r()*1.2-.1)*W);pe.setAttribute("cy",py);
  pe.setAttribute("rx",60+r()*160);pe.setAttribute("ry",8+r()*20);
  pe.setAttribute("fill",r()>.5?"#b9dd8f":"#3a7b33");el.patches.appendChild(pe);
 }
 for(k=0;k<n;k++){
  var x=r()*W, fy=.685+Math.pow(r(),.85)*.315, y=H*fy, d=(fy-HOR)/(1-HOR);
  var h=5+d*34*(.45+r()*.75), near=d>.55;
  var g=document.createElementNS(NS,"path");
  g.setAttribute("d","M"+x+" "+y+" q "+(-h*.28)+" "+(-h*.55)+" "+(-h*.46)+" "+(-h)+
   "M"+x+" "+y+" q "+(h*.08)+" "+(-h*.6)+" "+(h*.05)+" "+(-h*1.15)+
   "M"+x+" "+y+" q "+(h*.3)+" "+(-h*.5)+" "+(h*.5)+" "+(-h*.9));
  g.setAttribute("fill","none");
  g.setAttribute("stroke",near?"#2f6e2c":"#69ad59");
  g.setAttribute("stroke-width",(0.9+d*1.9).toFixed(2));
  g.setAttribute("stroke-linecap","round");
  g.setAttribute("opacity",(0.35+d*.5).toFixed(2));
  (near?el.tf:el.tb).appendChild(g);
  if(r()>.9){
   var f=document.createElementNS(NS,"g"), fs=1.4+d*2.6;
   f.innerHTML='<circle r="'+fs+'" fill="'+(r()>.5?"#fdfcf2":"#f7d8e4")+'"/>'+
    '<circle cx="'+fs*.7+'" cy="'+(-fs*.5)+'" r="'+(fs*.5)+'" fill="#f2c94c"/>';
   f.setAttribute("transform","translate("+x+","+(-h*.9+y)+")");
   (near?el.tf:el.tb).appendChild(f);
  }
 }
}

/* --- distant treeline --- */
function woods(y){
 var r=rnd(77),d="M0 "+y,x=0;
 while(x<W+60){var w=22+r()*48,h=8+r()*24;d+=" q "+(w/2)+" "+(-h)+" "+w+" 0";x+=w;}
 d+=" L"+x+" "+(y+8)+" L0 "+(y+8)+" Z";el.woods.setAttribute("d",d);
}

/* --- layout --- */
var anims=[].slice.call(document.querySelectorAll(".animal"));
function layout(){
 var pw=W,ph=H;
 W=window.innerWidth||document.documentElement.clientWidth;
 H=window.innerHeight||document.documentElement.clientHeight;
 svg.setAttribute("viewBox","0 0 "+W+" "+H);
 var hz=Math.round(H*HOR);
 el.sky.setAttribute("x",0);el.sky.setAttribute("y",0);el.sky.setAttribute("width",W);el.sky.setAttribute("height",hz+1);
 el.grass.setAttribute("x",0);el.grass.setAttribute("y",hz);el.grass.setAttribute("width",W);el.grass.setAttribute("height",H-hz);
 el.haze.setAttribute("x",0);el.haze.setAttribute("y",hz);el.haze.setAttribute("width",W);el.haze.setAttribute("height",Math.max(20,(H-hz)*.28));
 el.hz.setAttribute("x",0);el.hz.setAttribute("y",hz-1);el.hz.setAttribute("width",W);
 woods(hz+1);
 var ss=Math.min(1,Math.max(.5,W/1000));
 el.sun.setAttribute("transform","translate("+Math.max(110,W*.825)+","+Math.max(96,H*.17)+") scale("+ss+")");
 var gs=Math.min(Math.max(Math.min(W/1320,H/820),.46),1.18);
 tree(W*.062,H*.815,gs*1.02,false,-1.2);
 tree(W*.945,H*.87,gs*.86,true,-3.4);
 tree(W*.22,H*.735,gs*.44,false,-5.1);
 if(pw>0){var k=W/pw;clouds.forEach(function(c){c.x*=k});birds.forEach(function(c){c.x*=k})}
 anims.forEach(function(a){
  var fx=+a.dataset.fx, gy=+a.dataset.gy, w=+a.dataset.w, h=+a.dataset.h;
  var s=gs*(.78+.22*(gy-.812)/.128);
  a.setAttribute("transform","translate("+(W*fx)+","+(H*gy)+") scale("+s+")");
  var hit=a.querySelector(".hit");
  hit.setAttribute("x",-w/2);hit.setAttribute("y",-h-6);hit.setAttribute("width",w);hit.setAttribute("height",h+12);
  var tag=a.querySelector(".tag");
  tag.setAttribute("transform","translate(0,"+(-h*s-26)+") scale("+(1/s)+")");
 });
 scatter();
}

/* --- drift loop --- */
function frame(ts){
 var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(playing){
  clouds.forEach(function(c){
   c.x+=c.v*wind*dt/W;
   var m=90*c.s+70;
   if(c.x*W>W+m){c.x=-m/W-.05;c.fy=.05+Math.random()*.33;c.s=.5+Math.random()*.8;c.v=5+Math.random()*11}
   c.el.setAttribute("transform","translate("+(c.x*W)+","+(c.fy*H)+") scale("+c.s+")");
  });
  birds.forEach(function(b){
   b.x+=b.v*wind*dt/W;
   var m=30*b.s+40;
   if(b.x*W>W+m)b.x=-m/W;
   b.el.setAttribute("transform","translate("+(b.x*W)+","+(b.fy*H+Math.sin(b.x*9)*7)+") scale("+b.s+")");
  });
 }
 requestAnimationFrame(frame);
}

/* --- interaction --- */
var playBtn=$$("#play"),wIn=$$("#wind"),wv=$$("#wv");
playBtn.addEventListener("click",function(){
 playing=!playing;document.body.classList.toggle("paused",!playing);
 playBtn.textContent=playing?"Pause":"Play";
});
wIn.addEventListener("input",function(){wind=+wIn.value/10;wv.textContent=wind.toFixed(1)});
anims.forEach(function(a){
 a.addEventListener("click",function(){
  var j=a.querySelector(".jumper");j.classList.remove("go");void j.getBBox();j.classList.add("go");
  setTimeout(function(){j.classList.remove("go")},820);
 });
});
[].slice.call(document.querySelectorAll(".legend button")).forEach(function(b){
 var a=document.getElementById(b.dataset.t);
 function on(){a.classList.add("hot");b.classList.add("on")}
 function off(){a.classList.remove("hot");b.classList.remove("on")}
 b.addEventListener("mouseenter",on);b.addEventListener("mouseleave",off);
 b.addEventListener("focus",on);b.addEventListener("blur",off);
 b.addEventListener("click",function(){a.dispatchEvent(new Event("click"))});
});
window.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();playBtn.click()}});

var rid;
window.addEventListener("resize",function(){clearTimeout(rid);rid=setTimeout(layout,80)});
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){
 playing=false;document.body.classList.add("paused");playBtn.textContent="Play";wIn.value=0;wind=0;wv.textContent="0.0";
}
layout();last=0;requestAnimationFrame(frame);
})();
</script>
</body>
</html>
