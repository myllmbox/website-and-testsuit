<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Farm — an animated pasture</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d6eefb}
#scene{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;left:0;top:0;padding:22px 26px;z-index:3;pointer-events:none;
 font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
.kick{font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#124a68;opacity:.72}
.hud h1{margin:.32em 0 .62em;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
 font-weight:600;font-size:clamp(25px,3.3vw,46px);line-height:.95;letter-spacing:-.02em;color:#0c3145;
 text-shadow:0 1px 0 rgba(255,255,255,.5)}
.hud h1 i{font-style:italic;color:#2b6b2f}
.chips{display:flex;gap:7px;flex-wrap:wrap;max-width:52vw;pointer-events:auto}
.chip{cursor:pointer;border:1.5px solid rgba(12,49,69,.28);background:rgba(255,255,255,.6);color:#0c3145;
 font:800 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:9px 12px;border-radius:2px;
 transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s,box-shadow .25s}
.chip:hover,.chip.on{background:#0c3145;color:#eef8ff;border-color:#0c3145;transform:translateY(-3px);box-shadow:0 7px 16px -8px rgba(12,49,69,.75)}
.chip:active{transform:translateY(-1px) scale(.97)}
.note{position:fixed;left:26px;bottom:15px;z-index:3;pointer-events:none;margin:0;
 font:800 9.5px/1.7 ui-sans-serif,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;
 color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(16,58,22,.6)}

/* ---------- motion ---------- */
.hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop var(--d,.86s) ease-in-out var(--dl,0s) infinite}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}10%{transform:translateY(1.6px) scaleY(.985)}
45%{transform:translateY(var(--amp,-15px)) scaleY(1.015)}78%{transform:translateY(0) scaleY(.99)}90%{transform:translateY(1.6px) scaleY(.985)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.animal{cursor:pointer}
.animal:hover .pop,.animal.hl .pop{transform:scale(1.05)}
.animal.spook .hop{animation-duration:.34s;--amp:-28px}
.shadow{fill:#123f18;opacity:.24;transform-box:fill-box;transform-origin:50% 50%;animation:shd var(--d,.86s) ease-in-out var(--dl,0s) infinite}
@keyframes shd{0%,100%{transform:scale(1);opacity:.24}45%{transform:scale(.85,.7);opacity:.12}}
.tag{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.animal:hover .tag,.animal.hl .tag{opacity:1;transform:translateY(0)}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s infinite var(--bl,0s)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}98%{transform:scaleY(1)}}
.tw{transform-box:fill-box;animation:tw 4.6s ease-in-out infinite var(--twd,0s)}
@keyframes tw{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-13deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
.sw{transform-box:fill-box;animation:sw 2.6s ease-in-out infinite var(--swd,0s)}
@keyframes sw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.canopy{transform-box:fill-box;transform-origin:50% 94%;animation:sway 6.4s ease-in-out infinite var(--swy,0s)}
@keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.4deg)}}
.trunkg{transform-box:fill-box;transform-origin:50% 100%;animation:sway2 6.4s ease-in-out infinite var(--swy,0s)}
@keyframes sway2{0%,100%{transform:rotate(.4deg)}50%{transform:rotate(-.4deg)}}
.gustable{transform-box:fill-box;transform-origin:50% 100%}
.breezy .gustable{animation:gust 3s ease-in-out}
@keyframes gust{0%,100%{transform:skewX(0) rotate(0)}28%{transform:skewX(-5deg) rotate(-2deg)}62%{transform:skewX(3deg) rotate(1.3deg)}}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
.flap{transform-box:fill-box;transform-origin:50% 100%;animation:flap .42s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.22)}}
.wingA{transform-box:fill-box;transform-origin:100% 50%;animation:wg .24s ease-in-out infinite alternate}
.wingB{transform-box:fill-box;transform-origin:0% 50%;animation:wg .24s ease-in-out infinite alternate}
@keyframes wg{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
.blades{transform-box:fill-box;transform-origin:50% 100%;animation:blade 7.5s ease-in-out infinite}
@keyframes blade{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.9deg)}}
</style>
</head>

<div class="hud">
 <p class="kick">Hollow Farm · pasture no. 4 · 06:40</p>
 <h1>Where the <i>grass</i><br>keeps bouncing</h1>
 <div class="chips">
  <button class="chip" data-a="cow">Cow</button>
  <button class="chip" data-a="sheep">Sheep</button>
  <button class="chip" data-a="pig">Pig</button>
  <button class="chip" data-a="horse">Horse</button>
 </div>

<p class="note">Hover a name · tap an animal</p>

<script>
(function(){
"use strict";
var svg=document.getElementById('scene');
function $(i){return document.getElementById(i);}
var el={sky:$('sky'),grass:$('grass'),hills:$('hills'),ridge:$('ridge'),treeline:$('treeline'),bushes:$('bushes'),
        fence:$('fence'),tuftsA:$('tuftsA'),tuftsB:$('tuftsB'),flowers:$('flowers'),fg:$('fg'),
        sun:$('sun'),clouds:$('clouds'),birds:$('birds'),flies:$('flies')};
var W=1600,H=990,hy=644,sd=20240517;
function rnd(){sd=(sd*1103515245+12345)&0x7fffffff;return sd/0x7fffffff;}
function rr(a,b){return a+(b-a)*rnd();}

/* --- sun --- */
(function(){
  var r='',i;
  for(i=0;i<12;i++){
    var L=(i%2)?92:116;
    r+='<path d="M-7 -62 L7 -62 L0 -'+L+' Z" fill="#ffe873" opacity="'+((i%2)?0.5:0.78)+'" transform="rotate('+(i*30)+')"/>';
  }
  el.sun.innerHTML='<circle class="halo" r="152" fill="url(#gHalo)"/><g class="rays">'+r+
    '</g><circle r="55" fill="#ffdb4f"/><circle r="46" fill="#fff08f"/><circle cx="-13" cy="-14" r="17" fill="#fffbd4" opacity=".7"/>';
})();

/* --- clouds --- */
var cloudDefs=[{u:.10,fy:.30,s:1.25,v:8},{u:.36,fy:.15,s:.72,v:5},{u:.62,fy:.44,s:1.45,v:11},
               {u:.86,fy:.24,s:.6,v:4},{u:.50,fy:.06,s:.85,v:6.2},{u:-.12,fy:.37,s:.95,v:9}];
(function(){
  var h='',i;
  for(i=0;i<cloudDefs.length;i++){
    var c=cloudDefs[i];
    h+='<g class="cl" opacity="'+(0.55+0.4*Math.min(1,c.s)).toFixed(2)+'"><use href="#'+((i%2)?'cloudB':'cloudA')+'" fill="url(#gCloud)"/></g>';
  }
  el.clouds.innerHTML=h;
  var g=el.clouds.children;
  for(i=0;i<g.length;i++){cloudDefs[i].el=g[i];}
})();

/* --- birds --- */
var birdDefs=[{u:.15,fy:.20,s:1,v:26},{u:.55,fy:.11,s:.75,v:34},{u:.8,fy:.30,s:.9,v:22}];
(function(){
  var h='',i;
  for(i=0;i<birdDefs.length;i++){
    h+='<g class="bd"><g class="flap" style="animation-delay:'+(-i*0.13).toFixed(2)+'s">'+
       '<path d="M0 0 Q10 -9 20 -3" stroke="#3d5f72" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
       '<path d="M0 0 Q-10 -9 -20 -3" stroke="#3d5f72" stroke-width="2.6" fill="none" stroke-linecap="round"/></g></g>';
  }
  el.birds.innerHTML=h;
  var g=el.birds.children;
  for(i=0;i<g.length;i++){birdDefs[i].el=g[i];}
})();

/* --- butterflies --- */
var flyDefs=[{fx:.28,fy:.90,v:.55,p:0},{fx:.66,fy:.97,v:.42,p:2.1}];
(function(){
  var h='',i;
  for(i=0;i<flyDefs.length;i++){
    h+='<g class="fy"><g class="wingA"><ellipse cx="-8" cy="-4" rx="9" ry="7.5" fill="#f7c948"/><ellipse cx="-6" cy="4" rx="6.5" ry="5.5" fill="#ef9f2b"/></g>'+
       '<g class="wingB" style="animation-delay:-.12s"><ellipse cx="8" cy="-4" rx="9" ry="7.5" fill="#f7c948"/><ellipse cx="6" cy="4" rx="6.5" ry="5.5" fill="#ef9f2b"/></g>'+
       '<ellipse cx="0" cy="0" rx="2.2" ry="6.5" fill="#4a3a22"/></g>';
  }
  el.flies.innerHTML=h;
  var g=el.flies.children;
  for(i=0;i<g.length;i++){flyDefs[i].el=g[i];}
})();

/* --- scenery generation --- */
function hillPath(y0,amp,wl,ph){
  var d='M0 '+(H+6)+' L0 '+y0.toFixed(1),x;
  for(x=0;x<=W;x+=18){
    var y=y0-amp*(0.55+0.45*Math.sin(x/wl+ph))-amp*0.3*Math.sin(x/(wl*0.37)+ph*2);
    d+=' L'+x+' '+y.toFixed(1);
  }
  return d+' L'+W+' '+(H+6)+' Z';
}
function build(){
  el.hills.innerHTML='<path d="'+hillPath(hy+4,38,300,0.7)+'" fill="url(#gHillA)"/>'+
                     '<path d="'+hillPath(hy+8,26,210,2.9)+'" fill="url(#gHillB)"/>';
  /* haze band + crisp horizon */
  el.ridge.innerHTML='<rect x="0" y="'+(hy-26)+'" width="'+W+'" height="26" fill="url(#gHaze)"/>'+
                     '<rect x="0" y="'+(hy-1)+'" width="'+W+'" height="2.4" fill="#2f6d31" opacity=".5"/>';
  /* distant tree line on the horizon */
  var s='',i,x;
  for(i=0;i<Math.round(W/85);i++){
    x=i*85+rr(-24,24);
    var r0=rr(12,26),y=hy+2;
    s+='<g opacity=".85"><circle cx="'+x.toFixed(0)+'" cy="'+(y-r0*0.55).toFixed(0)+'" r="'+r0.toFixed(0)+'" fill="#3f7f45"/>'+
       '<circle cx="'+(x+r0*0.8).toFixed(0)+'" cy="'+(y-r0*0.35).toFixed(0)+'" r="'+(r0*0.7).toFixed(0)+'" fill="#478a49"/></g>';
  }
  el.treeline.innerHTML=s;
  /* bushes on the grass */
  s='';
  for(i=0;i<7;i++){
    x=rr(0,W); var by=hy+rr(14,H*0.10), bs=rr(.5,1);
    s+='<g transform="translate('+x.toFixed(0)+' '+by.toFixed(0)+') scale('+bs.toFixed(2)+')">'+
       '<g fill="#3e8a3d"><circle cx="-20" cy="-12" r="16"/><circle cx="0" cy="-22" r="20"/><circle cx="20" cy="-12" r="15"/><circle cx="0" cy="-6" r="18"/></g>'+
       '<g fill="#57a248" opacity=".8"><circle cx="-8" cy="-24" r="11"/><circle cx="10" cy="-16" r="10"/></g></g>';
  }
  el.bushes.innerHTML=s;
  /* fence */
  var fy=hy+H*0.048, f='', p;
  for(p=-40;p<W+60;p+=98){
    f+='<rect x="'+(p-4)+'" y="'+(fy-44).toFixed(0)+'" width="8" height="46" rx="2" fill="#a4835c"/>'+
       '<rect x="'+(p-4)+'" y="'+(fy-44).toFixed(0)+'" width="3" height="46" fill="#c09a70" opacity=".7"/>';
  }
  f+='<rect x="0" y="'+(fy-36).toFixed(0)+'" width="'+W+'" height="7" fill="#b3906a"/>'+
     '<rect x="0" y="'+(fy-18).toFixed(0)+'" width="'+W+'" height="6" fill="#a4835c"/>';
  el.fence.innerHTML='<g opacity=".9">'+f+'</g>';
  /* grass tufts */
  function tuftSet(count,minD,shade){
    var t='',j;
    for(j=0;j<count;j++){
      var gx=rr(-20,W+20), d=minD+rnd()*(1-minD), gy=hy+(H-hy)*d, sc=(0.45+d*1.15)*rr(.8,1.2);
      t+='<path transform="translate('+gx.toFixed(1)+' '+gy.toFixed(1)+') scale('+sc.toFixed(2)+')" d="M0 0Q-3-8-8-14Q-2-9-1 0ZM0 0Q0-11 1-18Q4-10 3 0ZM2 0Q7-8 12-12Q6-6 3 0Z" fill="'+shade+'"/>';
    }
    return t;
  }
  el.tuftsA.innerHTML=tuftSet(Math.round(W/26),0,.5)  .split('fill="#4a9b3c"').join('fill="#5aa847"');
  el.tuftsB.innerHTML=tuftSet(Math.round(W/46),.45,.5);
  /* soft ground blotches */
  var b='',k;
  for(k=0;k<12;k++){
    var bx=rr(0,W), bd=rnd(), byy=hy+(H-hy)*bd;
    b+='<ellipse cx="'+bx.toFixed(0)+'" cy="'+byy.toFixed(0)+'" rx="'+rr(60,190).toFixed(0)+'" ry="'+rr(10,26).toFixed(0)+
       '" fill="'+(rnd()>.5?'#b9e58a':'#2c6b30')+'" opacity="'+(rnd()>.5?'.1':'.09')+'"/>';
  }
  el.tuftsA.insertBefore(strToG(b),el.tuftsA.firstChild);
  /* flowers */
  var fl='',cols=['#ffffff','#ffe58a','#f7a8c4','#ffffff','#ffd9e6'];
  for(k=0;k<Math.round(W/70);k++){
    var fx=rr(0,W), fd=Math.pow(rnd(),.8), fy2=hy+(H-hy)*(0.08+0.9*fd), fs=(0.5+fd*0.9), c=cols[k%cols.length], q, ff='';
    for(q=0;q<5;q++){var a=q*1.2566;ff+='<circle cx="'+(Math.cos(a)*3.6).toFixed(1)+'" cy="'+(Math.sin(a)*3.6).toFixed(1)+'" r="3.1" fill="'+c+'"/>';}
    fl+='<g transform="translate('+fx.toFixed(1)+' '+fy2.toFixed(1)+') scale('+fs.toFixed(2)+')"><path d="M0 0Q-1-5 0-9" stroke="#3d8a35" stroke-width="1.6" fill="none"/>'+ff+'<circle r="2.1" fill="#f6c34a"/></g>';
  }
  el.flowers.innerHTML=fl;
  /* stones */
  var st='';
  for(k=0;k<4;k++){var sx=rr(30,W-30),sy=hy+(H-hy)*rr(.2,.95),ss=rr(.6,1.3);
    st+='<g transform="translate('+sx.toFixed(0)+' '+sy.toFixed(0)+') scale('+ss.toFixed(2)+')"><ellipse rx="15" ry="9" fill="#9aa39a"/><ellipse cx="-3" cy="-3" rx="9" ry="5" fill="#b7bfb6"/></g>';}
  el.flowers.innerHTML+=st;
  /* foreground blades */
  el.fg.innerHTML='<g class="blades" opacity=".95"><g fill="#1f5b25">'+
    '<path d="M-10 1000 Q10 900 -14 848 Q26 906 22 1000Z" transform="translate('+(W*0.02)+' '+(H-72)+') scale(1.5)"/>'+
    '<path d="M-10 1000 Q4 910 20 856 Q22 916 22 1000Z" transform="translate('+(W*0.07)+' '+(H-58)+') scale(1.25)"/>'+
    '<path d="M-10 1000 Q14 906 -6 852 Q28 908 22 1000Z" transform="translate('+(W*0.94)+' '+(H-64)+') scale(1.4)"/>'+
    '<path d="M-10 1000 Q2 916 18 862 Q20 922 22 1000Z" transform="translate('+(W*0.99)+' '+(H-52)+') scale(1.2)"/>'+
    '<path d="M-10 1000 Q12 918 -8 866 Q26 920 22 1000Z" transform="translate('+(W*0.50)+' '+(H-38)+') scale(.95)"/>'+
    '</g></g>';
}
function strToG(s){var g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=s;return g;}

/* --- placement --- */
var LAYER={back:{y:.092,s:.60},mid:{y:.165,s:.78},front:{y:.248,s:.92},
           treeA:{y:.115,s:1.02},treeB:{y:.152,s:.86},treeC:{y:.045,s:.5}};
function place(){
  var ds=Math.min(1,W/1180), hs=H/990, all=svg.querySelectorAll('[data-x]'), i;
  for(i=0;i<all.length;i++){
    var g=all[i], L=LAYER[g.getAttribute('data-layer')];
    g.setAttribute('transform','translate('+(parseFloat(g.getAttribute('data-x'))*W).toFixed(1)+' '+
      (hy+L.y*H).toFixed(1)+') scale('+(L.s*ds*hs).toFixed(3)+')');
  }
  el.sun.setAttribute('transform','translate('+(W*0.84).toFixed(0)+' '+(H*0.155).toFixed(0)+') scale('+(hs*(0.85+ds*0.2)).toFixed(3)+')');
}
function fit(){
  var asp=(window.innerWidth||1600)/(window.innerHeight||900);
  H=990; W=H*asp;
  if(W<820){H=Math.min(1300,820/asp);W=H*asp;}
  if(W>2400){W=2400;H=W/asp;}
  if(H<700){H=700;W=H*asp;}
  W=Math.round(W); H=Math.round(H); hy=Math.round(H*0.65);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  el.sky.setAttribute('width',W); el.sky.setAttribute('height',hy+1);
  el.grass.setAttribute('y',hy);  el.grass.setAttribute('width',W); el.grass.setAttribute('height',H-hy+2);
  place(); build();
}

/* --- ambient loop --- */
var last=0;
function frame(t){
  var dt=Math.min(0.05,(t-last)/1000)||0; last=t;
  var i,c,m;
  for(i=0;i<cloudDefs.length;i++){
    c=cloudDefs[i]; m=250*c.s;
    c.u+=c.v*dt/(W+2*m); if(c.u>1)c.u-=1;
    c.el.setAttribute('transform','translate('+(c.u*(W+2*m)-m).toFixed(1)+' '+(hy*c.fy).toFixed(1)+') scale('+c.s+')');
  }
  for(i=0;i<birdDefs.length;i++){
    c=birdDefs[i]; m=90;
    c.u+=c.v*dt/(W+2*m); if(c.u>1)c.u-=1;
    c.el.setAttribute('transform','translate('+(c.u*(W+2*m)-m).toFixed(1)+' '+
      (hy*c.fy+Math.sin(t/850+i)*9).toFixed(1)+') scale('+c.s+')');
  }
  for(i=0;i<flyDefs.length;i++){
    c=flyDefs[i];
    var bx=c.fx*W+Math.sin(t/1700*c.v*4+c.p)*70;
    var by=hy+(H-hy)*0.16*c.fy+Math.sin(t/430*c.v*4+c.p)*24+H*0.12*c.fy;
    c.el.setAttribute('transform','translate('+bx.toFixed(1)+' '+by.toFixed(1)+') rotate('+(Math.sin(t/430*c.v*4+c.p)*10).toFixed(1)+') scale('+(0.9*(H/990)).toFixed(2)+')');
  }
  requestAnimationFrame(frame);
}

/* --- interactions --- */
function spook(a){a.classList.add('spook');setTimeout(function(){a.classList.remove('spook');},720);}
var chips=document.querySelectorAll('.chip');
Array.prototype.forEach.call(chips,function(ch){
  var a=$('a-'+ch.getAttribute('data-a'));
  if(!a)return;
  ch.addEventListener('mouseenter',function(){a.classList.add('hl');ch.classList.add('on');});
  ch.addEventListener('mouseleave',function(){a.classList.remove('hl');ch.classList.remove('on');});
  ch.addEventListener('focus',function(){a.classList.add('hl');});
  ch.addEventListener('blur',function(){a.classList.remove('hl');});
  ch.addEventListener('click',function(){spook(a);});
});
svg.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==svg&&!(t.classList&&t.classList.contains('animal')))t=t.parentNode;
  if(t&&t!==svg)spook(t);
});
setInterval(function(){
  svg.classList.add('breezy');
  setTimeout(function(){svg.classList.remove('breezy');},3200);
},11000);

var raf=0;
window.addEventListener('resize',function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);});
fit();
requestAnimationFrame(frame);
})();
</script>
