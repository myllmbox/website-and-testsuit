<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windrow Pasture</title>
<style>
:root{--disp:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--ink:#2b2418}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#bfe3f6}
#scene{position:fixed;inset:0;display:block}
#hud{position:fixed;left:18px;bottom:18px;z-index:5;max-width:min(340px,72vw);padding:13px 15px 11px;border-radius:15px 15px 15px 4px;background:#fffdf4;border:1px solid #ddd5be;box-shadow:0 16px 34px rgba(24,54,18,.28);user-select:none}
.tag{font:700 9px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#7c9a56;margin-bottom:7px}
#hud h1{margin:0;font:600 33px/.92 var(--disp);letter-spacing:-.015em;color:var(--ink)}
#hud h1 em{font-style:italic;color:#43752f}
.sub{margin:7px 0 11px;font:11.5px/1.45 var(--mono);color:#6c6455}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font:700 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:7px 9px;border-radius:8px;border:1px solid #d9d2bf;background:#fff;color:#3a3327;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,color .18s,box-shadow .18s}
.chips button:hover,.chips button:focus-visible{background:#2b2418;color:#fff6dd;border-color:#2b2418;transform:translateY(-3px);box-shadow:0 7px 12px rgba(43,36,24,.26);outline:none}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:8px;border-top:1px dashed #ded6c2;font:10px/1.2 var(--mono);color:#8a8172;letter-spacing:.06em}
.an{cursor:pointer}
.bounce{animation-name:hop;animation-timing-function:cubic-bezier(.45,.05,.5,.95);animation-iteration-count:infinite}
@keyframes hop{0%,100%{transform:translateY(0)}46%{transform:translateY(-16px)}}
.body{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.an:hover .body,.an.excited .body{transform:translateY(-3px) scale(1.055)}
.an:hover .bounce,.an.excited .bounce{animation-duration:.4s!important}
.an:hover .shadow,.an.excited .shadow{opacity:.34!important}
.ring{opacity:0;transition:opacity .3s}
.an:hover .ring,.an.excited .ring{opacity:.75}
.shadow{transition:opacity .3s}
.rays{transform-origin:0 0;animation:spin 95s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 5.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.09);opacity:1}}
.swish{transform-box:fill-box;transform-origin:50% 4%;animation:sway 2.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.tswish{transform-box:fill-box;transform-origin:50% 2%;animation:sway 2.8s ease-in-out infinite}
.flap{transform-box:fill-box;transform-origin:center left;animation:flap .16s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.22)}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bounce,.rays,.halo,.swish,.tswish,.flap,.tree{animation:none!important}}
</style>
</head>

<div id="hud">
<div class="tag">SVG primitives &middot; zero network calls</div>
<h1>Windrow <em>Pasture</em></h1>
<p class="sub">Four species, four off-beat hops, one very patient sun.</p>
<div class="chips"><button data-a="sheep">Sheep</button><button data-a="cow">Cow</button><button data-a="pig">Pig</button><button data-a="horse">Horse</button></div>
<div class="meta"><span id="clock">--:--</span><span id="fps">-- fps</span></div>
</div>
<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg",svg=document.getElementById("scene");
function $(i){return document.getElementById(i)}
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function rnd32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rnd32(97531);
var S={vbw:1600,u:1};
/* --- grass texture, flowers, sky pebbles --- */
(function(){
 var lawn=$("lawn"),peb=$("peb"),n=170,i,g,x,y,h,c;
 for(i=0;i<n;i++){
  var t=R();
  x=R();y=.592+Math.pow(t,.7)*.395;h=5+30*(y-.59)/.4;
  c=t>.5?"#2e6b2c":(t>.28?"#5aa349":"#7dbf5d");
  g=el("g",{transform:"translate("+(x*1600).toFixed(1)+","+(y*900).toFixed(1)+") scale("+(.55+.75*(y-.59)/.4).toFixed(2)+")",stroke:c,"stroke-width":1.8,"stroke-linecap":"round",fill:"none",opacity:(.5+.45*R()).toFixed(2)});
  g.appendChild(el("path",{d:"M 0 0 C -4 -"+(h*.45).toFixed(1)+" -7 -"+(h*.75).toFixed(1)+" -5 -"+h.toFixed(1)}));
  g.appendChild(el("path",{d:"M 0 0 C 0 -"+(h*.5).toFixed(1)+" 1 -"+(h*.8).toFixed(1)+" 1 -"+(h*1.15).toFixed(1)}));
  g.appendChild(el("path",{d:"M 0 0 C 4 -"+(h*.45).toFixed(1)+" 7 -"+(h*.7).toFixed(1)+" 6 -"+(h*.9).toFixed(1)}));
  lawn.appendChild(g);
 }
 var fc=["#fff6f0","#ffd85e","#ff9ec4","#ffffff","#ffe9a8"];
 for(i=0;i<30;i++){
  x=R();y=.64+Math.pow(R(),.6)*.33;
  g=el("g",{transform:"translate("+(x*1600).toFixed(1)+","+(y*900).toFixed(1)+")"});
  var col=fc[(R()*fc.length)|0];
  for(var k=0;k<5;k++){var an=k/5*6.283;g.appendChild(el("circle",{cx:(Math.cos(an)*4).toFixed(1),cy:(Math.sin(an)*4-7).toFixed(1),r:3.1,fill:col}))}
  g.appendChild(el("circle",{cx:0,cy:-7,r:2.1,fill:"#f5c93f"}));
  g.appendChild(el("path",{d:"M 0 -5 q 1 6 0 10",stroke:"#3b7a34","stroke-width":1.5,fill:"none"}));
  lawn.appendChild(g);
 }
 for(i=0;i<26;i++){peb.appendChild(el("circle",{cx:(R()*1600).toFixed(1),cy:(4+R()*520).toFixed(1),r:(1.1+R()*2.1).toFixed(1),fill:"#fff",opacity:(.2+.4*R()).toFixed(2)}))}
})();
/* --- sun rays --- */
(function(){
 var g=$("rays");
 for(var i=0;i<12;i++){
  var a=i*30*Math.PI/180,r0=64,r1=(i%2?96:122),w=.055;
  var p="M "+(Math.cos(a-w)*r0).toFixed(1)+" "+(Math.sin(a-w)*r0).toFixed(1)+
        " L "+(Math.cos(a)*r1).toFixed(1)+" "+(Math.sin(a)*r1).toFixed(1)+
        " L "+(Math.cos(a+w)*r0).toFixed(1)+" "+(Math.sin(a+w)*r0).toFixed(1)+" Z";
  g.appendChild(el("path",{d:p}));
 }
})();
/* --- clouds --- */
var clouds=[];
(function(){
 var host=$("clouds"),spec=[[.13,.17,.85,1],[.42,.10,1.25,.9],[.68,.24,.7,.8],[.88,.15,1.05,.95]];
 for(var i=0;i<spec.length;i++){
  var u=el("use",{href:"#cloud"+(i%2?"B":"A"),opacity:spec[i][3]});
  var g=el("g",{fill:"#fff"},null);g.appendChild(u);host.appendChild(g);
  clouds.push({g:g,p:spec[i][0],cy:spec[i][1]*585,v:(.000024+R()*.000022)*spec[i][2],s:spec[i][2]});
 }
})();
/* --- birds + butterflies --- */
var birds=[],bugs=[];
(function(){
 var host=$("birds");
 for(var i=0;i<3;i++){
  var g=el("g",null);
  g.appendChild(el("path",{d:"M -11 0 C -5 -7 -2 -7 0 -2 C 2 -7 5 -7 11 0",fill:"none",stroke:"#3f4c58","stroke-width":2.4,"stroke-linecap":"round"}));
  host.appendChild(g);
  birds.push({g:g,p:R(),y:(.10+R()*.20)*585,v:.00007+R()*.00005,f:R()*6});
 }
 var bh=$("bugs"),cols=["#ffb84d","#f47ec0"];
 for(var j=0;j<2;j++){
  var b=el("g",null),w=el("g",{class:"flap",style:"animation-delay:-"+(R()*.2).toFixed(2)+"s"});
  w.appendChild(el("path",{d:"M 0 0 C -11 -13 -18 -4 0 3 Z",fill:cols[j]}));
  w.appendChild(el("path",{d:"M 0 0 C 11 -13 18 -4 0 3 Z",fill:cols[j],opacity:.85}));
  w.appendChild(el("ellipse",{cx:0,cy:0,rx:1.6,ry:5,fill:"#3a2f26"}));
  b.appendChild(w);bh.appendChild(b);
  bugs.push({g:b,p:.2+R()*.6,cy:.80*900,amp:26+R()*30,v:.000045+R()*.00003,ph:R()*6.28});
 }
})();
/* --- horizon ridge path (topiary line) --- */
(function(){
 var d="M -40 592 L -40 584",x=-40;
 while(x<1640){var w=26+R()*46,hgt=10+R()*24;d+=" q "+(w/2).toFixed(1)+" -"+hgt.toFixed(1)+" "+w.toFixed(1)+" 0";x+=w}
 $("far").setAttribute("d",d+" L 1640 592 Z");
 $("ridge").setAttribute("d",d);
})();
/* --- layout --- */
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function place(){
 var W=innerWidth||1600,H=innerHeight||900,u=H/900,vbw=W/u;
 S.u=u;S.vbw=vbw;
 svg.setAttribute("viewBox","0 0 "+vbw.toFixed(1)+" 900");
 var items=document.querySelectorAll("[data-fx]");
 for(var i=0;i<items.length;i++){
  var e=items[i],f=+e.getAttribute("data-fx"),y=+(e.getAttribute("data-y")||0),s=e.getAttribute("data-s")?+e.getAttribute("data-s"):1;
  e.setAttribute("transform","translate("+(f*vbw).toFixed(1)+","+y+") scale("+s+")");
 }
 $("sky").setAttribute("width",vbw.toFixed(1));
 $("grass").setAttribute("width",vbw.toFixed(1));
 $("pond").setAttribute("cx",(vbw*.29).toFixed(1));
 $("pondbits").setAttribute("transform","translate("+(vbw*.29-330)+",0)");
 $("tree1").setAttribute("transform","translate("+(vbw*.055).toFixed(1)+",624) scale(.96)");
 $("tree2").setAttribute("transform","translate("+(vbw*.945).toFixed(1)+",652) scale(1.1)");
 var sun=$("sun");sun.setAttribute("transform","translate("+Math.min(vbw-170,vbw*.86).toFixed(1)+",136)");
 for(var k=0;k<clouds.length;k++)draw(clouds[k]);
 for(var b=0;b<birds.length;b++)drawB(birds[b]);
 for(var n=0;n<bugs.length;n++)drawU(bugs[n]);
}
function draw(c){var x=c.p*(S.vbw+560)-280;c.g.setAttribute("transform","translate("+x.toFixed(1)+","+c.cy.toFixed(1)+") scale("+c.s.toFixed(2)+")")}
function drawB(b){var x=b.p*(S.vbw+340)-170;var y=b.y+Math.sin(b.p*22+b.f)*11;b.g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+")")+(b.v<0?" scale(-1,1)":"")}
function drawU(u){var x=u.p*(S.vbw*.9)+S.vbw*.05,y=u.cy+Math.sin(u.p*9+u.ph)*u.amp;u.g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+")")}
/* --- motion loop --- */
var last=performance.now(),acc=0,frames=0,fpsEl=$("fps"),clockEl=$("clock"),t0=0;
function tick(t){
 var dt=Math.min(60,t-last);last=t;frames++;acc+=dt;
 if(!reduce){
  var i;
  for(i=0;i<clouds.length;i++){var c=clouds[i];c.p+=c.v*dt;if(c.p>1.36)c.p-=1.36;draw(c)}
  for(i=0;i<birds.length;i++){var b=birds[i];b.p+=b.v*dt;if(b.p>1.2)b.p-=1.4;drawB(b)}
  for(i=0;i<bugs.length;i++){var u=bugs[i];u.p+=u.v*dt;if(u.p>1)u.p-=1;drawU(u)}
 }
 if(acc>500){fpsEl.textContent=Math.round(frames*1000/acc)+" fps";frames=0;acc=0}
 if(t-t0>1000){t0=t;var d=new Date();clockEl.textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* --- chip interaction --- */
var chips=document.querySelectorAll(".chips button");
for(var i=0;i<chips.length;i++){(function(btn){
 var a=$("a-"+btn.getAttribute("data-a"));
 function on(){a.classList.add("excited");var g=a.querySelector(".bounce");if(g&&g.style){g.style.animationName="none";void a.offsetWidth;g.style.animationName="hop"}}
 function off(){a.classList.remove("excited")}
 btn.addEventListener("mouseenter",on);btn.addEventListener("focus",on);
 btn.addEventListener("mouseleave",off);btn.addEventListener("blur",off);
 btn.addEventListener("click",on);
})(chips[i])}
addEventListener("resize",place);
place();
})();
</script>
