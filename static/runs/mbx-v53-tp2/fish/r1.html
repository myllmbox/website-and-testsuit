<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Drift — Plate II</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#03101c;-webkit-font-smoothing:antialiased}
#stage{display:block;width:100vw;height:100vh}
.fish{cursor:pointer}
.lift{transform-box:fill-box;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.2,.8,.25,1)}
.fish:hover .lift{transform:scale(1.09) translateY(-7px)}
.fronds{transform-box:fill-box;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3.2deg)}to{transform:rotate(3.6deg)}}
.ray{transform-box:fill-box;transform-origin:50% 0;animation:shim 13s ease-in-out infinite alternate}
@keyframes shim{from{opacity:.42;transform:skewX(-2deg) scaleX(.93)}to{opacity:.95;transform:skewX(3.5deg) scaleX(1.07)}}
#surface{animation:glide 11s ease-in-out infinite alternate}
@keyframes glide{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.ano{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 6.5s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.93,.95)}to{transform:scale(1.07,1.05)}}
.caust{animation:caust 9s ease-in-out infinite alternate}
@keyframes caust{from{transform:translateX(-34px);opacity:.5}to{transform:translateX(34px);opacity:1}}
.hud{position:fixed;z-index:5;pointer-events:none;color:#e9f9ff;text-shadow:0 3px 22px rgba(2,16,30,.9)}
.tl{top:min(6vh,54px);left:min(5vw,58px);max-width:38ch;animation:rise 1.5s cubic-bezier(.2,.8,.25,1) both .25s}
.br{right:min(5vw,58px);bottom:min(5vh,44px);text-align:right;animation:rise 1.5s cubic-bezier(.2,.8,.25,1) both .65s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.kicker{font:600 10.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.34em;text-transform:uppercase;color:#7fd6ee}
h1{margin:.14em 0 .1em;font:400 clamp(40px,6.6vw,88px)/.9 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;letter-spacing:-.02em;color:#f6feff}
h1 em{display:block;font-style:italic;color:#ffc478}
.rule{width:104px;height:2px;margin:.7em 0 .8em;background:linear-gradient(90deg,#ffc478,rgba(255,196,120,0))}
.lede{max-width:33ch;font:400 13.5px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#bfe4f3}
.stat{margin-bottom:11px}
.stat b{display:block;font:400 26px/1 Georgia,"Times New Roman",serif;color:#ffd79b}
.stat span{font:600 9.5px/1.8 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.26em;text-transform:uppercase;color:#93d8ec}
.tip{margin-top:14px;font:italic 400 12.5px/1.5 Georgia,serif;color:#8ec9de;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<h1>Abyssal<em>Drift</em></h1>

<script>
(function(){
"use strict";
var svg=document.getElementById('stage'),NS='http://www.w3.org/2000/svg',XLINK='http://www.w3.org/1999/xlink';
var H=900,W=1600,BED=778;
var bubL=document.getElementById('bubbles'),moteL=document.getElementById('motes'),
    decorL=document.getElementById('bedDecor'),backL=document.getElementById('backdrop'),
    raysL=document.getElementById('rays'),bedP=document.getElementById('bedPath'),
    bedE=document.getElementById('bedEdge'),bedC=document.getElementById('bedClipPath');

function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function rnd(a,b){return a+Math.random()*(b-a);}
function use(id,color,cls){var u=el('use',{href:'#'+id});u.setAttributeNS(XLINK,'xlink:href','#'+id);
 if(color)u.setAttribute('color',color); if(cls)u.setAttribute('class',cls); return u;}
function ground(x){return BED+11*Math.sin(x*0.0042)+7*Math.sin(x*0.0113+1.7);}

/* ---------- terrain + decoration ---------- */
var items=[];
function place(parent,node,fx,s,yoff){var w=el('g');w.appendChild(node);parent.appendChild(w);
 items.push({w:w,fx:fx,s:s,yo:yoff||0});return w;}

var greens=['#2f8f63','#1f6f57','#3fa770','#256b4c','#48b07a','#1c5a4a','#2c8a58','#3d9c66'];
var i,w;
for(i=0;i<8;i++){
 var inner=el('g',{'class':'fronds'});
 inner.setAttribute('style','animation-duration:'+rnd(6,11).toFixed(1)+'s;animation-delay:-'+rnd(0,7).toFixed(1)+'s');
 inner.appendChild(use('weed',greens[i%greens.length]));
 place(decorL,inner,rnd(.03,.97),rnd(.55,1.35),4);
}
for(i=0;i<7;i++){
 var c=(i%2)?'#4a5866':'#6a7581';
 var r=el('path',{d:(i%3===0)?'M-46,16 C-42,-8 -24,-26 -2,-28 C20,-30 38,-14 46,16 Z':'M-34,14 C-30,-4 -12,-18 6,-18 C26,-18 36,-4 38,14 Z',fill:c});
 var rr=el('g');rr.appendChild(r);place(decorL,rr,rnd(.02,.98),rnd(.35,1.15),2);
}
for(i=0;i<11;i++){
 var p=el('ellipse',{cx:0,cy:0,rx:rnd(6,17).toFixed(1),ry:rnd(3,7).toFixed(1),fill:(i%2)?'#8b6b45':'#a98a5e','fill-opacity':.75});
 var pg=el('g');pg.appendChild(p);place(decorL,pg,rnd(.01,.99),1,10);
}
var anemCols=['#ef7f9d','#f2a35e','#c98ce0','#ff8f6b'];
for(i=0;i<4;i++){
 var ag=el('g',{'class':'ano'});ag.appendChild(use('anem',anemCols[i%4]));
 place(decorL,ag,rnd(.06,.94),rnd(.7,1.25),2);
}
for(i=0;i<2;i++){
 var fg=el('g');fg.appendChild(use('fan',['#e0677a','#f08a5f'][i]));fg.firstChild.setAttribute('opacity','.8');
 place(decorL,fg,.3+i*.42,rnd(.9,1.3),2);
}
for(i=0;i<5;i++){
 var mound=el('path',{d:'M-300,0 C-180,-130 -70,-186 10,-196 C90,-186 200,-120 320,0 Z',fill:'#0b3a5c',opacity:(.35+i*.05).toFixed(2)});
 place(backL,mound,(i+.4)/5.4,rnd(.7,1.25),34);
}
for(i=0;i<6;i++){
 var bk=el('g');bk.appendChild(use('weed','#0e4a52'));bk.firstChild.setAttribute('opacity','.5');
 place(backL,bk,rnd(.02,.98),rnd(.5,1),30);
}

function layout(){
 W=Math.max(880,Math.min(2400,Math.round(900*innerWidth/innerHeight)));
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 var pts=[],x;
 for(x=-60;x<=W+60;x+=140)pts.push([x,ground(x)]);
 var top='M'+pts[0][0]+','+pts[0][1].toFixed(1),j;
 for(j=1;j<pts.length-1;j++)top+=' Q'+pts[j][0]+','+pts[j][1].toFixed(1)+' '+((pts[j][0]+pts[j+1][0])/2).toFixed(1)+','+((pts[j][1]+pts[j+1][1])/2).toFixed(1);
 bedP.setAttribute('d',top+' L'+(W+60)+','+(H+60)+' L-60,'+(H+60)+' Z');
 bedC.setAttribute('d',top+' L'+(W+60)+','+(H+60)+' L-60,'+(H+60)+' Z');
 bedE.setAttribute('d',top);
 for(j=0;j<items.length;j++){var it=items[j],gx=it.fx*W;
  it.w.setAttribute('transform','translate('+gx.toFixed(1)+','+(ground(gx)+it.yo).toFixed(1)+') scale('+it.s.toFixed(2)+')');}
 for(j=0;j<bubbles.length;j++)bubbles[j].baseX=bubbles[j].fx*W;
 for(j=0;j<fish.length;j++){var f=fish[j];if(f.x>W+f.m)f.x=W+f.m;if(f.x<-f.m)f.x=-f.m;}
}

/* ---------- bubbles ---------- */
var vents=[.12,.3,.47,.62,.79,.93],bubbles=[];
function seed(b,x,y,r){
 b.r=(r!==undefined)?r:2.2+Math.pow(Math.random(),1.7)*9.8;
 b.fx=(x!==undefined)?x/W:vents[(Math.random()*vents.length)|0]+rnd(-.03,.03);
 b.baseX=b.fx*W; b.y=(y!==undefined)?y:ground(b.baseX)+rnd(0,34);
 b.vy=11+155/(b.r+7)+rnd(0,7); b.amp=rnd(5,26); b.freq=rnd(.4,1.3); b.ph=rnd(0,6.28);
 b.c.setAttribute('r',b.r.toFixed(2));
 b.c.setAttribute('stroke-width',Math.max(.6,b.r*.1).toFixed(2));
 b.h.setAttribute('r',(b.r*.26).toFixed(2));
 b.h.setAttribute('cx',(-b.r*.3).toFixed(2));
 b.h.setAttribute('cy',(-b.r*.34).toFixed(2));
 b.g.setAttribute('opacity',Math.min(.95,.4+b.r/14).toFixed(2));
}
function makeBubble(x,y,r,temp){
 var g=el('g'),c=el('circle',{fill:'url(#bub)',stroke:'rgba(226,247,255,.55)'}),h=el('circle',{fill:'rgba(255,255,255,.9)'});
 g.appendChild(c);g.appendChild(h);
 var b={g:g,c:c,h:h,r:0,x:0,y:0,fx:0,baseX:0,vy:0,amp:0,freq:0,ph:0,temp:!!temp};
 seed(b,x,y,r);bubL.appendChild(g);bubbles.push(b);return b;
}
for(i=0;i<18;i++){var nb=makeBubble();nb.y=rnd(-60,ground(W/2));}
function tickBubbles(dt,t){
 for(var k=bubbles.length-1;k>=0;k--){
  var b=bubbles[k];b.y-=b.vy*dt;b.r+=dt*.28;
  var prog=(1-(b.y/H))*.9+.5;
  b.x=b.baseX+Math.sin(t*b.freq+b.ph)*b.amp*prog;
  if(b.y<-b.r-8){
   if(b.temp){bubL.removeChild(b.g);bubbles.splice(k,1);continue;}
   seed(b);b.r=rnd(2.2,12);continue;
  }
  b.c.setAttribute('r',b.r.toFixed(2));
  b.g.setAttribute('transform','translate('+b.x.toFixed(1)+','+b.y.toFixed(1)+')');
 }
}

/* ---------- plankton motes ---------- */
var motes=[];
for(i=0;i<30;i++){
 var c=el('circle',{r:rnd(.7,2.4).toFixed(2),fill:'#e2f7ff',opacity:rnd(.06,.3).toFixed(2)});
 moteL.appendChild(c);motes.push({c:c,x:Math.random()*W,y:Math.random()*H,vy:rnd(2,9),vx:rnd(-6,2),ph:rnd(0,6.28)});
}
function tickMotes(dt,t){
 for(var k=0;k<motes.length;k++){var m=motes[k];
  m.y-=m.vy*dt;m.x+=(m.vx+Math.sin(t*.5+m.ph)*3)*dt;
  if(m.y<-8){m.y=H+8;m.x=Math.random()*W;} if(m.x<-10)m.x=W+10; if(m.x>W+10)m.x=-10;
  m.c.setAttribute('transform','translate('+m.x.toFixed(1)+','+m.y.toFixed(1)+')');
 }
}

/* ---------- fish ---------- */
function Fish(o){
 o.g=document.getElementById(o.id);o.tail=o.g.querySelector('.tail');o.fin=o.g.querySelector('.side');
 o.sp=o.base;o.spT=o.base;
 o.g.addEventListener('mouseenter',function(){o.spT=o.base*2.6;});
 o.g.addEventListener('mouseleave',function(){o.spT=o.base;});
 return o;
}
var fish=[
 Fish({id:'fishA',x:520,y0:288,dir:1,base:56,m:250,ba:20,bf:.15,ph:0,tf:.9,ta:11,px:-92,py:0,fpx:34,fpy:6}),
 Fish({id:'fishB',x:1180,y0:560,dir:-1,base:134,m:200,ba:30,bf:.26,ph:2.1,tf:2,ta:14,px:-64,py:0,fpx:22,fpy:3})
];

var last=0,acc=0,rb=document.getElementById('rb'),rc=document.getElementById('rc'),rd=document.getElementById('rd'),amb=18;
function frame(ts){
 var t=ts/1000,dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;
 for(var k=0;k<fish.length;k++){
  var f=fish[k];
  f.sp+=(f.spT-f.sp)*Math.min(1,dt*2.6);
  f.x+=f.dir*f.sp*dt;
  if(f.dir>0&&f.x-f.m>W)f.x=-f.m; else if(f.dir<0&&f.x+f.m<0)f.x=W+f.m;
  var y=f.y0+Math.sin(t*f.bf*6.283+f.ph)*f.ba;
  var rot=Math.sin(t*f.bf*6.283+f.ph+1.2)*2.6;
  f.g.setAttribute('transform','translate('+f.x.toFixed(1)+','+y.toFixed(1)+') rotate('+rot.toFixed(2)+') scale('+f.dir+',1)');
  var wag=Math.sin(t*f.tf*6.283+f.ph)*f.ta*(f.sp/f.base);
  f.tail.setAttribute('transform','rotate('+wag.toFixed(2)+','+f.px+','+f.py+')');
  f.fin.setAttribute('transform','rotate('+(-wag*.55).toFixed(2)+','+f.fpx+','+f.fpy+')');
 }
 tickBubbles(dt,t);tickMotes(dt,t);
 acc+=dt;
 if(acc>.3){acc=0;rb.textContent=bubbles.length;rc.textContent=(fish[0].sp/52).toFixed(2);rd.textContent=(11.6+Math.sin(t*.25)*.7).toFixed(1);}
 requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
svg.addEventListener('pointerdown',function(e){
 var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
 var m=svg.getScreenCTM();if(!m)return;var q=p.matrixTransform(m.inverse());
 if(bubbles.length>110)return;
 for(var k=0;k<7;k++)makeBubble(q.x+rnd(-24,24),q.y+rnd(-14,18),rnd(1.4,5.5),true);
});
var px=0,py=0;
addEventListener('mousemove',function(e){
 px=(e.clientX/innerWidth-.5);py=(e.clientY/innerHeight-.5);
 raysL.setAttribute('transform','translate('+(px*38).toFixed(1)+','+(py*10).toFixed(1)+')');
 backL.setAttribute('transform','translate('+(-px*20).toFixed(1)+','+(-py*8).toFixed(1)+')');
});
addEventListener('resize',layout);
layout();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
