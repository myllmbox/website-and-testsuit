<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Drift — an SVG reef</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#03131f;color:#e8f7ff;font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
.fish{cursor:pointer}
.lbl{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-style:italic;font-size:15px;text-anchor:middle;fill:#eaf9ff;stroke:rgba(3,25,45,.55);stroke-width:4px;paint-order:stroke;opacity:0;transition:opacity .4s ease;pointer-events:none}
.fish.hot .lbl{opacity:1}
.fish.hot .bodyg{filter:url(#glow)}
.ray{mix-blend-mode:screen;animation-name:ray;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes ray{0%,100%{opacity:.08;transform:translateX(-26px) skewX(0deg)}50%{opacity:.28;transform:translateX(26px) skewX(-2.5deg)}}
.mote{mix-blend-mode:screen;fill:#dff6ff;animation-name:mote;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}14%{opacity:.55}86%{opacity:.3}100%{opacity:0;transform:translateY(var(--ry,-400px))}}
.caus{mix-blend-mode:screen;animation:caus 19s ease-in-out infinite}
@keyframes caus{0%,100%{transform:translateX(-40px);opacity:.35}50%{transform:translateX(44px);opacity:.7}}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.brand{position:absolute;left:clamp(16px,3.2vw,54px);top:clamp(14px,3.4vh,46px)}
.kicker{font-size:10.5px;letter-spacing:.44em;text-transform:uppercase;color:#bfe8f5;opacity:.8}
.brand h1{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:400;font-size:clamp(46px,7.4vw,108px);line-height:.84;letter-spacing:-.025em;margin:.12em 0 0;text-shadow:0 10px 34px rgba(2,20,40,.55)}
.brand h1 em{font-style:italic;color:#ffc49a}
.lede{max-width:29ch;margin-top:16px;padding-left:13px;border-left:2px solid rgba(255,255,255,.3);font-size:13px;line-height:1.6;color:#bcdfe9;opacity:.85}
.brand>*{opacity:0;transform:translateY(16px);animation:up .95s cubic-bezier(.2,.75,.2,1) forwards}
.brand .kicker{animation-delay:.1s}.brand h1{animation-delay:.26s}.brand .lede{animation-delay:.46s}
@keyframes up{to{opacity:1;transform:none}}
.legend{position:absolute;right:clamp(14px,2.6vw,46px);bottom:clamp(16px,3.2vh,44px);display:grid;gap:9px;justify-items:end;opacity:0;animation:up 1s .85s cubic-bezier(.2,.75,.2,1) forwards}
.sp{display:flex;align-items:center;gap:11px;padding:8px 14px 8px 10px;border:1px solid rgba(180,225,240,.22);border-radius:2px;background:rgba(4,26,44,.5);color:inherit;font:inherit;cursor:pointer;transition:border-color .3s,transform .3s,background .3s}
.sp:hover{transform:translateX(-6px);border-color:rgba(214,242,252,.6);background:rgba(7,38,62,.68)}
.sw{width:16px;height:16px;border-radius:50%;transition:width .35s ease}
.sp:hover .sw{width:26px}
.sp b{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.sp i{font-style:normal;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9cc9dc;opacity:.85}
.ticks{position:absolute;right:clamp(14px,2.2vw,34px);top:20%;bottom:34%;display:flex;flex-direction:column;justify-content:space-between;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:rgba(190,225,240,.45);opacity:0;animation:up 1s 1.1s forwards}
.ticks span{position:relative;padding-left:24px}
.ticks span::before{content:"";position:absolute;left:0;top:50%;width:15px;height:1px;background:rgba(190,225,240,.4)}
.hint{position:absolute;left:clamp(16px,3.2vw,54px);bottom:clamp(16px,3.2vh,44px);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(190,225,240,.5)}
@media (max-height:520px){.ticks{display:none}}
@media (max-width:620px){.ticks,.lede{display:none}}
@media (prefers-reduced-motion:reduce){.ray,.mote,.caus,.brand>*,.legend,.ticks{animation-duration:.01s;animation-iteration-count:1;opacity:1}}
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1600 900" aria-label="Animated underwater reef scene">
<defs>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7fdcf3"/><stop offset=".16" stop-color="#41aed6"/>
<stop offset=".42" stop-color="#1a72a8"/><stop offset=".7" stop-color="#0b4674"/>
<stop offset="1" stop-color="#031f39"/></linearGradient>
<radialGradient id="gSun" cx=".5" cy="0" r=".85">
<stop offset="0" stop-color="#f2feff" stop-opacity=".6"/><stop offset=".5" stop-color="#bfeeff" stop-opacity=".14"/>
<stop offset="1" stop-color="#bfeeff" stop-opacity="0"/></radialGradient>
<linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e8fbff" stop-opacity=".75"/><stop offset=".6" stop-color="#cdefff" stop-opacity=".18"/>
<stop offset="1" stop-color="#cdefff" stop-opacity="0"/></linearGradient>
<radialGradient id="gCaustic" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#eafeff" stop-opacity=".55"/><stop offset="1" stop-color="#eafeff" stop-opacity="0"/></radialGradient>
<linearGradient id="gRidge" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#14506e"/><stop offset="1" stop-color="#0a3350"/></linearGradient>
<linearGradient id="gSand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e6cd9c"/><stop offset=".3" stop-color="#cba974"/>
<stop offset=".7" stop-color="#9b7749"/><stop offset="1" stop-color="#5c4227"/></linearGradient>
<linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8f8272"/><stop offset="1" stop-color="#453b30"/></linearGradient>
<linearGradient id="gK1" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#14563f"/><stop offset="1" stop-color="#5cbf78"/></linearGradient>
<linearGradient id="gK2" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#0f4f4a"/><stop offset="1" stop-color="#3fbf95"/></linearGradient>
<linearGradient id="gK3" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#0a3a44"/><stop offset="1" stop-color="#1d7f70"/></linearGradient>
<linearGradient id="gABody" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffc59a"/><stop offset=".38" stop-color="#ff8f4d"/>
<stop offset=".82" stop-color="#e0512a"/><stop offset="1" stop-color="#b03a20"/></linearGradient>
<linearGradient id="gATail" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#ff9a5c" stop-opacity=".95"/><stop offset="1" stop-color="#f26b34" stop-opacity=".55"/></linearGradient>
<linearGradient id="gAFin" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#c9451f"/><stop offset="1" stop-color="#ffb98a"/></linearGradient>
<radialGradient id="gBBody" cx=".58" cy=".38" r=".78">
<stop offset="0" stop-color="#9ff5e6"/><stop offset=".45" stop-color="#38c6bb"/>
<stop offset=".85" stop-color="#158398"/><stop offset="1" stop-color="#0d5a78"/></radialGradient>
<linearGradient id="gBTail" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#ffd166" stop-opacity=".95"/><stop offset="1" stop-color="#3fc0c8" stop-opacity=".5"/></linearGradient>
<radialGradient id="gBub" cx=".34" cy=".28" r=".8">
<stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".45" stop-color="#d3f1ff" stop-opacity=".14"/>
<stop offset=".88" stop-color="#eafaff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/></radialGradient>
<radialGradient id="gVig" cx=".5" cy=".44" r=".8">
<stop offset=".5" stop-color="#00121f" stop-opacity="0"/><stop offset="1" stop-color="#00121f" stop-opacity=".68"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect id="water" x="0" y="0" width="100%" height="100%" fill="url(#gWater)"/>
<rect id="sun" x="0" y="0" width="100%" height="55%" fill="url(#gSun)"/>
<g id="rays"></g>
<g id="caustics" filter="url(#soft)"></g>
<g id="surface"></g>
<g id="motes"></g>
<g id="far"></g>
<g id="mid"></g>
<g id="near"></g>
<g id="bubbles"></g>

<g id="fishLayer">
  <g id="fA" class="fish"><g class="bodyg">
    <g class="tail"><path d="M-96 0L-174 -50Q-140 0 -174 50Z" fill="url(#gATail)"/>
    <path d="M-96 0L-160 -32Q-136 0 -160 32Z" fill="#ffd2ae" opacity=".28"/></g>
    <path d="M-42 28C-18 62 14 58 34 28C6 42-16 42-42 28Z" fill="url(#gAFin)" opacity=".92"/>
    <path d="M-46-30C-22-78 34-72 64-26C20-42-12-40-46-30Z" fill="url(#gAFin)"/>
    <path d="M112 0C88-30 20-45-34-34C-76-26-101-12-104 0C-101 12-76 26-34 34C20 45 88 30 112 0Z" fill="url(#gABody)"/>
    <path d="M-28-33C-6-8-6 10-22 33" stroke="#b8421e" stroke-width="3" fill="none" opacity=".35"/>
    <path d="M16-40C36-16 36 14 14 40" stroke="#fff4e8" stroke-width="3" fill="none" opacity=".22"/>
    <path d="M62-25C53-5 53 8 60 25" stroke="#c8542c" stroke-width="3" fill="none" opacity=".55"/>
    <g class="pec"><path d="M24 4C8 34-24 40-34 22C-14 16 0 12 24 4Z" fill="#ffd2ae" opacity=".7"/></g>
    <circle cx="80" cy="-9" r="11.5" fill="#f7fdff"/><circle cx="83" cy="-9" r="5.4" fill="#0d2231"/>
    <circle cx="78.4" cy="-12.6" r="2.1" fill="#fff"/>
    <path d="M92 10C100 17 109 14 113 5" stroke="#8a2f18" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <text class="lbl" x="4" y="-72">Coral darter</text>
  </g></g>

  <g id="fB" class="fish"><g class="bodyg">
    <g class="tail"><path d="M-42 0L-100 -42Q-74 0 -100 42Z" fill="url(#gBTail)"/></g>
    <path d="M-16 40C-2 68 22 64 34 34C12 46-2 44-16 40Z" fill="#2bb3ac"/>
    <path d="M-18-42C-6-80 26-74 42-34C14-48-2-46-18-42Z" fill="#3fd0c6"/>
    <path d="M52 4C46-30 22-49-4-48C-32-46-46-24-46 2C-46 27-30 48-2 48C24 48 46 33 52 4Z" fill="url(#gBBody)"/>
    <path d="M-22-42C-30-14-30 14-22 44" stroke="#ffd166" stroke-width="4" fill="none" opacity=".55"/>
    <path d="M6-47C-2-16-2 16 6 47" stroke="#0b4b63" stroke-width="4" fill="none" opacity=".38"/>
    <g class="pec"><path d="M14 6C2 28-18 32-24 20C-9 15 2 12 14 6Z" fill="#c9fff5" opacity=".62"/></g>
    <circle cx="26" cy="-14" r="9.6" fill="#f7fdff"/><circle cx="29" cy="-14" r="4.6" fill="#0d2231"/>
    <circle cx="24.6" cy="-17" r="1.8" fill="#fff"/>
    <circle cx="-30" cy="4" r="6" fill="#ffd166" opacity=".55"/>
    <path d="M42 13C49 18 55 15 57 9" stroke="#0a4356" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <g transform="scale(-1 1)"><text class="lbl" x="-2" y="-64">Jade discus</text></g>
  </g></g>
</g>

<g id="fore"></g>
<g id="bubblesF"></g>
<rect id="vig" x="0" y="0" width="100%" height="100%" fill="url(#gVig)" style="pointer-events:none"/>
</svg>

<div class="hud">
  <header class="brand">
    <p class="kicker">Reef field study No. 04</p>
    <h1>Drift<em>.</em></h1>
    <p class="lede">Two fish, one sandy shelf, a steady rain of bubbles. Every creature here is a path, an ellipse and a gradient &mdash; nothing but SVG.</p>
  </header>
  <div class="ticks"><span>0 m</span><span>14 m</span><span>28 m</span><span>42 m</span></div>
  <div class="legend">
    <button class="sp" data-f="0"><span class="sw" style="background:linear-gradient(90deg,#ff9a5c,#df4f26)"></span><b>Coral darter</b><i>swift</i></button>
    <button class="sp" data-f="1"><span class="sw" style="background:linear-gradient(90deg,#5fe3cf,#1a8fa8)"></span><b>Jade discus</b><i>patient</i></button>
  </div>
  <p class="hint">click the water &middot; hover a fish</p>
</div>

<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg";
var svg=document.getElementById("scene");
var q=function(i){return document.getElementById(i);};
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
var W=1,H=1,T=0,last=0,S=1,px=0,py=0,tx=0,ty=0;

function ftop(x){return H*0.866+Math.sin(x*0.0017+1.2)*H*0.02+Math.sin(x*0.0043+.4)*H*0.011;}
function strip(fn){var d="M-60 "+fn(-60).toFixed(1);for(var x=-60;x<=W+60;x+=28)d+="L"+x+" "+fn(x).toFixed(1);
return d+"L"+(W+60)+" "+(H+60)+"L-60 "+(H+60)+"Z";}

/* ambient */
function buildAmbient(){
 var g=q("rays");while(g.firstChild)g.removeChild(g.firstChild);
 for(var i=0;i<6;i++){var x=W*(0.06+0.17*i)+Math.random()*W*0.05,w1=16+Math.random()*46,w2=w1*(3+Math.random()*2.6),sk=H*0.13+Math.random()*H*0.12;
  el("path",{"class":"ray",fill:"url(#gRay)",d:"M"+(x-w1/2)+" -40L"+(x+w1/2)+" -40L"+(x+w2/2+sk)+" "+(H*0.9)+"L"+(x-w2/2+sk)+" "+(H*0.9)+"Z",
   style:"animation-duration:"+(11+Math.random()*11)+"s;animation-delay:-"+(Math.random()*12)+"s;transform-box:fill-box;transform-origin:50% 0"},g);}
 var c=q("caustics");while(c.firstChild)c.removeChild(c.firstChild);
 for(var j=0;j<5;j++)el("ellipse",{"class":"caus",cx:W*(0.1+0.2*j),cy:H*0.05+Math.random()*H*0.07,rx:W*0.09+Math.random()*90,ry:9+Math.random()*11,
  fill:"url(#gCaustic)",style:"animation-delay:-"+(Math.random()*19)+"s"},c);
 var s=q("surface");while(s.firstChild)s.removeChild(s.firstChild);
 el("rect",{x:0,y:0,width:W,height:H*0.022,fill:"#dff6ff","fill-opacity":.16},s);
 var d="M-20 "+(H*0.024);for(var k=-20;k<=W+20;k+=34)d+="Q"+(k+9)+" "+(H*0.024+Math.sin(k*0.02)*5-3)+" "+(k+17)+" "+(H*0.024+Math.cos(k*0.013)*4);
 el("path",{d:d,fill:"none",stroke:"#eafeff","stroke-opacity":.5,"stroke-width":2},s);
 var m=q("motes");while(m.firstChild)m.removeChild(m.firstChild);
 for(var n=0;n<26;n++){var e=el("circle",{"class":"mote",cx:Math.random()*W,cy:H*0.1+Math.random()*H*0.85,r:0.7+Math.random()*2.1},m);
  e.style.animationDuration=(16+Math.random()*24)+"s";e.style.animationDelay=(-Math.random()*34)+"s";
  e.style.setProperty("--ry",(-H*(0.4+Math.random()*0.55))+"px");}
}

/* floor + rocks + kelp */
var ridge,sand,ROCKS=[{x:.12,r:.06,h:.03},{x:.28,r:.032,h:.017},{x:.5,r:.075,h:.038},{x:.64,r:.028,h:.015},{x:.82,r:.052,h:.028},{x:.95,r:.034,h:.018}];
var VENTS=[.19,.47,.78];
var PLANT=[];
function buildFloor(){
 var f=q("far"),mi=q("mid"),ne=q("near"),fo=q("fore");
 [f,mi,ne,fo].forEach(function(g){while(g.firstChild)g.removeChild(g.firstChild);});
 ridge=el("path",{fill:"url(#gRidge)"},f);
 ridge.setAttribute("d",strip(function(x){return H*0.79+Math.sin(x*0.0012+2.6)*H*0.035+Math.sin(x*0.0031)*H*0.018;}));
 for(var i=0;i<5;i++){var bx=W*(0.07+0.21*i);addPlant(bx,H*0.82,0.13+Math.random()*0.1,7+Math.random()*6,"url(#gK3)",f,.55,16+Math.random()*12,.6+Math.random()*.5);}
 sand=el("path",{fill:"url(#gSand)"},mi);
 sand.setAttribute("d",strip(ftop));
 var sh=el("path",{fill:"#f6e3b6",opacity:.28},mi);
 sh.setAttribute("d",strip(function(x){return ftop(x)+H*0.012;}));
 ROCKS.forEach(function(r){var cx=r.x*W,cy=ftop(cx)-r.h*H*0.3,rx=r.r*W*0.9,ry=r.h*H*1.2;
  el("ellipse",{cx:cx,cy:cy+ry*0.55,rx:rx*1.12,ry:ry*0.4,fill:"#3c2a17","fill-opacity":.45},mi);
  el("ellipse",{cx:cx,cy:cy,rx:rx,ry:ry,fill:"url(#gRock)"},mi);
  el("ellipse",{cx:cx-rx*0.22,cy:cy-ry*0.4,rx:rx*0.55,ry:ry*0.3,fill:"#b7a894",opacity:.35},mi);});
 for(var p=0;p<16;p++){var pxx=Math.random()*W;el("circle",{cx:pxx,cy:ftop(pxx)+H*(0.02+Math.random()*0.06),r:1.6+Math.random()*4,fill:"#7d6141",opacity:.55},mi);}
 VENTS.forEach(function(v){var cx=v*W,cy=ftop(cx);
  el("ellipse",{cx:cx,cy:cy+2,rx:W*0.022,ry:H*0.011,fill:"#6b4f2d"},ne);
  el("ellipse",{cx:cx,cy:cy-1,rx:W*0.011,ry:H*0.005,fill:"#2d1e10","fill-opacity":.7},ne);});
 for(var a=0;a<3;a++){var ax=W*(0.35+a*0.22),ay=ftop(W*(0.35+a*0.22));
  for(var b=0;b<4;b++)el("ellipse",{cx:ax+b*7-10,cy:ay-8-b*3,rx:5,ry:12+b*4,fill:"#f0a35f",opacity:.85},ne);}
 for(var k=0;k<8;k++){var xx=W*(0.05+0.125*k+Math.random()*0.03);addPlant(xx,ftop(xx),0.09+Math.random()*0.13,9+Math.random()*8,k%2?"url(#gK1)":"url(#gK2)",ne,1,26+Math.random()*16,1);}
 for(var z=0;z<2;z++)addPlant(W*(0.14+0.72*z),H*0.94,0.3+Math.random()*0.12,20+Math.random()*10,"url(#gK3)",fo,.62,12+Math.random()*8,1.4);
}
function addPlant(x,y,hf,w,fl,grp,op,amp,spd){
 var n=3+Math.floor(Math.random()*3);
 for(var i=0;i<n;i++){var e=el("path",{fill:grp===q("far")?"url(#gK3)":grp===q("fore")?"url(#gK3)":"url(#gK2)",opacity:op},grp);
  PLANT.push({e:e,x:x+(i-(n-1)/2)*w*1.3+Math.random()*8,y:y,h:H*hf*(0.6+Math.random()*0.7),w:w*(0.6+Math.random()*0.7),
   amp:amp*(0.5+Math.random()*0.9),spd:spd,ph:Math.random()*6.28,lean:(Math.random()-0.5)*30});}
}
function blade(p,t){
 var N=8,d="",i,u,y,x,w,pts=[];
 for(i=0;i<=N;i++){u=i/N;y=p.y-u*p.h;x=p.x+p.lean*u+Math.sin(t*p.spd*0.06+p.ph+u*2.6)*p.amp*u*u;
  w=p.w*(1-u*0.8)*(0.35+0.65*Math.sin(Math.PI*Math.min(0.98,0.12+u*1.05)));pts.push([x,w,y]);}
 d="M"+(pts[0][0]-pts[0][1]).toFixed(1)+" "+pts[0][2].toFixed(1);
 for(i=1;i<=N;i++)d+="L"+(pts[i][0]-pts[i][1]).toFixed(1)+" "+pts[i][2].toFixed(1);
 for(i=N;i>=0;i--)d+="L"+(pts[i][0]+pts[i][1]).toFixed(1)+" "+pts[i][2].toFixed(1);
 return d+"Z";
}

/* bubbles */
var BUB=[];
function mkBubble(parent){
 var g=el("g",{},parent),c=el("circle",{r:4,fill:"url(#gBub)",stroke:"#e6faff","stroke-opacity":.55,"stroke-width":1},g);
 var h=el("circle",{r:1.3,fill:"#fff","fill-opacity":.95},g);
 return {g:g,c:c,h:h,parent:parent,x:0,y:0,r:4,sp:60,w:1,amp:10,ph:0,p:0};
}
for(var i=0;i<8;i++)BUB.push(mkBubble(q("bubbles")));
for(var i2=0;i2<4;i2++)BUB.push(mkBubble(q("bubblesF")));
function spawn(b,x,y){
 var vx=x===undefined?W*(VENTS[Math.floor(Math.random()*3)]+(Math.random()-0.5)*0.05):x;
 b.r=(b.parent===q("bubblesF")?5:2.2)+Math.random()*5.5;
 b.c.setAttribute("r",b.r.toFixed(1));b.h.setAttribute("r",(b.r*0.3).toFixed(1));
 b.h.setAttribute("cx",(-b.r*0.32).toFixed(1));b.h.setAttribute("cy",(-b.r*0.36).toFixed(1));
 b.x=vx;b.y=(y===undefined?ftop(vx)+Math.random()*14:y);
 b.sp=(34+620/(b.r+7))*(b.parent===q("bubblesF")?1.25:1);
 b.w=0.7+Math.random()*1.4;b.amp=12+Math.random()*26;b.ph=Math.random()*6.28;b.p=0;
 b.g.setAttribute("opacity",1);
}
BUB.forEach(function(b){spawn(b);b.y=Math.random()*H;});

/* fish */
var FISH=[
 {n:q("fA"),dir:1,fy:0.40,sc:1.02,sp:96,wag:5.4,wa:12,bob:13,tn:0.55,ph:0,tp:{x:-96,y:0},pp:{x:24,y:4},hot:0,hs:1,x:0,by:0},
 {n:q("fB"),dir:-1,fy:0.635,sc:0.8,sp:37,wag:8.6,wa:17,bob:9,tn:0.9,ph:2.1,tp:{x:-42,y:0},pp:{x:14,y:6},hot:0,hs:1,x:0,by:0}
];
FISH.forEach(function(f){f.tail=f.n.querySelector(".tail");f.pec=f.n.querySelector(".pec");
 f.n.addEventListener("mouseenter",function(){f.hot=1;f.n.classList.add("hot");});
 f.n.addEventListener("mouseleave",function(){f.hot=0;f.n.classList.remove("hot");});});
Array.prototype.forEach.call(document.querySelectorAll(".sp"),function(btn){
 var f=FISH[+btn.dataset.f];
 btn.addEventListener("mouseenter",function(){f.hot=1;f.n.classList.add("hot");});
 btn.addEventListener("mouseleave",function(){f.hot=0;f.n.classList.remove("hot");});});

/* layout + loop */
function layout(){
 W=Math.max(320,window.innerWidth);H=Math.max(320,window.innerHeight);S=Math.max(0.5,Math.min(1.25,Math.min(W/1400,H/820)));
 svg.setAttribute("viewBox","0 0 "+W+" "+H);
 buildAmbient();PLANT.length=0;buildFloor();
 FISH.forEach(function(f,i){f.by=H*f.fy;if(i===0)f.x=W*0.18;else f.x=W*0.82;});
 BUB.forEach(function(b){if(b.y>H+20||b.y<-20)spawn(b);});
}
function setT(g,x,y){g.setAttribute("transform","translate("+x.toFixed(2)+" "+y.toFixed(2)+")");}
function frame(now){
 var dt=Math.min(0.05,(now-last)/1000)||0;last=now;T+=dt;
 px+=(tx-px)*0.06;py+=(ty-py)*0.06;
 setT(q("far"),px*0.15,py*0.12);setT(q("mid"),px*0.3,py*0.2);setT(q("near"),px*0.45,py*0.3);
 setT(q("fishLayer"),px*0.26,py*0.18);setT(q("fore"),px*0.7,py*0.45);
 setT(q("bubbles"),px*0.4,py*0.26);setT(q("bubblesF"),px*0.6,py*0.4);
 for(var i=0;i<PLANT.length;i++)PLANT[i].e.setAttribute("d",blade(PLANT[i],T));
 for(var j=0;j<BUB.length;j++){var b=BUB[j];
  if(b.p>0){b.p+=dt/0.24;var o=Math.max(0,1-b.p),s=1+b.p*0.7;
   b.g.setAttribute("opacity",o.toFixed(2));b.g.setAttribute("transform","translate("+b.x.toFixed(1)+" "+b.y.toFixed(1)+") scale("+s.toFixed(2)+")");
   if(b.p>=1)spawn(b);continue;}
  b.y-=b.sp*(H/900)*dt;b.x+=Math.sin(T*b.w*1.6+b.ph)*b.amp*dt;
  if(b.y<-b.r-8){b.p=0.001;b.g.setAttribute("opacity",1);}
  else b.g.setAttribute("transform","translate("+b.x.toFixed(1)+" "+b.y.toFixed(1)+")");}
 for(var k=0;k<FISH.length;k++){var f=FISH[k];
  f.x+=f.dir*f.sp*S*dt;var m=210*S;
  if(f.dir>0&&f.x>W+m)f.x=-m;else if(f.dir<0&&f.x<-m)f.x=W+m;
  var bob=Math.sin(T*f.tn*2+f.ph)*f.bob*S,rot=Math.cos(T*f.tn*2+f.ph)*2.4;
  f.hs+=((f.hot?1.14:1)-f.hs)*0.12;var sc=f.sc*S*f.hs;
  f.n.setAttribute("transform","translate("+f.x.toFixed(1)+" "+(f.by+bob).toFixed(1)+") rotate("+rot.toFixed(2)+") scale("+(f.dir*sc).toFixed(3)+" "+sc.toFixed(3)+")");
  var a=Math.sin(T*f.wag+f.ph)*f.wa;
  f.tail.setAttribute("transform","rotate("+a.toFixed(2)+" "+f.tp.x+" "+f.tp.y+")");
  f.pec.setAttribute("transform","rotate("+(Math.sin(T*f.wag*0.8+f.ph+1)*11).toFixed(2)+" "+f.pp.x+" "+f.pp.y+")");}
 requestAnimationFrame(frame);
}
window.addEventListener("pointermove",function(e){tx=((e.clientX/W)-0.5)*46;ty=((e.clientY/H)-0.5)*30;});
svg.addEventListener("click",function(e){var n=0,i=0;
 for(;i<BUB.length&&n<6;i++){if(BUB[i].p===0&&BUB[i].y>H*0.7){spawn(BUB[i],e.clientX+(Math.random()-0.5)*26,e.clientY+(Math.random()-0.5)*20);n++;}}
 if(n<6)for(var r=0;r<6-n;r++){var b=BUB[Math.floor(Math.random()*BUB.length)];spawn(b,e.clientX+(Math.random()-0.5)*30,e.clientY+(Math.random()-0.5)*24);}});
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(layout,120);});
layout();last=performance.now();requestAnimationFrame(frame);
})();
</script>
</html>
