</head>
<body>
  <header class="nav">
    <a class="brand" href="./">
      <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="var(--roundel-red)" stroke-width="14"/>
        <rect x="0" y="41" width="100" height="18" fill="var(--roundel-bar)"/>
        <text x="50" y="54.5" text-anchor="middle" fill="var(--roundel-bar-text)" font-size="12" font-weight="800" letter-spacing="1" font-family="Inter, system-ui, sans-serif">My LLM Box</text>

    <pre></pre>
    <div class="dlg-foot"><button type="button" class="copy">Copy prompt</button><a class="dlg-file" href="#" target="_blank" rel="noopener">Open as file</a></div>
  </dialog>
